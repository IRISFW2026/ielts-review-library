amples": [{"en": "Dugongs and manatees look quite alike – they are similar in size, colour and shape, and both have flexible flippers for forelimbs.", "zh": "儒艮和海牛看起来十分相像——它们的体型大小、颜色和外形都很相似，而且两者的前肢都是灵活的鳍状肢。"}], "source": "文档词汇与阅读语境", "id": "3790eab3c6a5", "stars": 4, "ipa": "ˈfɔːlɪm", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "however", "zh": "然而", "type": "word", "examples": [{"en": "However, the manatee has a broad, rounded tail, whereas the dugong's is fluked, like that of a whale.", "zh": "然而，海牛的尾巴宽大而圆，而儒艮的尾巴则像鲸的尾巴一样，具有分叉的尾叶。"}, {"en": "They do have pelvic bones, however – a leftover from their evolution from a four-legged to a fully aquatic animal.", "zh": "不过，它们确实保留着骨盆骨——这是它们从四足动物演化为完全水生动物的过程中遗留下来的结构。"}, {"en": "However, laws in certain parts of Florida now limit boat speeds during winter, allowing slow-moving manatees more time to respond.", "zh": "不过，如今佛罗里达州部分地区的法律会在冬季限制船速，使行动缓慢的海牛有更多时间作出反应。"}], "source": "文档词汇与阅读语境", "id": "8192dcebf396", "stars": 2, "ipa": "haʊˈevə", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "broad", "zh": "宽大的；广泛的", "type": "word", "examples": [{"en": "However, the manatee has a broad, rounded tail, whereas the dugong's is fluked, like that of a whale.", "zh": "然而，海牛的尾巴宽大而圆，而儒艮的尾巴则像鲸的尾巴一样，具有分叉的尾叶。"}], "source": "文档词汇与阅读语境", "id": "f5d439fd3caa", "stars": 2, "ipa": "brɔːd", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "rounded", "zh": "圆形的；圆润的", "type": "word", "examples": [{"en": "However, the manatee has a broad, rounded tail, whereas the dugong's is fluked, like that of a whale.", "zh": "然而，海牛的尾巴宽大而圆，而儒艮的尾巴则像鲸的尾巴一样，具有分叉的尾叶。"}, {"en": "Manatees' teeth are all molars – flat, rounded teeth for grinding food.", "zh": "海牛的牙齿全部都是臼齿——也就是用于磨碎食物的、表面扁平且轮廓圆钝的牙齿。"}], "source": "文档词汇与阅读语境", "id": "495e4106e280", "stars": 2, "ipa": "ˈraʊndɪd", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "tail", "zh": "尾巴", "type": "word", "examples": [{"en": "However, the manatee has a broad, rounded tail, whereas the dugong's is fluked, like that of a whale.", "zh": "然而，海牛的尾巴宽大而圆，而儒艮的尾巴则像鲸的尾巴一样，具有分叉的尾叶。"}, {"en": "Manatees have pectoral flippers but no back limbs, only a tail for propulsion.", "zh": "海牛有胸鳍状肢，但没有后肢，只有一条用于推进身体的尾巴。"}], "source": "文档词汇与阅读语境", "id": "b45a5aa82d1c", "stars": 1, "ipa": "teɪl", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "whereas", "zh": "然而；而", "type": "word", "examples": [{"en": "However, the manatee has a broad, rounded tail, whereas the dugong's is fluked, like that of a whale.", "zh": "然而，海牛的尾巴宽大而圆，而儒艮的尾巴则像鲸的尾巴一样，具有分叉的尾叶。"}, {"en": "There are two subspecies of West Indian manatee: the Antillean manatee is found in waters from the Bahamas to Brazil, whereas the Florida manatee is found in US waters, although some individuals have been recorded in the Bahamas.", "zh": "西印度海牛有两个亚种：安的列斯海牛分布于从巴哈马到巴西的水域，而佛罗里达海牛分布于美国水域，不过在巴哈马也曾记录到一些佛罗里达海牛个体。"}, {"en": "Some people prefer studying alone, whereas others learn better in groups.", "zh": "有些人喜欢独自学习，而另一些人在小组中学得更好。"}], "source": "文档词汇与阅读语境", "id": "209d76b701eb", "stars": 3, "ipa": "weərˈæz", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "fluked", "zh": "有分叉尾叶的", "type": "word", "examples": [{"en": "However, the manatee has a broad, rounded tail, whereas the dugong's is fluked, like that of a whale.", "zh": "然而，海牛的尾巴宽大而圆，而儒艮的尾巴则像鲸的尾巴一样，具有分叉的尾叶。"}], "source": "文档词汇与阅读语境", "id": "1c11b4585698", "stars": 4, "ipa": "fluːkt", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "whale", "zh": "鲸", "type": "word", "examples": [{"en": "However, the manatee has a broad, rounded tail, whereas the dugong's is fluked, like that of a whale.", "zh": "然而，海牛的尾巴宽大而圆，而儒艮的尾巴则像鲸的尾巴一样，具有分叉的尾叶。"}, {"en": "Whales belong to a group of animals called mammals.", "zh": "鲸属于被称为哺乳动物的类群。"}], "source": "文档词汇与阅读语境", "id": "15eaccdd4655", "stars": 2, "ipa": "weɪl", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "species", "zh": "物种；种类", "type": "word", "examples": [{"en": "There are three species of manatees: the West Indian manatee (Trichechus manatus), the African manatee (Trichechus senegalensis) and the Amazonian manatee (Trichechus inunguis).", "zh": "海牛共有三个物种：西印度海牛（Trichechus manatus）、非洲海牛（Trichechus senegalensis）和亚马孙海牛（Trichechus inunguis）。"}, {"en": "The species also makes use of rivers, with the mammals seen in landlocked countries such as Mali and Niger.", "zh": "这个物种也利用河流；在马里、尼日尔等内陆国家，也能见到非洲海牛。"}, {"en": "The Amazonian manatee is the smallest species, though it is still a big animal.", "zh": "亚马孙海牛是体型最小的海牛物种，不过它仍然是一种大型动物。"}], "source": "文档词汇与阅读语境", "id": "c45ced3d5930", "stars": 3, "ipa": "ˈspiːʃiːz", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "West Indian", "zh": "西印度群岛的", "type": "word", "examples": [{"en": "There are three species of manatees: the West Indian manatee (Trichechus manatus), the African manatee (Trichechus senegalensis) and the Amazonian manatee (Trichechus inunguis).", "zh": "海牛共有三个物种：西印度海牛（Trichechus manatus）、非洲海牛（Trichechus senegalensis）和亚马孙海牛（Trichechus inunguis）。"}, {"en": "West Indian and Amazonian manatees are both herbivores.", "zh": "西印度海牛和亚马孙海牛都是食草动物。"}, {"en": "The West Indian manatee reaches about 3.5 metres long and weighs on average around 500 kilogrammes.", "zh": "西印度海牛体长可达约3.5米，平均体重约为500千克。"}], "source": "文档词汇与阅读语境", "id": "ae88d7c48c99", "stars": 3, "ipa": "ˌwest ˈɪndiən", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "African", "zh": "非洲的；非洲人", "type": "word", "examples": [{"en": "There are three species of manatees: the West Indian manatee (Trichechus manatus), the African manatee (Trichechus senegalensis) and the Amazonian manatee (Trichechus inunguis).", "zh": "海牛共有三个物种：西印度海牛（Trichechus manatus）、非洲海牛（Trichechus senegalensis）和亚马孙海牛（Trichechus inunguis）。"}, {"en": "African manatees are omnivorous – studies have shown that molluscs and fish make up a small part of their diets.", "zh": "非洲海牛是杂食性的——研究表明，软体动物和鱼类构成了它们食物中的一小部分。"}, {"en": "The African manatee is also about 3.5 metres long and found in the sea along the west coast of Africa, from Mauritania down to Angola.", "zh": "非洲海牛的体长也约为3.5米，分布于非洲西海岸沿岸海域，范围从毛里塔尼亚向南延伸至安哥拉。"}], "source": "文档词汇与阅读语境", "id": "c6b3880fa3fb", "stars": 3, "ipa": "ˈæfrɪkən", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "Amazonian", "zh": "亚马孙地区的", "type": "word", "examples": [{"en": "There are three species of manatees: the West Indian manatee (Trichechus manatus), the African manatee (Trichechus senegalensis) and the Amazonian manatee (Trichechus inunguis).", "zh": "海牛共有三个物种：西印度海牛（Trichechus manatus）、非洲海牛（Trichechus senegalensis）和亚马孙海牛（Trichechus inunguis）。"}, {"en": "West Indian and Amazonian manatees are both herbivores.", "zh": "西印度海牛和亚马孙海牛都是食草动物。"}, {"en": "The Amazonian manatee is the smallest species, though it is still a big animal.", "zh": "亚马孙海牛是体型最小的海牛物种，不过它仍然是一种大型动物。"}], "source": "文档词汇与阅读语境", "id": "fe927bcf4506", "stars": 3, "ipa": "ˌæməˈzəʊniən", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "unlike", "zh": "与……不同", "type": "word", "examples": [{"en": "Unlike most mammals, manatees have only six bones in their neck – most others, including humans and giraffes, have seven.", "zh": "与大多数哺乳动物不同，海牛的颈部只有六块骨头，而大多数其他哺乳动物，包括人类和长颈鹿，都有七块。"}, {"en": "Unlike most birds, penguins cannot fly.", "zh": "与大多数鸟类不同，企鹅不会飞。"}, {"en": "Unlike most of my friends, I prefer studying in the morning.", "zh": "与我的大多数朋友不同，我更喜欢在早上学习。"}], "source": "文档词汇与阅读语境", "id": "6729bfb1664a", "stars": 2, "ipa": "ʌnˈlaɪk", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "bone", "zh": "骨头", "type": "word", "examples": [{"en": "Unlike most mammals, manatees have only six bones in their neck – most others, including humans and giraffes, have seven.", "zh": "与大多数哺乳动物不同，海牛的颈部只有六块骨头，而大多数其他哺乳动物，包括人类和长颈鹿，都有七块。"}, {"en": "They do have pelvic bones, however – a leftover from their evolution from a four-legged to a fully aquatic animal.", "zh": "不过，它们确实保留着骨盆骨——这是它们从四足动物演化为完全水生动物的过程中遗留下来的结构。"}], "source": "文档词汇与阅读语境", "id": "4c9644494e96", "stars": 1, "ipa": "bəʊn", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "neck", "zh": "颈部；脖子", "type": "word", "examples": [{"en": "Unlike most mammals, manatees have only six bones in their neck – most others, including humans and giraffes, have seven.", "zh": "与大多数哺乳动物不同，海牛的颈部只有六块骨头，而大多数其他哺乳动物，包括人类和长颈鹿，都有七块。"}, {"en": "This short neck allows a manatee to move its head up and down, but not side to side.", "zh": "这种短颈使海牛能够上下移动头部，却无法左右转动头部。"}], "source": "文档词汇与阅读语境", "id": "7fc22bdcd829", "stars": 1, "ipa": "nek", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "including", "zh": "包括", "type": "word", "examples": [{"en": "Unlike most mammals, manatees have only six bones in their neck – most others, including humans and giraffes, have seven.", "zh": "与大多数哺乳动物不同，海牛的颈部只有六块骨头，而大多数其他哺乳动物，包括人类和长颈鹿，都有七块。"}], "source": "文档词汇与阅读语境", "id": "8c42d4bbf988", "stars": 2, "ipa": "ɪnˈkluːdɪŋ", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "human", "zh": "人；人类的", "type": "word", "examples": [{"en": "Unlike most mammals, manatees have only six bones in their neck – most others, including humans and giraffes, have seven.", "zh": "与大多数哺乳动物不同，海牛的颈部只有六块骨头，而大多数其他哺乳动物，包括人类和长颈鹿，都有七块。"}, {"en": "Studies have shown that some animals can recognise individual human faces.", "zh": "研究表明，一些动物能够识别不同的人脸。"}], "source": "文档词汇与阅读语境", "id": "e9f9d04dbc2d", "stars": 1, "ipa": "ˈhjuːmən", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "giraffe", "zh": "长颈鹿", "type": "word", "examples": [{"en": "Unlike most mammals, manatees have only six bones in their neck – most others, including humans and giraffes, have seven.", "zh": "与大多数哺乳动物不同，海牛的颈部只有六块骨头，而大多数其他哺乳动物，包括人类和长颈鹿，都有七块。"}], "source": "文档词汇与阅读语境", "id": "65a2c4ff9c89", "stars": 2, "ipa": "dʒɪˈrɑːf", "ipaNote": "英式常用读法；record nd they eventually fall out, so they continually grow new teeth that get pushed forward to replace the ones they lose.", "zh": "由于海牛以会磨损牙齿的水生植物为食，这些牙齿逐渐磨损，最终脱落，因此海牛会不断长出新牙；新牙被向前推移，以替换掉落的旧牙。"}], "source": "文档词汇与阅读语境", "id": "ae7c59ee435f", "stars": 1, "ipa": "plɑːnt", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "diet", "zh": "日常饮食；食物", "type": "word", "examples": [{"en": "Seagrasses and other marine plants make up most of a manatee's diet.", "zh": "海草和其他海生植物构成了海牛食物的主要部分。"}, {"en": "African manatees are omnivorous – studies have shown that molluscs and fish make up a small part of their diets.", "zh": "非洲海牛是杂食性的——研究表明，软体动物和鱼类构成了它们食物中的一小部分。"}, {"en": "Due to manatees' abrasive aquatic plant diet, these teeth get worn down and they eventually fall out, so they continually grow new teeth that get pushed forward to replace the ones they lose.", "zh": "由于海牛以会磨损牙齿的水生植物为食，这些牙齿逐渐磨损，最终脱落，因此海牛会不断长出新牙；新牙被向前推移，以替换掉落的旧牙。"}], "source": "文档词汇与阅读语境", "id": "d1aca3b2b841", "stars": 2, "ipa": "ˈdaɪət", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "spend", "zh": "花费；度过", "type": "word", "examples": [{"en": "Manatees spend about eight hours each day grazing and uprooting plants.", "zh": "海牛每天大约花八个小时吃草和连根拔起植物。"}, {"en": "Transport costs make up 20% of my monthly spending.", "zh": "交通费用占我每月支出的20%。"}, {"en": "I spend an hour practising spoken English each morning.", "zh": "我每天早上花一小时练习英语口语。"}], "source": "文档词汇与阅读语境", "id": "1f07d95988d0", "stars": 1, "ipa": "spend", "ipaNote": "英式常用读法；record、estimate区分词性，tear采用本文“撕扯”的读音。"}, {"term": "about", "zh": "大约；关于", "type": "word", "examples": [{"en": "Manatees spend about eight hours each day grazing and uprooting plants.", "zh": "海牛每天大约花八个小时吃草和连根拔起植物。"}, {"en": "The West Indian manatee reaches about 3.5 metres long and weighs on average around 500 kilogrammes.", "zh": "西印度海牛体长可达约3.5米，平均体重约为500千克。"}, {"en": "The African manatee is also about 3.5 metres long and found in the sea along the west coast of Af 来三年内监测该种群。"}], "note": "over the next…years", "source": "文档重点短语", "id": "6e3fc43dc2f0", "stars": 3}, {"term": "a review of", "zh": "对……的回顾性分析／审查", "type": "phrase", "examples": [{"en": "A review of previous studies revealed several gaps in the evidence.", "zh": "对既有研究的回顾性分析揭示了证据中的若干缺口。"}, {"en": "The team conducted a review of reported accidents.", "zh": "团队对已报告的事故进行了回顾性分析。"}, {"en": "A review of hospital records identified a recurring problem.", "zh": "对医院记录的审查发现了一个反复出现的问题。"}], "note": "a review of…", "source": "文档重点短语", "id": "a023dbc05c30", "stars": 3}, {"term": "entanglement in fishing nets", "zh": "被渔网缠住", "type": "phrase", "examples": [{"en": "The report examined cases of entanglement in fishing nets.", "zh": "报告分析了被渔网缠住的案例。"}, {"en": "The animal was injured after becoming entangled in a fishing net.", "zh": "这只动物被渔网缠住后受了伤。"}, {"en": "The new equipment aims to reduce entanglement in fishing nets.", "zh": "新设备旨在减少动物被渔网缠住的情况。"}], "note": "entanglement in fishing nets", "source": "文档重点短语", "id": "fca6067d9dfb", "stars": 3}, {"term": "at least", "zh": "至少……", "type": "phrase", "examples": [{"en": "At least thirty people attended the meeting.", "zh": "至少三十人参加了会议。"}, {"en": "The repairs will take at least two weeks.", "zh": "维修至少需要两周。"}, {"en": "At least seven hundred cases involved manatees.", "zh": "至少七百起案例涉及海牛。"}], "note": "at least…", "source": "文档重点短语", "id": "7e663592679b", "stars": 3}, {"term": "the chief cause of", "zh": "……的首要原因", "type": "phrase", "examples": [{"en": "The investigation identified the chief cause of the accident.", "zh": "调查确定了事故的首要原因。"}, {"en": "Equipment failure was the chief cause of the delay.", "zh": "设备故障是延误的首要原因。"}, {"en": "The report examined the chief cause of population decline.", "zh": "报告考察了种群数量下降的首要原因。"}], "note": "the chief cause of…", "source": "文档重点短语", "id": "bc3432fb8f88", "stars": 3}, {"term": "limit boat speeds", "zh": "限制船速", "type": "phrase", "examples": [{"en": "The regulations limit boat speeds near the shore.", "zh": "这些规定限制近岸船速。"}, {"en": "Local authorities limit boat speeds in protected areas.", "zh": "地方当局限制保护区内的船速。"}, {"en": "The new rules limit boat speeds during the winter months.", "zh": "新规定在冬季月份限制船速。"}], "note": "limit boat speeds", "source": "文档重点短语", "id": "d9ce34e86193", "stars": 3}, {"term": "allow somebody more time to respond", "zh": "给予某人更多反应时间", "type": "phrase", "examples": [{"en": "The warning allows drivers more time to respond.", "zh": "这项预警给予驾驶员更多反应时间。"}, {"en": "Slower traffic allows pedestrians more time to respond to danger.", "zh": "更慢的车流给予行人更多时间应对危险。"}, {"en": "The teacher allowed students more time to respond to the question.", "zh": "老师给学生更多时间回答问题。"}], "note": "allow somebody more time to respond", "source": "文档重点短语", "id": "a8255511130a", "stars": 4}], "sentences": [{"en": "Manatees, also known as sea cows, are aquatic mammals that belong to a group of animals called Sirenia.", "zh": "海牛又称“海中之牛”，是一类水生哺乳动物，属于一个叫作海牛目的动物类群。"}, {"en": "This group also contains dugongs.", "zh": "这个类群还包括儒艮。"}, {"en": "Dugongs and manatees look quite alike – they are similar in size, colour and shape, and both have flexible flippers for forelimbs.", "zh": "儒艮和海牛看起来十分相像——它们的体型大小、颜色和外形都很相似，而且两者的前肢都是灵活的鳍状肢。"}, {"en": "However, the manatee has a broad, rounded tail, whereas the dugong's is fluked, like that of a whale.", "zh": "然而，海牛的尾巴宽大而圆，而儒艮的尾巴则像鲸的尾巴一样，具有分叉的尾叶。"}, {"en": "There are three species of manatees: the West Indian manatee (Trichechus manatus), the African manatee (Trichechus senegalensis) and the Amazonian manatee (Trichechus inunguis).", "zh": "海牛共有三个物种：西印度海牛（Trichechus manatus）、非洲海牛（Trichechus senegalensis）和亚马孙海牛（Trichechus inunguis）。"}, {"en": "Unlike most mammals, manatees have only six bones in their neck – most others, including humans and giraffes, have seven.", "zh": "与大多数哺乳动物不同，海牛的颈部只有六块骨头，而大多数其他哺乳动物，包括人类和长颈鹿，都有七块。"}, {"en": "This short neck allows a manatee to move its head up and down, but not side to side.", "zh": "这种短颈使海牛能够上下移动头部，却无法左右转动头部。"}, {"en": "To see something on its left or its right, a manatee must turn its entire body, steering with its flippers.", "zh": "为了看清左侧或右侧的东西，海牛必须转动整个身体，并用鳍状肢控制方向。"}, {"en": "Manatees have pectoral flippers but no back limbs, only a tail for propulsion.", "zh": "海牛有胸鳍状肢，但没有后肢，只有一条用于推进身体的尾巴。"}, {"en": "They do have pelvic bones, however – a leftover from their evolution from a four-legged to a fully aquatic animal.", "zh": "不过，它们确实保留着骨盆骨——这是它们从四足动物演化为完全水生动物的过程中遗留下来的结构。"}, {"en": "Manatees share some visual similarities to elephants.", "zh": "海牛在外观上与大象有一些相似之处。"}, {"en": "Like elephants, manatees have thick, wrinkled skin.", "zh": "与大象一样，海牛的皮肤厚实，而且布满褶皱。"}, {"en": "They also have some hairs covering their bodies which help them sense vibrations in the water around them.", "zh": "它们的体表还长有一些毛发，这些毛发帮助它们感知周围水中的振动。"}, {"en": "Seagrasses and other marine plants make up most of a manatee's diet.", "zh": "海草和其他海生植物构成了海牛食物的主要部分。"}, {"en": "Manatees spend about eight hours each day grazing and uprooting plants.", "zh": "海牛每天大约花八个小时吃草和连根拔起植物。"}, {"en": "They eat up to 15% of their weight in food each day.", "zh": "它们每天摄入的食物重量可达自身体重的15%。"}, {"en": "African manatees are omnivorous – studies have shown that molluscs and fish make up a small part of their diets.", "zh": "非洲海牛是杂食性的——研究表明，软体动物和鱼类构成了它们食物中的一小部分。"}, {"en": "West Indian and Amazonian manatees are both herbivores.", "zh": "西印度海牛和亚马孙海牛都是食草动物。"}, {"en": "Manatees' teeth are all molars – flat, rounded teeth for grinding food.", "zh": "海牛的牙齿全部都是臼齿——也就是用于磨碎食物的、表面扁平且轮廓圆钝的牙齿。"}, {"en": "Due to manatees' abrasive aquatic plant diet, these teeth get worn down and they eventually fall out, so they continually grow new teeth that get pushed forward to replace the ones they lose.", "zh": "由于海牛以会磨损牙齿的水生植物为食，这些牙齿逐渐磨损，最终脱落，因此海牛会不断长出新牙；新牙被向前推移，以替换掉落的旧牙。"}, {"en": "Instead of having incisors to grasp their food, manatees have lips which function like a pair of hands to help tear food away from the seafloor.", "zh": "海牛并非用门齿夹取食物，而是用嘴唇；它们的嘴唇像一双手一样发挥作用，帮助把食物从海底扯下来。"}, {"en": "Manatees are fully aquatic, but as mammals, they need to come up to the surface to breathe.", "zh": "海牛完全生活在水中，但作为哺乳动物，它们需要上浮到水面呼吸。"}, {"en": "When awake, they typically surface every two to four minutes, but they can hold their breath for much longer.", "zh": "清醒时，它们通常每隔两到四分钟浮出水面一次，但它们能够屏住呼吸更长时间。"}, {"en": "Adult manatees sleep underwater for 10–12 hours a day, but they come up for air every 15–20 minutes.", "zh": "成年海牛每天在水下睡眠10至12小时，但每隔15至20分钟就会上浮换气。"}, {"en": "Active manatees need to breathe more frequently.", "zh": "处于活动状态的海牛需要更频繁地呼吸。"}, {"en": "It's thought that manatees use their muscular diaphragm and breathing to adjust their buoyancy.", "zh": "人们认为，海牛利用其肌肉质的膈膜以及呼吸活动来调节浮力。"}, {"en": "They may use diaphragm contractions to compress and store gas in folds in their large intestine to help them float.", "zh": "它们可能利用膈膜的收缩来压缩气体，并将气体储存在大肠的褶皱中，以帮助自己漂浮。"}, {"en": "The West Indian manatee reaches about 3.5 metres long and weighs on average around 500 kilogrammes.", "zh": "西印度海牛体长可达约3.5米，平均体重约为500千克。"}, {"en": "It moves between fresh water and salt water, taking advantage of coastal mangroves and coral reefs, rivers, lakes and inland lagoons.", "zh": "它会在淡水与咸水环境之间移动，利用沿海红树林、珊瑚礁、河流、湖泊和内陆潟湖等环境栖息。"}, {"en": "There are two subspecies of West Indian manatee: the Antillean manatee is found in waters from the Bahamas to Brazil, whereas the Florida manatee is found in US waters, although some individuals have been recorded in the Bahamas.", "zh": "西印度海牛有两个亚种：安的列斯海牛分布于从巴哈马到巴西的水域，而佛罗里达海牛分布于美国水域，不过在巴哈马也曾记录到一些佛罗里达海牛个体。"}, {"en": "In winter, the Florida manatee is typically restricted to Florida.", "zh": "冬季，佛罗里达海牛的活动范围通常局限于佛罗里达州。"}, {"en": "When the ambient water temperature drops below 20°C, it takes refuge in naturally and artificially warmed water, such as at the warm-water outfalls from powerplants.", "zh": "当周围水温降至20℃以下时，它会到天然或人工加温的水域中避寒，例如发电厂温水排放口附近的水域。"}, {"en": "The African manatee is also about 3.5 metres long and found in the sea along the west coast of Africa, from Mauritania down to Angola.", "zh": "非洲海牛的体长也约为3.5米，分布于非洲西海岸沿岸海域，范围从毛里塔尼亚向南延伸至安哥拉。"}, {"en": "The species also makes use of rivers, with the mammals seen in landlocked countries such as Mali and Niger.", "zh": "这个物种也利用河流；在马里、尼日尔等内陆国家，也能见到非洲海牛。"}, {"en": "The Amazonian manatee is the smallest species, though it is still a big animal.", "zh": "亚马孙海牛是体型最小的海牛物种，不过它仍然是一种大型动物。"}, {"en": "It grows to about 2.5 metres long and 350 kilogrammes.", "zh": "它可以长到约2.5米长，体重达到约350千克。"}, {"en": "Amazonian manatees favour calm, shallow waters that are above 23°C.", "zh": "亚马孙海牛偏好水温高于23℃、水流平缓的浅水水域。"}, {"en": "This species is found in fresh water in the Amazon Basin in Brazil, as well as in Colombia, Ecuador and Peru.", "zh": "这个物种分布于巴西亚马孙流域的淡水水域，也分布于哥伦比亚、厄瓜多尔和秘鲁。"}, {"en": "All three manatee species are endangered or at a heightened risk of extinction.", "zh": "三个海牛物种都面临生存威胁，或处于较高的灭绝风险之中。"}, {"en": "The African manatee and Amazonian manatee are both listed as Vulnerable by the International Union for Conservation of Nature (IUCN).", "zh": "非洲海牛和亚马孙海牛都被国际自然保护联盟（IUCN）列为“易危”物种。"}, {"en": "It is estimated that 140,000 Amazonian manatees were killed between 1935 and 1954 for their meat, fat and skin, with the latter used to make leather.", "zh": "据估计，1935年至1954年间，约有14万头亚马孙海牛因人们获取其肉、脂肪和皮而遭到捕杀，其中皮被用来制作皮革。"}, {"en": "In more recent years, African manatee decline has been tied to incidental capture in fishing nets and hunting.", "zh": "在较近些年，非洲海牛数量的下降被认为与渔网误捕和猎捕有关。"}, {"en": "Manatee hunting is now illegal in every country the African species is found in.", "zh": "如今，在非洲海牛分布的每一个国家，猎捕海牛都属于违法行为。"}, {"en": "The two subspecies of West Indian manatee are listed as Endangered by the IUCN.", "zh": "西印度海牛的两个亚种都被国际自然保护联盟（IUCN）列为“濒危”。"}, {"en": "Both are also expected to undergo a decline of 20% over the next 40 years.", "zh": "预计这两个亚种的种群数量还将在未来40年内下降20%。"}, {"en": "A review of almost 1,800 cases of entanglement in fishing nets and of plastic consumption among marine mammals in US waters from 2009 to 2020 found that at least 700 cases involved manatees.", "zh": "一项回顾性分析考察了2009年至2020年美国水域海洋哺乳动物被渔网缠住以及摄入塑料的近1,800起案例，发现其中至少700起涉及海牛。"}, {"en": "The chief cause of death in Florida manatees is boat strikes.", "zh": "佛罗里达海牛死亡的首要原因是船只撞击。"}, {"en": "However, laws in certain parts of Florida now limit boat speeds during winter, allowing slow-moving manatees more time to respond.", "zh": "不过，如今佛罗里达州部分地区的法律会在冬季限制船速，使行动缓慢的海牛有更多时间作出反应。"}], "examples": [{"en": "The city is known as a centre of international trade.", "zh": "这座城市被称为国际贸易中心。"}, {"en": "This process is known as photosynthesis.", "zh": "这个过程被称为光合作用。"}, {"en": "My grandmother, also known as \"the family chef\", loves cooking for us.", "zh": "我的奶奶也被称为\"家庭大厨\"，很喜欢为我们做饭。"}, {"en": "Whales belong to a group of animals called mammals.", "zh": "鲸属于被称为哺乳动物的类群。"}, {"en": "This notebook belongs to my sister.", "zh": "这个笔记本是我姐姐的。"}, {"en": "Many students belong to more than one university club.", "zh": "许多学生参加了不止一个大学社团。"}, {"en": "The twins look alike, but their personalities are very different.", "zh": "这对双胞胎长得很像，但性格非常不同。"}, {"en": "These two buildings look quite alike from a distance.", "zh": "从远处看，这两栋建筑十分相像。"}, {"en": "Some animal species look alike even though they are not closely related.", "zh": "有些动物物种虽然亲缘关系并不近，但看起来很相像。"}, {"en": "The two apartments are similar in size.", "zh": "这两套公寓的面积相近。"}, {"en": "The courses are similar in content but differ in teaching methods.", "zh": "这些课程在内容上相似，但教学方法不同。"}, {"en": "The two products are similar in appearance and price.", "zh": "这两款产品在外观和价格上相似。"}, {"en": "Both cities have reliable public transport systems.", "zh": "这两座城市都有可靠的公共交通系统。"}, {"en": "The two courses both have a strong practical focus.", "zh": "这两门课程都很注重实践。"}, {"en": "Both options have advantages and disadvantages.", "zh": "这两个选项都各有利弊。"}, {"en": "The robot has cameras for eyes.", "zh": "这个机器人用摄像头作为眼睛。"}, {"en": "The snowman has a carrot for a nose.", "zh": "这个雪人的鼻子是用胡萝卜做的。"}, {"en": "The toy has two butt function rec(x){return state[x.id]||{level:0,due:0,reps:0}}
function eligible(x,now=Date.now()){let r=rec(x);return r.level!==4&&(!r.level||r.due<=now)}
function dayKey(){return new Date().toLocaleDateString('en-CA')}
function todayNew(){return Object.values(state).filter(r=>r.startedDay===dayKey()).length}
function candidates(){let all=DATA.items.filter(x=>(kind==='all'||x.type===kind)&&rec(x).level!==4);if(scope==='all')return all.sort((a,b)=>(rec(a).level||1)-(rec(b).level||1));let due=all.filter(x=>rec(x).level&&eligible(x)).sort((a,b)=>rec(a).due-rec(b).due);let fresh=all.filter(x=>!rec(x).level).slice(0,Math.max(0,settings.daily-todayNew()));return [...due,...fresh]}

function next(){const id=queue.shift();current=DATA.items.find(x=>x.id===id)||null;revealed=false;answerEN='';answerZH='';meaningOK=false;render()}

function renderStats(){const counts={4:0,2:0,3:0,1:0};DATA.items.forEach(x=>{let l=rec(x).level;if(l)counts[l]++});let due=DATA.items.filter(x=>rec(x).level&&eligible(x)).length;let fresh=DATA.items.filter(x=>!rec(x).level).length;$('stats').innerHTML=`<div class="stat"><b>${due}</b><span>到期复习</span></div><div class="stat"><b>${fresh}</b><span>尚未学习</span></div><div class="stat"><b>${counts[1]+counts[2]+counts[3]}</b><span>正在巩固</span></div><div class="stat"><b>${counts[4]}</b><span>已经熟练</span></div>`;$('progress').style.width=(counts[4]/DATA.items.length*100)+'%';$('progress-label').textContent=`${counts[4]} / ${DATA.items.length}`}
function filterControls(){return `<div class="controls"><select id="kind" aria-label="词条类型"><option value="all">全部 · 单词与短语</option><option value="word">只练单词</option><option value="phrase">只练短语</option></select><select id="scope" aria-label="练习范围"><option value="due">按计划 · 到期＋新词</option><option value="all">提前练习 · 所有未熟练</option></select></div>`}
function playButton(text,label='朗读',small=false){return `<button class="speaker${small?' small':''}" data-say="${escapeHTML(text)}" aria-label="${escapeHTML(label)}">${icon}<span>${label}</span></button>`}
function norm(s){return s.normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:…“”"()\[\]]/g,'').replace(/\s+/g,' ').trim()}
function spellingCorrect(){return current&&norm(answerEN)===norm(current.term)}
function reveal(){if(view==='dictation')answerEN=$('en-answer').value;if(view!=='cards')answerZH=$('zh-answer').value;revealed=true;render()}
function grade(level){if(!current||!revealed)return;if(view!=='cards'&&level>=3&&(!meaningOK||(view==='dictation'&&!spellingCorrect()))){toast('请先核对拼写，并确认中文意思基本正确。');return}const old=rec(current),now=Date.now(),reps=(old.reps||0)+1;let interval=level===1?60000:level===2?600000:level===3?[1,3,7,14,30][Math.min(old.level===3?(old.streak||0):0,4)]*86400000:0;state[current.id]={...old,level,reps,due:level===4?null:now+interval,streak:level===3?(old.level===3?(old.streak||0)+1:1):0,startedDay:old.startedDay||dayKey(),updated:now};save();sessionCount++;next()}
function training(){let intro={cards:'先回忆，再揭晓。每一次主动回忆，都在加深记忆。',dictation:'先听英文，再写拼写和中文意思。答案在核对前保持隐藏。',meaning:'看到英文，主动写出中文意思，再对照自评。'};let html=filterControls();if(!current){let future=DATA.items.filter(x=>rec(x).level&&rec(x).level!==4&&rec(x).due>Date.now()).sort((a,b)=>rec(a).due-rec(b).due)[0];let complete=DATA.items.every(x=>rec(x).level===4);html+=`<section class="card empty"><div class="big">${complete?'✓':'◌'}</div><h2>${complete?'这一篇，你已经掌握了！':'当前计划已完成'}</h2><p class="muted">本轮已完成 ${sessionCount} 次。${future?'下一次复习：'+escapeHTML(new Date(rec(future).due).toLocaleString()):'可以在全部词库查看学习情况。'}</p><p class="small muted">${complete?'熟练词不会自动出现，可在词库改回其他等级。':'不认识的 1 分钟后、模糊的 10 分钟后回来；认识的按天复习。新词每天默认 20 个。'}</p><button id="refresh" class="primary">检查到期复习</button> <button id="early">提前练习未熟练词</button></section>`;return html}
let x=current,r=rec(x);html+=`<p class="small muted">${intro[view]}</p><section class="card"><div class="cardtop"><span class="tag">${x.type==='word'?'WORD · 单词':'PHRASE · 短语'} / ${LABELS[r.level]||'未学'}</span><span class="counter">本轮已完成 ${sessionCount} · 待练 ${queue.length+1}</span></div><div class="center">`;

if(view!=='cards'&&!revealed)html+=`<div class="practice-input">${view==='dictation'?'<label>英文单词或短语<input id="en-answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入你听到的英文"></label>':''}<label>中文释义<textarea id="zh-answer" placeholder="写出你理解的中文意思"></textarea></label></div>`;

let sentenceType='original';
function sentenceList(){if(!$('sentence-list'))return;let rows=(sentenceType==='original'?DATA.sentences:DATA.examples).filter(x=>(x.en+x.zh).toLowerCase().includes(search.toLowerCase()));$('sentence-list').innerHTML=rows.map((x,i)=>`<article class="list-item"><span class="tag">${String(i+1).padStart(2,'0')}</span><p style="font-size:18px">${escapeHTML(x.en)}</p>${playButton(x.en,'朗读整句',true)}<details><summary>查看中文</summary><p>${escapeHTML(x.zh)}</p></details></article>`).join('')||'<p>没有匹配的句子。</p>'}
function settingsPage(){return `<section class="card settings"><h2>让学习适合你</h2><details><summary>五星难度与音标说明</summary><p class="small muted">1 星：基础词；2 星：日常常用词；3 星：雅思阅读常见词；4 星：进阶词；5 星：专业或生僻词。星级是本词库的学习难度建议，并非官方考试等级，与“熟练、认识、模糊、不认识”的个人掌握情况分开记录。</p><p class="small muted">全部 224 个词汇条目附英式常用音标；多词词条为常用组合读法。record、estimate 区分名词与动词；tear 采用本文“撕扯”的 /teə/。听写时不显示音标，核对答案后才显示。</p><p class="small muted">专业词读音参考：<a href="https://dictionary.cambridge.org/dictionary/english/manatee" target="_blank" rel="noopener noreferrer">Cambridge manatee</a> · <a href="https://dictionary.cambridge.org/dictionary/english/dugong" target="_blank" rel="noopener noreferrer">dugong</a> · <a href="https://dictionary.cambridge.org/dictionary/english/pectoral" target="_blank" rel="noopener noreferrer">pectoral</a> · <a href="https://dictionary.cambridge.org/dictionary/english/herbivorous" target="_blank" rel="noopener noreferrer">herbivorous</a></p></details><label>英语朗读音色<select id="voice-select"></select></label><p class="small muted">优先推荐 Natural、Neural、Premium 等自然音色。可用音色由浏览器和系统提供；没有自然音色时，请在设备的语音设置中添加英语增强语音。</p><label>语速 <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="${settings.rate}"><span id="rate-label">${settings.rate} ×</span></label><label>发音来源<select id="engine"><option value="device">设备英语语音 · 单词、短语、句子</option><option value="dictionary">在线词典发音 · 词条优先，失败转设备语音</option></select></label><p class="small muted">在线词典发音需要联网，会把所读词条发送给有道词典。句子始终使用所选设备音色。</p><div>${playButton('Manatees are aquatic mammals.','试听所选音色')}</div><label>每天新词数量<input id="daily" type="number" min="1" max="100" value="${settings.daily}"></label><details open><summary>复习规则</summary><div class="rules"><p>不认识：1 分钟后再出现。模糊：10 分钟后再出现。认识：连续选择后，间隔按 1、3、7、14、30 天增加；再次选模糊或不认识会重置这个连续间隔。</p><p>熟练：退出所有自动复习和提前练习；可在全部词库中重新调整等级。新词每天默认 20 个，到期词不受新词上限限制。网页关闭后不弹通知，下次打开会列出到期词。</p><p>“提前练习”允许在到期前复习所有未熟练词。练习结果需要选择等级才会保存。</p></div></details><div><h2>进度备份</h2><p class="muted small">记录只保存在当前浏览器，不会自动同步到 GitHub 或其他设备。换设备前先导出。</p><div class="row"><button id="export">导出进度</button><label><span class="sr">导入进度文件</span><input id="import" type="file" accept="application/json,.json"></label></div></div><p class="small muted">词库：${DATA.items.filter(x=>x.type==='word').length} 个单词与词汇条目、${DATA.items.filter(x=>x.type==='phrase').length} 组短语。模板中的省略号不参与拼写；部分语法模板已改为可听写的具体表达，可在答案处查看文档形式。</p></section>`}
function render(){renderStats();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('subtitle').textContent={cards:'Manatees · 海牛 / 翻卡复习',dictation:'Manatees · 海牛 / 听英文，写英文与中文',meaning:'Manatees · 海牛 / 看英文，写中文释义',sentences:'在句子里，听懂每一个词。',library:'你的 Manatees 个人词库',settings:'学习偏好与进度管理'}[view];$('app').innerHTML=['cards','dictation','meaning'].includes(view)?training():view==='library'?library():view==='sentences'?sentences():settingsPage();
if($('kind')){$('kind').value=kind;$('kind').onchange=e=>{kind=e.target.value;if(view==='library')render();else buildQueue()}}if($('scope')){$('scope').value=scope;$('scope').onchange=e=>{scope=e.target.value;buildQueue()}}
if($('reveal'))$('reveal').onclick=reveal;if($('listen'))$('listen').onclick=()=>speak(current.term,true);if($('slow'))$('slow').onclick=()=>speak(current.term,true,0.65);if($('meaning-ok'))$('meaning-ok').onchange=e=>{meaningOK=e.target.checked;render()};if($('skip'))$('skip').onclick=()=>{next()};if($('refresh'))$('refresh').onclick=buildQueue;if($('early'))$('early').onclick=()=>{scope='all';buildQueue()};
if($('star-filter')){$('star-filter').value=starFilter;$('star-filter').onchange=e=>{starFilter=e.target.value;render()}}if($('search'))$('search').oninput=e=>{let pos=e.target.selectionStart;search=e.target.value;render();$('search').focus();$('search').setSelectionRange(pos,pos)};if($('status-filter')){$('status-filter').value=statusFilter;$('status-filter').onchange=e=>{statusFilter=e.target.value;render()}}
if(view==='sentences'){$('sentence-type').value=sentenceType;$('sentence-type').onchange=e=>{sentenceType=e.target.value;sentenceList()};$('sentence-search').oninput=e=>{search=e.target.value;sentenceList()};sentenceList()}
if(view==='settings'){voiceOptions();$('engine').value=settings.engine;$('engine').onchange=e=>{settings.engine=e.target.value;saveSettings()};$('voice-select').onchange=e=>{settings.voice=e.target.value;saveSettings();voiceStatus()};$('rate').oninput=e=>{settings.rate=Number(e.target.value);$('rate-label').textContent=settings.rate+' ×';saveSettings()};$('daily').onchange=e=>{settings.daily=Math.max(1,Math.min(100,parseInt(e.target.value)||20));e.target.value=settings.daily;saveSettings()};$('export').onclick=exportData;$('import').onchange=importData}}
document.addEventListener('click',e=>{let v=e.target.closest('[data-view]');if(v){stopSound();search='';navigate(v.dataset.view)}let p=e.target.closest('[data-say]');if(p)speak(p.dataset.say,DATA.items.some(x=>x.term===p.dataset.say));let g=e.target.closest('[data-grade]');if(g)grade(Number(g.dataset.grade))});
document.addEventListener('change',e=>{let id=e.target.dataset.levelId;if(!id)return;let level=e.target.value;if(level==='new')delete state[id];else{let old=state[id]||{};state[id]={...old,level:Number(level),due:level==='4'?null:Date.now(),streak:0,reps:old.reps||0,startedDay:old.startedDay||dayKey(),updated:Date.now()}}save();renderStats()});
let audio=null,soundToken=0;
function stopSound(){soundToken++;if(audio){audio.pause();audio=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
function voiceScore(v){return (/natural|neural|premium|enhanced/i.test(v.name)?100:0)+(!v.localService?30:0)+(/^en-GB/i.test(v.lang)?10:0)+(/Google|Microsoft|Samantha|Daniel|Serena/i.test(v.name)?5:0)}
function selectedVoice(){return voices.find(v=>v.voiceURI===settings.voice)||voices[0]}
function loadVoices(){voices=('speechSynthesis'in window?speechSynthesis.getVoices():[]).filter(v=>/^en(?:-|_)/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));voiceStatus();if(view==='settings')voiceOptions()}
function voiceStatus(){let v=selectedVoice();$('voice-status').textContent=v?'英语音色 · '+v.name:('speechSynthesis'in window?'未检测到英语音色，请查看学习设置':'此浏览器不支持设备朗读，请尝试在线词典发音或其他浏览器')}
function voiceOptions(){if(!$('voice-select'))return;$('voice-select').innerHTML='<option value="">自动选择 · 优先自然英语音色</option>'+voices.map(v=>`<option value="${escapeHTML(v.voiceURI)}">${escapeHTML(v.name)} · ${escapeHTML(v.lang)}</option>`).join('');$('voice-select').value=settings.voice}
function deviceSpeech(text,rate,token){if(token!==soundToken)return;if(!('speechSynthesis'in window)){toast('此浏览器不支持语音朗读，请换用支持语音的浏览器。');return}loadVoices();let v=selectedVoice();if(!v){toast('未检测到英语音色，请在系统中添加英语语音后重试。');return}let u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=rate;u.pitch=1;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))toast('朗读未成功，请换一个英语音色。')};speechSynthesis.speak(u)}
function speak(text,isTerm=false,rate=settings.rate){stopSound();const token=soundToken;let spoken=text.replace(/\bA\b/g,'A').replace(/…/g,' ').replace(/[＋+]/g,' ');if(settings.engine==='dictionary'&&isTerm){audio=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(spoken)+'&type=1');audio.playbackRate=rate;let finished=false;const fallback=()=>{if(finished||token!==soundToken)return;finished=true;if(audio)audio.pause();toast('在线发音不可用，已切换设备音色。');deviceSpeech(spoken,rate,token)};const timer=setTimeout(fallback,7000);audio.onplaying=()=>{finished=true;clearTimeout(timer)};audio.onerror=fallback;audio.play().catch(fallback);return}deviceSpeech(spoken,rate,token)}
function exportData(){let blob=new Blob([JSON.stringify({app:KEY,version:1,exportedAt:new Date().toISOString(),state,settings},null,2)],{type:'application/json'});let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='Manatees-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.app!==KEY||d.version!==1||!d.state||typeof d.state!=='object'||Array.isArray(d.state))throw Error();let valid=new Set(DATA.items.map(x=>x.id)),incoming={};for(let [id,r]of Object.entries(d.state)){if(!valid.has(id))continue;if(!r||![1,2,3,4].includes(r.level)||!Number.isFinite(r.updated)||!Number.isFinite(r.reps)||r.reps<0||(r.level!==4&&!Number.isFinite(r.due)))throw Error();incoming[id]={level:r.level,due:r.level===4?null:r.due,reps:r.reps,updated:r.updated,streak:Number.isFinite(r.streak)?Math.max(0,r.streak):0,startedDay:typeof r.startedDay==='string'?r.startedDay:dayKey()}}for(let[id,r]of Object.entries(incoming))if(!state[id]||r.updated>=(state[id].updated||0))state[id]=r;save();render();toast('进度已导入：按最后更新时间合并，不覆盖较新的记录。')}catch{toast('导入失败：请选择本页面导出的有效进度文件。')}finally{if($('import'))$('import').value=''}}
window.addEventListener('hashchange',()=>{let v=location.hash.slice(1);if(v!==view&&['cards','dictation','meaning','sentences','library','settings'].includes(v))navigate(v)});
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,1200)}else voiceStatus();
setInterval(()=>{renderStats();if(['cards','dictation','meaning'].includes(view)&&!current&&!document.querySelector('#en-answer')){let ids=candidates().map(x=>x.id);if(ids.length){queue=ids;next()}}},15000);
if(['cards','dictation','meaning'].includes(view))buildQueue();else render();
</script></body></html>
