": "The soil was repeatedly turned over.", "zh": "土壤被反复翻动。"}], "pos": "adv. 副词", "stars": 3, "contextSenses": [0], "id": "kakapo-f92e15433828"}, {"term": "turn over", "ipa": "ˌtɜːn ˈəʊvə", "zh": "翻动，翻转", "note": "此处搭配soil，指翻土", "type": "phrase", "examples": [{"en": "They used a small tool to turn over the soil.", "zh": "他们用一把小工具翻土。"}], "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "kakapo-0c3041778554"}, {"term": "during", "ipa": "ˈdjʊərɪŋ", "zh": "在……期间", "note": "后接名词，如during incubation", "type": "word", "examples": [{"en": "The 1–4 eggs are laid in soil, which is repeatedly turned over before and during incubation.", "zh": "雌鸟产下的1至4枚蛋位于土中，而这些土在孵卵前和孵卵期间会被反复翻动。"}, {"en": "As a result, during 1980–97, the surviving population was evacuated to three island sanctuaries: Codfish Island, Maud Island and Little Barrier Island.", "zh": "因此，1980年至1997年间，幸存的鸮鹦鹉种群被转移到三个岛屿保护地：科德菲什岛、莫德岛和小巴里尔岛。"}, {"en": "The equipment was checked before and during the experiment.", "zh": "实验前及实验期间，设备都接受了检查。"}], "pos": "prep. 介词", "stars": 1, "contextSenses": [0], "id": "kakapo-22246bf32aa1"}, {"term": "period", "ipa": "ˈpɪəriəd", "zh": "一段时间", "note": "long periods表示长时间，未给出确切时长", "type": "word", "examples": [{"en": "The female kākāpō has to spend long periods away from the nest searching for food, which leaves the unattended eggs and chicks particularly vulnerable to predators.", "zh": "雌性鸮鹦鹉不得不长时间离巢觅食，这使无人照看的鸟蛋和幼鸟尤其容易受到捕食者的侵害。"}, {"en": "She spends long periods away from home for work.", "zh": "她因工作需要经常长时间离家。"}, {"en": "The female spends long periods away from the nest searching for food.", "zh": "雌鸟长时间离巢觅食。"}], "pos": "n. 名词", "stars": 2, "contextSenses": [0], "id": "kakapo-1b735b6c6bed"}, {"term": "nest", "ipa": "nest", "zh": "鸟巢", "note": "也可作动词，表示筑巢、在某处营巢", "type": "word", "examples": [{"en": "The female kākāpō has to spend long periods away from the nest searching for food, which leaves the unattended eggs and chicks particularly vulnerable to predators.", "zh": "雌性鸮鹦鹉不得不长时间离巢觅食，这使无人照看的鸟蛋和幼鸟尤其容易受到捕食者的侵害。"}, {"en": "The female spends long periods away from the nest searching for food.", "zh": "雌鸟长时间离巢觅食。"}, {"en": "The unprotected nests were particularly vulnerable to disturbance.", "zh": "缺乏保护的巢尤其容易受到干扰。"}], "pos": "n. 名词", "stars": 2, "contextSenses": [0], "id": "kakapo-7bb45018eadb"}, {"term": "search for", "ipa": "ˈsɜːtʃ fə", "zh": "寻找", "note": "for后接要寻找的对象", "type": "phrase", "examples": [{"en": "The organisation made over sixty expeditions to search for the species.", "zh": "该机构开展了六十多次考察，搜寻这个物种。"}], "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "kakapo-90d705313d96"}, {"term": "leave", "ipa": "liːv", "zh": "使……处于某种状态", "note": "熟词生义；其他义：离开、留下", "type": "word", "examples": [{"en": "They are entirely vegetarian, with their diet including the leaves, roots and bark of trees as well as bulbs, and fern fronds.", "zh": "它们完全以植物为食，食物包括树叶、树根和树皮，也包括植物的鳞茎及蕨类的叶片。"}, {"en": "The female kākāpō has to spend long periods away from the nest searching for food, which leaves the unattended eggs and chicks particularly vulnerable to predators.", "zh": "雌性鸮鹦鹉不得不长时间离巢觅食，这使无人照看的鸟蛋和幼鸟尤其容易受到捕食者的侵害。"}, {"en": "The leaves reach up to thirty centimetres in length.", "zh": "这些叶子的长度可达三十厘米。"}], "pos": "v. 动词", "stars": 1, "contextSenses": [0], "id": "kakapo-ac85e87f5a7e"}, {"term": "unattended", "ipa": "ˌʌnəˈtendɪd", "zh": "无人照看的，无人看管的", "note": "如unattended luggage“无人看管的行李”", "type": "word", "examples": [{"en": "The female kākāpō has to spend long periods away from the nest searching for food, which leaves the unattended eggs and chicks particularly vulnerable to predators.", "zh": "雌性鸮鹦鹉不得不长时间离巢觅食，这使无人照看的鸟蛋和幼鸟尤其容易受到捕食者的侵害。"}, {"en": "Do not leave your luggage unattended.", "zh": "不要让行李处于无人看管的状态。"}, {"en": "The eggs were left unattended while the female searched for food.", "zh": "雌鸟觅食时，鸟蛋处于无人照看的状态。"}], "pos": "adj. 形容词", "stars": 4, "contextSenses": [0], "id": "kakapo-fcabe4a1242e", "memory": {"method": "前缀＋词族", "parts": "un-（不）＋attended（受到照看的）", "ti 白鼬以及另外两种鼠等其他捕食者，也被引入了新西兰。"}, {"en": "Conservationist Richard Henry led an effort to relocate several hundred of the birds to predator-free Resolution Island in Fiordland.", "zh": "自然保护人士Richard Henry牵头开展了一项行动，将数百只鸮鹦鹉迁往峡湾地区没有捕食者的雷索卢申岛。"}], "pos": "n. 名词", "stars": 4, "contextSenses": [0, 1], "id": "kakapo-3ec5ed31fb61", "memory": {"method": "词族联想", "parts": "predator（捕食者）与 predation（捕食行为）联记", "tip": "用角色对照：predator 捕食者，prey 猎物。", "family": "predation 捕食；prey 猎物"}}, {"term": "arrive", "ipa": "əˈraɪv", "zh": "到达", "note": "arrive in＋较大地点；arrive at＋具体地点", "type": "word", "examples": [{"en": "Before humans arrived, kākāpō were common throughout New Zealand's forests.", "zh": "在人类到来之前，鸮鹦鹉在新西兰各地的森林中都很常见。"}, {"en": "By the time European colonisers arrived in the early 1800s, kākāpō had become confined to the central North Island and forested parts of the South Island.", "zh": "到19世纪初欧洲殖民者抵达时，鸮鹦鹉的分布范围已经缩小，仅限于北岛中部和南岛有森林覆盖的部分地区。"}, {"en": "Unfortunately, the island didn't remain predator free – stoats arrived within six years, eventually destroying the kākāpō population.", "zh": "不幸的是，这座岛并未一直保持没有捕食者的状态——不到六年，白鼬便进入了岛上，最终导致岛上的鸮鹦鹉种群覆灭。"}], "pos": "v. 动词", "stars": 1, "contextSenses": [0], "id": "kakapo-92ee22333db9"}, {"term": "common", "ipa": "ˈkɒmən", "zh": "常见的，普遍存在的", "note": "也可指共同的，如 a common goal", "type": "word", "examples": [{"en": "Before humans arrived, kākāpō were common throughout New Zealand's forests.", "zh": "在人类到来之前，鸮鹦鹉在新西兰各地的森林中都很常见。"}, {"en": "The plant is common throughout the region.", "zh": "这种植物在该地区各地都很常见。"}, {"en": "These birds were once common throughout the island's forests.", "zh": "这些鸟曾在岛上各地的森林中十分常见。"}], "pos": "adj. 形容词", "stars": 2, "contextSenses": [0], "id": "kakapo-28a48b96989d"}, {"term": "throughout", "ipa": "θruːˈaʊt", "zh": "遍及，到处", "note": "也可表示贯穿整个时期，如 throughout the year", "type": "word", "examples": [{"en": "Before humans arrived, kākāpō were common throughout New Zealand's forests.", "zh": "在人类到来之前，鸮鹦鹉在新西兰各地的森林中都很常见。"}, {"en": "The plant ，启动；启动，发起", "note": "其他义：发射、推出产品 / 也可指发射、推出产品", "type": "word", "examples": [{"en": "In 1894, the New Zealand government launched its first attempt to save the kākāpō.", "zh": "1894年，新西兰政府首次启动了拯救鸮鹦鹉的行动。"}, {"en": "In 1974, a new initiative was launched, and by 1977, 18 more kākāpō were found in Fiordland.", "zh": "1974年，一项新的行动启动了；到1977年，又有18只鸮鹦鹉在峡湾地区被发现。"}, {"en": "In 1996, a new Recovery Plan was launched, together with a specialist advisory group called the Kākāpō Scientific and Technical Advisory Committee and a higher amount of funding.", "zh": "1996年，一项新的种群恢复计划启动；与此同时，一个名为“鸮鹦鹉科学与技术咨询委员会”的专业顾问小组成立，保护资金也有所增加。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0, 1], "id": "kakapo-f991bc2adeb6"}, {"term": "attempt", "ipa": "əˈtempt", "zh": "尝试", "note": "可作名词或动词；attempt to do", "type": "word", "examples": [{"en": "In 1894, the New Zealand government launched its first attempt to save the kākāpō.", "zh": "1894年，新西兰政府首次启动了拯救鸮鹦鹉的行动。"}, {"en": "The government launched an attempt to protect the species.", "zh": "政府发起了一项保护该物种的行动。"}, {"en": "The organisation launched a new attempt to restore the habitat.", "zh": "该组织再次尝试恢复栖息地。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0], "id": "kakapo-705b73111455"}, {"term": "save", "ipa": "seɪv", "zh": "拯救，保护", "note": "其他义：节省、储蓄、保存文件", "type": "word", "examples": [{"en": "In 1894, the New Zealand government launched its first attempt to save the kākāpō.", "zh": "1894年，新西兰政府首次启动了拯救鸮鹦鹉的行动。"}], "pos": "v. 动词", "stars": 1, "contextSenses": [0], "id": "kakapo-3759fe29d5ae"}, {"term": "conservationist", "ipa": "ˌkɒnsəˈveɪʃənɪst", "zh": "自然保护人士", "note": "conservation“自然保护”", "type": "word", "examples": [{"en": "Conservationist Richard Henry led an effort to relocate several hundred of the birds to predator-free Resolution Island in Fiordland.", "zh": "自然保护人士Richard Henry牵头开展了一项行动，将数百只鸮鹦鹉迁往峡湾地区没有捕食者的雷索卢申岛。"}], "pos": "n. 名词", "stars": 5, "contextSenses": [0], "id": "kakapo-21cbed162eff", "memory": {"method": "名词＋后缀", "parts": "conser ], "pos": "v. 动词", "stars": 2, "contextSenses": [0], "id": "kakapo-bb6db397f2fa"}, {"term": "within", "ipa": "wɪˈðɪn", "zh": "在……时间以内", "note": "也可表示空间或数值范围以内 / 表示时间上限，不是持续时长", "type": "word", "examples": [{"en": "Unfortunately, the island didn't remain predator free – stoats arrived within six years, eventually destroying the kākāpō population.", "zh": "不幸的是，这座岛并未一直保持没有捕食者的状态——不到六年，白鼬便进入了岛上，最终导致岛上的鸮鹦鹉种群覆灭。"}, {"en": "Six were caught, but there were no females amongst them and all but one died within a few months of captivity.", "zh": "共有六只鸮鹦鹉被捕获，但其中没有雌鸟；圈养后不到几个月，除一只外，其余全部死亡。"}, {"en": "The project was completed within six years.", "zh": "项目在六年内完成。"}], "pos": "prep. 介词", "stars": 2, "contextSenses": [0], "id": "kakapo-4c76c62cb4c3"}, {"term": "eventually", "ipa": "ɪˈventʃuəli", "zh": "最终", "note": "强调经过过程后出现的结果", "type": "word", "examples": [{"en": "Unfortunately, the island didn't remain predator free – stoats arrived within six years, eventually destroying the kākāpō population.", "zh": "不幸的是，这座岛并未一直保持没有捕食者的状态——不到六年，白鼬便进入了岛上，最终导致岛上的鸮鹦鹉种群覆灭。"}], "pos": "adv. 副词", "stars": 3, "contextSenses": [0], "id": "kakapo-6da1acd1101d"}, {"term": "destroy", "ipa": "dɪˈstrɔɪ", "zh": "毁灭，彻底破坏", "note": "本句指使种群不复存在", "type": "word", "examples": [{"en": "Unfortunately, the island didn't remain predator free – stoats arrived within six years, eventually destroying the kākāpō population.", "zh": "不幸的是，这座岛并未一直保持没有捕食者的状态——不到六年，白鼬便进入了岛上，最终导致岛上的鸮鹦鹉种群覆灭。"}], "pos": "v. 动词", "stars": 2, "contextSenses": [0], "id": "kakapo-ef640915468f"}, {"term": "population", "ipa": "ˌpɒpjəˈleɪʃən", "zh": "种群；种群，种群数量", "note": "熟词生义：不只指人类人口，也指特定区域某种生物的群体 / 本句作单数整体，用was / 本句不是人类人口", "type": "word", "examples": [{"en": "Unfortunately, the island didn't remain predator free – stoats arrived within six years, eventually destroying the kākāpō population.", "zh": "不幸的是，这座岛并未一直保持没有捕食者的状态——不到六年，白鼬便进入了岛上，最终导致岛上的鸮鹦鹉种群覆灭。"}, {"en": "In 1977, a large population of males was spotted in Rakiura – a large island free from stoats, ferrets and weasels.", "zh": "1977年，人们在拉基乌拉岛发现了一个数量较大的雄鸟种群。这是一座没有白鼬、雪貂和伶鼬的大岛。"}, {"en": "As a result, during 1980–97, the surviving population was evacuated to three island sanctuaries: Codfish Island, Maud Island and Little Barrier Island.", "zh": "因此，1980年至1997年间，幸存的鸮鹦鹉种群被转移到三个岛屿保护地：科德菲什岛、莫德岛和小巴里尔岛。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0, 1], "id": "kakapo-ec20c3924171"}, {"term": "mid-", "ipa": "mɪd", "zh": "中间的，中期的", "note": "如mid-century“世纪中叶”", "type": "word", "examples": [{"en": "By the mid-1900s, the kākāpō was practically a lost species.", "zh": "到20世纪中叶，鸮鹦鹉几乎已经成了一个行将消失的物种。"}], "pos": "prefix 前缀", "stars": 3, "contextSenses": [0], "id": "kakapo-3e1e3dcfea10"}, {"term": "practically", "ipa": "ˈpræktɪkli", "zh": "几乎，差不多", "note": "熟词生义；另可表示实际地、从实践角度", "type": "word", "examples": [{"en": "By the mid-1900s, the kākāpō was practically a lost species.", "zh": "到20世纪中叶，鸮鹦鹉几乎已经成了一个行将消失的物种。"}, {"en": "At that time, the bird was practically a lost species.", "zh": "当时，这种鸟几乎已经消失。"}, {"en": "The account described it as practically a lost species.", "zh": "这份记述将它描述为一个几乎已经消失的物种。"}], "pos": "adv. 副词", "stars": 3, "contextSenses": [0], "id": "kakapo-b3bd0ba7ca97"}, {"term": "lost", "ipa": "lɒst", "zh": "几乎消失、难以寻到的", "note": "也可表示迷路的、遗失的；此处不是正式保护等级", "type": "word", "examples": [{"en": "A great deal of habitat was lost through forest clearance, and introduced species such as deer depleted the remaining forests of food.", "zh": "森林被清除，导致大量栖息地丧失；鹿等引入物种又大量消耗了剩余森林中的食物资源。"}, {"en": "By the mid-1900s, the kākāpō was practically a lost species.", "zh": "到20世纪中叶，鸮鹦鹉几乎已经成了一个行将消失的物种。"}, {"en": "A great deal of habitat was lost during this period.", "zh": "这一时期，大量栖息地丧失了。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "kakapo-1d1b2d86ec07"}, {"term": "cling", "ipa": "klɪŋ", "zh": "紧抓，依附", "note": "cling to；也可比喻坚持某种想法", "type": "word", "examples": [{"en": "Only a few clung to life in the most isolated parts of New Zealand.", "zh": "只有少数鸮鹦鹉仍在新西兰最偏僻的地区艰难存活。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0], "id": "kakapo-4a291bd9da26"}, {"term": "clung", "ipa": "klʌŋ", "zh": "艰难维持〔在搭配中〕", "note": "cling的过去式和过去分词", "type": "word", "examples": [{"en": "Only a few clung to life in the most isolated parts of New Zealand.", "zh": "只有少数鸮鹦鹉仍在新西兰最偏僻的地区艰难存活。"}, {"en": "A few birds clung to life in remote valleys.", "zh": "少数鸟在偏远山谷中艰难存活。"}, {"en": "The damaged tree clung to life despite the drought.", "zh": "尽管遭遇干旱，那棵受损的树仍勉强活着。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0], "id": "kakapo-37941c9829d8"}, {"term": "cling to life", "ipa": "ˌklɪŋ tə ˈlaɪf", "zh": "勉强存活，艰难维持生命；艰难存活", "note": "带有危险、脆弱的语气 / 文档表达：cling to life", "type": "phrase", "examples": [{"en": "A few birds clung to life in remote valleys.", "zh": "少数鸟在偏远山谷中艰难存活。"}, {"en": "The damaged tree clung to life despite the drought.", "zh": "尽管遭遇干旱，那棵受损的树仍勉强活着。"}, {"en": "The remaining population clung to life in a small area of forest.", "zh": "剩余种群在一小片森林里艰难维持生存。"}], "pos": "短语／表达", "stars": 3, "contextSenses": [0, 1], "id": "kakapo-944b8812a55a"}, {"term": "isolated", "ipa": "ˈaɪsəleɪtɪd", "zh": "偏僻的，隔绝的", "note": "也可指孤立的个案，如an isolated incident", "type": "word", "examples": [{"en": "Only a few clung to life in the most isolated parts of New Zealand.", "zh": "只有少数鸮鹦鹉仍在新西兰最偏僻的地区艰难存活。"}, {"en": "The researchers searched in the most isolated parts of the island.", "zh": "研究人员在岛上最偏僻的地区搜寻。"}, {"en": "Small communities lived in the most isolated parts of the region.", "zh": "一些小型社区位于该地区最偏僻的地方。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "kakapo-e874ec3a3b03"}, {"term": "newly", "ipa": "ˈnjuːli", "zh": "新近地，刚刚", "note": "如 newly established“新设立的”", "type": "word", "examples": [{"en": "From 1949 to 1973, the newly formed New Zealand Wildlife Service made over 60 expeditions to find kākāpō, focusing mainly on Fiordland.", "zh": "1949年至1973年间，新成立的新西兰野生动物管理机构开展了60多次寻找鸮鹦鹉的野外考察，主要集中在峡湾地区。"}], "pos": "adv. 副词", "stars": 3, "contextSenses": [0], "id": "kakapo-54f93f73d1d6"}, {"term": "form", "ipa": "fɔːm", "zh": "成立，组建", "note": "也可表示形成；名词可指形式、表格", "type": "word", "examples": [{"en": "From 1949 to 1973, the newly formed New Zealand Wildlife Service made over 60 expeditions to find kākāpō, focusing mainly on Fiordland.", "zh": "1949年至1973年间，新成立的新西兰野生动物管理机构开展了60多次寻找鸮鹦鹉的野外考察，主要集中在峡湾地区。"}, {"en": "The surviving birds formed the foundation of subsequent conservation work.", "zh": "幸存鸟类构成了后续保护工作的基础。"}], "pos": "v. 动词", "stars": 2, "contextSenses": [0], "id": "kakapo-b8444cda20d9"}, {"term": "wildlife", "ipa": "ˈwaɪldlaɪf", "zh": "野生动物、生物", "note": "通常不可数", "type": "word", "examples": [{"en": "From 1949 to 1973, the newly formed New Zealand Wildlife Service made over 60 expeditions to find kākāpō, focusing mainly on Fiordland.", "zh": "1949年至1973年间，新成立的新西兰野生动物管理机构开展了60多次寻找鸮鹦鹉的野外考察，主要集中在峡湾地区。"}, {"en": "Some introduced animals prey on native wildlife.", "zh": "一些引入的动物会捕食本地野生动物。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0], "id": "kakapo-71f504e53e8d"}, {"term": "service", "ipa": "ˈsɜːvɪs", "zh": "公共机构、管理部门", "note": "熟悉的另一义为服务；此处是机构名称的一部分", "type": "word", "examples": [{"en": "From 1949 to 1973, the newly formed New Zealand Wildlife Service made over 60 expeditions to find kākāpō, focusing mainly on Fiordland.", "zh": "1949年至1973年间，新成立的新西兰野生动物管理机构开展了60多次寻找鸮鹦鹉的野外考察，主要集中在峡湾地区。"}], "pos": "n. 名词", "stars": 2, "contextSenses": [0], "id": "kakapo-6b7c6c20dc19"}, {"term": "expedition", "ipa": "ˌekspəˈdɪʃən", "zh": "考察，远征", "note": "强调有特定目的、经过组织的行程", "type": "word", "examples": [{"en": "From 1949 to 1973, the newly formed New Zealand Wildlife Service made over 60 expeditions to find kākāpō, focusing mainly on Fiordland.", "zh": "1949年至1973年间，新成立的新西兰野生动物管理机构开展了60多次寻找鸮鹦鹉的野外考察，主要集中在峡湾地区。"}, {"en": "The team made several expeditions to find the remaining birds.", "zh": "团队开展了几次考察，寻找剩余的鸟。"}, {"en": "Researchers made expeditions to remote valleys.", "zh": "研究人员前往偏远山谷考察。"}], "pos": "n. 名词", "stars": 4, "contextSenses": [0], "id": "kakapo-862fa2aa3f6e", "memory": {"method": "词族＋情景", "parts": "expedition（有组织的考察）与 expeditionary 联记", "tip": "不是普通出游，而是为寻找鸟只组织的野外行程。", "family": "expeditionary 考察的；an expedition 考察活动"}}, {"term": "mainly", "ipa": "ˈmeɪnli", "zh": "主要地", "note": "不等于 exclusively“仅仅、完全只在”", "type": "word", "examples": [{"en": "From 1949 to 1973, the newly formed New Zealand Wildlife Service made over 60 expeditions to find kākāpō, focusing mainly on Fiordland.", "zh": "1949年至1973年间，新成立的新西兰野生动物管理机构开展了60多次寻找鸮鹦鹉的野外考察，主要集中在峡湾地区。"}, {"en": "The survey focused mainly on forest habitats.", "zh": "调查主要集中于森林栖息地。"}, {"en": "The team focused mainly on finding females.", "zh": "团队主要致力于寻找雌鸟。"}], "pos": "adv. 副词", "stars": 3, "contextSenses": [0], "id": "kakapo-1d066f16bc4f"}, {"term": "catch", "ipa": "kætʃ", "zh": "捕获", "note": "也可指赶上、接住、感染，如 catch a cold", "type": "word", "examples": [{"en": "Six were caught, but there were no females amongst them and all but one died within a few months of captivity.", "zh": "共有六只鸮鹦鹉被捕获，但其中没有雌鸟；圈养后不到几个月，除一只外，其余全部死亡。"}], "pos": "v. 动词", "stars": 2, "contextSenses": [0], "id": "kakapo-d0111d842a3f"}, {"term": "amongst", "ipa": "əˈmʌŋst", "zh": "在……当中", "note": "与 among基本同义", "type": "word", "examples": [{"en": "Six were caught, but there were no females amongst them and all but one died within a few months of captivity.", "zh": "共有六只鸮鹦鹉被捕获，但其中没有雌鸟；圈养后不到几个月，除一只外，其余全部死亡。"}], "pos": "prep. 介词", "stars": 3, "contextSenses": [0], "id": "kakapo-ddbc6ce4728b"}, {"term": "all but one", "ipa": "ˌɔːl bət ˈwʌn", "zh": "除一个以外全部", "note": "此处 but表示except / 文档表达：all but one", "type": "phrase", "examples": [{"en": "All but one of the students completed the task.", "zh": "除一名学生外，其余都完成了任务。"}, {"en": "All but one of the machines stopped working.", "zh": "除一台机器外，其余都停止运转了。"}, {"en": "Six birds were caught, and all but one died within a few months.", "zh": "六只鸟被捕获，除一只外，其余都在几个月内死亡。"}], "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "kakapo-b32e7b7e5807"}, {"term": "captivity", "ipa": "kæpˈtɪvəti", "zh": "圈养、被关养的状态", "note": "in captivity“在圈养条件下”；区别野外状态", "type": "word", "examples": [{"en": "Six were caught, but there were no females amongst them and all but one died within a few months of captivity.", "zh": "共有六只鸮鹦鹉被捕获，但其中没有雌鸟；圈养后不到几个月，除一只外，其余全部死亡。"}, {"en": "The birds died within a few months of being taken into captivity.", "zh": "这些鸟在被圈养后的几个月内死亡了。"}], "pos": "n. 名词", "stars": 4, "contextSenses": [0], "id": "kakapo-c7ba4c085c2f", "memory": {"method": "词族＋后缀", "parts": "captive（被囚禁的）→ captivity（被关养的状态）", "tip": "-ity 表示性质或状态；本文 in captivity 是圈养状态。", "family": "captive 被囚禁的；in the wild 在野外"}}, {"term": "initiative", "ipa": "ɪˈnɪʃətɪv", "zh": "新举措、新行动", "note": "也可表示主动性，如 show initiative", "type": "word", "examples": [{"en": "In 1974, a new initiative was launched, and by 1977, 18 more kākāpō were found in Fiordland.", "zh": "1974年，一项新的行动启动了；到1977年，又有18只鸮鹦鹉在峡湾地区被发现。"}, {"en": "The organisation launched a new initiative to protect habitats.", "zh": "该组织启动了一项保护栖息地的新行动。"}, {"en": "The government launched a new initiative to support conservation research.", "zh": "政府发起了一项支持自然保护研究的新举措。"}], "pos": "n. 名词", "stars": 4, "contextSenses": [0], "id": "kakapo-bf6cd6050189", "memory": {"method": "词族联想", "parts": "initiate（发起）→ initiative（新举措）", "tip": "发起 initiate 一项行动 initiative；本文不是主动性之义。", "family": "initiate 发起；initial 最初的"}}, {"term": "by", "ipa": "baɪ", "zh": "到……时，不迟于；截至，到……时", "note": "此处表示时间界限 / 此处表示完成时限 / 不表示事情全部发生在该年", "type": "word", "examples": [{"en": "By the time European colonisers arrived in the early 1800s, kākāpō had become confined to the central North Island and forested parts of the South Island.", "zh": "到19世纪初欧洲殖民者抵达时，鸮鹦鹉的分布范围已经缩小，仅限于北岛中部和南岛有森林覆盖的部分地区。"}, {"en": "The fall in kākāpō numbers was accelerated by European colonisation.", "zh": "欧洲殖民活动加速了鸮鹦鹉数量的下降。"}, {"en": "By the mid-1900s, the kākāpō was practically a lost species.", "zh": "到20世纪中叶，鸮鹦鹉几乎已经成了一个行将消失的物种。"}], "pos": "prep. 介词", "stars": 1, "contextSenses": [0, 1], "id": "kakapo-07ad92080ec7"}, {"term": "more", "ipa": "mɔː", "zh": "另外的，额外的", "note": "18 more表示又增加18只的发现记录", "type": "word", "examples": [{"en": "Other predators such as cats, stoats and two more species of rat were also introduced.", "zh": "猫、白鼬以及另外两种鼠等其他捕食者，也被引入了新西兰。"}, {"en": "In 1974, a new initiative was launched, and by 1977, 18 more kākāpō were found in Fiordland.", "zh": "1974年，一项新的行动启动了；到1977年，又有18只鸮鹦鹉在峡湾地区被发现。"}, {"en": "However, the population did not start to increase until rats were removed from all three islands, and the birds were more intensively managed.", "zh": "然而，直到三座岛上的鼠都被清除，并且对鸮鹦鹉实施了更密集的管理之后，种群数量才开始增加。"}], "pos": "det. 限定词", "stars": 1, "contextSenses": [0], "id": "kakapo-2d543bdb99b2"}, {"term": "find", "ipa": "faɪnd", "zh": "发现，找到", "note": "find—found—found", "type": "word", "examples": [{"en": "From 1949 to 1973, the newly formed New Zealand Wildlife Service made over 60 expeditions to find kākāpō, focusing mainly on Fiordland.", "zh": "1949年至1973年间，新成立的新西兰野生动物管理机构开展了60多次寻找鸮鹦鹉的野外考察，主要集中在峡湾地区。"}, {"en": "The team made several expeditions to find the remaining birds.", "zh": "团队开展了几次考察，寻找剩余的鸟。"}, {"en": "The team focused mainly on finding females.", "zh": "团队主要致力于寻找雌鸟。"}], "pos": "v. 动词", "stars": 1, "contextSenses": [0], "id": "kakapo-c12505da19c0"}, {"term": "however", "ipa": "haʊˈevə", "zh": "然而", "note": "标志与前面积极结果形成转折", "type": "word", "examples": [{"en": "However, this all changed with the arrival of the first Polynesian settlers about 700 years ago.", "zh": "然而，大约700年前，随着首批波利尼西亚移民的到来，这一切都发生了改变。"}, {"en": "However, there were still no females.", "zh": "然而，仍然没有发现雌鸟。"}, {"en": "However, breeding success was hard to achieve.", "zh": "然而，要成功繁殖并不容易。"}], "pos": "adv. 副词", "stars": 2, "contextSenses": [0], "id": "kakapo-02eff0636ff7"}, {"term": "still", "ipa": "stɪl", "zh": "仍然", "note": "也可表示静止的，如 keep still", "type": "word", "examples": [{"en": "However, there were still no females.", "zh": "然而，仍然没有发现雌鸟。"}], "pos": "adv. 副词", "stars": 1, "contextSenses": [0], "id": "kakapo-03362106119d"}, {"term": "spot", "ipa": "spɒt", "zh": "发现，看到", "note": "熟词生义；名词常指斑点、地点", "type": "word", "examples": [{"en": "In 1977, a large population of males was spotted in Rakiura – a large island free from stoats, ferrets and weasels.", "zh": "1977年，人们在拉基乌拉岛发现了一个数量较大的雄鸟种群。这是一座没有白鼬、雪貂和伶鼬的大岛。"}], "pos": "v. 动词", "stars": 2, "contextSenses": [0], "id": "kakapo-9eb2461955f6"}, {"term": "free from", "ipa": "ˈfriː frəm", "zh": "没有，不受……影响", "note": "后接需要排除的事物", "type": "phrase", "examples": [{"en": "In 1977, a large population of males was spotted in Rakiura – a large island free from stoats, ferrets and weasels.", "zh": "1977年，人们在拉基乌拉岛发现了一个数量较大的雄鸟种群。这是一座没有白鼬、雪貂和伶鼬的大岛。"}, {"en": "The island was free from the three predators mentioned in the report.", "zh": "岛上没有报告提到的那三种捕食者。"}, {"en": "The samples were free from contamination.", "zh": "样本没有受到污染。"}], "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "kakapo-fff5a867ba75"}, {"term": "ferret", "ipa": "ˈferɪt", "zh": "雪貂", "note": "鼬科动物", "type": "word", "examples": [{"en": "In 1977, a large population of males was spotted in Rakiura – a large island free from stoats, ferrets and weasels.", "zh": "1977年，人们在拉基乌拉岛发现了一个数量较大的雄鸟种群。这是一座没有白鼬、雪貂和伶鼬的大岛。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0], "id": "kakapo-ed72e0e5dfe3"}, {"term": "weasel", "ipa": "ˈwiːzəl", "zh": "伶鼬，鼬", "note": "此处与stoat、ferret并列，指不同动物", "type": "word", "examples": [{"en": "In 1977, a large population of males was spotted in Rakiura – a large island free from stoats, ferrets and weasels.", "zh": "1977年，人们在拉基乌拉岛发现了一个数量较大的雄鸟种群。这是一座没有白鼬、雪貂和伶鼬的大岛。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0], "id": "kakapo-6efd3f3a6c3c"}, {"term": "individual", "ipa": "ˌɪndɪˈvɪdʒuəl", "zh": "生物个体", "note": "名词也指个人；形容词表示个别的、单独的", "type": "word", "examples": [{"en": "There were about 200 individuals, and in 1980 it was confirmed females were also present.", "zh": "当时约有200只个体；1980年，人们确认其中也存在雌鸟。"}, {"en": "A reported l  "The surviving birds formed the foundation of subsequent conservation work.", "zh": "幸存鸟类构成了后续保护工作的基础。"}], "pos": "adj. 形容词", "stars": 4, "contextSenses": [0], "id": "kakapo-fb8680fffe32", "memory": {"method": "词族联想", "parts": "subsequent（随后的）与 subsequently（随后）联记", "tip": "前面发现的鸟是后续 subsequent 保护工作的基础。", "family": "subsequently 随后；subsequent to 在……之后"}}, {"term": "predation", "ipa": "prɪˈdeɪʃən", "zh": "捕食", "note": "强调行为或生态过程", "type": "word", "examples": [{"en": "Unfortunately, predation by feral cats on Rakiura Island led to a rapid decline in kākāpō numbers.", "zh": "不幸的是，拉基乌拉岛上野化猫的捕食，导致鸮鹦鹉数量迅速下降。"}], "pos": "n. 名词", "stars": 4, "contextSenses": [0], "id": "kakapo-a0600c798cdc", "memory": {"method": "词族变化", "parts": "predation（捕食行为）↔ predator（捕食者）", "tip": "同一生态事件：行为是 predation，行动者是 predator。", "family": "predator 捕食者；prey 猎物"}}, {"term": "feral", "ipa": "ˈferəl", "zh": "野化的，脱离家养后在野外生活的", "note": "与一般的wild“野生的”不完全相同", "type": "word", "examples": [{"en": "Unfortunately, predation by feral cats on Rakiura Island led to a rapid decline in kākāpō numbers.", "zh": "不幸的是，拉基乌拉岛上野化猫的捕食，导致鸮鹦鹉数量迅速下降。"}], "pos": "adj. 形容词", "stars": 4, "contextSenses": [0], "id": "kakapo-8c41c4f93689", "memory": {"method": "语义对比", "parts": "整体记忆 feral，与 wild 对照", "tip": "本文猫原属家养动物，后来在野外生活，因而是野化猫 feral cats。", "family": "feral cat 野化猫；wild 野生的"}}, {"term": "lead to", "ipa": "ˈliːd tə", "zh": "导致", "note": "过去式为led to；此处不是“带路到”", "type": "phrase", "examples": [{"en": "Unfortunately, predation by feral cats on Rakiura Island led to a rapid decline in kākāpō numbers.", "zh": "不幸的是，拉基乌拉岛上野化猫的捕食，导致鸮鹦鹉数量迅速下降。"}], "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "kakapo-c95b59bff4c3"}, {"term": "rapid", "ipa": "ˈræpɪd", "zh": "迅速的", "note": "强调变化速度", "type": "word", "examples": [{"en": "Unfortunately, predation by feral cats on Rakiura Island led to a rapid decline in kākāpō numbers.", "zh": "不幸的是，拉基乌拉岛上野化猫的捕食，导致鸮鹦鹉数量迅速下降。"}, {"en": "Habitat loss led to a rapid decline in bird numbers.", " fish Island, Maud Island and Little Barrier Island.", "zh": "因此，1980年至1997年间，幸存的鸮鹦鹉种群被转移到三个岛屿保护地：科德菲什岛、莫德岛和小巴里尔岛。"}, {"en": "The residents were evacuated to a safer area.", "zh": "居民被疏散到更安全的地区。"}, {"en": "The team evacuated the animals to an island sanctuary.", "zh": "团队将动物转移到一处岛屿保护地。"}], "pos": "v. 动词", "stars": 4, "contextSenses": [0], "id": "kakapo-81706c822ad9", "memory": {"method": "词族变化", "parts": "evacuate（撤离）→ evacuation（撤离，名词）", "tip": "把鸟从危险地点撤走，再转移到保护地。", "family": "evacuation 撤离；evacuee 被疏散者"}}, {"term": "sanctuary", "ipa": "ˈsæŋktʃuəri", "zh": "野生动物保护地，庇护所", "note": "不自动等同于“无捕食者区域”", "type": "word", "examples": [{"en": "The team evacuated the animals to an island sanctuary.", "zh": "团队将动物转移到一处岛屿保护地。"}], "pos": "n. 名词", "stars": 5, "contextSenses": [0], "id": "kakapo-85d0314cecbe", "memory": {"method": "词族＋语境", "parts": "sanctuary（庇护所）与 sanctum（私密安静处）联记", "tip": "本文是动物保护地；这个词本身并不保证没有捕食者。", "family": "wildlife sanctuary 野生动物保护地；sanctum 私密处", "source": "https://www.etymonline.com/word/sanctuary"}}, {"term": "breeding", "ipa": "ˈbriːdɪŋ", "zh": "繁殖", "note": "breed的名词性形式", "type": "word", "examples": [{"en": "However, breeding success was hard to achieve.", "zh": "然而，要成功繁殖并不容易。"}, {"en": "The team collected data before and during the breeding season.", "zh": "团队在繁殖季之前及期间收集了数据。"}, {"en": "Breeding success was hard to achieve.", "zh": "成功繁殖很难实现。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0], "id": "kakapo-0189556a2eae"}, {"term": "success", "ipa": "səkˈses", "zh": "成功", "note": "此处通常不可数", "type": "word", "examples": [{"en": "However, breeding success was hard to achieve.", "zh": "然而，要成功繁殖并不容易。"}, {"en": "Breeding success was hard to achieve.", "zh": "成功繁殖很难实现。"}], "pos": "n. 名词", "stars": 2, "contextSenses": [0], "id": "kakapo-7fec9448325d"}, {"term": "achieve", "ipa": "əˈtʃiːv", "zh": "实现，达到", "note": "常搭配goal、success、result", "type": "word", "examples": [{"en": "However, breeding success was hard to achieve.", "zh": "然而，要成功繁殖并不容易。"}, {"en": "Breeding success was hard to achieve.", "zh": "成功繁殖很难实现。"}, {"en": "Agreement proved hard to achieve.", "zh": "事实证明，达成一致很困难。"}], "pos": "v. 动词", "stars": 2, "contextSenses": [0], "id": "kakapo-a382f6c10be0"}, {"term": "insufficient", "ipa": "ˌɪnsəˈfɪʃənt", "zh": "不足的，不够的", "note": "反义词sufficient“足够的”", "type": "word", "examples": [{"en": "Rats were found to be a major predator of kākāpō chicks and an insufficient number of chicks survived to offset adult mortality.", "zh": "人们发现，鼠类是鸮鹦鹉幼鸟的主要捕食者之一；存活下来的幼鸟数量不足，无法抵消成年鸟死亡造成的种群损失。"}, {"en": "An insufficient number of chicks survived.", "zh": "存活的幼鸟数量不足。"}, {"en": "The project recruited an insufficient number of volunteers.", "zh": "项目招募的志愿者数量不足。"}], "pos": "adj. 形容词", "stars": 4, "contextSenses": [0], "id": "kakapo-bc69479b4d86", "memory": {"method": "否定前缀", "parts": "in-（不）＋sufficient（足够的）", "tip": "幼鸟存活数不够抵消死亡数：insufficient。", "family": "sufficient 足够的；insufficiency 不足"}}, {"term": "survive", "ipa": "səˈvaɪv", "zh": "存活，幸存", "note": "名词survival“存活、生存”", "type": "word", "examples": [{"en": "Rats were found to be a major predator of kākāpō chicks and an insufficient number of chicks survived to offset adult mortality.", "zh": "人们发现，鼠类是鸮鹦鹉幼鸟的主要捕食者之一；存活下来的幼鸟数量不足，无法抵消成年鸟死亡造成的种群损失。"}, {"en": "By 1995, although at least 12 chicks had been produced on the islands, only three had survived.", "zh": "到1995年，虽然这些岛上至少已有12只幼鸟出生，但只有三只存活了下来。"}, {"en": "Several species survive in forested parts of the mountains.", "zh": "若干物种在山区有森林覆盖的地带生存。"}], "pos": "v. 动词", "stars": 2, "contextSenses": [0], "id": "kakapo-8be0cbe2d86b"}, {"term": "offset", "ipa": "ˌɒfˈset", "zh": "抵消，补偿", "note": "常用于成本、损失、排放等；不是单纯“增加”", "type": "word", "examples": [{"en": "Rats were found to be a major predator of kākāpō chicks and an insufficient number of chicks survived to offset adult mortality.", "zh": "人们发现，鼠类是鸮鹦鹉幼鸟的主要捕食者之一；存活下来的幼鸟数量不足，无法抵消成年鸟死亡造成的种群损失。"}, {"en": "Too few young birds survived to offset adult mortality.", "zh": "存活幼鸟太少，无法抵消成年鸟死亡造成的损失。"}, {"en": "The researchers assessed whether new recruits could offset adult mortality.", "zh": "研究人员评估了新补充个体是否能抵消成年个体死亡造成的损失。"}], "pos": "v. 动词", "stars": 4, "contextSenses": [0], "id": "kakapo-dff6967ca659", "memory": {"method": "复合词联想", "parts": "off ＋ set，整体记住“抵消”", "tip": "存活幼鸟补上成年鸟死亡造成的损失；offset 不是单纯增加。", "family": "offset a loss 抵消损失；offset emissions 抵消排放"}}, {"term": "adult", "ipa": "ˈædʌlt", "zh": "成年的；成年个体", "note": "此处修饰mortality，指成年鸟死亡 / 此处作名词，指成年鸟", "type": "word", "examples": [{"en": "Rats were found to be a major predator of kākāpō chicks and an insufficient number of chicks survived to offset adult mortality.", "zh": "人们发现，鼠类是鸮鹦鹉幼鸟的主要捕食者之一；存活下来的幼鸟数量不足，无法抵消成年鸟死亡造成的种群损失。"}, {"en": "This involved moving the birds between islands, supplementary feeding of adults and rescuing and hand-raising any failing chicks.", "zh": "这些管理措施包括：在岛屿之间转移鸟只、为成年鸟补充饲料，以及救助并人工抚育那些生长或生存状况不佳的幼鸟。"}, {"en": "Too few young birds survived to offset adult mortality.", "zh": "存活幼鸟太少，无法抵消成年鸟死亡造成的损失。"}], "pos": "adj./n. 形容词／名词", "stars": 2, "contextSenses": [0, 1], "id": "kakapo-2e0106335f4a"}, {"term": "mortality", "ipa": "mɔːˈtæləti", "zh": "死亡，死亡率", "note": "与生存、健康、种群研究相关", "type": "word", "examples": [{"en": "Rats were found to be a major predator of kākāpō chicks and an insufficient number of chicks survived to offset adult mortality.", "zh": "人们发现，鼠类是鸮鹦鹉幼鸟的主要捕食者之一；存活下来的幼鸟数量不足，无法抵消成年鸟死亡造成的种群损失。"}, {"en": "Too few young birds survived to offset adult mortality.", "zh": "存活幼鸟太少，无法抵消成年鸟死亡造成的损失。"}, {"en": "The researchers assessed whether new recruits could offset adult mortality.", "zh": "研究人员评估了新补充个体是否能抵消成年个体死亡造成的损失。"}], "pos": "n. 名词", "stars": 5, "contextSenses": [0], "id": "kakapo-b01985659f7f", "memory": {"method": "形容词＋后缀", "parts": "mortal（会死亡的）＋-ity → mortality", "tip": "mortal 指生命有限，mortality 在本文是死亡／死亡率。", "family": "mortal 会死亡的；immortal 不朽的"}}, {"term": "although", "ipa": "ɔːlˈðəʊ", "zh": "虽然，尽管", "note": "不再与but重复连接同一主从句", "type": "word", "examples": [{"en": "By 1995, although at least 12 chicks had been produced on the islands, only three had survived.", "zh": "到1995年，虽然这些岛上至少已有12只幼鸟出生，但只有三只存活了下来。"}], "pos": "conj. 连词", "stars": 2, "contextSenses": [0], "id": "kakapo-18be9fec45b2"}, {"term": "at least", "ipa": "ət ˈliːst", "zh": "至少", "note": "表示下限，不是精确数量", "type": "phrase", "examples": [{"en": "By 1995, although at least 12 chicks had been produced on the islands, only three had survived.", "zh": "到1995年，虽然这些岛上至少已有12只幼鸟出生，但只有三只存活了下来。"}], "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "kakapo-be773c9aa611"}, {"term": "produce", "ipa": "prəˈdjuːs", "zh": "繁殖产生，产下；繁殖产生", "note": "也可指生产、创作、造成", "type": "word", "examples": [{"en": "By 1995, although at least 12 chicks had been produced on the islands, only three had survived.", "zh": "到1995年，虽然这些岛上至少已有12只幼鸟出生，但只有三只存活了下来。"}, {"en": "By 2000, five new females had been produced, and the total population had grown to 62 birds.", "zh": "到2000年，已繁殖出五只新的雌鸟，种群总数也已增至62只。"}], "pos": "v. 动词", "stars": 2, "contextSenses": [0, 1], "id": "kakapo-2097897c2783"}, {"term": "drop", "ipa": "drɒp", "zh": "下降，减少", "note": "也可指掉落；名词可指一滴或降幅", "type": "word", "examples": [{"en": "The kākāpō population had dropped to 51 birds.", "zh": "鸮鹦鹉种群已经减少到51只。"}], "pos": "v. 动词", "stars": 2, "contextSenses": [0], "id": "kakapo-f628437d701e"}, {"term": "drop to", "ipa": "ˈdrɒp tə", "zh": "下降至；下降至……", "note": "to后面是最终数值 / 文档表达：drop to…", "type": "phrase", "examples": [{"en": "The number dropped to fifty-one.", "zh": "数量下降至五十一。"}, {"en": "Attendance dropped to its lowest level of the year.", "zh": "出席人数下降至全年最低水平。"}, {"en": "The temperature dropped to five degrees.", "zh": "气温降至五度。"}], "pos": "短语／表达", "stars": 3, "contextSenses": [0, 1], "id": "kakapo-941cfecc4add"}, {"term": "critical", "ipa": "ˈkrɪtɪkəl", "zh": "危急的", "note": "其他义：关键的、批判性的、挑剔的", "type": "word", "examples": [{"en": "The critical situation prompted an urgent review of kākāpō management in New Zealand.", "zh": "这一危急局势促使新西兰紧急重新审查鸮鹦鹉的保护管理工作。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "kakapo-f013668dbe27"}, {"term": "situation", "ipa": "ˌsɪtʃuˈeɪʃən", "zh": "局势，情况", "note": "本句概括前面的种群危机", "type": "word", "examples": [{"en": "The critical situation prompted an urgent review of kākāpō management in New Zealand.", "zh": "这一危急局势促使新西兰紧急重新审查鸮鹦鹉的保护管理工作。"}, {"en": "By the time the new rules took effect, the situation had changed.", "zh": "新规则生效时，情况已经发生了变化。"}], "pos": "n. 名词", "stars": 2, "contextSenses": [0], "id": "kakapo-b6fbb1ec34a8"}, {"term": "prompt", "ipa": "prɒmpt", "zh": "促使，引发", "note": "熟词生义；形容词可指及时的，名词可指提示", "type": "word", "examples": [{"en": "The critical situation prompted an urgent review of kākāpō management in New Zealand.", "zh": "这一危急局势促使新西兰紧急重新审查鸮鹦鹉的保护管理工作。"}, {"en": "The accident prompted an urgent review of safety procedures.", "zh": "事故促使人们紧急审查安全程序。"}, {"en": "The decline prompted an urgent review of conservation management.", "zh": "数量下降促使人们紧急审查保护管理工作。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0], "id": "kakapo-e7caa312d98f"}, {"term": "urgent", "ipa": "ˈɜːdʒənt", "zh": "紧急的，迫切的", "note": "需要尽快处理，不宜拖延", "type": "word", "examples": [{"en": "The critical situation prompted an urgent review of kākāpō management in New Zealand.", "zh": "这一危急局势促使新西兰紧急重新审查鸮鹦鹉的保护管理工作。"}, {"en": "The accident prompted an urgent review of safety procedures.", "zh": "事故促使人们紧急审查安全程序。"}, {"en": "The decline prompted an urgent review of conservation management.", "zh": "数量下降促使人们紧急审查保护管理工作。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "kakapo-f1a4e3efc7f8"}, {"term": "review", "ipa": "rɪˈvjuː", "zh": "审查，重新评估", "note": "也可指复习、评论", "type": "word", "examples": [{"en": "The critical situation prompted an urgent review of kākāpō management in New Zealand.", "zh": "这一危急局势促使新西兰紧急重新审查鸮鹦鹉的保护管理工作。"}, {"en": "The accident prompted an urgent review of safety procedures.", "zh": "事故促使人们紧急审查安全程序。"}, {"en": "The decline prompted an urgent review of conservation management.", "zh": "数量下降促使人们紧急审查保护管理工作。"}], "pos": "n. 名词", "stars": 2, "contextSenses": [0], "id": "kakapo-652c171891ed"}, {"term": "management", "ipa": "ˈmænɪdʒmənt", "zh": "管理；保护管理工作", "note": "本句为物种保护管理 / 也可指管理层、经营管理", "type": "word", "examples": [{"en": "The critical situation prompted an urgent review of kākāpō management in New Zealand.", "zh": "这一危急局势促使新西兰紧急重新审查鸮鹦鹉的保护管理工作。"}, {"en": "Today, kākāpō management continues to be guided by the kākāpō Recovery Plan.", "zh": "如今，鸮鹦鹉的保护管理工作仍以《鸮鹦鹉恢复计划》为指导。"}, {"en": "The decline prompted an urgent review of conservation management.", "zh": "数量下降促使人们紧急审查保护管理工作。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0, 1], "id": "kakapo-c622cd4c1ee9"}, {"term": "recovery", "ipa": "rɪˈkʌvəri", "zh": "种群恢复", "note": "其他义：康复、经济复苏、数据恢复 / 也可指康复、经济复苏、数据恢复", "type": "word", "examples": [{"en": "In 1996, a new Recovery Plan was launched, together with a specialist advisory group called the Kākāpō Scientific and Technical Advisory Committee and a higher amount of funding.", "zh": "1996年，一项新的种群恢复计划启动；与此同时，一个名为“鸮鹦鹉科学与技术咨询委员会”的专业顾问小组成立，保护资金也有所增加。"}, {"en": "After the first five years of the Recovery Plan, the population was on target.", "zh": "恢复计划实施最初五年后，鸮鹦鹉种群达到了预定的阶段性目标。"}, {"en": "Today, kākāpō management continues to be guided by the kākāpō Recovery Plan.", "zh": "如今，鸮鹦鹉的保护管理工作仍以《鸮鹦鹉恢复计划》为指导。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0], "id": "kakapo-5c28331e7be3"}, {"term": "specialist", "ipa": "ˈspeʃəlɪst", "zh": "专业的；专家", "note": "此处修饰advisory group", "type": "word", "examples": [{"en": "In 1996, a new Recovery Plan was launched, together with a specialist advisory group called the Kākāpō Scientific and Technical Advisory Committee and a higher amount of funding.", "zh": "1996年，一项新的种群恢复计划启动；与此同时，一个名为“鸮鹦鹉科学与技术咨询委员会”的专业顾问小组成立，保护资金也有所增加。"}, {"en": "Specialists were trained to rescue and hand-raise chicks.", "zh": "专业人员接受了救助和人工抚育幼鸟的培训。"}], "pos": "adj./n. 形容词／名词", "stars": 3, "contextSenses": [0, 1], "id": "kakapo-363bc1ded001"}, {"term": "advisory", "ipa": "ədˈvaɪzəri", "zh": "咨询的，顾问性质的", "note": "来自动词advise“建议”", "type": "word", "examples": [{"en": "In 1996, a new Recovery Plan was launched, together with a specialist advisory group called the Kākāpō Scientific and Technical Advisory Committee and a higher amount of funding.", "zh": "1996年，一项新的种群恢复计划启动；与此同时，一个名为“鸮鹦鹉科学与技术咨询委员会”的专业顾问小组成立，保护资金也有所增加。"}, {"en": "A new programme was launched together with an advisory group.", "zh": "新项目启动的同时，一个顾问小组也成立了。"}], "pos": "adj. 形容词", "stars": 4, "contextSenses": [0], "id": "kakapo-2c3113e724ca", "memory": {"method": "词族变化", "parts": "advise（建议）→ advisory（咨询的）", "tip": "advise 是动词，advice 是名词，advisory 修饰顾问小组。", "family": "advise 建议；adviser 顾问；advice 建议"}}, {"term": "scientific", "ipa": "ˌsaɪənˈtɪfɪk", "zh": "科学的", "note": "如scientific evidence“科学证据”", "type": "word", "examples": [{"en": "In 1996, a new Recovery Plan was launched, together with a specialist advisory group called the Kākāpō Scientific and Technical Advisory Committee and a higher amount of funding.", "zh": "1996年，一项新的种群恢复计划启动；与此同时，一个名为“鸮鹦鹉科学与技术咨询委员会”的专业顾问小组成立，保护资金也有所增加。"}, {"en": "Conservation work continues to be guided by scientific evidence.", "zh": "保护工作继续以科学证据为指导。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "kakapo-5afe89553266"}, {"term": "technical", "ipa": "ˈteknɪkəl", "zh": "技术的，专业技术方面的", "note": "不只是“难懂的”", "type": "word", "examples": [{"en": "In 1996, a new Recovery Plan was launched, together with a specialist advisory group called the Kākāpō Scientific and Technical Advisory Committee and a higher amount of funding.", "zh": "1996年，一项新的种群恢复计划启动；与此同时，一个名为“鸮鹦鹉科学与技术咨询委员会”的专业顾问小组成立，保护资金也有所增加。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "kakapo-8baa6bc7abf9"}, {"term": "committee", "ipa": "kəˈmɪti", "zh": "委员会", "note": "由多人组成、承担特定任务的组织", "type": "word", "examples": [{"en": "In 1996, a new Recovery Plan was launched, together with a specialist advisory group called the Kākāpō Scientific and Technical Advisory Committee and a higher amount of funding.", "zh": "1996年，一项新的种群恢复计划启动；与此同时，一个名为“鸮鹦鹉科学与技术咨询委员会”的专业顾问小组成立，保护资金也有所增加。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0], "id": "kakapo-40d368cf5e75"}, {"term": "funding", "ipa": "ˈfʌndɪŋ", "zh": "资金，资助", "note": "通常不可数；fund作动词表示资助", "type": "word", "examples": [{"en": "In 1996, a new Recovery Plan was launched, together with a specialist advisory group called the Kākāpō Scientific and Technical Advisory Committee and a higher amount of funding.", "zh": "1996年，一项新的种群恢复计划启动；与此同时，一个名为“鸮鹦鹉科学与技术咨询委员会”的专业顾问小组成立，保护资金也有所增加。"}, {"en": "Without further funding, the project will be in serious trouble.", "zh": "如果没有更多资金，这个项目将陷入严重困境。"}, {"en": "A new recovery plan was launched with additional funding.", "zh": "一项新的恢复计划启动，并获得了额外资金。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0], "id": "kakapo-b9ebfc1d8c06"}, {"term": "renewed", "ipa": "rɪˈnjuːd", "zh": "重新开展的，再次加强的", "note": "如renewed efforts“重新作出的努力”", "type": "word", "examples": [{"en": "Renewed steps were taken to control predators on the three islands.", "zh": "人们重新采取措施，控制这三座岛上的捕食者。"}, {"en": "The team took renewed steps to protect the remaining birds.", "zh": "团队重新采取措施保护剩余鸟类。"}, {"en": "Renewed steps were taken to improve monitoring.", "zh": "人们重新采取措施加强监测。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "kakapo-5dbf231dc4e3"}, {"term": "step", "ipa": "step", "zh": "措施，行动步骤", "note": "熟词生义；常见义为脚步、台阶", "type": "word", "examples": [{"en": "Renewed steps were taken to control predators on the three islands.", "zh": "人们重新采取措施，控制这三座岛上的捕食者。"}, {"en": "The team took renewed steps to protect the remaining birds.", "zh": "团队重新采取措施保护剩余鸟类。"}, {"en": "Renewed steps were taken to improve monitoring.", "zh": "人们重新采取措施加强监测。"}], "pos": "n. 名词", "stars": 2, "contextSenses": [0], "id": "kakapo-5949253eea94"}, {"term": "control", "ipa": "kənˈtrəʊl", "zh": "控制数量或影响", "note": "不一定表示全部消灭", "type": "word", "examples": [{"en": "Renewed steps were taken to control predators on the three islands.", "zh": "人们重新采取措施，控制这三座岛上的捕食者。"}, {"en": "At best, the bird can control its descent.", "zh": "这只鸟充其量只能控制下降过程。"}], "pos": "v. 动词", "stars": 2, "contextSenses": [0], "id": "kakapo-d6b217d3cb10"}, {"term": "eradicate", "ipa": "ɪˈrædɪkeɪt", "zh": "根除，彻底清除", "note": "也用于疾病、贫困等，如eradicate a disease", "type": "word", "examples": [{"en": "Cats were eradicated from Little Barrier Island in 1980, and possums were eradicated from Codfish Island by 1986.", "zh": "1980年，小巴里尔岛上的猫被彻底清除；到1986年，科德菲什岛上的负鼠也已被清除。"}, {"en": "The team eradicated rats from the island.", "zh": "团队清除了岛上的鼠。"}, {"en": "The invasive plants were eradicated from the reserve.", "zh": "保护区里的入侵植物被彻底清除。"}], "pos": "v. 动词", "stars": 5, "contextSenses": [0], "id": "kakapo-daccea623885", "memory": {"method": "词族联想", "parts": "eradicate（根除）→ eradication（根除，名词）", "tip": "本文是从岛上彻底清除捕食者，比 control 控制程度更强。", "family": "eradication 根除；eradicated 已被根除的"}}, {"term": "possum", "ipa": "ˈpɒsəm", "zh": "负鼠", "note": "动物名称，不等于rat", "type": "word", "examples": [{"en": "Cats were eradicated from Little Barrier Island in 1980, and possums were eradicated from Codfish Island by 1986.", "zh": "1980年，小巴里尔岛上的猫被彻底清除；到1986年，科德菲什岛上的负鼠也已被清除。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0], "id": "kakapo-570e26d6b6a1"}, {"term": "from", "ipa": "frəm", "zh": "从某范围内清除", "note": "与eradicate搭配，说明移除范围", "type": "word", "examples": [{"en": "They often leap from trees and flap their wings, but at best manage a controlled descent to the ground.", "zh": "它们经常从树上跃下并拍动翅膀，但充其量只能控制着降落到地面。"}, {"en": "The female kākāpō has to spend long periods away from the nest searching for food, which leaves the unattended eggs and chicks particularly vulnerable to predators.", "zh": "雌性鸮鹦鹉不得不长时间离巢觅食，这使无人照看的鸟蛋和幼鸟尤其容易受到捕食者的侵害。"}, {"en": "From 1949 to 1973, the newly formed New Zealand Wildlife Service made over 60 expeditions to find kākāpō, focusing mainly on Fiordland.", "zh": "1949年至1973年间，新成立的新西兰野生动物管理机构开展了60多次寻找鸮鹦鹉的野外考察，主要集中在峡湾地区。"}], "pos": "prep. 介词", "stars": 1, "contextSenses": [0], "id": "kakapo-4810cd7e6036"}, {"term": "increase", "ipa": "ɪnˈkriːs", "zh": "增加，增长", "note": "此处为动词；名词通常读/ˈɪŋkriːs/", "type": "word", "examples": [{"en": "However, the population did not start to increase until rats were removed from all three islands, and the birds were more intensively managed.", "zh": "然而，直到三座岛上的鼠都被清除，并且对鸮鹦鹉实施了更密集的管理之后，种群数量才开始增加。"}, {"en": "Its key goals are: minimise the loss of genetic diversity in the kākāpō population, restore or maintain sufficient habitat to accommodate the expected increase in the kākāpō population, and ensure stakeholders continue to be fully engaged in the preservation of the species.", "zh": "该计划的主要目标是：尽量减少鸮鹦鹉种群遗传多样性的丧失；恢复或维持足够的栖息地，以容纳预计增加的种群数量；并确保相关各方继续充分参与这一物种的保护。"}, {"en": "The increase gave researchers grounds for cautious optimism.", "zh": "数量增长让研究人员有理由谨慎乐观。"}], "pos": "v. 动词", "stars": 2, "contextSenses": [0], "id": "kakapo-ef2029bd2f8d"}, {"term": "remove", "ipa": "rɪˈmuːv", "zh": "清除，移除", "note": "本句未说明具体采用了什么清除方法", "type": "word", "examples": [{"en": "However, the population did not start to increase until rats were removed from all three islands, and the birds were more intensively managed.", "zh": "然而，直到三座岛上的鼠都被清除，并且对鸮鹦鹉实施了更密集的管理之后，种群数量才开始增加。"}], "pos": "v. 动词", "stars": 2, "contextSenses": [0], "id": "kakapo-72eb6ebf197d"}, {"term": "intensively", "ipa": "ɪnˈtensɪvli", "zh": "密集地，投入较大程度地", "note": "来自intensive，如intensive training", "type": "word", "examples": [{"en": "However, the population did not start to increase until rats were removed from all three islands, and the birds were more intensively managed.", "zh": "然而，直到三座岛上的鼠都被清除，并且对鸮鹦鹉实施了更密集的管理之后，种群数量才开始增加。"}, {"en": "The population was more intensively managed after the review.", "zh": "审查之后，该种群接受了更密集的管理。"}, {"en": "The birds were more intensively managed during the breeding season.", "zh": "繁殖季期间，这些鸟接受了更密集的管理。"}], "pos": "adv. 副词", "stars": 4, "contextSenses": [0], "id": "kakapo-76af6650cdda", "memory": {"method": "形容词＋后缀", "parts": "intensive（密集 s": "短语／表达", "stars": 4, "contextSenses": [0], "id": "kakapo-78dceb597015"}, {"term": "rescue and hand-raise chicks", "zh": "救助并人工抚育幼鸟", "type": "phrase", "examples": [{"en": "The team rescued and hand-raised the weakened chicks.", "zh": "团队救助并人工抚育了虚弱的幼鸟。"}, {"en": "Specialists were trained to rescue and hand-raise chicks.", "zh": "专业人员接受了救助和人工抚育幼鸟的培训。"}, {"en": "The programme included rescuing and hand-raising chicks that were not thriving.", "zh": "该项目包括救助并人工抚育生长状况不佳的幼鸟。"}], "note": "文档表达：rescue and hand-raise chicks", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "kakapo-b14b4b1e4799"}, {"term": "after the first five years of…", "zh": "在……最初五年之后", "type": "phrase", "examples": [{"en": "After the first five years of the programme, the team reviewed its progress.", "zh": "项目实施最初五年后，团队回顾了进展。"}, {"en": "After the first five years of the study, several patterns had emerged.", "zh": "研究开展最初五年后，已经出现了一些规律。"}, {"en": "After the first five years of the plan, the results were encouraging.", "zh": "计划实施最初五年后，结果令人鼓舞。"}], "note": "文档表达：after the first five years of…", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "kakapo-47b0c5de53a9"}, {"term": "be on target", "zh": "达到预期，进展符合目标", "type": "phrase", "examples": [{"en": "The project is on target for completion in June.", "zh": "项目进展符合预期，有望在6月完成。"}, {"en": "The latest figures suggest that the recovery programme is on target.", "zh": "最新数据显示，恢复项目进展符合目标。"}, {"en": "We checked whether the population was on target.", "zh": "我们检查了种群恢复是否达到预期。"}], "note": "文档表达：be on target", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "kakapo-90b7ef48103a"}, {"term": "grow to＋数量", "zh": "增长至……", "type": "phrase", "examples": [{"en": "The population grew to sixty-two birds.", "zh": "种群数量增至62只。"}, {"en": "The team has grown to twenty members.", "zh": "团队已发展到20名成员。"}, {"en": "The collection grew to over a thousand works.", "zh": "藏品数量增至一千多件。"}], "note": "文档表达：grow to＋数量", "ipa": "", "pos": d553ef777b22"}, {"term": "minimise the loss of…", "zh": "尽量减少……的丧失", "type": "phrase", "examples": [{"en": "The programme aims to minimise the loss of genetic diversity.", "zh": "该项目旨在尽量减少遗传多样性的丧失。"}, {"en": "Careful storage can minimise the loss of important records.", "zh": "妥善储存可以尽量减少重要记录的丢失。"}, {"en": "The new design seeks to minimise the loss of heat.", "zh": "新设计力求尽量减少热量流失。"}], "note": "文档表达：minimise the loss of…", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "kakapo-970c294ff261"}, {"term": "genetic diversity in a population", "zh": "种群内的遗传多样性", "type": "phrase", "examples": [{"en": "The study examined genetic diversity in the population.", "zh": "研究考察了该种群内的遗传多样性。"}, {"en": "The researchers compared genetic diversity in different populations.", "zh": "研究人员比较了不同种群的遗传多样性。"}, {"en": "The plan includes monitoring genetic diversity in the bird population.", "zh": "该计划包括监测鸟类种群内的遗传多样性。"}], "note": "文档表达：genetic diversity in a population", "ipa": "", "pos": "短语／表达", "stars": 4, "contextSenses": [0], "id": "kakapo-fe7ad0a2960a"}, {"term": "restore or maintain sufficient habitat", "zh": "恢复或维持足够的栖息地", "type": "phrase", "examples": [{"en": "The plan aims to restore or maintain sufficient habitat for the birds.", "zh": "该计划旨在为这些鸟恢复或维持足够的栖息地。"}, {"en": "The team assessed how much habitat needed to be restored.", "zh": "团队评估了需要恢复多少栖息地。"}, {"en": "The reserve must maintain sufficient habitat for the growing population.", "zh": "保护区必须为增长中的种群维持足够的栖息地。"}], "note": "文档表达：restore or maintain sufficient habitat", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "kakapo-98bdce536c59"}, {"term": "accommodate the expected increase in…", "zh": "容纳、满足……的预计增长", "type": "phrase", "examples": [{"en": "The station is being expanded to accommodate the expected increase in passenger numbers.", "zh": "车站正在扩建，以应对预计增长的旅客数量。"}, {"en": "The school needs more classrooms to accommodate the expected increase in student numbers.", "zh": "学校需要更多教室，以容纳预计增加的学生。"}, {"en": "More habitat is needed to accommodate the expected increase in the bird population.", "zh": "需要更多栖息地，以容纳预计增长的鸟类种群。"}], "note": "文档表达：accommodate the expected increase in…", "ipa": "", "pos": "短语／表达", "stars": 4, "contextSenses": [0], "id": "kakapo-12702b6b83bb"}, {"term": "ensure that…", "zh": "确保……", "type": "phrase", "examples": [{"en": "We need to ensure that the records are accurate.", "zh": "我们需要确保记录准确。"}, {"en": "The plan aims to ensure that sufficient funding remains available.", "zh": "该计划旨在确保持续有足够资金可用。"}, {"en": "The organisers must ensure that all participants receive the information.", "zh": "组织者必须确保所有参与者都收到信息。"}], "note": "文档表达：ensure that…", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "kakapo-61f7b7951d56"}, {"term": "be fully engaged in…", "zh": "充分参与、投入……", "type": "phrase", "examples": [{"en": "The students were fully engaged in the discussion.", "zh": "学生们充分参与了讨论。"}, {"en": "The project aims to keep local communities fully engaged in conservation work.", "zh": "该项目旨在让当地社区持续充分参与保护工作。"}, {"en": "The advisers remained fully engaged in developing the plan.", "zh": "顾问们始终积极参与计划的制定。"}], "note": "文档表达：be fully engaged in…", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "kakapo-ba4faf00febc"}, {"term": "the preservation of the species", "zh": "这一物种的保护", "type": "phrase", "examples": [{"en": "The fund supports the preservation of the species.", "zh": "该基金支持这一物种的保护。"}, {"en": "Several organisations contribute to the preservation of the species.", "zh": "多个组织共同参与这一物种的保护。"}, {"en": "The report identifies priorities for the preservation of the species.", "zh": "报告确定了保护这一物种的优先事项。"}], "note": "文档表达：the preservation of the species", "ipa": "", "pos": "短语／表达", "stars": 4, "contextSenses": [0], "id": "kakapo-13558cf8ac14"}], "sentences": [{"en": "The kākāpō is a nocturnal, flightless parrot that is critically endangered and one of New Zealand's unique treasures.", "zh": "鸮鹦鹉是一种夜间活动、不会飞的鹦鹉，处于极度濒危状态，也是新西兰独特的珍宝之一。"}, {"en": "The kākāpō, also known as the owl parrot, is a large, forest-dwelling bird, with a pale owl-like face.", "zh": "鸮鹦鹉又称“猫头鹰鹦鹉”，是一种生活在森林中的大型鸟类，面部颜色较浅，外形类似猫头鹰。"}, {"en": "Up to 64 cm in length, it has predominantly yellow-green feathers, forward-facing eyes, a large grey beak, large blue feet, and relatively short wings and tail.", "zh": "它体长可达64厘米，羽毛以黄绿色为主，双眼朝前，有一张灰色的大喙、一双蓝色的大脚，以及相对较短的翅膀和尾巴。"}, {"en": "It is the world's only flightless parrot, and is also possibly one of the world's longest-living birds, with a reported lifespan of up to 100 years.", "zh": "它是世界上唯一不会飞的鹦鹉，也可能是世界上最长寿的鸟类之一；据报道，其寿命可达100年。"}, {"en": "Kākāpō are solitary birds and tend to occupy the same home range for many years.", "zh": "鸮鹦鹉是独居鸟类，往往会连续多年生活在同一片活动范围内。"}, {"en": "They forage on the ground and climb high into trees.", "zh": "它们在地面觅食，也会爬到树上很高的地方。"}, {"en": "They often leap from trees and flap their wings, but at best manage a controlled descent to the ground.", "zh": "它们经常从树上跃下并拍动翅膀，但充其量只能控制着降落到地面。"}, {"en": "They are entirely vegetarian, with their diet including the leaves, roots and bark of trees as well as bulbs, and fern fronds.", "zh": "它们完全以植物为食，食物包括树叶、树根和树皮，也包括植物的鳞茎及蕨类的叶片。"}, {"en": "Kākāpō breed in summer and autumn, but only in years when food is plentiful.", "zh": "鸮鹦鹉在夏季和秋季繁殖，但只会在食物充足的年份繁殖。"}, {"en": "Males play no part in incubation or chick-rearing – females alone incubate eggs and feed the chicks.", "zh": "雄鸟不参与孵卵或育雏——完全由雌鸟独自孵卵并喂养幼鸟。"}, {"en": "The 1–4 eggs are laid in soil, which is repeatedly turned over before and during incubation.", "zh": "雌鸟产下的1至4枚蛋位于土中，而这些土在孵卵前和孵卵期间会被反复翻动。"}, {"en": "The female kākāpō has to spend long periods away from the nest searching for food, which leaves the unattended eggs and chicks particularly vulnerable to predators.", "zh": "雌性鸮鹦鹉不得不长时间离巢觅食，这使无人照看的鸟蛋和幼鸟尤其容易受到捕食者的侵害。"}, {"en": "Before humans arrived, kākāpō were common throughout New Zealand's forests.", "zh": "在人类到来之前，鸮鹦鹉在新西兰各地的森林中都很常见。"}, {"en": "However, this all changed with the arrival of the first Polynesian settlers about 700 years ago.", "zh": "然而，大约700年前，随着首批波利尼西亚移民的到来，这一切都发生了改变。"}, {"en": "For the early settlers, the flightless kākāpō was easy prey.", "zh": "对早期移民来说，不会飞的鸮鹦鹉是很容易捕获的猎物。"}, {"en": "They ate its meat and used its feathers to make soft cloaks.", "zh": "他们食用鸮鹦鹉的肉，并用它的羽毛制作柔软的披风。"}, {"en": "With them came the Polynesian dog and rat, which also preyed on kākāpō.", "zh": "随他们一同到来的还有波利尼西亚犬和鼠，这些动物也捕食鸮鹦鹉。"}, {"en": "By the time European colonisers arrived in the early 1800s, kākāpō had become confined to the central North Island and forested parts of the South Island.", "zh": "到19世纪初欧洲殖民者抵达时，鸮鹦鹉的分布范围已经缩小，仅限于北岛中部和南岛有森林覆盖的部分地区。"}, {"en": "The fall in kākāpō numbers was accelerated by European colonisation.", "zh": "欧洲殖民活动加速了鸮鹦鹉数量的下降。"}, {"en": "A great deal of habitat was lost through forest clearance, and introduced species such as deer depleted the remaining forests of food.", "zh": "森林被清除，导致大量栖息地丧失；鹿等引入物种又大量消耗了剩余森林中的食物资源。"}, {"en": "Other predators such as cats, stoats and two more species of rat were also introduced.", "zh": "猫、白鼬以及另外两种鼠等其他捕食者，也被引入了新西兰。"}, {"en": "The kākāpō were in serious trouble.", "zh": "鸮鹦鹉陷入了严重的生存危机。"}, {"en": "In 1894, the New Zealand government launched its first attempt to save the kākāpō.", "zh": "1894年，新西兰政府首次启动了拯救鸮鹦鹉的行动。"}, {"en": "Conservationist Richard Henry led an effort to relocate several hundred of the birds to predator-free Resolution Island in Fiordland.", "zh": "自然保护人士Richard Henry牵头开展了一项行动，将数百只鸮鹦鹉迁往峡湾地区没有捕食者的雷索卢申岛。"}, {"en": "Unfortunately, the island didn't remain predator free – stoats arrived within six years, eventually destroying the kākāpō population.", "zh": "不幸的是，这座岛并未一直保持没有捕食者的状态——不到六年，白鼬便进入了岛上，最终导致岛上的鸮鹦鹉种群覆灭。"}, {"en": "By the mid-1900s, the kākāpō was practically a lost species.", "zh": "到20世纪中叶，鸮鹦鹉几乎已经成了一个行将消失的物种。"}, {"en": "Only a few clung to life in the most isolated parts of New Zealand.", "zh": "只有少数鸮鹦鹉仍在新西兰最偏僻的地区艰难存活。"}, {"en": "From 1949 to 1973, the newly formed New Zealand Wildlife Service made over 60 expeditions to find kākāpō, focusing mainly on Fiordland.", "zh": "1949年至1973年间，新成立的新西兰野生动物管理机构开展了60多次寻找鸮鹦鹉的野外考察，主要集中在峡湾地区。"}, {"en": "Six were caught, but there were no females amongst them and all but one died within a few months of captivity.", "zh": "共有六只鸮鹦鹉被捕获，但其中没有雌鸟；圈养后不到几个月，除一只外，其余全部死亡。"}, {"en": "In 1974, a new initiative was launched, and by 1977, 18 more kākāpō were found in Fiordland.", "zh": "1974年，一项新的行动启动了；到1977年，又有18只鸮鹦鹉在峡湾地区被发现。"}, {"en": "However, there were still no females.", "zh": "然而，仍然没有发现雌鸟。"}, {"en": "In 1977, a large population of males was spotted in Rakiura – a large island free from stoats, ferrets and weasels.", "zh": "1977年，人们在拉基乌拉岛发现了一个数量较大的雄鸟种群。这是一座没有白鼬、雪貂和伶鼬的大岛。"}, {"en": "There were about 200 individuals, and in 1980 it was confirmed females were also present.", "zh": "当时约有200只个体；1980年，人们确认其中也存在雌鸟。"}, {"en": "These birds have been the foundation of all subsequent work in managing the species.", "zh": "这些鸟一直是此后所有鸮鹦鹉种群管理工作的基础。"}, {"en": "Unfortunately, predation by feral cats on Rakiura Island led to a rapid decline in kākāpō numbers.", "zh": "不幸的是，拉基乌拉岛上野化猫的捕食，导致鸮鹦鹉数量迅速下降。"}, {"en": "As a result, during 1980–97, the surviving population was evacuated to three island sanctuaries: Codfish Island, Maud Island and Little Barrier Island.", "zh": "因此，1980年至1997年间，幸存的鸮鹦鹉种群被转移到三个岛屿保护地：科德菲什岛、莫德岛和小巴里尔岛。"}, {"en": "However, breeding success was hard to achieve.", "zh": "然而，要成功繁殖并不容易。"}, {"en": "Rats were found to be a major predator of kākāpō chicks and an insufficient number of chicks survived to offset adult mortality.", "zh": "人们发现，鼠类是鸮鹦鹉幼鸟的主要捕食者之一；存活下来的幼鸟数量不足，无法抵消成年鸟死亡造成的种群损失。"}, {"en": "By 1995, although at least 12 chicks had been produced on the islands, only three had survived.", "zh": "到1995年，虽然这些岛上至少已有12只幼鸟出生，但只有三只存活了下来。"}, {"en": "The kākāpō population had dropped to 51 birds.", "zh": "鸮鹦鹉种群已经减少到51只。"}, {"en": "The critical situation prompted an urgent review of kākāpō management in New Zealand.", "zh": "这一危急局势促使新西兰紧急重新审查鸮鹦鹉的保护管理工作。"}, {"en": "In 1996, a new Recovery Plan was launched, together with a specialist advisory group called the Kākāpō Scientific and Technical Advisory Committee and a higher amount of funding.", "zh": "1996年，一项新的种群恢复计划启动；与此同时，一个名为“鸮鹦鹉科学与技术咨询委员会”的专业顾问小组成立，保护资金也有所增加。"}, {"en": "Renewed steps were taken to control predators on the three islands.", "zh": "人们重新采取措施，控制这三座岛上的捕食者。"}, {"en": "Cats were eradicated from Little Barrier Island in 1980, and possums were eradicated from Codfish Island by 1986.", "zh": "1980年，小巴里尔岛上的猫被彻底清除；到1986年，科德菲什岛上的负鼠也已被清除。"}, {"en": "However, the population did not start to increase until rats were removed from all three islands, and the birds were more intensively managed.", "zh": "然而，直到三座岛上的鼠都被清除，并且对鸮鹦鹉实施了更密集的管理之后，种群数量才开始增加。"}, {"en": "This involved moving the birds between islands, supplementary feeding of adults and rescuing and hand-raising any failing chicks.", "zh": "这些管理措施包括：在岛屿之间转移鸟只、为成年鸟补充饲料，以及救助并人工抚育那些生长或生存状况不佳的幼鸟。"}, {"en": "After the first five years of the Recovery Plan, the population was on target.", "zh": "恢复计划实施最初五年后，鸮鹦鹉种群达到了预定的阶段性目标。"}, {"en": "By 2000, five new females had been produced, and the total population had grown to 62 birds.", "zh": "到2000年，已繁殖出五只新的雌鸟，种群总数也已增至62只。"}, {"en": "For the first time, there was cautious optimism for the future of kākāpō and by June 2020, a total of 210 birds was recorded.", "zh": "人们首次对鸮鹦鹉的未来抱有谨慎的乐观态度；到2020年6月，记录到的总数量已达210只。"}, {"en": "Today, kākāpō management continues to be guided by the kākāpō Recovery Plan.", "zh": "如今，鸮鹦鹉的保护管理工作仍以《鸮鹦鹉恢复计划》为指导。"}, {"en": "Its key goals are: minimise the loss of genetic diversity in the kākāpō population, restore or maintain sufficient habitat to accommodate the expected increase in the kākāpō population, and ensure stakeholders continue to be fully engaged in the preservation of the species.", "zh": "该计划的主要目标是：尽量减少鸮鹦鹉种群遗传多样性的丧失；恢复或维持足够的栖息地，以容纳预计增加的种群数量；并确保相关各方继续充分参与这一物种的保护。"}], "examples": [{"en": "The kākāpō, also know
