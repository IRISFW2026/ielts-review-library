<title>UK QS150 · 2027 入学地图 · 2026 申请</title>
<meta name="description" content="2027 年入学、2026 年申请的英国 QS150 硕士院校地图，使用最新 QS 世界大学排名 2027，提供官网与申请入口。">
<style>
:root{
  --ink:#111827;
  --muted:#667085;
  --line:rgba(15,23,42,.08);
  --glass:rgba(255,255,255,.82);
  --glass-strong:rgba(255,255,255,.96);
  --blue:#2563eb;
  --soft:#f5f7fa;
  --shadow:0 12px 40px rgba(15,23,42,.11);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eef2f6;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{overflow:hidden}

.app{
  width:min(1480px,calc(100% - 24px));
  height:calc(100vh - 24px);
  margin:12px auto;
  border-radius:32px;
  overflow:hidden;
  box-shadow:var(--shadow);
  background:#dbe8f0;
  position:relative;
}
#map{position:absolute;inset:0}

/* top-left */
.brand{
  position:absolute;left:18px;top:18px;z-index:1200;
  width:270px;
  padding:15px 17px 14px;
  border-radius:24px;
  background:var(--glass);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:0 8px 24px rgba(15,23,42,.10);
}
.brand .eyebrow{font-size:10px;font-weight:650;letter-spacing:.10em;color:#7b8491}
.brand .title{font-size:21px;font-weight:700;letter-spacing:-.03em;margin-top:4px}
.brand .sub{font-size:12px;color:var(--muted);margin-top:3px}

.filters{
  position:absolute;left:18px;top:132px;z-index:1200;
  display:flex;gap:7px;flex-wrap:wrap;
  max-width:310px;
}
.filter{
  border:0;cursor:pointer;
  padding:9px 13px;border-radius:999px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 5px 16px rgba(15,23,42,.08);
  color:#475467;font-size:12px;font-weight:700;
}
.filter.active{background:rgba(255,255,255,.98);color:#252c35;box-shadow:inset 0 0 0 1px rgba(118,130,146,.18),0 3px 9px rgba(15,23,42,.11)}
.filter.active:before{content:"";display:inline-block;width:5px;height:5px;background:#d5a129;border-radius:50%;margin:0 6px 1px 0}

.map-actions{
  position:absolute;top:18px;right:340px;z-index:1200;
  display:flex;gap:8px;
}
.iconbtn{
  border:0;cursor:pointer;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 3px 12px rgba(15,23,42,.09);
  border:1px solid rgba(255,255,255,.75);
  font-size:18px;color:#111827
}
.iconbtn svg{width:18px;height:18px;flex-shrink:0}.iconbtn.homebtn{width:auto;padding:0 15px;gap:7px;border-radius:999px;font-size:12px;font-weight:600}
.iconbtn:hover{background:#fff}.iconbtn:focus-visible,.filter:focus-visible{outline:2px solid #9aa7b6;outline-offset:3px}

/* right rail */
.sidebar{
  position:absolute;right:18px;top:18px;bottom:18px;z-index:1250;
  width:300px;
  border-radius:26px;
  background:rgba(255,255,255,.90);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 8px 30px rgba(15,23,42,.10);
  overflow:hidden;
  display:flex;flex-direction:column;
}

.selected{
  padding:0;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.72);
  flex-shrink:0;max-height:66%;overflow:auto;scrollbar-width:thin;
}
.detail-head{position:sticky;top:0;z-index:2;padding:17px 17px 13px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.detail-category{font-size:11px;color:#667085;margin-top:7px}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.detail-actions a{display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 7px;border:1px solid #e4e7eb;border-radius:999px;background:#f5f6f8;color:#4c596b;text-decoration:none;font-size:12px;font-weight:600}
.detail-actions a.primary{background:#fff3cc;color:#755719;border-color:#efe0b0}
.detail-actions a:hover{background:#eceff3}.detail-actions a.primary:hover{background:#ffebaf}
.detail-actions svg,.place-row svg{width:17px;height:17px;flex-shrink:0}
.detail-body{padding:0 17px 16px}
.place-info{padding:6px 0 8px;border-bottom:1px solid var(--line)}
.place-row{display:flex;gap:10px;align-items:flex-start;margin-top:12px;color:#667085}
.place-row div{min-width:0}.place-row b{display:block;font-size:10px;font-weight:600;color:#7b8494;margin-bottom:3px}
.place-row span,.place-row a{font-size:12px;line-height:1.6;color:#344054;text-decoration:none;overflow-wrap:anywhere}
.place-row a:hover,.detail-source a:hover{text-decoration:underline;color:#2563eb}
.place-tools{display:flex;gap:13px;flex-wrap:wrap;margin-top:12px}.place-tools a{font-size:11px;color:#2563eb;text-decoration:none;padding:4px 0}
.detail-section-title{font-size:11px;font-weight:750;color:#667085;margin:15px 0 0}
.detail-source{font-size:10px;line-height:1.6;color:#8b95a5;margin:12px 0 0}.detail-source a{color:#718096;text-decoration:none}
.mobile-selected{padding:0!important;overflow:hidden}.mobile-selected> b,.mobile-selected>div:not(.detail-head):not(.detail-body){display:block;margin:15px}
.mobile-selected .detail-head{position:relative}.mobile-selected .detail-body{padding-bottom:17px}
.school-card:focus-visible,.detail-actions a:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
.selected.empty{
  padding:20px 17px;
}
.selected .hint-title{font-size:15px;font-weight:800}
.selected .hint-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.detail-head h2{margin:0;font-size:20px;letter-spacing:-.03em}
.detail-head .en{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.selected-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;
}
.selected-item{
  background:#f7f9fb;border-radius:14px;padding:9px 10px;
}
.selected-item b{display:block;font-size:10px;color:#667085;margin-bottom:3px}
.selected-item span{font-size:12px;line-height:1.4;color:#1f2937}
.selected-gain{
  margin-top:8px;background:#f7f9fb;border-radius:14px;padding:10px;
}
.selected-gain b{display:block;font-size:10px;color:#667085;margin-bottom:3px}
.selected-gain span{font-size:12px;line-height:1.45;color:#1f2937}

.sidebar-head{
  flex-shrink:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 15px 9px;
}
.sidebar-head b{font-size:12px;color:#475467}
.sidebar-head span{font-size:11px;color:#98a2b3}
.school-list{
  overflow:auto;padding:0 10px 12px;min-height:0;flex:1;
  scrollbar-width:thin;
}
.school-card{
  display:grid;grid-template-columns:42px minmax(0,1fr);
  gap:10px;align-items:center;
  padding:10px;
  margin:6px 0;
  border-radius:18px;
  cursor:pointer;
  transition:.16s ease;
  border:1px solid transparent;
}
.school-card:hover{background:#f7f9fb}
.school-card.active{background:#fff7df;border-color:rgba(192,143,25,.17);box-shadow:none}
.school-card.active .avatar{background:#fff0b9;color:#94691a;box-shadow:none}
.school-card.active .card-title{color:#44371d}
.school-card.active .badge{background:#f6ebce;color:#7f6a40}
.avatar{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  color:#7b8490;background:#f0f2f5;
}
.avatar svg{width:22px;height:22px}
.card-title{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-en{font-size:11px;color:#667085;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{display:flex;gap:6px;align-items:center;margin-top:5px}
.qs{font-size:10px;font-weight:600;color:#667085}.selected-item a{color:#755719;text-decoration:none}.selected-item a:hover{text-decoration:underline}.budget-note{display:block;font-size:10px!important;color:#8b95a5!important;margin-top:4px}
.badge{font-size:10px;padding:3px 6px;border-radius:999px;background:#eef2f6;color:#344054;font-weight:700}

/* Hollow stars turn warm yellow on selection; labels move independently of coordinates. */
.school-star-icon{background:none;border:0;outline-offset:5px}
.school-pin{position:relative;width:32px;height:32px;cursor:pointer}
.school-pin:before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.98);box-shadow:0 2px 8px rgba(38,49,65,.17);transition:background .18s,box-shadow .18s;pointer-events:none}
.star-anchor{position:absolute;left:5px;top:5px;width:22px;height:22px;overflow:visible;pointer-events:none}
.star-anchor path{fill:#fff;stroke:#7b8796;stroke-width:2.1;stroke-linejoin:round;transition:fill .18s,stroke .18s}
.school-pin.active:before{background:#fff9e5;box-shadow:0 0 0 5px rgba(255,202,56,.15),0 3px 12px rgba(137,104,23,.2)}
.school-pin.active .star-anchor path{fill:#ffcb3d;stroke:#ae7b16}
.school-pin:hover:before{box-shadow:0 3px 12px rgba(38,49,65,.24)}
.pin-leader{position:absolute;inset:0;width:32px;height:32px;overflow:visible;pointer-events:none}
.pin-leader path{stroke:#aab2be;stroke-width:1;fill:none}
.school-pin.active .pin-leader path{stroke:#c7a548;stroke-width:1.2}
.pin-label{position:absolute;display:flex;align-items:center;gap:7px;width:max-content;max-width:200px;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.87);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);box-shadow:0 2px 7px rgba(15,23,42,.09);transform:translateY(-50%);white-space:nowrap;color:#46505c;transition:background .18s,box-shadow .18s}
.pin-label.left{transform:translate(-100%,-50%)}
.pin-label .name{font-size:12px;font-weight:600}
.pin-label .rank{font-size:10px;font-weight:500;color:#8a929d}
.school-pin.active .pin-label{background:rgba(255,251,237,.97);border-color:rgba(217,181,78,.48);box-shadow:0 3px 12px rgba(133,108,45,.14);color:#554324}
.school-pin.active .pin-label .rank{color:#947b43}
.school-star-icon:focus-visible{outline:3px solid #2563eb;border-radius:8px}
.manual-map-controls{margin:0 0 30px 18px!important;display:flex;align-items:flex-end;gap:9px}
.zoom-buttons{display:flex;flex-direction:column;overflow:hidden;background:rgba(255,255,255,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.9);border-radius:999px;box-shadow:0 3px 12px rgba(15,23,42,.1)}
.zoom-buttons button{width:44px;height:44px;border:0;background:transparent;font:24px/1 system-ui;color:#344054;cursor:pointer}
.zoom-buttons button+button{border-top:1px solid #eef1f5}
.zoom-buttons button:hover{background:#f1f5fb}
.map-gesture-hint{padding:7px 9px;margin-bottom:2px;background:rgba(255,255,255,.86);border-radius:8px;font-size:10px;color:#718096;pointer-events:none}
.locate-school{width:100%;margin-top:12px;padding:10px 12px;border:1px solid #e4e7eb;background:#f3f5f7;border-radius:999px;color:#566273;font:inherit;font-size:12px;font-weight:600;line-height:1.4;cursor:pointer}
.locate-school:hover{background:#e9edf2}
@media(prefers-reduced-motion:reduce){.school-card,.school-pin:before,.star-anchor path,.pin-label{transition:none}}
@media(max-width:900px){.school-pin:before{inset:2px}.star-anchor{width:20px;height:20px;left:6px;top:6px}.manual-map-controls{margin:0 0 26px 12px!important}.map-gesture-hint{font-size:9px;padding:6px 8px}.pin-label{padding:6px 9px}.pin-label .name{font-size:11px}.pin-label .rank{display:none}.locate-school{min-height:44px}}

/* Leaflet critical layout CSS */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,
.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{

.leaflet-container{overflow:hidden;background:#dbe7f1;outline-offset:1px;-webkit-tap-highlight-color:transparent}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}.leaflet-container.leaflet-touch-drag{touch-action:pinch-zoom}.leaflet-container.leaflet-touch-zoom.leaflet-touch-drag{touch-action:none}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-animated{transform-origin:0 0}.leaflet-map-pane{z-index:400}

.leaflet-control{position:relative;z-index:800;pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{float:left;clear:both}.leaflet-right .leaflet-control{float:right}
.leaflet-control-attribution{background:rgba(255,255,255,.72);padding:1px 5px;font-size:9px;color:#64748b}
.leaflet-control-attribution a{color:#475569;text-decoration:none}
.leaflet-container .leaflet-tile-pane img{max-width:none!important;max-height:none!important;width:auto!important;padding:0!important}

/* mobile: no overlay list on map */
.mobile-content{display:none}

@media(max-width:900px){
  body{overflow:auto}
  .app{
    width:100%;height:auto;min-height:100vh;margin:0;border-radius:0;
    overflow:visible;background:#eef2f6;box-shadow:none;
  }
  #map{
    position:relative;height:62vh;min-height:480px;
    border-radius:0 0 26px 26px;overflow:hidden;
  }
  .sidebar{display:none}
  .map-actions{right:12px;top:12px}
  .brand{left:12px;top:12px;width:calc(100% - 156px);max-width:235px;padding:11px 13px;border-radius:21px}
  .brand .title{font-size:clamp(15px,4vw,17px)}
  .brand .eyebrow{font-size:9px;letter-spacing:.04em}.brand .sub{font-size:10px;line-height:1.5}
  .map-actions{gap:6px}.iconbtn.homebtn{padding:0 12px;gap:5px}
  .filters{left:12px;top:104px;max-width:calc(100% - 24px)}
  .filter{padding:8px 11px}
  .mobile-content{
    display:block;padding:16px 12px 26px;background:#eef2f6;
  }
  .mobile-selected{
    background:#fff;border-radius:20px;padding:15px;margin-bottom:12px;
    box-shadow:0 8px 22px rgba(15,23,42,.07);
  }
  .mobile-list{display:grid;gap:8px}
  .mobile-list .school-card{
    margin:0;background:#fff;border-radius:18px;
  }
}

<div class="app" id="app">
  <div id="map"></div>

  <div class="brand">
    <div class="eyebrow">UK QS150 · QS 2027</div>
    <div class="title">2027 入学地图</div>
    <div class="sub">2026 年申请 · 非伦敦院校</div>
  </div>

  <div class="filters">
    <button class="filter active" data-filter="全部">全部</button>
    <button class="filter" data-filter="冲刺">冲刺</button>

const qsProfiles={BHM:"university-birmingham",LDS:"university-leeds",GLA:"university-glasgow",SHF:"university-sheffield",SOU:"university-southampton",EXE:"university-exeter",LIV:"university-liverpool",NCL:"newcastle-university"};
schools.forEach(s=>Object.assign(s,schoolDirectory[s.initials],{qsSource:"https://www.topuniversities.com/universities/"+qsProfiles[s.initials]}));

let currentFilter="全部";
let activeName=null;

const map=L.map("map",{
  zoomControl:false,attributionControl:true,
  scrollWheelZoom:true,doubleClickZoom:true,boxZoom:true,
  inertia:false,zoomAnimation:false,markerZoomAnimation:false,
  dragging:true,touchZoom:true,bounceAtZoomLimits:false,trackResize:false,
  zoomSnap:.25,zoomDelta:.5,wheelPxPerZoomLevel:160,wheelDebounceTime:30,
  minZoom:5,maxZoom:16,
  maxBounds:[[43,-24],[65,18]],maxBoundsViscosity:1
});
const manualZoom=L.control({position:"bottomleft"});
manualZoom.onAdd=()=>{
  const root=L.DomUtil.create("div","manual-map-controls");
  root.innerHTML='<div class="zoom-buttons"><button type="button" id="zoomInBtn" title="放大地图" aria-label="放大地图">＋</button><button type="button" id="zoomOutBtn" title="缩小地图" aria-label="缩小地图">−</button></div><span class="map-gesture-hint">'+(L.Browser.mobile?'双指缩放 · 拖动浏览':'滚轮 / 触控板缩放 · 拖动浏览')+'</span>';
  L.DomEvent.disableClickPropagation(root);
  L.DomEvent.disableScrollPropagation(root);
  root.querySelector("#zoomInBtn").onclick=()=>{map.stop();map.setZoom(map.getZoom()+.5,{animate:false});};
  root.querySelector("#zoomOutBtn").onclick=()=>{map.stop();map.setZoom(map.getZoom()-.5,{animate:false});};
  return root;
};
manualZoom.addTo(map);
// Canvas vector basemap: Google-inspired palette, independent open map data.
const baseHost=document.createElement("div");
baseHost.id="cleanBasemap";
map.getContainer().prepend(baseHost);
try {
const baseView=new ol.View({center:ol.proj.fromLonLat([-2.8,54.2]),zoom:6});
const baseMap=new ol.Map({target:baseHost,controls:[],interactions:[],view:baseView,pixelRatio:Math.min(window.devicePixelRatio||1,2)});
let pendingSync=false;
function syncBasemap(){
  if(pendingSync)return;
  pendingSync=true;
  requestAnimationFrame(()=>{
    pendingSync=false;
    if(!map._loaded)return;
    baseMap.updateSize();
    const center=map.getCenter();
    baseView.setCenter(ol.proj.fromLonLat([center.lng,center.lat]));
    baseView.setZoom(map.getZoom());
    baseMap.renderSync();
  });
}
map.on("move zoom resize",syncBasemap);
olms.apply(baseMap,"./map-style.json?v=1").then(syncBasemap).catch(error=>{
  console.error("Basemap unavailable",error);
  baseHost.innerHTML='<div style="position:absolute;left:18px;bottom:32px;color:#64748b;font:12px system-ui">地图底图暂时未能加载，请稍后刷新。</div>';
});
} catch(error) {
  console.error("Basemap initialization unavailable",error);
  baseHost.innerHTML='<div style="position:absolute;left:18px;bottom:32px;color:#64748b;font:12px system-ui">地图底图暂时未能加载，请稍后刷新。</div>';
}
map.attributionControl.addAttribution('<a href="https://openfreemap.org/">OpenFreeMap</a> · © <a href="https://openmaptiles.org/">OpenMapTiles</a> · © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>');

const markerMap=new Map();

function visibleSchools(){
  return schools.filter(s=>currentFilter==="全部"||s.level===currentFilter);
}

const labelOffsets={
  "伯明翰大学":[-26,16],"利兹大学":[26,-22],"格拉斯哥大学":[-26,-10],
  "谢菲尔德大学":[26,22],"南安普顿大学":[26,13],"埃克塞特大学":[-26,22],
  "利物浦大学":[-26,-20],"纽卡斯尔大学":[26,-18]
};
function pinIcon(s){
  const [dx,dy]=labelOffsets[s.name];
  return L.divIcon({
    className:"school-star-icon",
    html:`<div class="school-pin ${activeName===s.name?"active":""}" data-school="${s.name}">
      <svg class="pin-leader" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 16L${16+dx} ${16+dy}"/></svg>
      <svg class="star-anchor" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 20.2 11 30 12.2 22.8 19 24.7 29 16 24 7.3 29 9.2 19 2 12.2 11.8 11Z"/></svg>
      <span class="pin-label ${dx<0?"left":""}" style="left:${16+dx}px;top:${16+dy}px"><span class="name">${s.name}</span><span class="rank">QS ${s.qs}</span></span>
    </div>`,
    iconSize:[32,32],iconAnchor:[16,16]
  });
}
function updateMarkerSelection(){
  markerMap.forEach((marker,name)=>{
    const selected=activeName===name;
    marker.getElement()?.querySelector(".school-pin")?.classList.toggle("active",selected);
    marker.getElement()?.setAttribute("aria-pressed",String(selected));
    marker.setZIndexOffset(selected?1000:0);
  });
}
function buildMarkers(){
  const visible=visibleSchools();
  const names=new Set(visible.map(s=>s.name));
  markerMap.forEach((marker,name)=>{if(!names.has(name)){map.removeLayer(marker);markerMap.delete(name);}});
  visible.forEach(s=>{
    if(markerMap.has(s.name))return;
    const marker=L.marker([s.lat,s.lng],{
      icon:pinIcon(s),title:s.name+" · 点击放大并查看详情",alt:s.name,
      keyboard:true,autoPanOnFocus:false,draggable:false,riseOnHover:false
    }).addTo(map);
    marker.on("click",()=>selectSchool(s.name));
    markerMap.set(s.name,marker);
  });
  updateMarkerSelection();
  requestAnimationFrame(layoutMobileLabels);
}
function layoutMobileLabels(){
  if(window.innerWidth>900||!map._loaded)return;
  const size=map.getSize(),occupied=[];
  const reserved=[{x:10,y:8,w:240,h:140},{x:10,y:size.y-120,w:50,h:100},{x:65,y:size.y-63,w:200,h:33}];
  const stars=visibleSchools().map(s=>{const p=map.latLngToContainerPoint([s.lat,s.lng]);return {name:s.name,x:p.x-16,y:p.y-16,w:32,h:32};});
  const overlaps=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  visibleSchools().slice().sort((a,b)=>b.lat-a.lat).forEach(s=>{
    const root=markerMap.get(s.name)?.getElement()?.querySelector(".school-pin");
    if(!root)return;
    const label=root.querySelector(".pin-label"),line=root.querySelector(".pin-leader path");
    const point=map.latLngToContainerPoint([s.lat,s.lng]);
    if(point.x<0||point.x>size.x||point.y<0||point.y>size.y)return;
    const width=label.offsetWidth,height=label.offsetHeight,[preferredX,preferredY]=labelOffsets[s.name];
    let best=null;
    for(const direction of [Math.sign(preferredX),-Math.sign(preferredX)]){
      for(const distance of [25,35,45]){
      for(const delta of [0,-26,26,-52,52,-78,78]){
        const dx=direction*distance,dy=preferredY+delta;
        const rect={x:point.x+dx+(direction<0?-width:0),y:point.y+dy-height/2,w:width+4,h:height+4};
        const overflow=Math.max(0,8-rect.x)+Math.max(0,rect.x+rect.w-size.x+8)+Math.max(0,8-rect.y)+Math.max(0,rect.y+rect.h-size.y+22);
        const score=overflow*10000+occupied.reduce((sum,r)=>sum+overlaps(rect,r)*10,0)+reserved.reduce((sum,r)=>sum+overlaps(rect,r)*10,0)+stars.reduce((sum,r)=>sum+(r.name===s.name?0:overlaps(rect,r)*30),0)+Math.abs(delta)+(distance-25)+(direction===Math.sign(preferredX)?0:12);
        if(!best||score<best.score)best={dx,dy,rect,score};
      }
      }
    }
    label.classList.toggle("left",best.dx<0);
    label.style.left=(16+best.dx)+"px";
    label.style.top=(16+best.dy)+"px";
    line.setAttribute("d",`M16 16L${16+best.dx} ${16+best.dy}`);
    occupied.push(best.rect);
  });
}
map.on("moveend zoomend resize",()=>requestAnimationFrame(layoutMobileLabels));
function fitAllSchools(){
  const desktop=window.innerWidth>900;
  map.stop();
  map.fitBounds(L.latLngBounds(schools.map(s=>[s.lat,s.lng])),{
    paddingTopLeft:desktop?[80,130]:[55,145],
    paddingBottomRight:desktop?[375,85]:[55,85],
    maxZoom:desktop?6.4:6,animate:false
  });
}
function returnToOverview(){
  if(currentFilter!=="全部"){
    currentFilter="全部";
    document.querySelectorAll(".filter").forEach(button=>button.classList.toggle("active",button.dataset.filter==="全部"));
    buildMarkers();
    renderLists();
  }
  fitAllSchools();
}
function locateSchool(name){
  const s=schools.find(x=>x.name===name);
  if(!s)return;
  const zoom=9;
  const offset=window.innerWidth>900?L.point(155,0):L.point(0,0);
  const center=map.unproject(map.project([s.lat,s.lng],zoom).add(offset),zoom);
  map.stop();
  map.setView(center,zoom,{animate:false});
}

function cardHTML(s){
  return `<article class="school-card ${activeName===s.name?"active":""}" data-name="${s.name}" role="button" tabindex="0" aria-pressed="${activeName===s.name}" aria-label="选择${s.name}">
    <div class="avatar" aria-hidden="true">${detailIcon("university")}</div>
    <div>
      <div class="card-title">${s.name}</div>
      <div class="card-en">${s.en}</div>
      <div class="card-meta">
        <span class="qs">QS 2027 · ${s.qs}</span>
        <span class="badge">${s.level}</span>
      </div>
    </div>
  </article>`;
}

function renderLists(){
  const vis=visibleSchools();
  document.getElementById("countText").textContent=`${vis.length} 所`;

  const list=document.getElementById("schoolList");
  const mobile=document.getElementById("mobileList");
  list.innerHTML=vis.map(cardHTML).join("");
  mobile.innerHTML=vis.map(cardHTML).join("");

  document.querySelectorAll(".school-card").forEach(card=>{
    card.addEventListener("click",()=>selectSchool(card.dataset.name));
    card.addEventListener("keydown",event=>{
      if(event.key==="Enter"||event.key===" "){event.preventDefault();selectSchool(card.dataset.name);}
    });
  });
}

function detailIcon(type){
  const paths={
    university:'<path d="m3 8 9-5 9 5M4 9h16M6 10v8m6-8v8m6-8v8M3 21h18M4 18h16"/>',
    web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z"/>',
    apply:'<path d="M14 3h7v7M21 3 11 13M10 3H4a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-6"/>',
    pin:'<path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
    phone:'<path d="m8 3 3 5-3 3c1 2 3 4 5 5l3-3 5 3c0 4-2 5-5 5C9 21 3 15 3 8c0-3 1-5 5-5Z"/>'
  };
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[type]}</svg>`;
}
function detailHTML(s){
  const placeQuery=encodeURIComponent(s.en+", "+s.address);
  const mapURL="https://www.google.com/maps/search/?api=1&query="+placeQuery;
  const directionsURL="https://www.google.com/maps/dir/?api=1&destination="+placeQuery;
  return `
    <div class="detail-head">
      <h2>${s.name}</h2>
      <div class="en">${s.en}</div>
      <div class="detail-category">大学 · ${s.city} · ${s.region}</div>
      <div class="detail-actions">
        <a href="${s.website}" target="_blank" rel="noopener noreferrer" aria-label="${s.name}官网（新窗口）">${detailIcon("web")}学校官网</a>
        <a class="primary" href="${s.apply}" target="_blank" rel="noopener noreferrer" aria-label="${s.name}硕士申请入口（新窗口）" title="${s.applyNote}">${detailIcon("apply")}申请入口</a>
      </div>
    </div>
    <div class="detail-body">
    <div class="place-info">
      <div class="place-row">${detailIcon("pin")}<div><b>校区 / 联系地址</b><a href="${mapURL}" target="_blank" rel="noopener noreferrer">${s.address}</a></div></div>
      <div class="place-row">${detailIcon("phone")}<div><b>${s.phoneLabel}</b><a href="tel:${s.phone.replace(/\s/g,"")}">${s.phone}</a></div></div>
      <div class="place-tools"><a href="${mapURL}" target="_blank" rel="noopener noreferrer">Google Maps 查看 ↗</a><a href="${directionsURL}" target="_blank" rel="noopener noreferrer">路线 ↗</a></div>
    </div>
    <p class="detail-section-title">申请规划</p>
    <div class="selected-grid">
      <div class="selected-item"><b>QS 世界排名 2027</b><span><a href="${s.qsSource}" target="_blank" rel="noopener noreferrer" title="查看 QS 官方排名">${s.qs} ↗</a></span></div>
      <div class="selected-item"><b>申请定位</b><span>${s.level}</span></div>
      <div class="selected-item" style="grid-column:1/-1"><b>推荐专业</b><span>${s.program}</span></div>
      <div class="selected-item" style="grid-column:1/-1"><b>留学预算参考 · 人民币</b><span>${s.cost}</span><span class="budget-note">预算估算；2027 年实际学费以官网为准</span></div>
    </div>
    <div class="selected-gain"><b>毕业后的增量价值</b><span>${s.gain}</span></div>
    <button type="button" class="locate-school" data-locate="${s.name}">定位这所学校 ↗</button>
    <p class="detail-source">2027 年入学 · 2026 年申请<br>${s.applyNote}<br><a href="${s.applyGuide}" target="_blank" rel="noopener noreferrer">官方申请说明 ↗</a> · <a href="${s.contact}" target="_blank" rel="noopener noreferrer">官方联系信息 ↗</a>${s.addressSource?` · <a href="${s.addressSource}" target="_blank" rel="noopener noreferrer">地址来源 ↗</a>`:""}<br><a href="${s.qsSource}" target="_blank" rel="noopener noreferrer">QS 2027 官方排名 ↗</a> · 核对：2026.10.28<br>照片、评价与开放时间可在 Google Maps 查看。</p>
    </div>
  `;
}

function selectSchool(name){
  const s=schools.find(x=>x.name===name);
  if(!s)return;
  activeName=name;

  updateMarkerSelection();
  renderLists();

  const panel=document.getElementById("selectedPanel");
  panel.className="selected";
  panel.innerHTML=detailHTML(s);
  panel.scrollTop=0;

  const mobile=document.getElementById("mobileSelected");
  mobile.innerHTML=detailHTML(s);

  locateSchool(name);
  if(window.innerWidth<=900){
    map.getContainer().scrollIntoView({block:"start",behavior:"auto"});
  }
}

document.querySelectorAll(".filter").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentFilter=btn.dataset.filter;
    activeName=null;
    document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    document.getElementById("selectedPanel").className="selected empty";
    document.getElementById("selectedPanel").innerHTML=
      `<div class="hint-title">选择一所学校</div>
       <div class="hint-sub">点击星标或院校列表，地图会放大到该校并点亮星标，详情显示在这里。</div>`;

    document.getElementById("mobileSelected").innerHTML=
      `<b>选择一所学校</b><div style="font-size:12px;color:#667085;margin-top:4px">点击星标或院校卡片，放大到该校并点亮星标。</div>`;

    buildMarkers();
    renderLists();
  });
});

document.getElementById("fitBtn").title="返回英国院校全景";
document.getElementById("fitBtn").setAttribute("aria-label","返回英国院校全景");
document.getElementById("fitBtn").addEventListener("click",returnToOverview);
["selectedPanel","mobileSelected"].forEach(id=>{
  document.getElementById(id).addEventListener("click",event=>{
    const button=event.target.closest("[data-locate]");
    if(button)locateSchool(button.dataset.locate);
  });
});
let resizeTimer;
function preserveViewOnResize(){
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    if(!map._loaded)return;
    const center=map.getCenter(),zoom=map.getZoom();
    map.stop();
    map.invalidateSize({pan:false,animate:false});
    map.setView(center,zoom,{animate:false});
    if(window.innerWidth>900)markerMap.forEach((marker,name)=>{
      const root=marker.getElement()?.querySelector(".school-pin");
      if(!root)return;
      const [dx,dy]=labelOffsets[name],label=root.querySelector(".pin-label");
      label.classList.toggle("left",dx<0);label.style.left=(16+dx)+"px";label.style.top=(16+dy)+"px";
      root.querySelector(".pin-leader path").setAttribute("d",`M16 16L${16+dx} ${16+dy}`);
    });
  },90);
}
document.getElementById("fullscreenBtn").addEventListener("click",async()=>{
  try{
    if(!document.fullscreenElement)await document.getElementById("app").requestFullscreen();
    else await document.exitFullscreen();
  }catch(error){console.info("Fullscreen unavailable",error);}
  preserveViewOnResize();
});
document.addEventListener("fullscreenchange",preserveViewOnResize);
if(typeof ResizeObserver!=="undefined"){
  const observer=new ResizeObserver(preserveViewOnResize);
  observer.observe(document.getElementById("map"));
}else window.addEventListener("resize",preserveViewOnResize);

buildMarkers();
renderLists();
fitAllSchools();
</script>
