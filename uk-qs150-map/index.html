<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UK QS150 · 2028 申请地图</title>
<meta name="description" content="2028 英国 QS150 硕士申请地图：非伦敦院校、推荐专业、申请定位与费用规划。">
<style>
:root{
  --ink:#111827;
  --muted:#667085;
  --line:rgba(15,23,42,.08);
  --glass:rgba(255,255,255,.88);
  --glass-strong:rgba(255,255,255,.96);
  --blue:#2563eb;
  --soft:#f5f7fa;
  --shadow:0 18px 44px rgba(15,23,42,.16);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#eef2f6;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{overflow:hidden}

.app{
  width:min(1480px,calc(100% - 24px));
  height:calc(100vh - 24px);
  margin:12px auto;
  border-radius:32px;
  overflow:hidden;
  box-shadow:var(--shadow);
  background:#dbe8f0;
  position:relative;
}
#map{position:absolute;inset:0}

/* top-left */
.brand{
  position:absolute;left:18px;top:18px;z-index:1200;
  width:270px;
  padding:15px 17px 14px;
  border-radius:24px;
  background:var(--glass);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:0 8px 24px rgba(15,23,42,.10);
}
.brand .eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;color:#64748b}
.brand .title{font-size:21px;font-weight:800;letter-spacing:-.03em;margin-top:3px}
.brand .sub{font-size:12px;color:var(--muted);margin-top:3px}

.filters{
  position:absolute;left:18px;top:132px;z-index:1200;
  display:flex;gap:7px;flex-wrap:wrap;
  max-width:310px;
}
.filter{
  border:0;cursor:pointer;
  padding:9px 13px;border-radius:999px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:0 5px 16px rgba(15,23,42,.08);
  color:#475467;font-size:12px;font-weight:700;
}
.filter.active{background:#111827;color:#fff}

.map-actions{
  position:absolute;top:18px;right:340px;z-index:1200;
  display:flex;gap:8px;
}
.iconbtn{
  border:0;cursor:pointer;width:46px;height:46px;border-radius:16px;
  background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 7px 22px rgba(15,23,42,.10);
  border:1px solid rgba(255,255,255,.75);
  font-size:18px;color:#111827
}

/* right rail */
.sidebar{
  position:absolute;right:18px;top:18px;bottom:18px;z-index:1250;
  width:300px;
  border-radius:26px;
  background:rgba(255,255,255,.90);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 14px 34px rgba(15,23,42,.14);
  overflow:hidden;
  display:flex;flex-direction:column;
}

.selected{
  padding:17px 17px 15px;
  border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.72);
}
.selected.empty{
  padding:20px 17px;
}
.selected .hint-title{font-size:15px;font-weight:800}
.selected .hint-sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.selected h2{margin:0;font-size:20px;letter-spacing:-.03em}
.selected .en{font-size:12px;color:var(--muted);margin-top:3px}
.selected-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;
}
.selected-item{
  background:#f7f9fb;border-radius:14px;padding:9px 10px;
}
.selected-item b{display:block;font-size:10px;color:#667085;margin-bottom:3px}
.selected-item span{font-size:12px;line-height:1.4;color:#1f2937}
.selected-gain{
  margin-top:8px;background:#f7f9fb;border-radius:14px;padding:10px;
}
.selected-gain b{display:block;font-size:10px;color:#667085;margin-bottom:3px}
.selected-gain span{font-size:12px;line-height:1.45;color:#1f2937}

.sidebar-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 15px 9px;
}
.sidebar-head b{font-size:12px;color:#475467}
.sidebar-head span{font-size:11px;color:#98a2b3}
.school-list{
  overflow:auto;padding:0 10px 12px;
  scrollbar-width:thin;
}
.school-card{
  display:grid;grid-template-columns:50px minmax(0,1fr);
  gap:10px;align-items:center;
  padding:10px;
  margin:6px 0;
  border-radius:18px;
  cursor:pointer;
  transition:.16s ease;
  border:1px solid transparent;
}
.school-card:hover{background:#f7f9fb}
.school-card.active{
  background:#eef4ff;
  border-color:rgba(37,99,235,.38);
  box-shadow:0 10px 24px rgba(37,99,235,.16);
  transform:translateX(-2px);
}
.school-card.active .avatar{
  background:linear-gradient(145deg,#2f6df6,#1d4ed8);
  color:#fff;
  box-shadow:0 6px 14px rgba(37,99,235,.24);
}
.school-card.active .card-title{color:#1747b8}
.school-card.active .badge{background:#dce8ff;color:#1747b8}
.avatar{
  width:50px;height:50px;border-radius:15px;display:grid;place-items:center;
  font-size:13px;font-weight:850;color:#334155;
  background:linear-gradient(145deg,#e9eef6,#d9e2ee);
}
.card-title{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-en{font-size:11px;color:#667085;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{display:flex;gap:6px;align-items:center;margin-top:5px}
.qs{font-size:11px;font-weight:800}
.badge{font-size:10px;padding:3px 6px;border-radius:999px;background:#eef2f6;color:#344054;font-weight:700}

/* Each star is anchored to its school coordinates; only its label is offset. */
.school-star-icon{background:none;border:0;outline-offset:5px}
.school-pin{position:relative;width:32px;height:32px;cursor:pointer}
.star-anchor{position:absolute;inset:0;width:32px;height:32px;overflow:visible;filter:drop-shadow(0 2px 3px rgba(91,65,16,.28))}
.star-anchor path{fill:#fbbc04;stroke:#fff;stroke-width:3;stroke-linejoin:round;paint-order:stroke fill}
.school-pin.active .star-anchor path{fill:#2563eb}
.school-pin.active .star-anchor{filter:drop-shadow(0 0 5px rgba(37,99,235,.42))}
.pin-leader{position:absolute;inset:0;width:32px;height:32px;overflow:visible;pointer-events:none}
.pin-leader path{stroke:#c5a14d;stroke-width:1.3;fill:none}
.school-pin.active .pin-leader path{stroke:#5a88ef;stroke-width:1.6}
.pin-label{position:absolute;display:flex;align-items:center;gap:7px;width:max-content;max-width:185px;padding:7px 10px;border-radius:11px;background:rgba(255,255,255,.97);border:1px solid rgba(15,23,42,.09);box-shadow:0 3px 12px rgba(15,23,42,.12);transform:translateY(-50%);white-space:nowrap;color:#344054}
.pin-label.left{transform:translate(-100%,-50%)}
.pin-label .name{font-size:12px;font-weight:750}
.pin-label .rank{font-size:10px;font-weight:600;color:#7c8798}
.school-pin.active .pin-label{background:#2563eb;border-color:#2563eb;box-shadow:0 5px 16px rgba(37,99,235,.25);color:white}
.school-pin.active .pin-label .rank{color:#d9e6ff}
.school-star-icon:focus-visible{outline:3px solid #2563eb;border-radius:8px}
.manual-map-controls{margin:0 0 30px 18px!important;display:flex;align-items:flex-end;gap:9px}
.zoom-buttons{display:flex;flex-direction:column;overflow:hidden;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.9);border-radius:15px;box-shadow:0 5px 18px rgba(15,23,42,.14)}
.zoom-buttons button{width:44px;height:44px;border:0;background:transparent;font:24px/1 system-ui;color:#344054;cursor:pointer}
.zoom-buttons button+button{border-top:1px solid #eef1f5}
.zoom-buttons button:hover{background:#f1f5fb}
.map-gesture-hint{padding:7px 9px;margin-bottom:2px;background:rgba(255,255,255,.86);border-radius:8px;font-size:10px;color:#718096;pointer-events:none}
.locate-school{width:100%;margin-top:12px;padding:10px 12px;border:1px solid #dbe7fc;background:#eef4ff;border-radius:11px;color:#2563eb;font:inherit;font-size:12px;font-weight:600;line-height:1.4;cursor:pointer}
.locate-school:hover{background:#e5eeff}
@media(max-width:900px){.star-anchor{width:20px;height:20px;left:6px;top:6px;right:auto;bottom:auto}.manual-map-controls{margin:0 0 26px 12px!important}.map-gesture-hint{font-size:9px;padding:6px 8px}.pin-label{padding:6px 8px;border-radius:9px}.pin-label .name{font-size:11px}.pin-label .rank{font-size:9px}.locate-school{min-height:44px}}

/* Leaflet critical layout CSS */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,
.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{
  position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;background:#dbe7f1;outline-offset:1px;-webkit-tap-highlight-color:transparent}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-animated{transform-origin:0 0}.leaflet-map-pane{z-index:400}
.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}
.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-control{position:relative;z-index:800;pointer-events:auto}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{float:left;clear:both}.leaflet-right .leaflet-control{float:right}
.leaflet-control-attribution{background:rgba(255,255,255,.72);padding:1px 5px;font-size:9px;color:#64748b}
.leaflet-control-attribution a{color:#475569;text-decoration:none}
.leaflet-container .leaflet-tile-pane img{max-width:none!important;max-height:none!important;width:auto!important;padding:0!important}

/* mobile: no overlay list on map */
.mobile-content{display:none}

@media(max-width:900px){
  body{overflow:auto}
  .app{
    width:100%;height:auto;min-height:100vh;margin:0;border-radius:0;
    overflow:visible;background:#eef2f6;box-shadow:none;
  }
  #map{
    position:relative;height:62vh;min-height:480px;
    border-radius:0 0 26px 26px;overflow:hidden;
  }
  .sidebar{display:none}
  .map-actions{right:12px;top:12px}
  .brand{left:12px;top:12px;width:235px;padding:11px 13px;border-radius:19px}
  .brand .title{font-size:17px}
  .brand .sub{display:none}
  .filters{left:12px;top:92px;max-width:calc(100% - 24px)}
  .filter{padding:8px 11px}
  .mobile-content{
    display:block;padding:16px 12px 26px;background:#eef2f6;
  }
  .mobile-selected{
    background:#fff;border-radius:20px;padding:15px;margin-bottom:12px;
    box-shadow:0 8px 22px rgba(15,23,42,.07);
  }
  .mobile-list{display:grid;gap:8px}
  .mobile-list .school-card{
    margin:0;background:#fff;border-radius:18px;
  }
}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
<style>#cleanBasemap{position:absolute;inset:0;z-index:100;pointer-events:none;background:#c8dcf4}#cleanBasemap .ol-viewport{pointer-events:none}.leaflet-container{background:#c8dcf4}</style>

<body>
<div class="app" id="app">
  <div id="map"></div>

  <div class="brand">
    <div class="eyebrow">UK QS150</div>
    <div class="title">2028 申请地图</div>
    <div class="sub">非伦敦 · 商科 / 数字营销 / 电商</div>
  </div>

  <div class="filters">
    <button class="filter active" data-filter="全部">全部</button>
    <button class="filter" data-filter="冲刺">冲刺</button>
    <button class="filter" data-filter="主申">主申</button>
    <button class="filter" data-filter="稳妥">稳妥</button>
  </div>

  <div class="map-actions">
    <button class="iconbtn" id="fitBtn" title="查看全部">⌖</button>
    <button class="iconbtn" id="fullscreenBtn" title="全屏">⛶</button>
  </div>

  <aside class="sidebar">
    <div class="selected empty" id="selectedPanel">
      <div class="hint-title">选择一所学校</div>
      <div class="hint-sub">点击星标或院校列表，地图会放大到该校并点亮星标，详情显示在这里。</div>
    </div>

    <div class="sidebar-head">
      <b>院校列表</b>
      <span id="countText">8 所</span>
    </div>
    <div class="school-list" id="schoolList"></div>
  </aside>

  <section class="mobile-content">
    <div class="mobile-selected" id="mobileSelected">
      <b>选择一所学校</b>
      <div style="font-size:12px;color:#667085;margin-top:4px">点击星标或院校卡片，放大到该校并点亮星标。</div>
    </div>
    <div class="mobile-list" id="mobileList"></div>
  </section>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ol-mapbox-style@13.8.0/dist/olms.js"></script>
<script>
const schools=[
{name:"伯明翰大学",en:"University of Birmingham",initials:"BHM",qs:"=68",city:"Birmingham",lat:52.4508,lng:-1.9305,level:"冲刺",program:"MSc Marketing – Digital Marketing",cost:"约 ¥49–52万",gain:"学校平台强，补足品牌战略、消费者洞察和数字营销管理能力。"},
{name:"利兹大学",en:"University of Leeds",initials:"LDS",qs:"=77",city:"Leeds",lat:53.8067,lng:-1.5550,level:"主申",program:"MSc International Marketing Management",cost:"约 ¥47–50万",gain:"把跨境电商执行经验升级成国际市场、品牌与营销战略能力。"},
{name:"格拉斯哥大学",en:"University of Glasgow",initials:"GLA",qs:"80",city:"Glasgow",lat:55.8721,lng:-4.2882,level:"主申",program:"MSc International Business",cost:"约 ¥51–55万",gain:"从电商运营拓宽到国际业务、BD、市场进入与管理。"},
{name:"谢菲尔德大学",en:"University of Sheffield",initials:"SHF",qs:"=82",city:"Sheffield",lat:53.3814,lng:-1.4885,level:"主申",program:"MSc Digital Marketing",cost:"约 ¥45–48万",gain:"强化数字营销、社媒、Influencer、E-commerce Strategy、AI 和 Analytics。"},
{name:"南安普顿大学",en:"University of Southampton",initials:"SOU",qs:"=111",city:"Southampton",lat:50.9346,lng:-1.3957,level:"主申",program:"MSc Digital Business",cost:"约 ¥50–53万",gain:"从电商实操进一步扩展到数字商业、数字战略和数字化转型。"},
{name:"埃克塞特大学",en:"University of Exeter",initials:"EXE",qs:"136",city:"Exeter",lat:50.7371,lng:-3.5351,level:"稳妥",program:"MSc Digital Marketing",cost:"约 ¥49–53万",gain:"在稳妥录取基础上系统补齐数字营销、MarTech 和消费者分析。"},
{name:"利物浦大学",en:"University of Liverpool",initials:"LIV",qs:"139",city:"Liverpool",lat:53.4062,lng:-2.9653,level:"稳妥",program:"MSc Digital Marketing and Analytics",cost:"约 ¥45–50万",gain:"把营销和数据分析结合起来，适合海外增长和数据驱动营销。"},
{name:"纽卡斯尔大学",en:"Newcastle University",initials:"NCL",qs:"149",city:"Newcastle upon Tyne",lat:54.9783,lng:-1.6178,level:"稳妥",program:"MSc Electronic Commerce",cost:"约 ¥45–48万",gain:"专业与跨境电商经历最直接衔接，强化电商管理、数字营销与数据能力。"}
];

let currentFilter="全部";
let activeName=null;

const map=L.map("map",{
  zoomControl:false,attributionControl:true,
  scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,
  inertia:false,zoomAnimation:false,markerZoomAnimation:false,
  dragging:!L.Browser.mobile,touchZoom:false,trackResize:false,
  minZoom:5,maxZoom:16,
  maxBounds:[[43,-24],[65,18]],maxBoundsViscosity:1
});
const manualZoom=L.control({position:"bottomleft"});
manualZoom.onAdd=()=>{
  const root=L.DomUtil.create("div","manual-map-controls");
  root.innerHTML='<div class="zoom-buttons"><button type="button" id="zoomInBtn" title="放大地图" aria-label="放大地图">＋</button><button type="button" id="zoomOutBtn" title="缩小地图" aria-label="缩小地图">−</button></div><span class="map-gesture-hint">'+(L.Browser.mobile?'★ 院校位置 · 使用＋/−缩放':'★ 院校位置 · 拖动查看 · 使用＋/−缩放')+'</span>';
  L.DomEvent.disableClickPropagation(root);
  L.DomEvent.disableScrollPropagation(root);
  root.querySelector("#zoomInBtn").onclick=()=>{map.stop();map.setZoom(map.getZoom()+1,{animate:false});};
  root.querySelector("#zoomOutBtn").onclick=()=>{map.stop();map.setZoom(map.getZoom()-1,{animate:false});};
  return root;
};
manualZoom.addTo(map);
// Canvas vector basemap: Google-inspired palette, independent open map data.
const baseHost=document.createElement("div");
baseHost.id="cleanBasemap";
map.getContainer().prepend(baseHost);
try {
const baseView=new ol.View({center:ol.proj.fromLonLat([-2.8,54.2]),zoom:6});
const baseMap=new ol.Map({target:baseHost,controls:[],interactions:[],view:baseView,pixelRatio:Math.min(window.devicePixelRatio||1,2)});
let pendingSync=false;
function syncBasemap(){
  if(pendingSync)return;
  pendingSync=true;
  requestAnimationFrame(()=>{
    pendingSync=false;
    if(!map._loaded)return;
    baseMap.updateSize();
    const center=map.getCenter();
    baseView.setCenter(ol.proj.fromLonLat([center.lng,center.lat]));
    baseView.setZoom(map.getZoom());
    baseMap.renderSync();
  });
}
map.on("move zoom resize",syncBasemap);
olms.apply(baseMap,"./map-style.json?v=1").then(syncBasemap).catch(error=>{
  console.error("Basemap unavailable",error);
  baseHost.innerHTML='<div style="position:absolute;left:18px;bottom:32px;color:#64748b;font:12px system-ui">地图底图暂时未能加载，请稍后刷新。</div>';
});
} catch(error) {
  console.error("Basemap initialization unavailable",error);
  baseHost.innerHTML='<div style="position:absolute;left:18px;bottom:32px;color:#64748b;font:12px system-ui">地图底图暂时未能加载，请稍后刷新。</div>';
}
map.attributionControl.addAttribution('<a href="https://openfreemap.org/">OpenFreeMap</a> · © <a href="https://openmaptiles.org/">OpenMapTiles</a> · © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>');

const markerMap=new Map();

function visibleSchools(){
  return schools.filter(s=>currentFilter==="全部"||s.level===currentFilter);
}

const labelOffsets={
  "伯明翰大学":[-26,16],"利兹大学":[26,-22],"格拉斯哥大学":[-26,-10],
  "谢菲尔德大学":[26,22],"南安普顿大学":[26,13],"埃克塞特大学":[-26,22],
  "利物浦大学":[-26,-20],"纽卡斯尔大学":[26,-18]
};
function pinIcon(s){
  const [dx,dy]=labelOffsets[s.name];
  return L.divIcon({
    className:"school-star-icon",
    html:`<div class="school-pin ${activeName===s.name?"active":""}" data-school="${s.name}">
      <svg class="pin-leader" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 16L${16+dx} ${16+dy}"/></svg>
      <svg class="star-anchor" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 20.2 11 30 12.2 22.8 19 24.7 29 16 24 7.3 29 9.2 19 2 12.2 11.8 11Z"/></svg>
      <span class="pin-label ${dx<0?"left":""}" style="left:${16+dx}px;top:${16+dy}px"><span class="name">${s.name}</span><span class="rank">${s.qs}</span></span>
    </div>`,
    iconSize:[32,32],iconAnchor:[16,16]
  });
}
function updateMarkerSelection(){
  markerMap.forEach((marker,name)=>{
    const selected=activeName===name;
    marker.getElement()?.querySelector(".school-pin")?.classList.toggle("active",selected);
    marker.getElement()?.setAttribute("aria-pressed",String(selected));
    marker.setZIndexOffset(selected?1000:0);
  });
}
function buildMarkers(){
  const visible=visibleSchools();
  const names=new Set(visible.map(s=>s.name));
  markerMap.forEach((marker,name)=>{if(!names.has(name)){map.removeLayer(marker);markerMap.delete(name);}});
  visible.forEach(s=>{
    if(markerMap.has(s.name))return;
    const marker=L.marker([s.lat,s.lng],{
      icon:pinIcon(s),title:s.name+" · 点击放大并查看详情",alt:s.name,
      keyboard:true,autoPanOnFocus:false,draggable:false,riseOnHover:false
    }).addTo(map);
    marker.on("click",()=>selectSchool(s.name));
    markerMap.set(s.name,marker);
  });
  updateMarkerSelection();
  requestAnimationFrame(layoutMobileLabels);
}
function layoutMobileLabels(){
  if(window.innerWidth>900||!map._loaded)return;
  const size=map.getSize(),occupied=[];
  const reserved=[{x:10,y:8,w:240,h:126},{x:10,y:size.y-120,w:50,h:100}];
  const overlaps=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  visibleSchools().slice().sort((a,b)=>b.lat-a.lat).forEach(s=>{
    const root=markerMap.get(s.name)?.getElement()?.querySelector(".school-pin");
    if(!root)return;
    const label=root.querySelector(".pin-label"),line=root.querySelector(".pin-leader path");
    const point=map.latLngToContainerPoint([s.lat,s.lng]);
    if(point.x<0||point.x>size.x||point.y<0||point.y>size.y)return;
    const width=label.offsetWidth,height=label.offsetHeight,[preferredX,preferredY]=labelOffsets[s.name];
    let best=null;
    for(const direction of [Math.sign(preferredX),-Math.sign(preferredX)]){
      for(const delta of [0,-26,26,-52,52,-78,78]){
        const dx=direction*25,dy=preferredY+delta;
        const rect={x:point.x+dx+(direction<0?-width:0),y:point.y+dy-height/2,w:width+4,h:height+4};
        const overflow=Math.max(0,8-rect.x)+Math.max(0,rect.x+rect.w-size.x+8)+Math.max(0,8-rect.y)+Math.max(0,rect.y+rect.h-size.y+22);
        const score=overflow*10000+occupied.reduce((sum,r)=>sum+overlaps(rect,r)*10,0)+reserved.reduce((sum,r)=>sum+overlaps(rect,r)*10,0)+Math.abs(delta)+(direction===Math.sign(preferredX)?0:12);
        if(!best||score<best.score)best={dx,dy,rect,score};
      }
    }
    label.classList.toggle("left",best.dx<0);
    label.style.left=(16+best.dx)+"px";
    label.style.top=(16+best.dy)+"px";
    line.setAttribute("d",`M16 16L${16+best.dx} ${16+best.dy}`);
    occupied.push(best.rect);
  });
}
map.on("moveend zoomend resize",()=>requestAnimationFrame(layoutMobileLabels));
function fitAllSchools(){
  const desktop=window.innerWidth>900;
  map.stop();
  map.fitBounds(L.latLngBounds(schools.map(s=>[s.lat,s.lng])),{
    paddingTopLeft:desktop?[80,130]:[55,125],
    paddingBottomRight:desktop?[375,85]:[55,85],
    maxZoom:desktop?6.4:6,animate:false
  });
}
function locateSchool(name){
  const s=schools.find(x=>x.name===name);
  if(!s)return;
  const zoom=9;
  const offset=window.innerWidth>900?L.point(155,0):L.point(0,0);
  const center=map.unproject(map.project([s.lat,s.lng],zoom).add(offset),zoom);
  map.stop();
  map.setView(center,zoom,{animate:false});
}

function cardHTML(s){
  return `<article class="school-card ${activeName===s.name?"active":""}" data-name="${s.name}">
    <div class="avatar">${s.initials}</div>
    <div>
      <div class="card-title">${s.name}</div>
      <div class="card-en">${s.en}</div>
      <div class="card-meta">
        <span class="qs">QS ${s.qs}</span>
        <span class="badge">${s.level}</span>
      </div>
    </div>
  </article>`;
}

function renderLists(){
  const vis=visibleSchools();
  document.getElementById("countText").textContent=`${vis.length} 所`;

  const list=document.getElementById("schoolList");
  const mobile=document.getElementById("mobileList");
  list.innerHTML=vis.map(cardHTML).join("");
  mobile.innerHTML=vis.map(cardHTML).join("");

  document.querySelectorAll(".school-card").forEach(card=>{
    card.addEventListener("click",()=>selectSchool(card.dataset.name));
  });
}

function detailHTML(s){
  return `
    <h2>${s.name}</h2>
    <div class="en">${s.en} · ${s.city}</div>
    <div class="selected-grid">
      <div class="selected-item"><b>QS 2027</b><span>${s.qs}</span></div>
      <div class="selected-item"><b>申请定位</b><span>${s.level}</span></div>
      <div class="selected-item" style="grid-column:1/-1"><b>推荐专业</b><span>${s.program}</span></div>
      <div class="selected-item" style="grid-column:1/-1"><b>2028 费用规划</b><span>${s.cost}</span></div>
    </div>
    <div class="selected-gain"><b>毕业后的增量价值</b><span>${s.gain}</span></div>
    <button type="button" class="locate-school" data-locate="${s.name}">定位这所学校 ↗</button>
  `;
}

function selectSchool(name){
  const s=schools.find(x=>x.name===name);
  if(!s)return;
  activeName=name;

  updateMarkerSelection();
  renderLists();

  const panel=document.getElementById("selectedPanel");
  panel.className="selected";
  panel.innerHTML=detailHTML(s);

  const mobile=document.getElementById("mobileSelected");
  mobile.innerHTML=detailHTML(s);

  locateSchool(name);
  if(window.innerWidth<=900){
    map.getContainer().scrollIntoView({block:"start",behavior:"auto"});
  }
}

document.querySelectorAll(".filter").forEach(btn=>{
  btn.addEventListener("click",()=>{
    currentFilter=btn.dataset.filter;
    activeName=null;
    document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    document.getElementById("selectedPanel").className="selected empty";
    document.getElementById("selectedPanel").innerHTML=
      `<div class="hint-title">选择一所学校</div>
       <div class="hint-sub">点击星标或院校列表，地图会放大到该校并点亮星标，详情显示在这里。</div>`;

    document.getElementById("mobileSelected").innerHTML=
      `<b>选择一所学校</b><div style="font-size:12px;color:#667085;margin-top:4px">点击星标或院校卡片，放大到该校并点亮星标。</div>`;

    buildMarkers();
    renderLists();
  });
});

document.getElementById("fitBtn").title="返回英国院校全景";
document.getElementById("fitBtn").setAttribute("aria-label","返回英国院校全景");
document.getElementById("fitBtn").addEventListener("click",fitAllSchools);
["selectedPanel","mobileSelected"].forEach(id=>{
  document.getElementById(id).addEventListener("click",event=>{
    const button=event.target.closest("[data-locate]");
    if(button)locateSchool(button.dataset.locate);
  });
});
let resizeTimer;
function preserveViewOnResize(){
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    if(!map._loaded)return;
    const center=map.getCenter(),zoom=map.getZoom();
    map.stop();
    map.invalidateSize({pan:false,animate:false});
    map.setView(center,zoom,{animate:false});
    if(window.innerWidth>900)markerMap.forEach((marker,name)=>{
      const root=marker.getElement()?.querySelector(".school-pin");
      if(!root)return;
      const [dx,dy]=labelOffsets[name],label=root.querySelector(".pin-label");
      label.classList.toggle("left",dx<0);label.style.left=(16+dx)+"px";label.style.top=(16+dy)+"px";
      root.querySelector(".pin-leader path").setAttribute("d",`M16 16L${16+dx} ${16+dy}`);
    });
  },90);
}
document.getElementById("fullscreenBtn").addEventListener("click",async()=>{
  try{
    if(!document.fullscreenElement)await document.getElementById("app").requestFullscreen();
    else await document.exitFullscreen();
  }catch(error){console.info("Fullscreen unavailable",error);}
  preserveViewOnResize();
});
document.addEventListener("fullscreenchange",preserveViewOnResize);
if(typeof ResizeObserver!=="undefined"){
  const observer=new ResizeObserver(preserveViewOnResize);
  observer.observe(document.getElementById("map"));
}else window.addEventListener("resize",preserveViewOnResize);

buildMarkers();
renderLists();
fitAllSchools();
</script>
</body>
</html>
