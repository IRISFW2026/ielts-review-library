 "examples": [{"en": "The team had to make hard choices about its priorities.", "zh": "团队不得不就优先事项作出艰难选择。"}, {"en": "There was not enough funding, so the organisers had to make hard choices.", "zh": "资金不足，因此组织者不得不作出艰难选择。"}, {"en": "Good tools can support us without making every hard choice for us.", "zh": "好的工具可以帮助我们，而不必替我们作出每一个艰难选择。"}], "note": "文档表达：make hard choices", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "robot-umpires-5c55245415ba"}, {"term": "maximize the use of time", "zh": "最大限度利用时间", "type": "phrase", "examples": [{"en": "She planned her revision to maximize the use of her time.", "zh": "她规划复习安排，以最大限度利用时间。"}, {"en": "The app is designed to help users maximize their study time.", "zh": "这个应用旨在帮助用户充分利用学习时间。"}, {"en": "Not every leisure activity needs to maximize the use of time.", "zh": "并非每一项休闲活动都需要追求时间利用最大化。"}], "note": "文档表达：maximize the use of time", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "robot-umpires-7b5f4121cf95"}, {"term": "take a dissenting stance toward", "zh": "对……持反对立场", "type": "phrase", "examples": [{"en": "Some players take a dissenting stance toward the new system.", "zh": "一些球员对新系统持反对立场。"}, {"en": "She took a dissenting stance toward the proposed changes.", "zh": "她对拟议中的变化持反对立场。"}, {"en": "Several members took a dissenting stance toward the policy.", "zh": "几位成员对该政策持反对立场。"}], "note": "文档表达：take a dissenting stance toward…", "ipa": "", "pos": "短语／表达", "stars": 4, "contextSenses": [0], "id": "robot-umpires-4202088694d7"}, {"term": "is not the answer", "zh": "……不是解决办法", "type": "phrase", "examples": [{"en": "Working longer hours is not always the answer.", "zh": "延长工作时间不总是解决办法。"}, {"en": "Buying more equipment is not the answer to every problem.", "zh": "购买更多设备并不是所有问题的答案。"}, {"en": "He argued that accuracy alone was not the answer.", "zh": "他认为，单靠准确性并不能解决问题。"}], "note": "文档表达：…is not the answer", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "robot-umpires-14d2f743c16d"}, {"term": "play for a team", "zh": "为某支球队效力", "type": "phrase", "examples": [{"en": "He plays for a local baseball team.", "zh": "他为当地一支棒球队效力。"}, {"en": "She used to play for her university team.", "zh": "她曾为大学校队效力。"}, {"en": "The player hopes to play for the national team.", "zh": "这名球员希望能为国家队效力。"}], "note": "文档表达：play for a team", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "robot-umpires-adff42aa9125"}, {"term": "want everything to be perfect", "zh": "希望一切都完美", "type": "phrase", "examples": [{"en": "She wanted everything to be perfect for the event.", "zh": "她希望活动的一切都完美。"}, {"en": "I delayed submitting the report because I wanted everything to be perfect.", "zh": "因为希望一切都完美，我迟迟没有提交报告。"}, {"en": "Wanting everything to be perfect can make it difficult to accept small mistakes.", "zh": "希望一切都完美，可能让人难以接受小错误。"}], "note": "文档表达：want everything to be perfect", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "robot-umpires-dbb22f346209"}, {"term": "that's not reality", "zh": "现实并非如此", "type": "phrase", "examples": [{"en": "The plan assumes that nobody makes mistakes, but that's not reality.", "zh": "这个计划假设没人犯错，但现实并非如此。"}, {"en": "Everything looks easy in the advertisement, but that's not reality.", "zh": "广告里一切看起来都很容易，但现实不是这样。"}, {"en": "We may wish for complete certainty, but that's not reality.", "zh": "我们也许希望完全确定，但现实并非如此。"}], "note": "文档表达：that’s not reality", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "robot-umpires-40ae61854ddb"}, {"term": "money in one's pocket", "zh": "口袋里的钱；手头的钱", "type": "phrase", "examples": [{"en": "He left home with very little money in his pocket.", "zh": "他离家时，口袋里没多少钱。"}, {"en": "After paying the bills, she had some money left in her pocket.", "zh": "付完账单后，她手头还剩一些钱。"}, {"en": "Having money in your pocket does not mean every problem is solved.", "zh": "手头有钱并不意味着所有问题都解决了。"}], "note": "文档表达：money in one’s pocket", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0, 1], "id": "robot-umpires-c86cfb2d4daf"}, {"term": "swing at a ball", "zh": "朝球挥棒，尝试击球", "type": "phrase", "examples": [{"en": "The batter swung at the ball but missed.", "zh": "击球手挥棒击球，但没有打中。"}, {"en": "She waited before swinging at the next ball.", "zh": "她等了一下，才对下一个球挥棒。"}, {"en": "He decided not to swing at the ball.", "zh": "他决定不对这一球挥棒。"}], "note": "文档表达：swing at a ball", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "robot-umpires-a054003693be"}, {"term": "swing and miss", "zh": "挥棒落空", "type": "phrase", "examples": [{"en": "The batter swung and missed.", "zh": "击球手挥棒落空。"}, {"en": "He swung and missed the first pitch.", "zh": "他对第一记投球挥棒，但没有击中。"}, {"en": "She swung and missed again.", "zh": "她再次挥棒落空。"}], "note": "文档表达：swing and miss", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "robot-umpires-abd2d014c21d"}, {"term": "pass through the strike zone", "zh": "穿过好球区", "type": "phrase", "examples": [{"en": "The ball passed through the strike zone.", "zh": "球穿过了好球区。"}, {"en": "The umpire judged whether the pitch had passed through the strike zone.", "zh": "裁判判断这记投球是否穿过了好球区。"}, {"en": "The system tracks balls as they pass through the strike zone.", "zh": "球穿过好球区时，系统会追踪其轨迹。"}], "note": "文档表达：pass through the strike zone", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "robot-umpires-48939ae234b3"}, {"term": "not swing at", "zh": "不对……挥棒", "type": "phrase", "examples": [{"en": "The batter did not swing at the first pitch.", "zh": "击球手没有对第一记投球挥棒。"}, {"en": "He watched the ball without swinging at it.", "zh": "他看着球经过，没有挥棒。"}, {"en": "Even if the batter does not swing at the ball, it can still be a strike.", "zh": "即使击球手没有挥棒，这一球仍可能被判为好球。"}], "note": "文档表达：not swing at…", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "robot-umpires-b3af94dfdc80"}], "sentences": [{"en": "A few years ago, Fred DeJesus from Brooklyn, New York became the first umpire in a minor league baseball game to use something called the Automated Ball-Strike System (ABS), often referred to as the 'robo-umpire'.", "zh": "几年前，来自纽约布鲁克林的弗雷德·德赫苏斯，成为首位在棒球小联盟比赛中使用一种名为“自动坏球—好球判定系统”（ABS）的裁判。该系统通常被称为“机器人裁判”。"}, {"en": "Instead of making any judgments himself about a strike*, DeJesus had decisions fed to him through an earpiece, connected to a modified missile-tracking system.", "zh": "德赫苏斯不再亲自作出好球判定，而是通过一只与改装后的导弹追踪系统相连接的耳机，接收传送给他的判定结果。"}, {"en": "The contraption looked like a large black pizza box with one glowing green eye; it was mounted above the press stand.", "zh": "这套装置看起来像一个大号黑色披萨盒，上面有一只发着绿光的“眼睛”；它被安装在记者席上方。"}, {"en": "Major League Baseball (MLB), who had commissioned the system, wanted human umpires to announce the calls, just as they would have done in the past.", "zh": "美国职业棒球大联盟（MLB）此前委托开发了这套系统，但仍希望由人类裁判宣布判定结果，就像过去那样。"}, {"en": "When the first pitch came in, a recorded voice told DeJesus it was a strike.", "zh": "当第一球投来时，一段预录的语音告诉德赫苏斯，这是一记好球。"}, {"en": "Previously, calling a strike was a judgment call on the part of the umpire.", "zh": "过去，是否判为好球，是由裁判凭自身判断作出的决定。"}, {"en": "Even if the batter does not hit the ball, a pitch that passes through the 'strike zone' (an imaginary zone about seventeen inches wide, stretching from the batter's knees to the middle of his chest) is considered a strike.", "zh": "即使击球手没有击中球，只要投球穿过“好球区”，也会被判为好球。这里的“好球区”指一个假想区域，宽约17英寸，垂直范围从击球手的膝盖延伸到胸部中间。"}, {"en": "During that first game, when DeJesus announced calls, there was no heckling and no shouted disagreement.", "zh": "在那场首次使用该系统的比赛中，德赫苏斯宣布判定时，没有人起哄，也没有人大声表示异议。"}, {"en": "Nobody said a word.", "zh": "没有人说一句话。"}, {"en": "For a hundred and fifty years or so, the strike zone has been the game's animating force – countless arguments between a team's manager and the umpire have taken place over its boundaries and whether a ball had crossed through it.", "zh": "大约150年来，好球区一直是这项运动富有戏剧性和活力的一个源泉——球队主教练与裁判之间，围绕好球区的边界以及球是否穿过该区域，发生过无数次争论。"}, {"en": "The rules of play have evolved in various stages.", "zh": "比赛规则经历了多个阶段的演变。"}, {"en": "Today, everyone knows that you may scream your disagreement in an umpire's face, but you must never shout personal abuse at them or touch them.", "zh": "如今，大家都知道，你可以当着裁判的面大声表达不满，但绝不能对裁判进行人身辱骂，也不能触碰裁判。"}, {"en": "That's a no-no.", "zh": "那是绝对不允许的。"}, {"en": "When the robo-umpires came, however, the arguments stopped.", "zh": "然而，当机器人裁判出现后，这些争论便停止了。"}, {"en": "During the first robo-umpire season, players complained about some strange calls.", "zh": "在首次采用机器人裁判的赛季中，球员们抱怨过一些奇怪的判定。"}, {"en": "In response, MLB decided to tweak the dimensions of the zone, and the following year the consensus was that ABS is profoundly consistent.", "zh": "作为回应，MLB决定微调好球区的尺寸；到了第二年，人们普遍认为，ABS的判定具有极高的一致性。"}, {"en": "MLB says the device is near-perfect, precise to within fractions of an inch.", "zh": "MLB称，这套设备近乎完美，精度可达到不足一英寸的细小量级。"}, {"en": "“It'll reduce controversy in the game, and be good for the game,” says Rob Manfred, who is Commissioner for MLB.", "zh": "“它会减少比赛中的争议，对这项运动有益，”文中担任MLB总裁的罗布·曼弗雷德说道。"}, {"en": "But the question is whether controversy is worth reducing, or whether it is the sign of a human hand.", "zh": "但问题在于，减少争议是否值得，还是说争议恰恰体现了人的参与。"}, {"en": "A human, at least, yells back.", "zh": "人类裁判至少还会吼回来。"}, {"en": "When I spoke with Frank Viola, a coach for a North Carolina team, he said that ABS works as designed, but that it was also unforgiving and pedantic, almost legalistic.", "zh": "当我与北卡罗来纳州一支球队的教练Frank Viola交谈时，他说ABS确实能按设计运行，但它也毫不通融、拘泥细节，几乎到了机械照搬法律条文般的地步。"}, {"en": "“Manfred is a lawyer,” Viola noted.", "zh": "“Manfred是个律师，”Viola说道。"}, {"en": "Some pitchers have complained that, compared with a human's, the robot's strike zone seems too precise.", "zh": "一些投手抱怨说，与人类裁判所判定的好球区相比，机器人的好球区似乎过于精确。"}, {"en": "Viola was once a major-league player himself.", "zh": "Viola本人也曾是一名大联盟球员。"}, {"en": "When he was pitching, he explained, umpires rewarded skill.", "zh": "他解释说，自己当投手的时候，裁判会对投球技艺给予认可。"}, {"en": "“Throw it where you aimed, and it would be a strike, even if it was an inch or two outside.”", "zh": "“只要把球投到你瞄准的位置，就会被判为好球，即使它偏出好球区一两英寸。”"}, {"en": "“There was a dialogue between pitcher and umpire.”", "zh": "“投手与裁判之间存在一种互动。”"}, {"en": "The executive tasked with running the experiment for MLB is Morgan Sword, who's in charge of baseball operations.", "zh": "受命为MLB负责这项试验的高管是Morgan Sword，他主管棒球运营事务。"}, {"en": "According to Sword, ABS was part of a larger project to make baseball more exciting since executives are terrified of losing younger fans, as has been the case with horse racing and boxing.", "zh": "据Sword所说，ABS属于一项让棒球更精彩的大型计划，因为管理层非常害怕失去年轻球迷——赛马和拳击就曾出现过这种情况。"}, {"en": "He explains how they began the process by asking fans what version of baseball they found most exciting.", "zh": "他解释说，他们最初是通过询问球迷最喜欢哪种棒球比赛风格，来启动这一过程的。"}, {"en": "The results showed that everyone wanted more action: more hits, more defense, more baserunning.", "zh": "结果显示，大家都希望比赛有更多场上活动：更多安打、更多防守，以及更多跑垒。"}, {"en": "This type of baseball essentially hasn't existed since the 1960s, when the hundred-mile-an-hour fastball, which is difficult to hit and control, entered the game.", "zh": "这种比赛风格自20世纪60年代以来基本上就不再存在了；当时，时速100英里的快速球进入了棒球比赛，而这种球既难打中，也难控制。"}, {"en": "It flattened the game into strikeouts, walks, and home runs – a type of play lacking much action.", "zh": "它使比赛变得单调，主要归结为三振出局、保送和本垒打——这是一种缺少丰富场上活动的比赛方式。"}, {"en": "Sword's team brainstormed potential fixes.", "zh": "Sword的团队集思广益，讨论了各种可能的解决办法。"}, {"en": "Any rule that existed, they talked about changing – from changing the bats to changing the geometry of the field.", "zh": "凡是现有的规则，他们都讨论过是否要修改——从改变球棒，到改变球场的几何布局，无所不谈。"}, {"en": "But while all of these were ruled out as potential fixes, ABS was seen as a perfect vehicle for change.", "zh": "不过，虽然这些方案最终都被排除在可行的解决办法之外，ABS却被视为推动变革的理想工具。"}, {"en": "According to Sword, once you get the technology right, you can load any strike zone you want into the system.", "zh": "据Sword所说，一旦把技术完善好，就可以把任何想要的好球区设定输入系统。"}, {"en": "“It might be a triangle, or a blob, or something shaped like Texas.”", "zh": "“它可以是三角形、一块不规则的形状，甚至可以长得像得克萨斯州。”"}, {"en": "“Over time, as baseball evolves, ABS can allow the zone to change with it.”", "zh": "“随着时间推移、棒球运动不断演变，ABS可以让好球区随之调整。”"}, {"en": "In the past twenty years, sports have moved away from judgment calls.", "zh": "过去二十年来，体育运动逐渐减少了对人为判断的依赖。"}, {"en": "Soccer has Video Assistant Referees (for offside decisions, for example).", "zh": "足球有视频助理裁判，例如用于辅助越位判定。"}, {"en": "Tennis has Hawk-Eye (for line calls, for example).", "zh": "网球有“鹰眼”系统，例如用于界线判定。"}, {"en": "For almost a decade, baseball has used instant replay on the base paths.", "zh": "棒球已经在垒间跑动相关的判定中使用即时回放近十年了。"}, {"en": "This is widely liked, even if the precision can sometimes cause problems.", "zh": "这种做法广受欢迎，尽管高度精确有时也会带来问题。"}, {"en": "But these applications deal with something physical: bases, lines, goals.", "zh": "但这些技术应用所处理的，是有形的对象：垒位、界线和球门。"}, {"en": "The boundaries of action are precise, delineated like the keys of a piano.", "zh": "这些比赛活动的界限十分明确，划分得如同钢琴琴键一样清清楚楚。"}, {"en": "This is not the case with ABS and the strike zone.", "zh": "但ABS和好球区的情况并非如此。"}, {"en": "Historically, a certain discretion has been appreciated.", "zh": "一直以来，人们都认可并看重一定程度的自由裁量。"}, {"en": "I decided to email Alva Noë, a professor at Berkeley University and a baseball fan, for his opinion.", "zh": "我决定给Alva Noë发邮件，征求他的意见。他是伯克利的一位教授，也是一名棒球迷。"}, {"en": "“Hardly a day goes by that I don't wake up and run through the reasons that this [robo-umpires] is such a terrible idea,” he replied.", "zh": "他回复道：“我几乎每天醒来，都会在脑中重新过一遍：为什么引入机器人裁判是个如此糟糕的主意。”"}, {"en": "He later told me, “This is part of a movement to use algorithms to take the hard choices of living out of life.”", "zh": "后来他告诉我：“这是一股趋势的一部分：人们试图利用算法，把生活中那些艰难的选择从生活里剔除出去。”"}, {"en": "Perhaps he's right.", "zh": "也许他是对的。"}, {"en": "We watch baseball to kill time, not to maximize it.", "zh": "我们看棒球是为了消磨时间，而不是为了把时间利用到极致。"}, {"en": "Some players I have met take a dissenting stance toward the robots too, believing that accuracy is not the answer.", "zh": "我遇到过的一些球员也对机器人裁判持反对立场，认为准确性并不是解决问题的答案。"}, {"en": "According to Joe Russo, who plays for a New Jersey team, “With technology, people just want everything to be perfect.”", "zh": "为新泽西州一支球队效力的Joe Russo说：“有了技术，人们就想让一切都变得完美。”"}, {"en": "That's not reality.", "zh": "现实不是这样的。"}, {"en": "I think perfect would be weird.", "zh": "我觉得，一切都完美反而会很奇怪。"}, {"en": "Your teams are always winning, work is always just great, there's always money in your pocket, your car never breaks down.", "zh": "你支持的球队总是赢，工作总是顺心如意，口袋里总有钱，汽车从来不出故障。"}, {"en": "What is there to talk about?", "zh": "那还有什么可聊的呢？"}], "examples": [{"en": "She was the first person to notice the error.", "zh": "她是第一个注意到错误的人。"}, {"en": "He became the first umpire to use the new system in the competition.", "zh": "他成为该赛事中首位使用新系统的裁判。"}, {"en": "I was the first student to arrive at the classroom.", "zh": "我是第一个到教室的学生。"}, {"en": "The team used something called a motion sensor.", "zh": "团队使用了一种叫作运动传感器的装置。"}, {"en": "We discussed something called cognitive bias.", "zh": "我们讨论了一个叫作认知偏差的概念。"}, {"en": "The device relies on something called automated tracking.", "zh": "该设备依靠一种称为自动追踪的技术。"}, {"en": "The device is often referred to as a digital assistant.", "zh": "这个设备通常被称为数字助手。"}, {"en": "This process is referred to as automation.", "zh": "这一过程被称为自动化。"}, {"en": "The system was referred to as the “robo-umpire”.", "zh": "这个系统被称为“机器人裁判”。"}, {"en": "Instead of making judgments immediately, she checked the evidence.", "zh": "她没有立即作出判断，而是核查了证据。"}, {"en": "The operator followed the system's instructions instead of making judgments independently.", "zh": "操作员遵循系统指令，而不是独立作出判断。"}, {"en": "Instead of making a judgment based on appearance, we examined the data.", "zh": "我们没有根据外观作出判断，而是检查了数据。"}, {"en": "I had my laptop repaired yesterday.", "zh": "我昨天请人修了笔记本电脑。"}, {"en": "The referee had the results sent to an earpiece.", "zh": "裁判通过耳机接收传来的结果。"}, {"en": "She had the document checked before submitting it.", "zh": "她提交文件前请人检查了文件。"}, {"en": "The sensors feed information to the computer.", "zh": "传感器向计算机传送信息。"}, {"en": "The latest figures were fed to the analysts.", "zh": "最新数据被传给了分析人员。"}, {"en": "The system feeds decisions to the umpire through an earpiece.", "zh": "系统通过耳机将判定结果传给裁判。"}, {"en": "The microphone is connected to the computer.", "zh": "麦克风连接着计算机。"}, {"en": "The earpiece was connected to the tracking system.", "zh": "耳机与追踪系统相连接。"}, {"en": "Several sensors are connected to a central unit.", "zh": "多个传感器连接着一个中央装置。"}, {"en": "The device looks like a small black box.", "zh": "这个设备看起来像一个小黑盒子。"}, {"en": "The sensor looked like a glowing eye.", "zh": "那个传感器看起来像一只发光的眼睛。"}, {"en": "From a distance, the building looks like a ship.", "zh": "从远处看，这栋建筑像一艘船。"}, {"en": "The camera was mounted above the entrance.", "zh": "摄像机被安装在入口上方。"}, {"en": "A display screen is mounted above the desk.", "zh": "书桌上方安装着一块显示屏。"}, {"en": "The tracking device was mounted above the press stand.", "zh": "追踪装置被安装在记者席上方。"}, {"en": "The organisation commissioned engineers to develop the system.", "zh": "该组织委托工程师开发这套系统。"}, {"en": "The museum commissioned an artist to create a sculpture.", "zh": "博物馆委托一位艺术家创作雕塑。"}, {"en": "The company commissioned researchers to evaluate the product.", "zh": "公司委托研究人员评估产品。"}, {"en": "The umpire announced the calls clearly.", "zh": "裁判清楚地宣布了判定。"}, {"en": "The human official remained responsible for announcing the calls.", "zh": "人类裁判仍负责宣布判定结果。"}, {"en": "The system made the decisions, but the umpire announced the calls.", "zh": "系统作出判定，但由裁判宣布结果。"}, {"en": "The device worked just as the engineers had expected.", "zh": "设备的运行情况完全符合工程师的预期。"}, {"en": "She followed the procedure just as she had done before.", "zh": "她像以前一样遵循流程。"}, {"en": "The officials announced the results just as they would in a traditional game.", "zh": "官员们像传统比赛中那样宣布结果。"}, {"en": "The umpire called a strike on the first pitch.", "zh": "裁判将第一记投球判为好球。"}, {"en": "The batter disagreed when the umpire called a strike.", "zh": "裁判判好球时，击球手表示异议。"}, {"en": "The system supplied the decision before the umpire called the strike.", "zh": "系统先提供判定结果，然后裁判宣布好球。"}, {"en": "Choosing between the two designs was a judgment call.", "zh": "在这两个设计之间作选择，需要凭判断决定。"}, {"en": "Whether to stop the game was a judgment call for the umpire.", "zh": "是否暂停比赛，需要裁判根据情况判断。"}, {"en": "There was no single clear answer; it was a judgment call.", "zh": "没有唯一明确的答案，需要作出判断。"}, {"en": "The mistake resulted from a misunderstanding on the part of the operator.", "zh": "这个错误源于操作员的误解。"}, {"en": "The project required considerable effort on the part of the team.", "zh": "项目需要团队付出相当大的努力。"}, {"en": "The decision involved a judgment on the part of the umpire.", "zh": "这项决定涉及裁判本人的判断。"}, {"en": "I will finish the task even if it takes longer than expected.", "zh": "即使耗时超过预期，我也会完成任务。"}, {"en": "Even if the system is accurate, people may still question its decisions.", "zh": "即使系统准确，人们仍可能质疑其判定。"}, {"en": "A pitch can be a strike even if the batter does not hit it.", "zh": "即使击球手没有击中，一记投球也可能是好球。"}, {"en": "The forest stretches from the river to the mountains.", "zh": "森林从河边延伸到山地。"}, {"en": "The protected area stretches from the coast to the inland hills.", "zh": "保护区从海岸延伸至内陆丘陵。"}, {"en": "The marked zone stretches from knee height to chest height.", "zh": "标出的区域从膝盖高度延伸到胸部高度。"}, {"en": "The trial was considered a success.", "zh": "这次试验被认为是成功的。"}, {"en": "The device is considered a useful tool.", "zh": "这个设备被视为有用的工具。"}, {"en": "A pitch passing through the designated zone is considered a strike in the description.", "zh": "按照文中的描述，穿过指定区域的投球被视为好球。"}, {"en": "She listened carefully and did not say a word.", "zh": "她认真听着，一句话也没说。"}, {"en": "Nobody said a word when the result was announced.", "zh": "结果宣布时，没有人说话。"}, {"en": "He left the room without saying a word.", "zh": "他一言不发地离开了房间。"}, {"en": "The discussion lasted an hour or so.", "zh": "讨论持续了一个小时左右。"}, {"en": "There were twenty people or so in the room.", "zh": "房间里大约有二十个人。"}, {"en": "The rule has existed for a hundred years or so.", "zh": "这项规则存在大约一百年了。"}, {"en": "Curiosity was an animating force behind the project.", "zh": "好奇心是推动该项目的一股力量。"}, {"en": "Competition became an animating force in the industry.", "zh": "竞争成为推动这个行业发展的一股力量。"}, {"en": "The debate has been an animating force in the movement.", "zh": "这场辩论一直为这项运动注入活力。"}, {"en": "There were arguments over the final decision.", "zh": "人们围绕最终决定发生了争论。"}, {"en": "The change led to arguments over fairness.", "zh": "这一变化引发了关于公平性的争论。"}, {"en": "Arguments over the boundaries continued for years.", "zh": "围绕边界的争论持续了多年。"}, {"en": "The discussion took place after the game.", "zh": "讨论发生在比赛之后。"}, {"en": "Several arguments have taken place over this issue.", "zh": "围绕这个问题已经发生过几次争论。"}, {"en": "The next meeting will take place on Friday.", "zh": "下次会议将在周五举行。"}, {"en": "The rules evolved in several stages.", "zh": "规则经历了几个阶段的演变。"}, {"en": "The design evolved in stages as new problems emerged.", "zh": "随着新问题出现，设计逐步演变。"}, {"en": "The system has evolved in various stages over the years.", "zh": "多年来，这套系统经历了不同阶段的发展。"}, {"en": "The spectator shouted his disagreement with the decision.", "zh": "那位观众大声表达了对判定的不满。"}, {"en": "Several people shouted their disagreement during the meeting.", "zh": "会议期间，有几个人大声表示反对。"}, {"en": "The manager screamed his disagreement at the umpire.", "zh": "主教练冲着裁判大声表达异议。"}, {"en": "He shouted in my face instead of explaining the problem.", "zh": "他没有解释问题，而是冲着我的脸大喊。"}, {"en": "She disliked having a camera pushed in her face.", "zh": "她不喜欢有人把摄像机凑到她面前。"}, {"en": "The player waved his arms in the umpire's face.", "zh": "那名球员在裁判面前挥舞双臂。"}, {"en": "A spectator shouted personal abuse at the referee.", "zh": "一名观众冲裁判进行人身辱骂。"}, {"en": "The manager was criticised for shouting personal abuse at an official.", "zh": "那位主教练因冲一名裁判人员进行人身辱骂而受到批评。"}, {"en": "Disagreeing with a decision does not justify shouting personal abuse at someone.", "zh": "不认同一个决定，并不能成为辱骂他人的理由。"}, {"en": "Using your phone during the exam is a no-no.", "zh": "考试期间使用手机是不允许的。"}, {"en": "Touching the equipment without permission is a no-no.", "zh": "未经许可触碰设备是禁止的。"}, {"en": "In that workplace, sharing confidential files is a definite no-no.", "zh": "在那个工作场所，分享机密文件是绝对禁止的。"}, {"en": "The players complained about the decision.", "zh": "球员们抱怨这项判定。"}, {"en": "Several customers complained about the long wait.", "zh": "几位顾客抱怨等候时间太长。"}, {"en": "She complained to the manager about the noise.", "zh": "她向经理投诉噪声问题。"}, {"en": "The rules were changed in response to complaints.", "zh": "为回应投诉，规则作了调整。"}, {"en": "The company improved the design in response to user feedback.", "zh": "公司根据用户反馈改进了设计。"}, {"en": "In response to the criticism, the team explained its methods.", "zh": "为回应批评，团队解释了自己的方法。"}, {"en": "The engineers tweaked the dimensions of the device.", "zh": "工程师微调了设备的尺寸。"}, {"en": "We need to tweak the dimensions of the frame.", "zh": "我们需要微调框架的尺寸。"}, {"en": "The designers tweaked the dimensions of the box without changing its overall shape.", "zh": "设计师微调了盒子的尺寸，没有改变整体形状。"}, {"en": "The consensus was that the new system was easier to use.", "zh": "大家普遍认为，新系统更容易使用。"}, {"en": "The consensus is that further testing is needed.", "zh": "普遍看法是，还需要进一步测试。"}, {"en": "After the discussion, the consensus was that the proposal should be revised.", "zh": "讨论后形成的共识是，应修改这份提案。"}, {"en": "The system was consistent across repeated tests.", "zh": "该系统在反复测试中表现稳定。"}, {"en": "We need to be consistent in how we apply the rules.", "zh": "我们需要以一致的方式执行规则。"}, {"en": "The decisions were consistent, even when different operators used the device.", "zh": "即使由不同操作员使用，设备给出的判定仍保持一致。"}, {"en": "The measurement is precise to within one millimetre.", "zh": "测量精度在一毫米以内。"}, {"en": "The device is precise to within a fraction of an inch.", "zh": "设备精确到一英寸的几分之一。"}, {"en": "The recorded position was precise to within a few centimetres.", "zh": "记录的位置精度在几厘米以内。"}, {"en": "Clearer rules may reduce controversy.", "zh": "更清晰的规则可能减少争议。"}, {"en": "The new procedure was intend ry detail.", "zh": "我们应做到准确，但不必对每个细节都过分刻板。"}, {"en": "Compared with the old system, the new one is more consistent.", "zh": "与旧系统相比，新系统更加稳定一致。"}, {"en": "The machine's decisions seemed strict compared with a human's.", "zh": "与人类的判定相比，机器的判定显得严格。"}, {"en": "Compared with last year, the team made fewer errors.", "zh": "与去年相比，球队失误更少。"}, {"en": "The instructions seem too complicated for beginners.", "zh": "这些要求对初学者来说似乎过于复杂。"}, {"en": "The deadline seemed too tight.", "zh": "截止期限似乎过于紧张。"}, {"en": "Some players thought the strike zone seemed too precise.", "zh": "一些球员认为，好球区似乎被界定得过于精确。"}, {"en": "The scoring system should reward skill rather than luck.", "zh": "评分系统应认可技艺，而非运气。"}, {"en": "The competition rewards skill and careful preparation.", "zh": "这项比赛重视技艺与充分准备。"}, {"en": "He believed that experienced umpires rewarded skill.", "zh": "他认为，经验丰富的裁判会认可投手的技艺。"}, {"en": "The pitcher aimed at the catcher's glove.", "zh": "投手瞄准捕手的手套。"}, {"en": "She threw the ball exactly where she had aimed.", "zh": "她把球准确投到了瞄准的位置。"}, {"en": "He aimed at the target but missed it.", "zh": "他瞄准了目标，却没有击中。"}, {"en": "The ball landed an inch or two outside the marked area.", "zh": "球落在标记区域外一两英寸处。"}, {"en": "The line extended an inch or two outside the frame.", "zh": "线条延伸到边框外一两英寸处。"}, {"en": "The pitch was an inch or two outside the strike zone.", "zh": "这记投球偏出好球区一两英寸。"}, {"en": "The project encouraged a dialogue between designers and users.", "zh": "这个项目鼓励设计师与用户交流。"}, {"en": "There was an ongoing dialogue between the teacher and the students.", "zh": "老师与学生之间保持着持续交流。"}, {"en": "He described the game as a dialogue between pitcher and umpire.", "zh": "他把比赛描述为投手与裁判之间的一种互动。"}, {"en": "She was tasked with organising the trial.", "zh": "她受命负责组织这次试验。"}, {"en": "The team is tasked with evaluating the new system.", "zh": "这个团队负责评估新系统。"}, {"en": "He was tasked with collecting feedback from fans.", "zh": "他受命收集球迷反馈。"}, {"en": "She is in charge of daily operations.", "zh": "她主管日常运营。"}, {"en": "Who is in charge if(view==='sentences'){$('sentence-type').value=sentenceType;$('sentence-type').onchange=e=>{sentenceType=e.target.value;sentenceList()};$('sentence-search').oninput=e=>{search=e.target.value;sentenceList()};sentenceList()}
if(view==='settings'){voiceOptions();$('engine').value=settings.engine;$('engine').onchange=e=>{settings.engine=e.target.value;saveSettings()};$('voice-select').onchange=e=>{settings.voice=e.target.value;saveSettings();voiceStatus()};$('rate').oninput=e=>{settings.rate=Number(e.target.value);$('rate-label').textContent=settings.rate+' ×';saveSettings()};$('daily').onchange=e=>{settings.daily=Math.max(1,Math.min(100,parseInt(e.target.value)||20));e.target.value=settings.daily;saveSettings()};$('export').onclick=exportData;$('import').onchange=importData}}
document.addEventListener('click',e=>{let v=e.target.closest('[data-view]');if(v){stopSound();search='';navigate(v.dataset.view)}let p=e.target.closest('[data-say]');if(p)speak(p.dataset.say,DATA.items.some(x=>x.term===p.dataset.say));let g=e.target.closest('[data-grade]');if(g)grade(Number(g.dataset.grade))});
document.addEventListener('change',e=>{let id=e.target.dataset.levelId;if(!id)return;let level=e.target.value;if(level==='new')delete state[id];else{let old=state[id]||{};state[id]={...old,level:Number(level),due:level==='4'?null:Date.now(),streak:0,reps:old.reps||0,startedDay:old.startedDay||dayKey(),updated:Date.now()}}save();renderStats()});
let audio=null,soundToken=0;
function stopSound(){soundToken++;if(audio){audio.pause();audio=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
function voiceScore(v){return (/natural|neural|premium|enhanced/i.test(v.name)?100:0)+(!v.localService?30:0)+(/^en-GB/i.test(v.lang)?10:0)+(/Google|Microsoft|Samantha|Daniel|Serena/i.test(v.name)?5:0)}
function selectedVoice(){return voices.find(v=>v.voiceURI===settings.voice)||voices[0]}
function loadVoices(){voices=('speechSynthesis'in window?speechSynthesis.getVoices():[]).filter(v=>/^en(?:-|_)/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));voiceStatus();if(view==='settings')voiceOptions()}
function voiceStatus(){let v=selectedVoice();$('voice-status').textContent=v?'英语音色 · '+v.name:('speechSynthesis'in window?'未检测到英语音色，请查看学习设置':'此浏览器不支持设备朗读，请尝试在线词典发音或其他浏览器')}
function voiceOptions(){if(!$('voice-select'))return;$('voice-select').innerHTML='<option value="">自动选择 · 优先自然英语音色</option>'+voices.map(v=>`<option value="${escapeHTML(v.voiceURI)}">${escapeHTML(v.name)} · ${escapeHTML(v.lang)}</option>`).join('');$('voice-select').value=settings.voice}
function deviceSpeech(text,rate,token){if(token!==soundToken)return;if(!('speechSynthesis'in window)){toast('此浏览器不支持语音朗读，请换用支持语音的浏览器。');return}loadVoices();let v=selectedVoice();if(!v){toast('未检测到英语音色，请在系统中添加英语语音后重试。');return}let u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=rate;u.pitch=1;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))toast('朗读未成功，请换一个英语音色。')};speechSynthesis.speak(u)}
function speak(text,isTerm=false,rate=settings.rate){stopSound();const token=soundToken;let spoken=text.replace(/\bA\b/g,'A').replace(/…/g,' ').replace(/[＋+]/g,' ');if(settings.engine==='dictionary'&&isTerm){audio=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(spoken)+'&type=1');audio.playbackRate=rate;let finished=false;const fallback=()=>{if(finished||token!==soundToken)return;finished=true;if(audio)audio.pause();toast('在线发音不可用，已切换设备音色。');deviceSpeech(spoken,rate,token)};const timer=setTimeout(fallback,7000);audio.onplaying=()=>{finished=true;clearTimeout(timer)};audio.onerror=fallback;audio.play().catch(fallback);return}deviceSpeech(spoken,rate,token)}
function exportData(){let blob=new Blob([JSON.stringify({app:KEY,version:1,exportedAt:new Date().toISOString(),state,settings},null,2)],{type:'application/json'});let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='Robot-Umpires-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.app!==KEY||d.version!==1||!d.state||typeof d.state!=='object'||Array.isArray(d.state))throw Error();let valid=new Set(DATA.items.map(x=>x.id)),incoming={};for(let [id,r]of Object.entries(d.state)){if(!valid.has(id))continue;if(!r||![1,2,3,4].includes(r.level)||!Number.isFinite(r.updated)||!Number.isFinite(r.reps)||r.reps<0||(r.level!==4&&!Number.isFinite(r.due)))throw Error();incoming[id]={level:r.level,due:r.level===4?null:r.due,reps:r.reps,updated:r.updated,streak:Number.isFinite(r.streak)?Math.max(0,r.streak):0,startedDay:typeof r.startedDay==='string'?r.startedDay:dayKey()}}for(let[id,r]of Object.entries(incoming))if(!state[id]||r.updated>=(state[id].updated||0))state[id]=r;save();render();toast('进度已导入：按最后更新时间合并，不覆盖较新的记录。')}catch{toast('导入失败：请选择本页面导出的有效进度文件。')}finally{if($('import'))$('import').value=''}}
window.addEventListener('hashchange',()=>{let v=location.hash.slice(1);if(v!==view&&['cards','dictation','meaning','sentences','library','settings'].includes(v))navigate(v)});
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,1200)}else voiceStatus();
setInterval(()=>{renderStats();if(['cards','dictation','meaning'].includes(view)&&!current&&!document.querySelector('#en-answer')){let ids=candidates().map(x=>x.id);if(ids.length){queue=ids;next()}}},15000);
if(['cards','dictation','meaning'].includes(view))buildQueue();else render();
</script></body></html>
