</style></head><body><script>const h=location.hash.slice(1).split('/');window.REVIEW_CONFIG={root:'',article:h[0]==='termite'?'termite':null,view:['reading','dictation','vocabulary','collocations'].includes(h[1])?h[1]:'reading'};window.addEventListener('hashchange',()=>{if(!location.hash.startsWith('#paragraph-'))location.reload()});</script><script>window.REVIEW_DATA={"termite":{"name":"Termite Mounds","slug":"termite","title":"Termite Mounds 雅思阅读精读","paragraphs":{"A":{"summary":"重新评价白蚁的名声：从破坏性害虫到可能有用的研究对象。","sentences":[{"id":"A1","en":"To most of us, termites are destructive insects which can cause damage on a devastating scale.","zh":"对我们大多数人而言，白蚁是破坏性昆虫，能够造成极其严重的损害。","words":[{"word":"termite","meaning":"白蚁","common":"白蚁","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"destructive","meaning":"破坏性的","common":"破坏性的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"devastating","meaning":"毁灭性的","common":"毁灭性的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[],"note":"which 引导定语从句，修饰 insects；on a devastating scale 强调破坏程度。"},{"id":"A2","en":"But according to Dr Rupert Soar of Loughborough University's School of Mechanical and Manufacturing Engineering, these pests may serve a useful purpose for us after all.","zh":"但据拉夫堡大学机械与制造工程学院的 Rupert Soar 博士介绍，这些害虫终究可能对我们有用。","words":[{"word":"serve a useful purpose","meaning":"发挥有用作用","common":"发挥有用作用","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":4}],"collocations":[{"term":"serve a useful purpose","zh":"发挥有用作用"}],"note":"But 是转折信号，决定本段由“贬”转向“重新评价”；according to 引出观点来源，after all 表示终究。"},{"id":"A3","en":"His multidisciplinary team of British and American engineers and biologists has set out to investigate the giant mounds built by termites in Namibia, in sub-Saharan Africa, as part of the most extensive study of these structures ever taken.","zh":"他的团队由英国和美国的工程师、生物学家组成，已开始调查撒哈拉以南非洲纳米比亚的巨大白蚁丘；这是迄今对白蚁丘结构最广泛的研究的一部分。","words":[{"word":"termite","meaning":"白蚁","common":"白蚁","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"multidisciplinary","meaning":"跨学科的","common":"跨学科的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"set out to","meaning":"着手做","common":"着手做","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":4},{"word":"mound","meaning":"土丘，本文指白蚁丘","common":"土丘，本文指白蚁丘","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"extensive","meaning":"广泛的","common":"广泛的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[{"term":"set out to","zh":"着手做"}],"note":"主干 His multidisciplinary team has set out to investigate…；built by termites 是后置定语；as part of… 说明研究定位。"}]},"B":{"summary":"令人惊叹的体量：地上高度、地下延伸与复杂隧道网络。","sentences":[{"id":"B1","en":"Termite mounds are impressive for their size alone; typically they are three metres high, and some as tall as eight metres have been found.","zh":"仅就体量而言，白蚁丘便令人惊叹：通常高三米，还发现过高达八米的白蚁丘。","words":[{"word":"impressive","meaning":"令人印象深刻的","common":"令人印象深刻的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"typically","meaning":"通常","common":"通常","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[],"note":"分号连接两个相关分句；for their size alone 明确本段中心是体量。as tall as eight metres 表示高达八米。"},{"id":"B2","en":"They also reach far into the earth, where the insects 'mine' their building materials, carefully selecting each grain of sand they use.","zh":"它们还深入地下，白蚁在那里“开采”建筑材料，仔细选择使用的每一粒沙。","words":[{"word":"mine","meaning":"开采（动词），矿井（名词）","common":"开采（动词），矿井（名词）","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"grain","meaning":"颗粒，也可指谷物","common":"颗粒，也可指谷物","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[],"note":"where 指地下地点；selecting… 是伴随动作。mine 在此为开采，不能译为“我的”。"},{"id":"B3","en":"The termite's nest is contained in the central cavity of the mound, safely protected from the harsh environment outside.","zh":"白蚁的巢位于蚁丘中央的空腔中，受到安全保护，免遭外界恶劣环境影响。","words":[{"word":"cavity","meaning":"空腔","common":"空腔","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"harsh","meaning":"恶劣的","common":"恶劣的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[],"note":"主干 The termite’s nest is contained…；safely protected… 补充说明受到保护的状态。"},{"id":"B4","en":"The mound itself is formed of an intricate lattice of tunnels, which split into smaller and smaller tunnels, much like a person's blood vessels.","zh":"蚁丘本身由错综复杂的隧道网构成；这些隧道不断分成更细小的隧道，就像人体的血管。","words":[{"word":"intricate","meaning":"错综复杂的","common":"错综复杂的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"lattice","meaning":"网格状结构","common":"网格状结构","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"split into","meaning":"分成","common":"分成","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":4},{"word":"blood vessel","meaning":"血管","common":"血管","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":4}],"collocations":[{"term":"split into","zh":"分成"},{"term":"blood vessel","zh":"血管"}],"note":"which 指 tunnels；split into 表示分成；much like 引出血管类比。结构细节服务于对建筑规模与复杂性的描写。"}]},"C":{"summary":"蚁丘的主要功能：通风、排气、调温、调湿。","sentences":[{"id":"C1","en":"This complex system of tunnels draws in air from the outside, capturing wind energy to drive it through the mound.","zh":"这一复杂隧道系统从外界吸入空气，利用风能推动空气穿过蚁丘。","words":[{"word":"draw in","meaning":"吸入","common":"吸入","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":4},{"word":"capture","meaning":"捕获，本文指利用","common":"捕获，本文指利用","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"suffocate","meaning":"窒息","common":"窒息","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[{"term":"draw in","zh":"吸入"}],"note":"主干 system draws in air；capturing… 表示伴随的利用方式；drive it 中 it 指 air。"},{"id":"C2","en":"It also serves to expel spent respiratory gases from the nest to prevent the termites from suffocating, so ensuring them a continuous provision of fresh, breathable air.","zh":"它还把巢中呼吸产生的废气排出，以防白蚁窒息，从而持续为它们提供新鲜、可呼吸的空气。","words":[{"word":"expel","meaning":"排出","common":"排出","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"spent","meaning":"用过的，废弃的","common":"用过的，废弃的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"respiratory","meaning":"呼吸的","common":"呼吸的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"provision","meaning":"供应，也可指条款","common":"供应，也可指条款","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[],"note":"serves to 表示功能；to prevent… 表目的；so ensuring… 表结果。连续动作共同支持“通风功能”。"},{"id":"C3","en":"So detailed is the design that the nest stays within three degrees of a constant temperature, despite variations on the outside of up to 50 °C, from blistering heat in the daytime to below freezing on the coldest nights.","zh":"这一设计如此精细，即使外界温差高达50摄氏度——白天酷热，最冷的夜晚低于冰点——巢内温度也只在某一恒定温度附近三度的范围内变化。","words":[{"word":"constant","meaning":"恒定的","common":"恒定的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"variation","meaning":"变化","common":"变化","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"blistering","meaning":"酷热的","common":"酷热的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[],"note":"So + 形容词 + be + 主语 + that… 是倒装，正常语序为 The design is so detailed that…；despite 引出对比。"},{"id":"C4","en":"The mound also automatically regulates moisture in the air, by means of both its underground 'cellar', and evaporation from the top of the mound.","zh":"蚁丘还通过地下“地窖”和顶部的蒸发作用，自动调节空气中的水分。","words":[{"word":"regulate","meaning":"调节","common":"调节","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"moisture","meaning":"水分","common":"水分","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"by means of","meaning":"通过","common":"通过","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":4},{"word":"evaporation","meaning":"蒸发","common":"蒸发","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[{"term":"by means of","zh":"通过"}],"note":"by means of 后接调湿手段；both…and… 并列地下空间与顶部蒸发。"},{"id":"C5","en":"Some colonies even had 'chimneys' at a height of 20 m to control moisture loss in the hottest regions of sub-Saharan Africa.","zh":"在撒哈拉以南非洲最炎热的地区，有些白蚁群甚至拥有高达20米的“烟囱”，以控制水分流失。","words":[{"word":"moisture","meaning":"水分","common":"水分","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[],"note":"chimneys 是引号中的形象说法。高度只是调湿功能的例子，不应因此把整段选为“体量”。"}]},"D":{"summary":"互利关系：白蚁种植真菌，真菌帮助消化并提供资源。","sentences":[{"id":"D1","en":"Furthermore, the termites have evolved in such a way as to outsource some of their biological functions.","zh":"此外，白蚁通过进化，以把部分生物功能“外包”的方式生存。","words":[{"word":"evolve","meaning":"进化","common":"进化","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"outsource","meaning":"外包","common":"外包","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"carry out","meaning":"执行，完成","common":"执行，完成","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":4},{"word":"break down","meaning":"分解；也可指故障","common":"分解；也可指故障","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":4},{"word":"indicate","meaning":"表明","common":"表明","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[{"term":"carry out","zh":"执行，完成"},{"term":"break down","zh":"分解；也可指故障"}],"note":"Furthermore 表示补充；in such a way as to… 表示以某种方式达到某结果。outsource 把人类商业概念用于生物功能。"},{"id":"D2","en":"Part of their digestive process is carried out by a fungus, which they 'farm' inside the mound.","zh":"部分消化过程由它们在蚁丘内部“种植”的一种真菌完成。","words":[{"word":"digestive","meaning":"消化的","common":"消化的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"fungus","meaning":"真菌","common":"真菌","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"farm","meaning":"种植，培育（动词）","common":"种植，培育（动词）","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[],"note":"is carried out 是被动结构；which 指 fungus；farm 在此是动词，表示培育或种植。"},{"id":"D3","en":"This fungus, which is found nowhere else on earth, thrives in the constant and optimum environment of the mound.","zh":"这种在地球其他地方找不到的真菌，在蚁丘恒定且最适宜的环境中茁壮生长。","words":[{"word":"fungus","meaning":"真菌","common":"真菌","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"thrive","meaning":"茁壮生长","common":"茁壮生长","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"optimum","meaning":"最适宜的","common":"最适宜的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[],"note":"which 引导非限制性定语从句；thrives 是主句谓语；constant and optimum 并列修饰 environment。"},{"id":"D4","en":"The termites feed the fungus with slightly chewed wood pulp, which the fungus then breaks down into a digestible sugary food to provide the insects with energy, and cellulose which they use for building.","zh":"白蚁给真菌喂食稍经咀嚼的木浆；真菌随后将其分解成可消化的含糖食物，为白蚁供能，并产生供它们建造使用的纤维素。","words":[{"word":"fungus","meaning":"真菌","common":"真菌","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"wood pulp","meaning":"木浆","common":"木浆","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":4},{"word":"digestible","meaning":"可消化的","common":"可消化的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"cellulose","meaning":"纤维素","common":"纤维素","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[{"term":"wood pulp","zh":"木浆"}],"note":"第一处 which 指 fungus；后面的 which they use for building 修饰 cellulose。抓住“白蚁供木浆→真菌分解→白蚁获得资源”的双向关系。"},{"id":"D5","en":"And, although the termites must generate waste, none ever leaves the structure, indicating that there is also some kind of internal waste-recycling system.","zh":"尽管白蚁必然产生废物，却从未有废物离开这一结构，说明内部还存在某种废物回收系统。","words":[{"word":"waste-recycling","meaning":"废物回收","common":"废物回收","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[],"note":"although 表让步；none 指废物；indicating that… 表推断。这一末句补充循环系统，不取代整段互利共生的核心。"}]},"E":{"summary":"挑战生命定义：内稳态从身体转移到建筑结构。","sentences":[{"id":"E1","en":"Scientists are so excited by the mounds that they have labelled them a 'super organism' because, in Soar's words, “They dance on the edge of what we would perceive to be cool or, if you're too cold, you need to thrive: that's called homeostasis.”","zh":"科学家对白蚁丘如此兴奋，以至于把它们称作“超级生物体”。其后引语存在疑似转录缺失，不能可靠地逐字翻译；这一段的明确主题是内稳态。","words":[{"word":"label","meaning":"把……称为，贴标签","common":"把……称为，贴标签","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"organism","meaning":"生物体","common":"生物体","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"homeostasis","meaning":"内稳态","common":"内稳态","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"perceive","meaning":"感知，认为","common":"感知，认为","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"come to light","meaning":"被发现，显露","common":"被发现，显露","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":4}],"collocations":[{"term":"come to light","zh":"被发现，显露"}],"note":"so…that… 表程度及结果。上传引语不完整，勿把有问题的文字作为句型范本；标题判断可依靠末句 redefine…living organism。"},{"id":"E2","en":"What the termites have done is to move homeostatic function away from their body, into the structure in which they live.","zh":"白蚁所做的，是把维持内稳态的功能从自身身体转移到它们居住的建筑结构中。","words":[],"collocations":[],"note":"What the termites have done 是主语从句；is to move… 为表语；in which they live 修饰 structure。"},{"id":"E3","en":"“As more information comes to light about the unique features of termite mounds, we may ultimately need to redefine our understanding of what constitutes a 'living' organism.”","zh":"随着白蚁丘独特特征的更多信息被发现，我们最终可能需要重新界定：究竟什么构成一个“活的”生物体。","words":[{"word":"organism","meaning":"生物体","common":"生物体","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"ultimately","meaning":"最终","common":"最终","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"redefine","meaning":"重新定义","common":"重新定义","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"constitute","meaning":"构成","common":"构成","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[],"note":"As 在此表示随着；come to light 表示被发现；what constitutes… 为宾语从句。may 保留可能性，并非已经重新定义。"}]},"F":{"summary":"研究方法：石膏填充、切片、顺序摄影、三维重建。","sentences":[{"id":"F1","en":"To reveal the structure of the mounds, Soar's team begins by filling and covering their plaster of Paris, a chalky white paste based on the mineral gypsum, which becomes rock-solid when dry.","zh":"为揭示蚁丘结构，Soar 的团队首先用巴黎石膏进行填充和覆盖；这是一种以石膏矿物为基础的白色粉状糊料，干燥后会变得坚硬如石。原句 filling and covering their plaster of Paris 疑似缺失成分，此处按上下文解释研究步骤。","words":[{"word":"reveal","meaning":"揭示","common":"揭示","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"plaster of Paris","meaning":"巴黎石膏","common":"巴黎石膏","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":4},{"word":"gypsum","meaning":"石膏矿物","common":"石膏矿物","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"rock-solid","meaning":"坚硬如石的","common":"坚硬如石的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[{"term":"plaster of Paris","zh":"巴黎石膏"}],"note":"To reveal… 表目的。上传句的填充对象与介词疑似缺失；a chalky white paste… 是对 plaster of Paris 的说明。"},{"id":"F2","en":"The researcher then carves the plaster of Paris into half-millimetre thick slices, and photographs them sequentially.","zh":"研究人员随后把石膏切成半毫米厚的薄片，并按顺序拍照。","words":[{"word":"plaster of Paris","meaning":"巴黎石膏","common":"巴黎石膏","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":4},{"word":"carve","meaning":"切割，雕刻","common":"切割，雕刻","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"slice","meaning":"薄片","common":"薄片","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"sequentially","meaning":"按顺序地","common":"按顺序地","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[{"term":"plaster of Paris","zh":"巴黎石膏"}],"note":"then 和 sequentially 表明操作顺序；half-millimetre thick 表示半毫米厚，勿误读成半米。"},{"id":"F3","en":"Once the pictures are digitally scanned, computer technology is able to recreate complex three-dimensional images of the mounds.","zh":"图片经过数字扫描后，计算机技术能够重建蚁丘复杂的三维图像。","words":[{"word":"scan","meaning":"扫描","common":"扫描","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"recreate","meaning":"重建","common":"重建","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"three-dimensional","meaning":"三维的","common":"三维的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[],"note":"Once 引导时间条件；recreate 表示重建；three-dimensional 为三维。"},{"id":"F4","en":"These models have enabled the team to map termite architecture at a level of detail never before attained.","zh":"这些模型让团队能够以前所未有的精细程度绘制白蚁建筑的结构。","words":[{"word":"enable","meaning":"使能够","common":"使能够","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"attain","meaning":"达到","common":"达到","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[],"note":"enable sb to do sth 表示使某人能够做；never before attained 修饰 level of detail。"}]},"G":{"summary":"潜在应用：为未来节能建筑与极端环境住所提供启发。","sentences":[{"id":"G1","en":"Soar hopes that the models will explain how termite mounds create a self-regulating living environment which manages to respond to changing internal and external conditions without drawing on any outside source of power.","zh":"Soar 希望这些模型能解释：白蚁丘如何创造一种自我调节的生活环境，在不借助任何外部能源的情况下，应对内外条件变化。","words":[{"word":"self-regulating","meaning":"自我调节的","common":"自我调节的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"respond to","meaning":"对……作出反应","common":"对……作出反应", 候变化、温度上升，我们将没有足够的燃料来驱动世界各地的空调。","words":[],"collocations":[],"note":"As 表随着；not enough…to… 表示不足以；引号内部由 he explains 插入。"},{"id":"G4","en":"It is hoped, says Soar, “that the findings will provide clues that aid the ultimate development of new kinds of human habitats, suitable for a variety of arid, hostile environments not only on the earth but maybe one day on the moon and beyond.”","zh":"Soar 表示，希望这些成果提供线索，帮助最终开发适用于各种干旱、恶劣环境的新型人类住所——不仅在地球上，也许有一天还在月球及更远的地方。","words":[{"word":"habitat","meaning":"栖息地，住所","common":"栖息地，住所","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"arid","meaning":"干旱的","common":"干旱的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"hostile","meaning":"恶劣的，也可指敌对的","common":"恶劣的，也可指敌对的","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"aid","meaning":"帮助","common":"帮助","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3},{"word":"beyond","meaning":"在更远处","common":"在更远处","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":3}],"collocations":[],"note":"It is hoped…that… 为被动表达；that aid… 修饰 clues；suitable for… 修饰 habitats；not only…but… 延伸应用范围。"}]}},"practice":[{"term":"serve a useful purpose","zh":"发挥有用作用","template":"X can serve a useful purpose by doing Y.","use":"结合模板替换主语与具体内容；检查搭配所需的介词及动词形式。","source":{"id":"A2","en":"But according to Dr Rupert Soar of Loughborough University's School of Mechanical and Manufacturing Engineering, these pests may serve a useful purpose for us after all.","zh":"但据拉夫堡大学机械与制造工程学院的 Rupert Soar 博士介绍，这些害虫终究可能对我们有用。","words":[{"word":"serve a useful purpose","meaning":"发挥有用作用","common":"发挥有用作用","ielts":"重点识别本文语境中的含义，并结合原句复习。","extended":"短语整体理解；判断标题时需结合整段，而非只看这一词。","ipa":"","stars":4}],"collocations":[{"term":"serve a useful purpose","zh":"发挥有用作用"}],"note":"But 是转折信号，决定本段由“贬”转向“重新评价”；according to  changes in temperature.","zh":"参考结构同上。此例句展示搭配结构，请换成自己的学习情境。"},{"prompt":"联系建筑、环境或研究：尝试另写一句话","en":"Soar hopes that the models will explain how termite mounds create a self-regulating living environment which manages to respond to changing internal and external conditions without drawing on any outside source of power.","zh":"Soar 希望这些模型能解释：白蚁丘如何创造一种自我调节的生活环境，在不借助任何外部能源的情况下，应对内外条件变化。"}],"derived":false}],"extras":{"intro":"白蚁丘如何调节环境，又如何启发未来建筑？以段落标题匹配为核心，复习原文、词汇和搭配。","priority":"先概括整段，再回原文找证据。不要只抓地点、数字或单个熟词。","logic":"名声重估 → 建筑体量 → 主要功能 → 互利共生 → 生命定义 → 研究方法 → 建筑应用。","structure":[["A","iii · reconsidering the termite’s reputation","重新评价白蚁的名声：从破坏性害虫到可能有用的研究对象。"],["B","vii · the astonishing physical dimensions of the termite mound","令人惊叹的体量：地上高度、地下延伸与复杂隧道网络。"],["C","iv · principal functions of the termite mound","蚁丘的主要功能：通风、排气、调温、调湿。"],["D","ix · a mutually beneficial relationship","互利关系：白蚁种植真菌，真菌帮助消化并提供资源。"],["E","ii · challenging our assumptions about the nature of life","挑战生命定义：内稳态从身体转移到建筑结构。"],["F","i · methods used to investigate termite mound formation","研究方法：石膏填充、切片、顺序摄影、三维重建。"],["G","vi · some potential benefits of understanding termite architecture","潜在应用：为未来节能建筑与极端环境住所提供启发。"]],"skills":[["阅读","标题匹配步骤","先读全段，用中文写“主题＋作者在说什么”，再比较标题覆盖范围。最后检查转折与结尾是否改变重心。"],["写作","方法迁移","本次完成标准：能解释A—E段原选择为什么只抓局部或与段意不符；能为各段指出支持正确标题的证据。视掌握情况决定是否加练，不设置正确率或速度目标。"]],"errors":[["27","To most of us, termites are destructive insects which can cause damage on a devastating scale. But according to Dr Rupert Soar of Loughborough University's School of Mechanical and Manufacturing Engineering, these pests may serve a useful purpose for us after all. His multidisciplinary team of British and American engineers and biologists has set out to investigate the giant mounds built by termites in Namibia, in sub-Saharan Africa, as part of the most extensive study of these structures ever taken.","你的选择：ii；文档提供的答案：iii","iii · reconsidering the termite’s reputation","重新评价白蚁的名声：从破坏性害虫到可能有用的研究对象。 判断关键：标题要覆盖整段的论述方向。"],["28","Termite mounds are impressive for their size alone; typically they are three metres high, and some as tall as eight metres have been found. They also reach far into the earth, where the insects 'mine' their building materials, carefully selecting each grain of sand they use. The termite's nest is contained in the central cavity of the mound, safely protected from the harsh environment outside. The mound itself is formed of an intricate lattice of tunnels, which split into smaller and smaller tunnels, much like a person's blood vessels.","你的选择：iv；文档提供的答案：vii","vii · the astonishing physical dimensions of the termite mound","令人惊叹的体量：地上高度、地下延伸与复杂隧道网络。 判断关键：标题要覆盖整段的论述方向。"],["29","This complex system of tunnels draws in air from the outside, capturing wind energy to drive it through the mound. It also serves to expel spent respiratory gases from the nest to prevent the termites from suffocating, so ensuring them a continuous provision of fresh, breathable air. So detailed is the design that the nest stays within three degrees of a constant temperature, despite variations on the outside of up to 50 °C, from blistering heat in the daytime to below freezing on the coldest nights. The mound also automatically regulates moisture in the air, by means of both its underground 'cellar', and evaporation from the top of the mound. Some colonies even had 'chimneys' at a height of 20 m to control moisture loss in the hottest regions of sub-Saharan Africa.","你的选择：v；文档提供的答案：iv","iv · principal functions of the termite mound","蚁丘的主要功能：通风、排气、调温、调湿。 判断关键：标题要覆盖整段的论述方向。"],["30","Furthermore, the termites have evolved in such a way as to outsource some of their biological functions. Part of their digestive process is carried out by a fungus, which they 'farm' inside the mound. This fungus, which is found nowhere else on earth, thrives in the constant and optimum environment of the mound. The termites feed the fungus with slightly chewed wood pulp, which the fungus then breaks down into a digestible sugary food to provide the insects with energy, and cellulose which they use for building. And, although the termites must generate waste, none ever leaves the structure, indicating that there is also some kind of internal waste-recycling system.","你的选择：vii；文档提供的答案：ix","ix · a mutually beneficial relationship","互利关系：白蚁种植真菌，真菌帮助消化并提供资源。 判断关键：标题要覆盖整段的论述方向。"],["31","Scientists are so excited by the mounds that they have labelled them a 'super organism' because, in Soar's words, “They dance on the edge of what we would perceive to be cool or, if you're too cold, you need to thrive: that's called homeostasis.” What the termites have done is to move homeostatic function away from their body, into the structure in which they live. “As more information comes to light about the unique features of termite mounds, we may ultimately need to redefine our understanding of what constitutes a 'living' organism.”","你的选择：iii；文档提供的答案：ii","ii · challenging our assumptions about the nature of life","挑战生命定义：内稳态从身体转移到建筑结构。 判断关键：标题要覆盖整段的论述方向。"],["32","To reveal the structure of the mounds, Soar's team begins by filling and covering their plaster of Paris, a chalky white paste based on the mineral gypsum, which becomes rock-solid when dry. The researcher then carves the plaster of Paris into half-millimetre thick slices, and photographs them sequentially. Once the pictures are digitally scanned, computer technology is able to recreate complex three-dimensional images of the mounds. These models have enabled the team to map termite architecture at a level of detail never before attained.","你的选择：i；文档提供的答案：i","i · methods used to investigate termite mound formation","研究方法：石膏填充、切片、顺序摄影、三维重建。 判断关键：标题要覆盖整段的论述方向。"],["33","Soar hopes that the models will explain how termite mounds create a self-regulating living environment which manages to respond to changing internal and external conditions without drawing on any outside source of power. If they do, the findings could be invaluable in informing future architectural design, and could inspire buildings that are self-sufficient, environmentally friendly, and cheap to run. “As we approach a world of climate change and temperatures rise,” he explains, “there will not be enough fuel to drive air conditioners around the world.” It is hoped, says Soar, “that the findings will provide clues that aid the ultimate development of new kinds of human habitats, suitable for a variety of arid, hostile environments not only on the earth but maybe one day on the moon and beyond.”","你的选择：vi；文档提供的答案：vi","vi · some potential benefits of understanding termite architecture","潜在应用：为未来节能建筑与极端环境住所提供启发。 判断关键：标题要覆盖整段的论述方向。"]]}}};</script><script>'use strict';
const DATA=window.REVIEW_DATA,CFG=window.REVIEW_CONFIG,ROOT=CFG.root,MODES={reading:'文章精读',dictation:'听写与拼写',vocabulary:'重点词汇库',collocations:'搭配造句'};
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const audio=(s,label='朗读英文')=>`<button type="button" class="speaker" data-say="${encodeURIComponent(s)}" aria-label="${esc(label)}" title="${esc(label)}"><svg class="audio-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>`;
const title={termite:'Termite Mounds'};
const route=(key,mode)=>`#${key}/${mode}`;
let voices=[],lastSpoken='';function loadVoices(){voices=window.speechSynthesis?.getVoices()||[];let el=$('#voice');if(!el)return;const chosen=el.value;el.innerHTML='<option value="">自动选择英式声音</option>'+voices.filter(v=>/^en/i.test(v.lang)).map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('');if(chosen)el.value=chosen;}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',5000);}
function speak(t){if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){toast('当前浏览器不支持朗读，请用 Chrome、Edge 或 Safari 打开。');return;}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t==='wind'?'to wind':t);u.lang='en-GB';u.rate=Number($('#rate')?.value||.9);const chosen=$('#voice')?.value;u.voice=voices.find(v=>v.name===chosen)||voices.find(v=>v.lang==='en-GB')||voices.find(v=>/^en/.test(v.lang))||null;u.onstart=()=>{$('#speechStatus').textContent='正在朗读';};u.onend=()=>{$('#speechStatus').textContent='';};u.onerror=e=>{if(e.error==='canceled'||e.error==='interrupted')return;$('#speechStatus').textContent='';toast('朗读未成功，请选择一个英语声音后重试，并检查设备音量。');};lastSpoken=t;window.speechSynthesis.speak(u);}
function readLocal(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback;}catch{return fallback;}}
function saveLocal(key,data){try{localStorage.setItem(key,JSON.stringify(data));}catch{toast('当前浏览器无法保存本机记录；本次练习仍可继续。');}}
function shell(){document.body.innerHTML=`<header><div class="header-row"><div><h1>${CFG.article?esc(title[CFG.article]):'雅思阅读复习库'}</h1><p>2026 年 9 月 30 日 · 三篇阅读 · 英式音标</p></div><div class="top-controls"><label for="articleSelect">文章</label><select id="articleSelect"><option value="">三篇总览</option>${Object.entries(title).map(([k,t])=>`<option value="${k}" ${k===CFG.article?'selected':''}>${esc(t)}</option>`).join('')}</select><label for="rate">语速</label><select id="rate"><option value="0.75">0.75 倍</option><option selected value="0.9">0.9 倍</option><option value="1">1 倍</option><option value="1.1">1.1 倍</option></select><select id="voice" aria-label="英语朗读声音"></select><button id="stopAudio" type="button">停止朗读</button><span class="status" id="speechStatus" role="status" style="color:#d5e0f2"></span></div></div></header><div class="sitewrap"><div class="breadcrumb"><a href="#overview">复习库</a> / <a href="#overview">2026-09-30</a>${CFG.article?' / '+esc(title[CFG.article])+' / '+MODES[CFG.view]:''}</div>${CFG.article?`<nav class="nav" aria-label="练习模块">${Object.entries(MODES).map(([m,n])=>`<a href="${route(CFG.article,m)}" ${CFG.view===m?'class="active" aria-current="page"':''}>${n}</a>`).join('')}</nav>`:''}<div id="content"></div><div class="footer">原文与题目答案来自你上传的 Word 文档。E、F 段疑似转录问题已在逐句解析中标注。<svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg>为学习优先级评估，并非雅思官方分级。朗读使用设备上的英语语音；英式声音可用时优先使用英音。造句草稿与复习记录仅保存在当前浏览器。</div></div><div id="toast" role="status"></div>`;$('#articleSelect').onchange=e=>{location.href=e.target.value?route(e.target.value,CFG.view||'reading'):'#overview';};$('#stopAudio').onclick=()=>{window.speechSynthesis?.cancel();$('#speechStatus').textContent='';};if('speechSynthesis' in window){loadVoices();window.speechSynthesis.addEventListener('voiceschanged',loadVoices);}document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)speak(decodeURIComponent(b.dataset.say));});}
function highlight(s,words,collocations){const terms=[...words.map(w=>w.word),...collocations.map(c=>c.term)].sort((a,b)=>b.length-a.length);const ranges=[];for(const t of terms){const rx=new RegExp('\\b'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','gi');let m;while((m=rx.exec(s))){if(!ranges.some(r=>m.index<r[1]&&m.index+t.length>r[0]))ranges.push([m.index,m.index+t.length]);}}ranges.sort((a,b)=>a[0]-b[0]);let html='',pos=0;for(const [a,b]of ranges){html+=esc(s.slice(pos,a))+'<mark>'+esc(s.slice(a,b))+'</mark>';pos=b;}return html+esc(s.slice(pos));}
function hub(){const cards=Object.entries(DATA).map(([k,a],i)=>`<article class="hub-card"><div class="number">0${i+1}</div><h2>${esc(a.name)}</h2><p class="small">${Object.keys(a.paragraphs).length} 段 · ${Object.values(a.paragraphs).reduce((n,p)=>n+p.sentences.length,0)} 句 · ${a.practice.length} 组搭配练习</p><p>${esc(a.extras.intro)}</p>${Object.entries(MODES).map(([m,n])=>`<a href="${route(k,m)}">${n}</a>`).join('')}</article>`).join('');$('#content').innerHTML=`<div class="panel"><h2 style="margin:0 0 8px">选择今天要复习的文章</h2><p style="margin:0">先看一个段落，再练五个词或一组搭配。每篇文章都有独立地址，可以直接收藏对应模块。</p></div><div class="hub-grid">${cards}</div>`;}
function readArticle(a){$('#content').innerHTML=`<div class="layout"><aside class="sidebar"><h2>段落定位</h2><div class="paragraph-nav">${Object.keys(a.paragraphs).map(k=>`<a href="#paragraph-${k}">${k}</a>`).join('')}</div><p>红色为词汇或搭配重点。点击小喇叭朗读，展开词义查看常见义和熟词生义。</p><p>${esc(a.extras.priority)}</p></aside><main><details class="panel"><summary>文章结构与复习重点</summary><p>${esc(a.extras.logic)}</p>${a.extras.structure.map(([p,t,x])=>`<p><strong>${esc(p)} ${esc(t)}</strong> ${esc(x)}</p>`).join('')}</details>${Object.entries(a.paragraphs).map(([letter,p])=>`<article class="article" id="paragraph-${letter}"><h2><span class="badge">${letter}</span>Paragraph ${letter}</h2><p class="summary"><strong>段落大意</strong> ${esc(p.summary)}</p>${p.sentences.map(s=>`<section class="sentence"><div class="sentence-id">${s.id}</div><div class="en-row"><div class="english">${highlight(s.en,s.words,s.collocations)}</div>${audio(s.en,'朗读 '+s.id+' 原句')}</div><div class="chinese"><strong>本句中文释义</strong><br>${esc(s.zh)}</div><div class="label">本句重点词汇</div>${s.words.map(w=>`<div class="word-line"><strong>${esc(w.word)}</strong> ${audio(w.word,'朗读词汇 '+w.word)} <span class="ipa">${esc(w.ipa)}</span> <span class="stars" aria-label="复习优先级${w.stars}星">${'<svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg>'.repeat(w.stars)}</span><div>${esc(w.meaning)}</div><details class="word-details"><summary>常见义 雅思学习义 熟词生义</summary><p><b>常见核心义</b> ${esc(w.common)}</p><p><b>雅思学习重点义</b> ${esc(w.ielts)}</p><p><b>熟词生义或辨析</b> ${esc(w.extended)}</p></details></div>`).join('')}<div class="label">本句重点搭配</div>${s.collocations.map(c=>`<div class="word-line"><strong>${esc(c.term)}</strong> ${audio(c.term,'朗读搭配 '+c.term)}<div>${esc(c.zh)}</div></div>`).join('')}<div class="label">本句理解难点</div><div class="note">${esc(s.note)}</div></section>`).join('')}</article>`).join('')}<details class="panel"><summary>听说读写迁移</summary>${a.extras.skills.map(([m,t,x])=>`<h3>${m} ${esc(t)}</h3><p>${esc(x)}</p>`).join('')}</details>${a.extras.errors?`<details class="panel"><summary>段落标题匹配 · 我的答案与文档答案</summary>${a.extras.errors.map(([n,en,zh,ans,why])=>`<h3>${n} ${ans}</h3><div class="en-row"><div>${esc(en)}</div>${audio(en)}</div><p>${esc(zh)}</p><p>${esc(why)}</p>`).join('')}</details>`:''}</main></div>`;}
function deck(a){const map=new Map();for(const [para,p]of Object.entries(a.paragraphs))for(const s of p.sentences)for(const w of s.words){const id=w.word+'|'+w.meaning;if(!map.has(id))map.set(id,{...w,id,para,sentence:s.id,en:s.en,zh:s.zh});}return [...map.values()];}
function paraOptions(a){return '<option value="ALL">全部段落</option>'+Object.keys(a.paragraphs).map(p=>`<option value="${p}">${p} 段</option>`).join('');}
function wordBank(a){const all=deck(a);$('#content').innerHTML=`<div class="panel"><h2 style="margin:0 0 10px">重点词汇库</h2><p class="small"><svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg> 基础识别 · <svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg><svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg> 主题认读 · <svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg><svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg><svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg> 常用积累 · <svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg><svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg><svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg><svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg> 重点掌握 · <svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg><svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg><svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg><svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg><svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg> 优先用于阅读识别与听说写迁移。等级考虑本文作用和跨话题迁移价值，不代表官方词频。</p><div class="filters"><input type="search" id="wordSearch" placeholder="搜索英文词汇或中文释义" aria-label="搜索英文词汇或中文释义"><select id="bankPara" aria-label="按段落筛选">${paraOptions(a)}</select><select id="bankStar" aria-label="按复习优先级筛选"><option value="0">全部星级</option>${[5,4,3,2,1].map(n=>`<option value="${n}">${n} 星</option>`).join('')}</select></div><div id="wordCount" class="small" role="status"></div></div><div id="wordGrid" class="word-grid"></div>`;function render(){const q=$('#wordSearch').value.trim().toLowerCase(),p=$('#bankPara').value,n=+$('#bankStar').value;const arr=all.filter(w=>(p==='ALL'||w.para===p)&&(!n||w.stars===n)&&(!q||[w.word,w.meaning,w.common,w.ielts,w.extended].some(s=>s.toLowerCase().includes(q))));$('#wordCount').textContent=`显示 ${arr.length} 条，共 ${all.length} 条语境词义`;$('#wordGrid').innerHTML=arr.length?arr.map(w=>`<article class="word-card"><div class="word-title"><strong>${esc(w.word)}</strong>${audio(w.word)}</div><p class="ipa">${esc(w.ipa)}</p><p class="stars">${'<svg class="star-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 6 7 .9-5.1 5 1.2 7-6.1-3.3L5.9 21l1.2-7L2 8.9 9 8z" fill="#f5bf3f" stroke="#b57a10" stroke-width="1"/></svg>'.repeat(w.stars)}</p><p><b>本句义</b> ${esc(w.meaning)}</p><p class="small">${w.sentence} · ${esc(w.common)}</p><details class="word-details"><summary>其他词义与原句</summary><p>雅思学习义：${esc(w.ielts)}</p><p>熟词生义或辨析：${esc(w.extended)}</p><div class="en-row"><div>${esc(w.en)}</div>${audio(w.en)}</div><p>${esc(w.zh)}</p></details></article>`).join(''):'<div class="panel empty">没有匹配词汇，试试其他关键词或取消筛选。</div>';}$ ('#wordSearch').oninput=render;$('#bankPara').onchange=render;$('#bankStar').onchange=render;render();}
const normalise=s=>s.toLowerCase().trim().replace(/[’']/g,"'").replace(/\s+/g,' ').replace(/[.,!?;:]+$/,'');
function dictation(a){const all=deck(a),key='ielts-review-v1-'+a.slug+'-quiz';let record=readLocal(key,{good:[],weak:[]}),current=null,answered=false,correct=false,queue=[];$('#content').innerHTML=`<div class="panel quiz-panel"><h2 style="margin-top:0">词汇听写与拼写</h2><div class="filters"><label>模式 <select id="quizMode"><option value="listen">听英文 写英文和中文</option><option value="meaning">看中文 写英文</option></select></label><select id="quizPara" aria-label="题目段落">${paraOptions(a)}</select><select id="quizPool" aria-label="题目范围"><option value="all">全部词汇</option><option value="priority">四星与五星</option><option value="weak">需复习词汇</option></select></div><div id="quizStats" class="small"></div><div id="quizPrompt" class="quiz-prompt"></div><form id="quizForm" class="quiz-form"><div><label for="answerEn">英文单词或短语</label><input id="answerEn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入英文拼写"></div><div id="cnField"><label for="answerZh">本句中文释义</label><input id="answerZh" autocomplete="off" placeholder="用自己的话写核心意思"></div><div class="actions"><button class="primary" id="checkQuiz" type="submit">核对答案</button><button id="replayQuiz" type="button"><svg class="audio-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> 再听一次</button><button id="nextQuiz" type="button">下一题</button></div></form><div id="quizFeedback" aria-live="polite"></div></div>`;function pool(){return all.filter(w=>($('#quizPara').value==='ALL'||w.para===$('#quizPara').value)&&($('#quizPool').value!=='priority'||w.stars>=4)&&($('#quizPool').value!=='weak'||record.weak.includes(w.id)));}function stats(){$('#quizStats').textContent=`当前范围 ${pool().length} 条 · 已掌握 ${record.good.length} 条 · 需复习 ${record.weak.length} 条（当前浏览器）`;}function next(reset=false){if(reset)queue=[];if(!queue.length)queue=pool().sort(()=>Math.random()-.5);current=queue.shift()||null;answered=false;$('#quizFeedback').innerHTML='';$('#answerEn').value='';$('#answerZh').value='';const listen=$('#quizMode').value==='listen';$('#cnField').hidden=!listen;$('#replayQuiz').hidden=!listen;$('#checkQuiz').disabled=!current;$('#nextQuiz').disabled=!current;$('#replayQuiz').disabled=!current;$('#answerEn').disabled=!current;$('#answerZh').disabled=!current;stats();if(!current){$('#quizPrompt').innerHTML='<p>当前范围没有词汇。请选择其他段落或题目范围。</p>';return;}$('#quizPrompt').innerHTML=listen?'<button type="button" class="listen-big" id="playPrompt" aria-label="播放当前词汇"><svg class="audio-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><h2>听英文，写拼写与中文意思</h2><p class="small">点击播放。核对前不展示英文、音标或中文提示。</p>':`<h2>${esc(current.meaning)}</h2><p class="small">根据本篇语境写英文词汇 · 来源 ${current.sentence}</p>`;if(listen)$('#playPrompt').onclick=()=>speak(current.word);$('#answerEn').focus();}function grade(ok){record.good=record.good.filter(x=>x!==current.id);record.weak=record.weak.filter(x=>x!==current.id);record[ok?'good':'weak'].push(current.id);saveLocal(key,record);stats();toast(ok?'已记为掌握':'已加入需复习');}$('#quizForm').onsubmit=e=>{e.preventDefault();if(!current)return;if(answered){next();return;}if(!$('#answerEn').value.trim()){toast('先写一个英文答案，再核对。');return;}answered=true;correct=normalise($('#answerEn').value)===normalise(current.word)||((current.word==='revitalise')&&normalise($('#answerEn').value)==='revitalize')||((current.word==='specialization')&&normalise($('#answerEn').value)==='specialisation');$('#quizFeedback').innerHTML=`<div class="feedback"><b class="${correct?'correct':'incorrect'}">${correct?'英文拼写正确':'英文拼写需要修改'}</b><div class="word-title"><strong>${esc(current.word)}</strong>${audio(current.word)}</div><p class="ipa">${esc(current.ipa)}</p><p><b>本句中文义</b> ${esc(current.meaning)}</p>${$('#quizMode').value==='listen'?`<p class="small">你的中文：${esc($('#answerZh').value||'未填写')}。中文允许同义表达，请对照核心意思自评。</p>`:''}<div class="en-row small"><div>${esc(current.en)}</div>${audio(current.en)}</div><div class="actions"><button id="quizGood" type="button">拼写与释义已掌握</button><button id="quizWeak" type="button">需复习</button></div></div>`;$('#quizGood').onclick=()=>grade(correct);$('#quizWeak').onclick=()=>grade(false);if(!correct)grade(false);};$('#nextQuiz').onclick=()=>next();$('#replayQuiz').onclick=()=>current&&speak(current.word);for(const id of ['quizMode','quizPara','quizPool'])$('#'+id).onchange=()=>next(true);next();}
function collocations(a){const key='ielts-review-v1-'+a.slug+'-writing';let drafts=readLocal(key,{}),index=0;$('#content').innerHTML=`<div class="panel"><h2 style="margin:0 0 10px">重要搭配造句练习</h2><div class="filters"><label for="practiceSelect">选择搭配</label><select id="practiceSelect">${a.practice.map((c,i)=>`<option value="${i}">${i+1}. ${esc(c.term)} · ${esc(c.zh)}</option>`).join('')}</select></div><p class="small">每组先看句型与原文，再写三个不同场景的句子。参考答案可展开；你的草稿只保存在当前浏览器。</p><div id="practiceStats" class="small" role="status"></div></div><div id="practiceBody"></div>`;function render(){const c=a.practice[index];$('#practiceSelect').value=index;$('#practiceBody').innerHTML=`<article class="practice-card"><div class="practice-heading"><h2>${esc(c.term)}</h2>${audio(c.term)}</div><p>${esc(c.zh)}</p><div class="label">句型模板</div><div class="template">${esc(c.template)}</div><div class="label">怎么用</div><p>${esc(c.use)}</p><div class="example"><div class="label">原文句子 ${c.source.id}${c.derived?' · 本搭配由原句提炼或迁移':''}</div><div class="en-row"><div class="english">${esc(c.source.en)}</div>${audio(c.source.en)}</div><p>${esc(c.source.zh)}</p></div><div class="example"><div class="label">参考例句</div><div class="en-row"><div>${esc(c.example.en)}</div>${audio(c.example.en)}</div><p>${esc(c.example.zh)}</p></div>${c.tasks.map((t,n)=>`<section class="task"><h3>造句 ${n+1} ${esc(t.prompt)}</h3><label class="small" for="draft-${n}">我的英文句子</label><textarea id="draft-${n}" data-draft="${n}" placeholder="使用 ${esc(c.term)} 造句">${esc(drafts[index+'-'+n]||'')}</textarea><div class="actions"><button type="button" data-read-draft="${n}"><svg class="audio-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><path d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg> 听我的句子</button></div><details><summary>查看例句与中文释义</summary><div class="en-row"><div>${esc(t.en)}</div>${audio(t.en)}</div><p>${esc(t.zh)}</p></details></section>`).join('')}<div class="actions"><button id="prevPractice" type="button" ${index===0?'disabled':''}>上一组</button><button id="nextPractice" type="button" ${index===a.practice.length-1?'disabled':''}>下一组</button></div></article>`;for(const el of document.querySelectorAll('[data-draft]'))el.oninput=()=>{drafts[index+'-'+el.dataset.draft]=el.value;saveLocal(key,drafts);stats();};for(const b of document.querySelectorAll('[data-read-draft]'))b.onclick=()=>{const t=$('#draft-'+b.dataset.readDraft).value.trim();if(t)speak(t);else toast('先写一句英文，再点击朗读。');};$('#prevPractice').onclick=()=>{index--;render();};$('#nextPractice').onclick=()=>{index++;render();};stats();}function stats(){$('#practiceStats').textContent=`第 ${index+1} / ${a.practice.length} 组 · 已写 ${Object.values(drafts).filter(x=>x.trim()).length} / ${a.practice.length*3} 句（本机草稿）`;}$('#practiceSelect').onchange=e=>{index=+e.target.value;render();};render();}
shell();if(!CFG.article)hub();else{const a=DATA[CFG.article];({reading:readArticle,dictation,vocabulary:wordBank,collocations})[CFG.view](a);}
