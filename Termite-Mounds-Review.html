environmentally friendly, and cheap to run.", "zh": "如果模型能做到这一点，研究成果将对未来建筑设计提供极其宝贵的参考，并启发人们建造自给自足、环境友好且运行成本低的建筑。", "sourceId": "G2"}], "para": "G"}, {"id": "termite-1d9a10b8aa21", "term": "habitat", "type": "word", "ipa": "ˈhæbɪtæt", "pos": "n. 名词", "stars": 2, "zh": "栖息地，住所", "contextSenses": [0], "legacyId": "habitat|栖息地，住所", "note": "常见义：栖息地，住所；学习用法：重点识别本文语境中的含义，并结合原句复习。；辨析：短语整体理解；判断标题时需结合整段，而非只看这一词。", "examples": [{"en": "It is hoped, says Soar, “that the findings will provide clues that aid the ultimate development of new kinds of human habitats, suitable for a variety of arid, hostile environments not only on the earth but maybe one day on the moon and beyond.”", "zh": "Soar 表示，希望这些成果提供线索，帮助最终开发适用于各种干旱、恶劣环境的新型人类住所——不仅在地球上，也许有一天还在月球及更远的地方。", "sourceId": "G4"}], "para": "G"}, {"id": "termite-a9e6d570b326", "term": "arid", "type": "word", "ipa": "ˈærɪd", "pos": "adj. 形容词", "stars": 3, "zh": "干旱的", "contextSenses": [0], "legacyId": "arid|干旱的", "note": "常见义：干旱的；学习用法：重点识别本文语境中的含义，并结合原句复习。；辨析：短语整体理解；判断标题时需结合整段，而非只看这一词。", "examples": [{"en": "It is hoped, says Soar, “that the findings will provide clues that aid the ultimate development of new kinds of human habitats, suitable for a variety of arid, hostile environments not only on the earth but maybe one day on the moon and beyond.”", "zh": "Soar 表示，希望这些成果提供线索，帮助最终开发适用于各种干旱、恶劣环境的新型人类住所——不仅在地球上，也许有一天还在月球及更远的地方。", "sourceId": "G4"}], "para": "G"}, {"id": "termite-38be6ce80a6e", "term": "hostile", "type": "word", "ipa": "ˈhɒstaɪl", "pos": "adj. 形容词", "stars": 3, "zh": "恶劣的", "contextSenses": [0], "legacyId": "hostile|恶劣的，也可指敌对的", "note": "常见义：恶劣的，也可指敌对的；学习用法：重点识别本文语境中的含义，并结合原句复习。；辨析：短语整体理解；判断标题时需结合整段，而非只看这一词。", "examples": [{"en": "It is hoped, says Soar, “that the findings will provide clues that aid the ultimate development of new kinds of human habitats, suitable for a variety of arid, hostile environments not only on the earth but maybe one day on the moon and beyond.”", "zh": "Soar 表示，希望这些成果提供线索，帮助最终开发适用于各种干旱、恶劣环境的新型人类住所——不仅在地球上，也许有一天还在月球及更远的地方。", "sourceId": "G4"}], "para": "G"}, {"id": "termite-c5d8b07ca4bc", "term": "aid", "type": "word", "ipa": "eɪd", "pos": "v. 动词", "stars": 2, "zh": "帮助", "contextSenses": [0], "legacyId": "aid|帮助", "note": "常见义：帮助；学习用法：重点识别本文语境中的含义，并结合原句复习。；辨析：短语整体理解；判断标题时需结合整段，而非只看这一词。", "examples": [{"en": "It is hoped, says Soar, “that the findings will provide clues that aid the ultimate development of new kinds of human habitats, suitable for a variety of arid, hostile environments not only on the earth but maybe one day on the moon and beyond.”", "zh": "Soar 表示，希望这些成果提供线索，帮助最终开发适用于各种干旱、恶劣环境的新型人类住所——不仅在地球上，也许有一天还在月球及更远的地方。", "sourceId": "G4"}], "para": "G"}, {"id": "termite-f119da6cbd29", "term": "beyond", "type": "word", "ipa": "bɪˈjɒnd", "pos": "prep. 介词", "stars": 2, "zh": "在更远处", "contextSenses": [0], "legacyId": "beyond|在更远处", "note": "常见义：在更远处；学习用法：重点识别本文语境中的含义，并结合原句复习。；辨析：短语整体理解；判断标题时需结合整段，而非只看这一词。", "examples": [{"en": "It is hoped, says Soar, “that the findings will provide clues that aid the ultimate development of new kinds of human habitats, suitable for a variety of arid, hostile environments not only on the earth but maybe one day on the moon and beyond.”", "zh": "Soar 表示，希望这些成果提供线索，帮助最终开发适用于各种干旱、恶劣环境的新型人类住所——不仅在地球上，也许有一天还在月球及更远的地方。", "sourceId": "G4"}], "para": "G"}], "sentences": [{"id": "termite-A1", "sourceId": "A1", "en": "To most of us, termites are destructive insects which can cause damage on a devastating scale.", "zh": "对我们大多数人而言，白蚁是破坏性昆虫，能够造成极其严重的损害。", "para": "A", "note": "which 引导定语从句，修饰 insects；on a devastating scale 强调破坏程度。"}, {"id": "termite-A2", "sourceId": "A2", "en": "But according to Dr Rupert Soar of Loughborough University's School of Mechanical and Manufacturing Engineering, these pests may serve a useful purpose for us after all.", "zh": "但据拉夫堡大学机械与制造工程学院的 Rupert Soar 博士介绍，这些害虫终究可能对我们有用。", "para": "A", "note": "But 是转折信号，决定本段由“贬”转向“重新评价”；according to 引出观点来源，after all 表示终究。"}, {"id": "termite-A3", "sourceId": "A3", "en": "His multidisciplinary team of British and American engineers and biologists has set out to investigate the giant mounds built by termites in Namibia, in sub-Saharan Africa, as part of the most extensive study of these structures ever taken.", "zh": "他的团队由英国和美国的工程师、生物学家组成，已开始调查撒哈拉以南非洲纳米比亚的巨大白蚁丘；这是迄今对白蚁丘结构最广泛的研究的一部分。", "para": "A", "note": "主干 His multidisciplinary team has set out to investigate…；built by termites 是后置定语；as part of… 说明研究定位。"}, {"id": "termite-B1", "sourceId": "B1", "en": "Termite mounds are impressive for their size alone; typically they are three metres high, and some as tall as eight metres have been found.", "zh": "仅就体量而言，白蚁丘便令人惊叹：通常高三米，还发现过高达八米的白蚁丘。", "para": "B", "note": "分号连接两个相关分句；for their size alone 明确本段中心是体量。as tall as eight metres 表示高达八米。"}, {"id": "termite-B2", "sourceId": "B2", "en": "They also reach far into the earth, where the insects 'mine' their building materials, carefully selecting each grain of sand they use.", "zh": "它们还深入地下，白蚁在那里“开采”建筑材料，仔细选择使用的每一粒沙。", "para": "B", "note": "where 指地下地点；selecting… 是伴随动作。mine 在此为开采，不能译为“我的”。"}, {"id": "termite-B3", "sourceId": "B3", "en": "The termite's nest is contained in the central cavity of the mound, safely protected from the harsh environment outside.", "zh": "白蚁的巢位于蚁丘中央的空腔中，受到安全保护，免遭外界恶劣环境影响。", "para": "B", "note": "主干 The termite’s nest is contained…；safely protected… 补充说明受到保护的状态。"}, {"id": "termite-B4", "sourceId": "B4", "en": "The mound itself is formed of an intricate lattice of tunnels, which split into smaller and smaller tunnels, much like a person's blood vessels.", "zh": "蚁丘本身由错综复杂的隧道网构成；这些隧道不断分成更细小的隧道，就像人体的血管。", "para": "B", "note": "which 指 tunnels；split into 表示分成；much like 引出血管类比。结构细节服务于对建筑规模与复杂性的描写。"}, {"id": "termite-C1", "sourceId": "C1", "en": "This complex system of tunnels draws in air from the outside, capturing wind energy to drive it through the mound.", "zh": "这一复杂隧道系统从外界吸入空气，利用风能推动空气穿过蚁丘。", "para": "C", "note": "主干 system draws in air；capturing… 表示伴随的利用方式；drive it 中 it 指 air。"}, {"id": "termite-C2", "sourceId": "C2", "en": "It also serves to expel spent respiratory gases from the nest to prevent the termites from suffocating, so ensuring them a continuous provision of fresh, breathable air.", "zh": "它还把巢中呼吸产生的废气排出，以防白蚁窒息，从而持续为它们提供新鲜、可呼吸的空气。", "para": "C", "note": "serves to 表示功能；to prevent… 表目的；so ensuring… 表结果。连续动作共同支持“通风功能”。"}, {"id": "termite-C3", "sourceId": "C3", "en": "So detailed is the design that the nest stays within three degrees of a constant temperature, despite variations on the outside of up to 50 °C, from blistering heat in the daytime to below freezing on the coldest nights.", "zh": "这一设计如此精细，即使外界温差高达50摄氏度——白天酷热，最冷的夜晚低于冰点——巢内温度也只在某一恒定温度附近三度的范围内变化。", "para": "C", "note": "So + 形容词 + be + 主语 + that… 是倒装，正常语序为 The design is so detailed that…；despite 引出对比。"}, {"id": "termite-C4", "sourceId": "C4", "en": "The mound also automatically regulates moisture in the air, by means of both its underground 'cellar', and evaporation from the top of the mound.", "zh": "蚁丘还通过地下“地窖”和顶部的蒸发作用，自动调节空气中的水分。", "para": "C", "note": "by means of 后接调湿手段；both…and… 并列地下空间与顶部蒸发。"}, {"id": "termite-C5", "sourceId": "C5", "en": "Some colonies even had 'chimneys' at a height of 20 m to control moisture loss in the hottest regions of sub-Saharan Africa.", "zh": "在撒哈拉以南非洲最炎热的地区，有些白蚁群甚至拥有高达20米的“烟囱”，以控制水分流失。", "para": "C", "note": "chimneys 是引号中的形象说法。高度只是调湿功能的例子，不应因此把整段选为“体量”。"}, {"id": "termite-D1", "sourceId": "D1", "en": "Furthermore, the termites have evolved in such a way as to outsource some of their biological functions.", "zh": "此外，白蚁通过进化，以把部分生物功能“外包”的方式生存。", "para": "D", "note": "Furthermore 表示补充；in such a way as to… 表示以某种方式达到某结果。outsource 把人类商业概念用于生物功能。"}, {"id": "termite-D2", "sourceId": "D2", "en": "Part of their digestive process is carried out by a fungus, which they 'farm' inside the mound.", "zh": "部分消化过程由它们在蚁丘内部“种植”的一种真菌完成。", "para": "D", "note": "is carried out 是被动结构；which 指 fungus；farm 在此是动词，表示培育或种植。"}, {"id": "termite-D3", "sourceId": "D3", "en": "This fungus, which is found nowhere else on earth, thrives in the constant and optimum environment of the mound.", "zh": "这种在地球其他地方找不到的真菌，在蚁丘恒定且最适宜的环境中茁壮生长。", "para": "D", "note": "which 引导非限制性定语从句；thrives 是主句谓语；constant and optimum 并列修饰 environment。"}, {"id": "termite-D4", "sourceId": "D4", "en": "The termites feed the fungus with slightly chewed wood pulp, which the fungus then breaks down into a digestible sugary food to provide the insects with energy, and cellulose which they use for building.", "zh": "白蚁给真菌喂食稍经咀嚼的木浆；真菌随后将其分解成可消化的含糖食物，为白蚁供能，并产生供它们建造使用的纤维素。", "para": "D", "note": "第一处 which 指 fungus；后面的 which they use for building 修饰 cellulose。抓住“白蚁供木浆→真菌分解→白蚁获得资源”的双向关系。"}, {"id": "termite-D5", "sourceId": "D5", "en": "And, although the termites must generate waste, none ever leaves the structure, indicating that there is also some kind of internal waste-recycling system.", "zh": "尽管白蚁必然产生废物，却从未有废物离开这一结构，说明内部还存在某种废物回收系统。", "para": "D", "note": "although 表让步；none 指废物；indicating that… 表推断。这一末句补充循环系统，不取代整段互利共生的核心。"}, {"id": "termite-E1", "sourceId": "E1", "en": "Scientists are so excited by the mounds that they have labelled them a 'super organism' because, in Soar's words, “They dance on the edge of what we would perceive to be cool or, if you're too cold, you need to thrive: that's called homeostasis.”", "zh": "科学家对白蚁丘如此兴奋，以至于把它们称作“超级生物体”。其后引语存在疑似转录缺失，不能可靠地逐字翻译；这一段的明确主题是内稳态。", "para": "E", "note": "so…that… 表程度及结果。上传引语不完整，勿把有问题的文字作为句型范本；标题判断可依靠末句 redefine…living organism。"}, {"id": "termite-E2", "sourceId": "E2", "en": "What the termites have done is to move homeostatic function away from their body, into the structure in which they live.", "zh": "白蚁所做的，是把维持内稳态的功能从自身身体转移到它们居住的建筑结构中。", "para": "E", "note": "What the termites have done 是主语从句；is to move… 为表语；in which they live 修饰 structure。"}, {"id": "termite-E3", "sourceId": "E3", "en": "“As more information comes to light about the unique features of termite mounds, we may ultimately need to redefine our understanding of what constitutes a 'living' organism.”", "zh": "随着白蚁丘独特特征的更多信息被发现，我们最终可能需要重新界定：究竟什么构成一个“活的”生物体。", "para": "E", "note": "As 在此表示随着；come to light 表示被发现；what constitutes… 为宾语从句。may 保留可能性，并非已经重新定义。"}, {"id": "termite-F1", "sourceId": "F1", "en": "To reveal the structure of the mounds, Soar's team begins by filling and covering their plaster of Paris, a chalky white paste based on the mineral gypsum, which becomes rock-solid when dry.", "zh": "为揭示蚁丘结构，Soar 的团队首先用巴黎石膏进行填充和覆盖；这是一种以石膏矿物为基础的白色粉状糊料，干燥后会变得坚硬如石。原句 filling and covering their plaster of Paris 疑似缺失成分，此处按上下文解释研究步骤。", "para": "F", "note": "To reveal… 表目的。上传句的填充对象与介词疑似缺失；a chalky white paste… 是对 plaster of Paris 的说明。"}, {"id": "termite-F2", "sourceId": "F2", "en": "The researcher then carves the plaster of Paris into half-millimetre thick slices, and photographs them sequentially.", "zh": "研究人员随后把石膏切成半毫米厚的薄片，并按顺序拍照。", "para": "F", "note": "then 和 sequentially 表明操作顺序；half-millimetre thick 表示半毫米厚，勿误读成半米。"}, {"id": "termite-F3", "sourceId": "F3", "en": "Once the pictures are digitally scanned, computer technology is able to recreate complex three-dimensional images of the mounds.", "zh": "图片经过数字扫描后，计算机技术能够重建蚁丘复杂的三维图像。", "para": "F", "note": "Once 引导时间条件；recreate 表示重建；three-dimensional 为三维。"}, {"id": "termite-F4", "sourceId": "F4", "en": "These models have enabled the team to map termite architecture at a level of detail never before attained.", "zh": "这些模型让团队能够以前所未有的精细程度绘制白蚁建筑的结构。", "para": "F", "note": "enable sb to do sth 表示使某人能够做；never before attained 修饰 level of detail。"}, {"id": "termite-G1", "sourceId": "G1", "en": "Soar hopes that the models will explain how termite mounds create a self-regulating living environment which manages to respond to changing internal and external conditions without drawing on any outside source of power.", "zh": "Soar 希望这些模型能解释：白蚁丘如何创造一种自我调节的生活环境，在不借助任何外部能源的情况下，应对内外条件变化。", "para": "G", "note": "主干 Soar hopes that…；how 引导解释内容；which 修饰 environment；without drawing on… 表示不依赖外部能源。"}, {"id": "termite-G2", "sourceId": "G2", "en": "If they do, the findings could be invaluable in informing future architectural design, and could inspire buildings that are self-sufficient, environmentally friendly, and cheap to run.", "zh": "如果模型能做到这一点，研究成果将对未来建筑设计提供极其宝贵的参考，并启发人们建造自给自足、环境友好且运行成本低的建筑。", "para": "G", "note": "If they do 中 they 指 models，do 代替前句 explain…；could 表可能性；inform 在此为给设计提供依据。"}, {"id": "termite-G3", "sourceId": "G3", "en": "“As we approach a world of climate change and temperatures rise,” he explains, “there will not be enough fuel to drive air conditioners around the world.”", "zh": "他解释说，随着气候变化、温度上升，我们将没有足够的燃料来驱动世界各地的空调。", "para": "G", "note": "As 表随着；not enough…to… 表示不足以；引号内部由 he explains 插入。"}, {"id": "termite-G4", "sourceId": "G4", "en": "It is hoped, says Soar, “that the findings will provide clues that aid the ultimate development of new kinds of human habitats, suitable for a variety of arid, hostile environments not only on the earth but maybe one day on the moon and beyond.”", "zh": "Soar 表示，希望这些成果提供线索，帮助最终开发适用于各种干旱、恶劣环境的新型人类住所——不仅在地球上，也许有一天还在月球及更远的地方。", "para": "G", "note": "It is hoped…that… 为被动表达；that aid… 修饰 clues；suitable for… 修饰 habitats；not only…but… 延伸应用范围。"}], "examples": [{"en": "Public libraries serve a useful purpose by providing free learning spaces.", "zh": "公共图书馆通过提供免费学习空间发挥有用作用。", "added": true}, {"en": "Public libraries serve a useful purpose by providing free learning spaces.", "zh": "公共图书馆通过提供免费学习空间发挥有用作用。", "added": true}, {"en": "Public libraries serve a useful purpose by providing free learning spaces.", "zh": "参考结构同上。此例句展示搭配结构，请换成自己的学习情境。", "added": true}, {"en": "But according to Dr Rupert Soar of Loughborough University's School of Mechanical and Manufacturing Engineering, these pests may serve a useful purpose for us after all.", "zh": "但据拉夫堡大学机械与制造工程学院的 Rupert Soar 博士介绍，这些害虫终究可能对我们有用。", "added": true}, {"en": "The class is split into three groups.", "zh": "全班被分成三组。", "added": true}, {"en": "The class is split into three groups.", "zh": "全班被分成三组。", "added": true}, {"en": "The class is split into three groups.", "zh": "参考结构同上。此例句展示搭配结构，请换成自己的学习情境。", "added": true}, {"en": "The mound itself is formed of an intricate lattice of tunnels, which split into smaller and smaller tunnels, much like a person's blood vessels.", "zh": "蚁丘本身由错综复杂的隧道网构成；这些隧道不断分成更细小的隧道，就像人体的血管。", "added": true}, {"en": "The building regulates temperature by means of natural ventilation.", "zh": "这栋建筑通过自然通风调节温度。", "added": true}, {"en": "The building regulates temperature by means of natural ventilation.", "zh": "这栋建筑通过自然通风调节温度。", "added": true}, {"en": "The building regulates temperature by means of natural ventilation.", "zh": "参考结构同上。此例句展示搭配结构，请换成自己的学习情境。", "added": true}, {"en": "The mound also automatically regulates moisture in the air, by means of both its underground 'cellar', and evaporation from the top of the mound.", "zh": "蚁丘还通过地下“地窖”和顶部的蒸发作用，自动调节空气中的水分。", "added": true}, {"en": "The body breaks down food into nutrients.", "zh": "身体把食物分解成营养物质。", "added": true}, {"en": "The body breaks down food into nutrients.", "zh": "身体把食物分解成营养物质。", "added": true}, {"en": "The body breaks down food into nutrients.", "zh": "参考结构同上。此例句展示搭配结构，请换成自己的学习情境。", "added": true}, {"en": "The termites feed the fungus with slightly chewed wood pulp, which the fungus then breaks down into a digestible sugary food to provide the insects with energy, and cellulose which they use for building.", "zh": "白蚁给真菌喂食稍经咀嚼的木浆；真菌随后将其分解成可消化的含糖食物，为白蚁供能，并产生供它们建造使用的纤维素。", "added": true}, {"en": "New evidence came to light during the investigation.", "zh": "调查期间发现了新证据。", "added": true}, {"en": "New evidence came to light during the investigation.", "zh": "调查期间发现了新证据。", "added": true}, {"en": "New evidence came to light during the investigation.", "zh": "参考结构同上。此例句展示搭配结构，请换成自己的学习情境。", "added": true}, {"en": "“As more information comes to light about the unique features of termite mounds, we may ultimately need to redefine our understanding of what constitutes a 'living' organism.”", "zh": "随着白蚁丘独特特征的更多信息被发现，我们最终可能需要重新界定：究竟什么构成一个“活的”生物体。", "added": true}, {"en": "Digital tools enable students to review lessons anywhere.", "zh": "数字工具使学生能够在任何地点复习。", "added": true}, {"en": "Digital tools enable students to review lessons anywhere.", "zh": "数字工具使学生能够在任何地点复习。", "added": true}, {"en": "Digital tools enable students to review lessons anywhere.", "zh": "参考结构同上。此例句展示搭配结构，请换成自己的学习情境。", "added": true}, {"en": "These models have enabled the team to map termite architecture at a level of detail never before attained.", "zh": "这些模型让团队能够以前所未有的精细程度绘制白蚁建筑的结构。", "added": true}, {"en": "The system responds to changes in temperature.", "zh": "这个系统对温度变化作出反应。", "added": true}, {"en": "The system responds to changes in temperature.", "zh": "这个系统对温度变化作出反应。", "added": true}, {"en": "The system responds to changes in temperature.", "zh": "参考结构同上。此例句展示搭配结构，请换成自己的学习情境。", "added": true}, {"en": "Soar hopes that the models will explain how termite mounds create a self-regulating living environment which manages to respond to changing internal and external conditions without drawing on any outside source of power.", "zh": "Soar 希望这些模型能解释：白蚁丘如何创造一种自我调节的生活环境，在不借助任何外部能源的情况下，应对内外条件变化。", "added": true}]}};
const MODES=['cards','dictation','meaning','sentences','library','settings'];
const routeParts=location.hash.slice(1).split("/");
let articleKey=Object.hasOwn(COLLECTIONS,routeParts[0])?routeParts[0]:readLocal("ielts-reading-termite-v2-article","termite");
if(!COLLECTIONS[articleKey])articleKey="termite";
let DATA=COLLECTIONS[articleKey];
let initialView=MODES.includes(routeParts[1])?routeParts[1]:MODES.includes(routeParts[0])?routeParts[0]:routeParts.includes("vocabulary")||routeParts.includes("collocations")?"library":routeParts.includes("reading")||location.hash.startsWith("#paragraph-")?"sentences":"cards";
const KEY="ielts-reading-termite-v2",SETTINGKEY=KEY+'-settings';
const LABELS={new:'未学',1:'不认识',2:'模糊',3:'认识',4:'熟练'};
const $=id=>document.getElementById(id),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readLocal(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}}
let state=readLocal(KEY,{}),settings={voice:'',rate:0.9,daily:20,engine:'device',...readLocal(SETTINGKEY,{})};
let view=initialView,kind='all',scope='due',queue=[],current=null,revealed=false,voices=[],sessionCount=0,answerEN='',answerZH='',meaningOK=false,search='',statusFilter='all',starFilter='all';
const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 8q5 4 0 8M19 5q8 7 0 14"/></svg>';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{toast('保存失败：浏览器存储不可用，请导出备份。');return false}}
function saveSettings(){try{localStorage.setItem(SETTINGKEY,JSON.stringify(settings))}catch{toast('设置未保存：浏览器存储不可用。')}}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,4500)}
function rec(x){return state[x.id]||{level:0,due:0,reps:0}}
function eligible(x,now=Date.now()){let r=rec(x);return r.level!==4&&(!r.level||r.due<=now)}
function dayKey(){return new Date().toLocaleDateString('en-CA')}
function todayNew(){return Object.values(state).filter(r=>r.startedDay===dayKey()).length}
function matchesStudyFilters(x){return (kind==='all'||x.type===kind)&&(starFilter==='all'||String(x.stars)===starFilter)}
function candidates(){let all=DATA.items.filter(x=>matchesStudyFilters(x)&&rec(x).level!==4);if(scope==='all')return all.sort((a,b)=>(rec(a).level||1)-(rec(b).level||1));let due=all.filter(x=>rec(x).level&&eligible(x)).sort((a,b)=>rec(a).due-rec(b).due);let fresh=all.filter(x=>!rec(x).level).slice(0,Math.max(0,settings.daily-todayNew()));return [...due,...fresh]}
function buildQueue(){queue=candidates().map(x=>x.id);next()}
function next(){const id=queue.shift();current=DATA.items.find(x=>x.id===id)||null;revealed=false;answerEN='';answerZH='';meaningOK=false;render()}
function navigate(v){view=v;location.hash=articleKey+'/'+v;if(['cards','dictation','meaning'].includes(v))buildQueue();else render()}
function renderStats(){const counts={4:0,2:0,3:0,1:0};DATA.items.forEach(x=>{let l=rec(x).level;if(l)counts[l]++});let due=DATA.items.filter(x=>rec(x).level&&eligible(x)).length;let fresh=DATA.items.filter(x=>!rec(x).level).length;$('stats').innerHTML=`<div class="stat"><b>${due}</b><span>到期复习</span></div><div class="stat"><b>${fresh}</b><span>尚未学习</span></div><div class="stat"><b>${counts[1]+counts[2]+counts[3]}</b><span>正在巩固</span></div><div class="stat"><b>${counts[4]}</b><span>已经熟练</span></div>`;$('progress').style.width=(counts[4]/DATA.items.length*100)+'%';$('progress-label').textContent=`${counts[4]} / ${DATA.items.length}`}
function starSelect(){return `<select id="star-filter" aria-label="按五星难度筛选学习"><option value="all">学习难度 · 全部星级</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${'★'.repeat(n)}${'☆'.repeat(5-n)} · 只学 ${n} 星</option>`).join('')}</select>`}
function contextMeaningHtml(x){let selected=x.contextSenses||[0];return x.zh.split('；').map((sense,i)=>selected.includes(i)?`<span class="context-meaning">${escapeHTML(sense)}<span class="context-badge">本文义</span></span>`:escapeHTML(sense)).join('；')}
function filterControls(){return `<div class="controls"><select id="kind" aria-label="词条类型"><option value="all">全部 · 单词与短语</option><option value="word">只练单词</option><option value="phrase">只练短语</option></select>${starSelect()}<select id="scope" aria-label="练习范围"><option value="due">按计划 · 到期＋新词</option><option value="all">提前练习 · 当前筛选内未熟练词</option></select></div><p class="study-filter-note">${starFilter==='all'?'全部星级':'仅练 '+starFilter+' 星'} · ${DATA.items.filter(x=>matchesStudyFilters(x)&&rec(x).level!==4).length} 条未熟练。可叠加单词／短语筛选；红色释义为本文义。</p>`}
function playButton(text,label='朗读',small=false){return `<button class="speaker${small?' small':''}" data-say="${escapeHTML(text)}" aria-label="${escapeHTML(label)}">${icon}<span>${label}</span></button>`}
function norm(s){return s.normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:…“”"()\[\]]/g,'').replace(/\s+/g,' ').trim()}
function spellingCorrect(){return current&&[current.term,...(current.acceptedSpellings||[])].some(t=>norm(answerEN)===norm(t))}
function reveal(){if(view==='dictation')answerEN=$('en-answer').value;if(view!=='cards')answerZH=$('zh-answer').value;revealed=true;render()}
function grade(level){if(!current||!revealed)return;if(view!=='cards'&&level>=3&&(!meaningOK||(view==='dictation'&&!spellingCorrect()))){toast('请先核对拼写，并确认中文意思基本正确。');return}const old=rec(current),now=Date.now(),reps=(old.reps||0)+1;let interval=level===1?60000:level===2?600000:level===3?[1,3,7,14,30][Math.min(old.level===3?(old.streak||0):0,4)]*86400000:0;state[current.id]={...old,level,reps,due:level===4?null:now+interval,streak:level===3?(old.level===3?(old.streak||0)+1:1):0,startedDay:old.startedDay||dayKey(),updated:now};save();sessionCount++;next()}
function training(){let intro={cards:'先回忆，再揭晓。每一次主动回忆，都在加深记忆。',dictation:'先听英文，再写拼写和中文意思。答案在核对前保持隐藏。',meaning:'看到英文，主动写出中文意思，再对照自评。'};let html=filterControls();if(!current){let selected=DATA.items.filter(matchesStudyFilters);let future=selected.filter(x=>rec(x).level&&rec(x).level!==4&&rec(x).due>Date.now()).sort((a,b)=>rec(a).due-rec(b).due)[0];let complete=selected.length>0&&selected.every(x=>rec(x).level===4);html+=`<section class="card empty"><div class="big">${complete?'✓':'◌'}</div><h2>${complete?'当前筛选内的词，你已经掌握了！':!selected.length?'当前筛选没有词条':'当前筛选的学习计划已完成'}</h2><p class="muted">本轮已完成 ${sessionCount} 次。${future?'下一次复习：'+escapeHTML(new Date(rec(future).due).toLocaleString()):'可以在全部词库查看学习情况。'}</p><p class="small muted">${complete?'熟练词不会自动出现，可在词库改回其他等级。':'不认识的 1 分钟后、模糊的 10 分钟后回来；认识的按天复习。新词每天默认 20 个。'}</p><button id="refresh" class="primary">检查到期复习</button> <button id="early">提前练习当前星级</button></section>`;return html}
let x=current,r=rec(x);html+=`<p class="small muted">${intro[view]}</p><section class="card"><div class="cardtop"><span class="tag">${x.type==='word'?'WORD · 单词':'PHRASE · 短语'} / ${LABELS[r.level]||'未学'}</span><span class="counter">本轮已完成 ${sessionCount} · 待练 ${queue.length+1}</span></div><div class="center">`;
if(view==='dictation'&&!revealed){html+=`<div class="term">Listen & recall</div><p class="muted small">点击小喇叭，听清后填写答案</p><button id="listen" class="speaker">${icon} 播放英文</button> <button id="slow" class="speaker small">慢速再听</button>`}else html+=`<div class="term">${escapeHTML(x.term)}</div>${wordMeta(x)}${playButton(x.term,'播放读音')}`;
if(view!=='cards'&&!revealed)html+=`<div class="practice-input">${view==='dictation'?'<label>英文单词或短语<input id="en-answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入你听到的英文"></label>':''}<label>中文释义<textarea id="zh-answer" placeholder="写出你理解的中文意思"></textarea></label></div>`;
if(!revealed)html+=`<p style="margin-top:25px"><button id="reveal" class="primary">${view==='cards'?'揭晓释义':'核对答案'}</button></p>`;
else{html+=`<div class="meaning">${contextMeaningHtml(x)}</div>`;if(x.note&&x.note!==x.term)html+=`<p class="small muted">词义与辨析：${escapeHTML(x.note)}</p>`;
if(view!=='cards'){html+=`<div class="answer">${view==='dictation'?`<p class="${spellingCorrect()?'ok':'warning'}">${spellingCorrect()?'✓ 英文拼写正确':'请再记一次：'+escapeHTML(x.term)}</p><p>你的英文：${escapeHTML(answerEN)||'（未填写）'}</p>`:''}<p>你的中文：${escapeHTML(answerZH)||'（未填写）'}</p><label><input id="meaning-ok" type="checkbox" ${meaningOK?'checked':''}> 我已对照，中文意思基本正确</label><p class="small muted">中文接受同义表达，由你自评；英文忽略大小写、标点和多余空格。</p></div>`}
if(x.examples.length){html+=`<div class="example">${x.examples.slice(0,3).map(e=>`<p>${escapeHTML(e.en)}</p><p class="small muted">${escapeHTML(e.zh)}</p>${playButton(e.en,e.added?'补充例句朗读':'例句朗读',true)}`).join('<div style="height:15px"></div>')}</div>`}}
if(revealed)html+=memoryHtml(x);html+='</div>';
if(revealed){let gated=view!=='cards'&&(!meaningOK||(view==='dictation'&&!spellingCorrect()));html+=`<div class="grades">${[[1,'不认识','1 分钟后'],[2,'模糊','10 分钟后'],[3,'认识','1 / 3 / 7 / 14 / 30 天'],[4,'熟练','退出自动复习']].map(([n,l,t])=>`<button data-grade="${n}" ${gated&&n>=3?'disabled':''}><b>${l}</b><small>${t}</small></button>`).join('')}</div><p class="hint">根据回忆表现选择等级。只有你主动标记“熟练”，才会退出自动复习。</p>`}
return html+'</section><div class="bottom"><span>间隔复习 · 优先复习到期词</span><button id="skip">暂时跳过</button></div>'}
function formatIPA(s){return s.split('；').map(p=>{let m=p.match(/^([^（]+)(.*)$/);return '/'+escapeHTML(m?m[1]:p)+'/'+escapeHTML(m?m[2]:'')}).join('；')}
function wordMeta(x){return `<div class="word-meta">${x.pos?`<span class="pos">${escapeHTML(x.pos)}</span>`:""}${x.ipa?`<span class="ipa" lang="en-GB">${formatIPA(x.ipa)}</span>`:''}<span class="stars" role="img" aria-label="学习难度 ${x.stars} 星，共 5 星" title="学习难度 ${x.stars}/5">${'★'.repeat(x.stars)}${'☆'.repeat(5-x.stars)} <span class="star-label">难度 ${x.stars}/5</span></span></div>`}
function memoryHtml(x){if(!x.memory)return '';let m=x.memory;return `<section class="memory-panel" aria-label="${escapeHTML(x.term)}的词根记忆法"><h3>词根与构词记忆 <span class="memory-label">${escapeHTML(m.method)}</span></h3><p><b>拆分／来源：</b>${escapeHTML(m.parts)}</p><p><b>这样记：</b>${escapeHTML(m.tip)}</p><p class="memory-family"><b>一起记：</b>${escapeHTML(m.family)}</p>${m.source?`<a href="${escapeHTML(m.source)}" target="_blank" rel="noopener noreferrer">查看词源参考 · Etymonline</a>`:''}</section>`}
function library(){let rows=DATA.items.filter(x=>(kind==='all'||kind===x.type)&&(statusFilter==='all'||String(rec(x).level||'new')===statusFilter)&&(starFilter==='all'||String(x.stars)===starFilter)&&(x.term+' '+x.zh+' '+(x.ipa||'')+' '+(x.pos||'')).toLowerCase().includes(search.trim().toLowerCase()));return `<label class="library-search" for="search">搜索全部词库</label><div class="controls"><input id="search" type="search" aria-label="搜索词库" placeholder="输入英文、中文或音标，例如：energy / 能量 / 动词" value="${escapeHTML(search)}"><select id="kind"><option value="all">全部类型</option><option value="word">单词</option><option value="phrase">短语</option></select><select id="status-filter"><option value="all">所有熟练程度</option>${Object.entries(LABELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="star-filter" aria-label="按五星难度筛选"><option value="all">所有难度等级</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${"★".repeat(n)} · ${n} 星</option>`).join('')}</select></div><p class="search-help">支持英文、中文、音标实时搜索，可叠加词条类型、熟练程度与星级筛选。</p><p class="small muted">共 ${rows.length} 条。可手动调整等级；熟练词也会保留在这里供查阅。</p><section class="card">${rows.map(x=>`<article class="list-item"><div class="listhead"><b>${escapeHTML(x.term)}</b>${playButton(x.term,'读音',true)}</div>${wordMeta(x)}<p>${contextMeaningHtml(x)}</p>${x.note?`<p class="small muted">${escapeHTML(x.note)}</p>`:""}${memoryHtml(x)}<select data-level-id="${x.id}" aria-label="${escapeHTML(x.term)}的熟练程度">${Object.entries(LABELS).map(([k,v])=>`<option value="${k}" ${(rec(x).level||'new')==k?'selected':''}>${v}</option>`).join('')}</select>${x.examples.length?`<details><summary>查看例句</summary>${x.examples.map(e=>`<p>${escapeHTML(e.en)}</p><p class="muted small">${escapeHTML(e.zh)}</p>${playButton(e.en,e.added?'补充例句朗读':'例句朗读',true)}`).join('')}</details>`:''}</article>`).join('')||'<p>没有匹配的词条。</p>'}</section>`}
function sentences(){return `<p class="muted">${DATA.sentences.length} 个原文句子 · ${DATA.examples.length} 个文档学习例句。先听，再展开中文。</p><div class="controls"><input id="sentence-search" placeholder="搜索原文或例句" aria-label="搜索句子" value="${escapeHTML(search)}"><select id="sentence-type"><option value="original">原文句子</option><option value="examples">文档学习例句</option></select></div><section class="card" id="sentence-list"></section>`}
let sentenceType='original';
function sentenceList(){if(!$('sentence-list'))return;let rows=(sentenceType==='original'?DATA.sentences:DATA.examples).filter(x=>(x.en+x.zh).toLowerCase().includes(search.toLowerCase()));$('sentence-list').innerHTML=rows.map((x,i)=>`<article class="list-item"><span class="tag">${String(i+1).padStart(2,'0')}</span><p style="font-size:18px">${escapeHTML(x.en)}</p>${playButton(x.en,'朗读整句',true)}<details><summary>查看中文</summary><p>${escapeHTML(x.zh)}</p></details></article>`).join('')||'<p>没有匹配的句子。</p>'}
function settingsPage(){return `<section class="card settings"><h2>让学习适合你</h2><details><summary>五星难度、音标与词性说明</summary><p class="small muted">1 星：基础词；2 星：日常常用词；3 星：雅思阅读常见词；4 星：进阶词；5 星：专业或生僻词。在翻卡复习、听写训练、看词写义中均可按星级选择学习范围。星级是本词库的学习难度建议，并非官方考试等级，与“熟练、认识、模糊、不认识”的个人掌握情况分开记录。</p><p class="small muted">全部收录的单词和短语附词性与英式常用音标。词性按本词库收录的常用义项标注；n. 名词，v. 动词，adj. 形容词，adv. 副词，prep. 介词，conj. 连词，det. 限定词，pron. 代词。全部四星、五星单词配有词根、构词或借词联想记忆；借词和无可靠拆分的词会明确说明，联想不等同于真实词源。多词词条采用常用组合读法。星级是学习难度建议；个人熟练度另行记录。wind 在过山车篇为“缠绕”，读 /waɪnd/；record 在鸟类篇作动词，重音在后。听写时不显示音标，核对答案后才显示。</p></details><label>英语朗读音色<select id="voice-select"></select></label><p class="small muted">优先推荐 Natural、Neural、Premium 等自然音色。可用音色由浏览器和系统提供；没有自然音色时，请在设备的语音设置中添加英语增强语音。</p><label>语速 <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="${settings.rate}"><span id="rate-label">${settings.rate} ×</span></label><label>发音来源<select id="engine"><option value="device">设备英语语音 · 单词、短语、句子</option><option value="dictionary">在线词典发音 · 词条优先，失败转设备语音</option></select></label><p class="small muted">在线词典发音需要联网，会把所读词条发送给有道词典。句子始终使用所选设备音色。</p><div>${playButton('Reading in context helps us understand words.','试听所选音色')}</div><label>每天新词数量<input id="daily" type="number" min="1" max="100" value="${settings.daily}"></label><details open><summary>复习规则</summary><div class="rules"><p>不认识：1 分钟后再出现。模糊：10 分钟后再出现。认识：连续选择后，间隔按 1、3、7、14、30 天增加；再次选模糊或不认识会重置这个连续间隔。</p><p>熟练：退出所有自动复习和提前练习；可在全部词库中重新调整等级。新词每天默认 20 个，到期词不受新词上限限制。网页关闭后不弹通知，下次打开会列出到期词。</p><p>“提前练习”允许在到期前复习所有未熟练词。练习结果需要选择等级才会保存。</p></div></details><div><h2>进度备份</h2><p class="muted small">记录只保存在当前浏览器，不会自动同步到 GitHub 或其他设备。换设备前先导出。</p><div class="row"><button id="export">导出进度</button><label><span class="sr">导入进度文件</span><input id="import" type="file" accept="application/json,.json"></label></div></div><p class="small muted">词库：${DATA.items.filter(x=>x.type==='word').length} 个单词与词汇条目、${DATA.items.filter(x=>x.type==='phrase').length} 组短语。模板中的省略号不参与拼写；部分语法模板已改为可听写的具体表达，可在答案处查看文档形式。</p></section>`}
function saveLocal(key,data){try{localStorage.setItem(key,JSON.stringify(data))}catch{toast('浏览器未能保存记录，请及时导出备份。')}}
function selectArticle(key,newView='cards'){if(!COLLECTIONS[key])return;stopSound();articleKey=key;DATA=COLLECTIONS[key];saveLocal(KEY+'-article',key);$('article-select').value=key;search='';statusFilter='all';queue=[];current=null;navigate(MODES.includes(newView)?newView:'cards')}
function syncRoute(){let h=location.hash.slice(1).split('/'),k=COLLECTIONS[h[0]]?h[0]:articleKey,raw=h[1]||h[0],v=MODES.includes(raw)?raw:({vocabulary:'library',reading:'sentences',collocations:'library',overview:'cards'}[raw]);if(!v)return;if(k!==articleKey||v!==view)selectArticle(k,v)}
function migrateLegacyQuiz(){if(readLocal(KEY+'-legacy-migrated',false))return;let n=0;for(const d of Object.values(COLLECTIONS)){const old=readLocal('ielts-review-v1-'+d.slug+'-quiz',{}),good=new Set(Array.isArray(old.good)?old.good:[]),weak=new Set(Array.isArray(old.weak)?old.weak:[]);for(const x of d.items){if(!x.legacyId||state[x.id])continue;let level=good.has(x.legacyId)?4:weak.has(x.legacyId)?1:0;if(level){state[x.id]={level,reps:1,streak:0,due:level===4?null:Date.now(),startedDay:'legacy',updated:Date.now()};n++}}}if(n)save();saveLocal(KEY+'-legacy-migrated',true)}
document.addEventListener('change',e=>{if(e.target.id==='article-select')selectArticle(e.target.value,view)});

function render(){renderStats();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('article-select').value=articleKey;$('subtitle').textContent={cards:DATA.title+' / 翻卡复习',dictation:DATA.title+' / 听英文，写英文与中文',meaning:DATA.title+' / 看英文，写中文释义',sentences:'在句子里，听懂每一个词。',library:DATA.title+' / 全部词库',settings:'学习偏好与进度管理'}[view];$('app').innerHTML=['cards','dictation','meaning'].includes(view)?training():view==='library'?library():view==='sentences'?sentences():settingsPage();
if($('kind')){$('kind').value=kind;$('kind').onchange=e=>{kind=e.target.value;if(view==='library')render();else buildQueue()}}if($('scope')){$('scope').value=scope;$('scope').onchange=e=>{scope=e.target.value;buildQueue()}}
if($('reveal'))$('reveal').onclick=reveal;if($('listen'))$('listen').onclick=()=>speak(current.term,true);if($('slow'))$('slow').onclick=()=>speak(current.term,true,0.65);if($('meaning-ok'))$('meaning-ok').onchange=e=>{meaningOK=e.target.checked;render()};if($('skip'))$('skip').onclick=()=>{next()};if($('refresh'))$('refresh').onclick=buildQueue;if($('early'))$('early').onclick=()=>{scope='all';buildQueue()};
if($('star-filter')){$('star-filter').value=starFilter;$('star-filter').onchange=e=>{starFilter=e.target.value;if(['cards','dictation','meaning'].includes(view))buildQueue();else render()}}if($('search'))$('search').oninput=e=>{let pos=e.target.selectionStart;search=e.target.value;render();$('search').focus();$('search').setSelectionRange(pos,pos)};if($('status-filter')){$('status-filter').value=statusFilter;$('status-filter').onchange=e=>{statusFilter=e.target.value;render()}}
if(view==='sentences'){$('sentence-type').value=sentenceType;$('sentence-type').onchange=e=>{sentenceType=e.target.value;sentenceList()};$('sentence-search').oninput=e=>{search=e.target.value;sentenceList()};sentenceList()}
if(view==='settings'){voiceOptions();$('engine').value=settings.engine;$('engine').onchange=e=>{settings.engine=e.target.value;saveSettings()};$('voice-select').onchange=e=>{settings.voice=e.target.value;saveSettings();voiceStatus()};$('rate').oninput=e=>{settings.rate=Number(e.target.value);$('rate-label').textContent=settings.rate+' ×';saveSettings()};$('daily').onchange=e=>{settings.daily=Math.max(1,Math.min(100,parseInt(e.target.value)||20));e.target.value=settings.daily;saveSettings()};$('export').onclick=exportData;$('import').onchange=importData}}
document.addEventListener('click',e=>{let v=e.target.closest('[data-view]');if(v){stopSound();search='';navigate(v.dataset.view)}let p=e.target.closest('[data-say]');if(p)speak(p.dataset.say,DATA.items.some(x=>x.term===p.dataset.say));let g=e.target.closest('[data-grade]');if(g)grade(Number(g.dataset.grade))});
document.addEventListener('change',e=>{let id=e.target.dataset.levelId;if(!id)return;let level=e.target.value;if(level==='new')delete state[id];else{let old=state[id]||{};state[id]={...old,level:Number(level),due:level==='4'?null:Date.now(),streak:0,reps:old.reps||0,startedDay:old.startedDay||dayKey(),updated:Date.now()}}save();renderStats()});
let audio=null,soundToken=0;
function stopSound(){soundToken++;if(audio){audio.pause();audio=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
function voiceScore(v){return (/natural|neural|premium|enhanced/i.test(v.name)?100:0)+(!v.localService?30:0)+(/^en-GB/i.test(v.lang)?10:0)+(/Google|Microsoft|Samantha|Daniel|Serena/i.test(v.name)?5:0)}
function selectedVoice(){return voices.find(v=>v.voiceURI===settings.voice)||voices[0]}
function loadVoices(){voices=('speechSynthesis'in window?speechSynthesis.getVoices():[]).filter(v=>/^en(?:-|_)/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));voiceStatus();if(view==='settings')voiceOptions()}
function voiceStatus(){let v=selectedVoice();$('voice-status').textContent=v?'英语音色 · '+v.name:('speechSynthesis'in window?'未检测到英语音色，请查看学习设置':'此浏览器不支持设备朗读，请尝试在线词典发音或其他浏览器')}
function voiceOptions(){if(!$('voice-select'))return;$('voice-select').innerHTML='<option value="">自动选择 · 优先自然英语音色</option>'+voices.map(v=>`<option value="${escapeHTML(v.voiceURI)}">${escapeHTML(v.name)} · ${escapeHTML(v.lang)}</option>`).join('');$('voice-select').value=settings.voice}
function deviceSpeech(text,rate,token){if(token!==soundToken)return;if(!('speechSynthesis'in window)){toast('此浏览器不支持语音朗读，请换用支持语音的浏览器。');return}loadVoices();let v=selectedVoice();if(!v){toast('未检测到英语音色，请在系统中添加英语语音后重试。');return}let u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=rate;u.pitch=1;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))toast('朗读未成功，请换一个英语音色。')};speechSynthesis.speak(u)}
function speak(text,isTerm=false,rate=settings.rate){stopSound();const token=soundToken;if(text==='wind'){text='to wind';isTerm=false}let spoken=text.replace(/\bA\b/g,'A').replace(/…/g,' ').replace(/[＋+]/g,' ');if(settings.engine==='dictionary'&&isTerm){audio=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(spoken)+'&type=1');audio.playbackRate=rate;let finished=false;const fallback=()=>{if(finished||token!==soundToken)return;finished=true;if(audio)audio.pause();toast('在线发音不可用，已切换设备音色。');deviceSpeech(spoken,rate,token)};const timer=setTimeout(fallback,7000);audio.onplaying=()=>{finished=true;clearTimeout(timer)};audio.onerror=fallback;audio.play().catch(fallback);return}deviceSpeech(spoken,rate,token)}
function exportData(){let blob=new Blob([JSON.stringify({app:KEY,version:1,exportedAt:new Date().toISOString(),state,settings},null,2)],{type:'application/json'});let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='Reading-Review-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.app!==KEY||d.version!==1||!d.state||typeof d.state!=='object'||Array.isArray(d.state))throw Error();let valid=new Set(Object.values(COLLECTIONS).flatMap(a=>a.items.map(x=>x.id))),incoming={};for(let [id,r]of Object.entries(d.state)){if(!valid.has(id))continue;if(!r||![1,2,3,4].includes(r.level)||!Number.isFinite(r.updated)||!Number.isFinite(r.reps)||r.reps<0||(r.level!==4&&!Number.isFinite(r.due)))throw Error();incoming[id]={level:r.level,due:r.level===4?null:r.due,reps:r.reps,updated:r.updated,streak:Number.isFinite(r.streak)?Math.max(0,r.streak):0,startedDay:typeof r.startedDay==='string'?r.startedDay:dayKey()}}for(let[id,r]of Object.entries(incoming))if(!state[id]||r.updated>=(state[id].updated||0))state[id]=r;save();render();toast('进度已导入：按最后更新时间合并，不覆盖较新的记录。')}catch{toast('导入失败：请选择本页面导出的有效进度文件。')}finally{if($('import'))$('import').value=''}}
window.addEventListener('hashchange',syncRoute);
$('article-select').value=articleKey;migrateLegacyQuiz();
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,1200)}else voiceStatus();
setInterval(()=>{renderStats();if(['cards','dictation','meaning'].includes(view)&&!current&&!document.querySelector('#en-answer')){let ids=candidates().map(x=>x.id);if(ids.length){queue=ids;next()}}},15000);
if(['cards','dictation','meaning'].includes(view))buildQueue();else render();
