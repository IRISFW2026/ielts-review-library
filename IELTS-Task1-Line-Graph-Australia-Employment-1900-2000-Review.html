clined continuously, while manufacturing and agriculture rose before falling.", "zh": "矿业的就业占比持续下降，而制造业和农业的就业占比则先上升，后下降。", "note": "while作对照；before后接falling，以省略重复主语。", "keywords": ["Mining", "continuously", "while", "rose before falling"], "role": "概述"}, {"id": "task1-s-A-4", "group": "A", "number": 4, "en": "In 1900, services employed 50% of workers, compared with about 7% in mining, the smallest of the four shares.", "zh": "1900年，服务业雇用了50%的劳动者，相比之下，矿业的就业占比约为7%，是四个行业中最低的。", "note": "compared with引出同年对比；后半省略重复的workers；the smallest of the four shares补充说明矿业份额最低。", "keywords": ["In 1900", "50%", "compared with", "7%", "smallest"], "role": "细节段"}, {"id": "task1-s-A-5", "group": "A", "number": 5, "en": "The figure for services reached 60% in 1940 and remained unchanged until 1960, before rising to 70% in 2000.", "zh": "服务业的就业占比在1940年达到60%，并保持不变直至1960年，随后在2000年升至70%。", "note": "两个过去时谓语共享主语；until表示持续到某时。", "keywords": ["figure for services", "60% in 1940", "unchanged until 1960", "70% in 2000"], "role": "细节段"}, {"id": "task1-s-A-6", "group": "A", "number": 6, "en": "By contrast, mining’s share fell to zero by the end of the century.", "zh": "相比之下，截至该世纪末，矿业的就业份额降至零。", "note": "by强调截至该时；share明确描述份额。", "keywords": ["By contrast", "mining’s share", "zero", "end of the century"], "role": "细节段"}, {"id": "task1-s-A-7", "group": "A", "number": 7, "en": "Manufacturing rose from about 18% in 1900 to a peak of roughly 28% in 1920, then declined to 10% in 2000.", "zh": "制造业的就业占比从1900年的约18%上升至1920年约28%的峰值，随后在2000年降至10%。", "note": "行业作主语是图表中的简洁转喻，指其就业占比；学习时也可写manufacturing’s share。", "keywords": ["Manufacturing", "18% in 1900", "peak of roughly 28%", "1920", "10% in 2000"], "role": "细节段"}, {"id": "task1-s-A-8", "group": "A", "number": 8, "en": "Similarly, agriculture increased from 10% to 15% between 1900 and 1940, before falling to around 8%.", "zh": "同样，农业的就业占比在1900年至1940年间从10%升至15%，之后降至约8%。", "note": "Similarly有真实依据：两业都先升后降，而不是仅为换连接词。", "keywords": ["Similarly", "agriculture", "10% to 15%", "1900 and 1940", "around 8%"], "role": "细节段"}, {"id": "task1-s-A-9", "group": "A", "number": 9, "en": "In the final year, manufacturing and agriculture had fairly similar shares, although both were far below the figure for services.", "zh": "在最后一年，制造业和农业的就业份额相当接近，尽管两者都远低于服务业的就业占比。", "note": "although引让步从句；both回指两行业；the figure for替代重复的share。", "keywords": ["final year", "manufacturing and agriculture", "fairly similar", "although", "far below"], "role": "细节段"}, {"id": "task1-s-platform-1", "group": "platform", "number": 1, "en": "The line graph illustrates the percentage of the Australian workforce employed in four different sectors—Services, Manufacturing, Agriculture, and Mining—over a century, from 1900 to 2000.", "zh": "该折线图展示了从1900年到2000年这一个世纪里，澳大利亚劳动力在四个不同行业——服务业、制造业、农业和矿业——就业的百分比。", "note": "破折号中列举四行业，是补充说明；workforce为集合名词，指劳动力总体。", "keywords": ["line graph", "illustrates", "percentage", "Australian workforce", "four different sectors", "century"], "role": "引言"}, {"id": "task1-s-platform-2", "group": "platform", "number": 2, "en": "Overall, the Services sector experienced a consistent upward trend, solidifying its position as the dominant employer.", "zh": "总体而言，服务业呈现持续一致的上升趋势，从而巩固了其作为主要就业吸纳行业的地位。", "note": "solidifying为分词短语，补充结果。原文consistent upward trend不够精确，建议The services sector increased overall and remained the largest throughout.", "keywords": ["Overall", "Services sector", "consistent upward trend", "solidifying", "dominant employer"], "role": "概述"}, {"id": "task1-s-platform-3", "group": "platform", "number": 3, "en": "Conversely, the Manufacturing, Agriculture, and Mining sectors all saw a general decline in their proportions of the workforce, with Mining dropping to zero by the end of the period.", "zh": "相反，制造业、农业和矿业在劳动力中所占的比例均总体下降，其中矿业的占比截至该时期末降至零。", "note": "saw意为经历；with + 名词 + doing说明伴随情况。general decline允许中途上升，不等于持续下降。", "keywords": ["Conversely", "three sectors", "general decline", "workforce", "with Mining dropping", "zero"], "role": "概述"}, {"id": "task1-s-platform-4", "group": "platform", "number": 4, "en": "In 1900, Services already accounted for the largest share at 50%.", "zh": "1900年，服务业就已经占据最大的就业份额，达到50%。", "note": "already强调期初已经领先；at 50%补数字。普通行业名在自己作文中用小写即可。", "keywords": ["In 1900", "Services", "already", "largest share", "50%"], "role": "细节段"}, {"id": "task1-s-platform-5", "group": "platform", "number": 5, "en": "This proportion rose steadily to 60% in 1940, before climbing further to reach a peak of 70% in 2000.", "zh": "这一比例稳步上升，在1940年达到60%，之后进一步攀升，在2000年达到70%的峰值。", "note": "This proportion承接前句；before + doing；to reach表结果。原句没有明确平台期，改写应补it remained at this level until 1960。", "keywords": ["This proportion", "steadily to 60%", "1940", "before climbing further", "peak of 70%", "2000"], "role": "细节段"}, {"id": "task1-s-platform-6", "group": "platform", "number": 6, "en": "In contrast, Manufacturing began at 18%, peaked at 28% in 1920, but then fell consistently to just 10% by 2000.", "zh": "相比之下，制造业的就业占比最初为18%，在1920年达到28%的峰值，但随后持续下降，截至2000年仅为10%。", "note": "三个过去时谓语顺序展开；but then体现转折；just暗示终值偏低，不必每句都用。", "keywords": ["In contrast", "Manufacturing", "18%", "28% in 1920", "consistently", "10% by 2000"], "role": "细节段"}, {"id": "task1-s-platform-7", "group": "platform", "number": 7, "en": "The Agriculture sector started at 10%, rose to a high of 15% in 1940, and subsequently declined to 8% in 2000.", "zh": "农业的就业占比最初为10%，在1940年升至15%的高点，随后在2000年降至8%。", "note": "并列的三个动词共用一个主语；subsequently表示随后，不表示因果。", "keywords": ["Agriculture sector", "10%", "high of 15%", "1940", "subsequently", "8% in 2000"], "role": "细节段"}, {"id": "task1-s-platform-8", "group": "platform", "number": 8, "en": "The Mining industry showed the most significant relative decrease, starting at 7% and falling continuously to reach 0% in the final year.", "zh": "矿业的就业占比出现了最显著的相对降幅，从最初的7%持续下降，最终在最后一年降至0%。", "note": "starting和falling是并列分词短语。relative是限定比较尺度的关键词，不能忽略；从7%到0%为7个百分点或100%相对降幅。", "keywords": ["Mining industry", "significant relative nt upward trend, solidifying its position as the dominant employer.", "zh": "总体而言，服务业呈现持续一致的上升趋势，从而巩固了其作为主要就业吸纳行业的地位。", "note": "solidifying为分词短语，补充结果。原文consistent upward trend不够精确，建议The services sector increased overall and remained the largest throughout.", "keywords": ["Overall", "Services sector", "consistent upward trend", "solidifying", "dominant employer"], "role": "概述"}, {"id": "task1-s-platform-3", "group": "platform", "number": 3, "en": "Conversely, the Manufacturing, Agriculture, and Mining sectors all saw a general decline in their proportions of the workforce, with Mining dropping to zero by the end of the period.", "zh": "相反，制造业、农业和矿业在劳动力中所占的比例均总体下降，其中矿业的占比截至该时期末降至零。", "note": "saw意为经历；with + 名词 + doing说明伴随情况。general decline允许中途上升，不等于持续下降。", "keywords": ["Conversely", "three sectors", "general decline", "workforce", "with Mining dropping", "zero"], "role": "概述"}, {"id": "task1-s-platform-4", "group": "platform", "number": 4, "en": "In 1900, Services already accounted for the largest share at 50%.", "zh": "1900年，服务业就已经占据最大的就业份额，达到50%。", "note": "already强调期初已经领先；at 50%补数字。普通行业名在自己作文中用小写即可。", "keywords": ["In 1900", "Services", "already", "largest share", "50%"], "role": "细节段"}, {"id": "task1-s-platform-5", "group": "platform", "number": 5, "en": "This proportion rose steadily to 60% in 1940, before climbing further to reach a peak of 70% in 2000.", "zh": "这一比例稳步上升，在1940年达到60%，之后进一步攀升，在2000年达到70%的峰值。", "note": "This proportion承接前句；before + doing；to reach表结果。原句没有明确平台期，改写应补it remained at this level until 1960。", "keywords": ["This proportion", "steadily to 60%", "1940", "before climbing further", "peak of 70%", "2000"], "role": "细节段"}, {"id": "task1-s-platform-6", "group": "platform", "number": 6, "en": "In contrast, Manufacturing began at 18%, peaked at 28% in 1920, but then fell consistently to just 10% by 2000.", "zh": "相比之下，制造业的就业占比最初为18%，在1920年达到28%的峰值，但随后持续下降，截至2000年仅为10%。", "note": "三个过去时谓语顺序展开；but then体现转折；just暗示终值偏低，不必每句都用。", "keywords": ["In contr function readLocal(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}}
let state=readLocal(KEY,{}),settings={voice:'',rate:0.9,daily:20,engine:'device',...readLocal(SETTINGKEY,{})};

function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{toast('保存失败：浏览器存储不可用，请导出备份。');return false}}
function saveSettings(){try{localStorage.setItem(SETTINGKEY,JSON.stringify(settings))}catch{toast('设置未保存：浏览器存储不可用。')}}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,4500)}
function rec(x){return state[x.id]||{level:0,due:0,reps:0}}
function eligible(x,now=Date.now()){let r=rec(x);return r.level!==4&&(!r.level||r.due<=now)}
function dayKey(){return new Date().toLocaleDateString('en-CA')}
function todayNew(){return DATA.items.filter(x=>state[x.id]?.startedDay===dayKey()).length}
function matchesStudyFilters(x){return (kind==='all'||x.type===kind)&&(starFilter==='all'||String(x.stars)===starFilter)}
function candidates(){let all=DATA.items.filter(x=>matchesStudyFilters(x)&&rec(x).level!==4);if(scope==='all')return all.sort((a,b)=>(rec(a).level||1)-(rec(b).level||1));let due=all.filter(x=>rec(x).level&&eligible(x)).sort((a,b)=>rec(a).due-rec(b).due);let fresh=all.filter(x=>!rec(x).level).slice(0,Math.max(0,settings.daily-todayNew()));return [...due,...fresh]}
function buildQueue(){queue=candidates().map(x=>x.id);next()}
function next(){const id=queue.shift();current=DATA.items.find(x=>x.id===id)||null;revealed=false;answerEN='';answerZH='';meaningOK=false;render()}
function navigate(v){view=v;location.hash=v;if(v==='recite')buildReciteQueue();else if(['cards','dictation','meaning'].includes(v))buildQueue();else render()}
function renderStats(){const pool=view==='recite'?DATA.models:DATA.items;const counts={4:0,2:0,3:0,1:0};pool.forEach(x=>{let l=rec(x).level;if(l)counts[l]++});let due=pool.filter(x=>rec(x).level&&eligible(x)).length;let fresh=pool.filter(x=>!rec(x).level).length;$('stats').innerHTML=`<div class="stat"><b>${due}</b><span>到期复习</span></div><div class="stat"><b>${fresh}</b><span>尚未学习</span></div><div class="stat"><b>${counts[1]+counts[2]+counts[3]}</b><span>正在巩固</span></div><div class="stat"><b>${counts[4]}</b><span>已经熟练</span></div>`;$('progress').style.width=(counts[4]/pool.length*100)+'%';$('progress-label').textContent=`${counts[4]} / ${pool.length}`}
function starSelect(){return `<select id="star-filter" aria-label="按五星难度筛选学习"><option value="all">学习难度 · 全部星级</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${'★'.repeat(n)}${'☆'.repeat(5-n)} · 只学 ${n} 星</option>`).join('')}</select>`}
function contextMeaningHtml(x){let selected=x.contextSenses||[0];return x.zh.split('；').map((sense,i)=>selected.includes(i)?`<span class="context-meaning">${escapeHTML(sense)}<span class="context-badge">本文义</span></span>`:escapeHTML(sense)).join('；')}

function norm(s){return s.normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:…“”"()\[\]]/g,'').replace(/\s+/g,' ').trim()}
function spellingCorrect(){return current&&norm(answerEN)===norm(current.term)}

function training(){let intro={cards:'先回忆，再揭晓。每一次主动回忆，都在加深记忆。',dictation:'先听英文，再写拼写和中文意思。答案在核对前保持隐藏。',meaning:'看到英文，主动写出中文意思，再对照自评。'};let html=filterControls();if(!current){let selected=DATA.items.filter(matchesStudyFilters);let future=selected.filter(x=>rec(x).level&&rec(x).level!==4&&rec(x).due>Date.now()).sort((a,b)=>rec(a).due-rec(b).due)[0];let complete=selected.length>0&&selected.every(x=>rec(x).level===4);html+=`<section class="card empty"><div class="big">${complete?'✓':'◌'}</div><h2>${complete?'当前筛选内的词，你已经掌握了！':!selected.length?'当前筛选没有词条':'当前筛选的学习计划已完成'}</h2><p class="muted">本轮已完成 ${sessionCount} 次。${future?'下一次复习：'+escapeHTML(new Date(rec(future).due).toLocaleString()):'可以在全部词库查看学习情况。'}</p><p class="small muted">${complete?'熟练词不会自动出现，可在词库改回其他等级。':'不认识的 1 分钟后、模糊的 10 分钟后回来；认识的按天复习。新词每天默认 20 个。'}</p><button id="refresh" class="primary">检查到期复习</button> <button id="early">提前练习当前星级</button></section>`;return html}

if(view!=='cards'&&!revealed)html+=`<div class="practice-input">${view==='dictation'?'<label>英文单词或短语<input id="en-answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入你听到的英文"></label>':''}<label>中文释义<textarea id="zh-answer" placeholder="写出你理解的中文意思"></textarea></label></div>`;

if(view!=='cards'){html+=`<div class="answer">${view==='dictation'?`<p class="${spellingCorrect()?'ok':'warning'}">${spellingCorrect()?'✓ 英文拼写正确':'请再记一次：'+escapeHTML(x.term)}</p><p>你的英文：${escapeHTML(answerEN)||'（未填写）'}</p>`:''}<p>你的中文：${escapeHTML(answerZH)||'（未填写）'}</p><label><input id="meaning-ok" type="checkbox" ${meaningOK?'checked':''}> 我已对照，中文意思基本正确</label><p class="small muted">中文接受同义表达，由你自评；英文忽略大小写、标点和多余空格。</p></div>`}

return html+'</section><div class="bottom"><span>间隔复习 · 优先复习到期词</span><button id="skip">暂时跳过</button></div>'}
function formatIPA(s){return s.split('；').map(p=>{let m=p.match(/^([^（]+)(.*)$/);return '/'+escapeHTML(m?m[1]:p)+'/'+escapeHTML(m?m[2]:'')}).join('；')}
function wordMeta(x){return `<div class="word-meta">${x.pos?`<span class="pos">${escapeHTML(x.pos)}</span>`:""}${x.ipa?`<span class="ipa" lang="en-GB">${formatIPA(x.ipa)}</span>`:''}<span class="stars" role="img" aria-label="学习难度 ${x.stars} 星，共 5 星" title="学习难度 ${x.stars}/5">${'★'.repeat(x.stars)}${'☆'.repeat(5-x.stars)} <span class="star-label">难度 ${x.stars}/5</span></span></div>`}
function memoryHtml(x){if(!x.memory)return '';let m=x.memory;return `<section class="memory-panel" aria-label="${escapeHTML(x.term)}的词根记忆法"><h3>词根与构词记忆 <span class="memory-label">${escapeHTML(m.method)}</span></h3><p><b>拆分／来源：</b>${escapeHTML(m.parts)}</p><p><b>这样记：</b>${escapeHTML(m.tip)}</p><p class="memory-family"><b>一起记：</b>${escapeHTML(m.family)}</p>${m.source?`<a href="${escapeHTML(m.source)}" target="_blank" rel="noopener noreferrer">查看词源参考 · Etymonline</a>`:''}</section>`}
function library(){let rows=DATA.items.filter(x=>(kind==='all'||kind===x.type)&&(statusFilter==='all'||String(rec(x).level||'new')===statusFilter)&&(starFilter==='all'||String(x.stars)===starFilter)&&(x.term+' '+x.zh+' '+(x.ipa||'')+' '+(x.pos||'')).toLowerCase().includes(search.trim().toLowerCase()));return `<label class="library-search" for="search">搜索全部词库</label><div class="controls"><input id="search" type="search" aria-label="搜索词库" placeholder="输入英文、中文或音标，例如：proportion / 比例 / 动词" value="${escapeHTML(search)}"><select id="kind"><option value="all">全部类型</option><option value="word">单词</option><option value="phrase">短语</option></select><select id="status-filter"><option value="all">所有熟练程度</option>${Object.entries(LABELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="star-filter" aria-label="按五星难度筛选"><option value="all">所有难度等级</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${"★".repeat(n)} · ${n} 星</option>`).join('')}</select></div><p class="search-help">支持英文、中文、音标实时搜索，可叠加词条类型、熟练程度与星级筛选。</p><p class="small muted">共 ${rows.length} 条。可手动调整等级；熟练词也会保留在这里供查阅。</p><section class="card">${rows.map(x=>`<article class="list-item"><div class="listhead"><b>${escapeHTML(x.term)}</b>${playButton(x.term,'读音',true)}</div>${wordMeta(x)}<p>${contextMeaningHtml(x)}</p>${memoryHtml(x)}<select data-level-id="${x.id}" aria-label="${escapeHTML(x.term)}的熟练程度">${Object.entries(LABELS).map(([k,v])=>`<option value="${k}" ${(rec(x).level||'new')==k?'selected':''}>${v}</option>`).join('')}</select>${x.examples.length?`<details><summary>查看例句</summary>${x.examples.map(e=>`<p>${escapeHTML(e.en)}</p><p class="muted small">${escapeHTML(e.zh)}</p>${playButton(e.en,e.added?'补充例句朗读':'例句朗读',true)}`).join('')}</details>`:''}</article>`).join('')||'<p>没有匹配的词条。</p>'}</section>`}
function sentences(){return `<p class="muted">${DATA.sentences.length} 个原文句子 · ${DATA.examples.length} 个文档学习例句。先听，再展开中文。</p><div class="controls"><input id="sentence-search" placeholder="搜索原文或例句" aria-label="搜索句子" value="${escapeHTML(search)}"><select id="sentence-type"><option value="original">原文句子</option><option value="examples">文档学习例句</option></select></div><section class="card" id="sentence-list"></section>`}

function settingsPage(){return `<section class="card settings"><h2>让学习适合你</h2><details><summary>五星难度、音标与词性说明</summary><p class="small muted">1 星：基础词；2 星：日常常用词；3 星：雅思写作常见词；4 星：进阶词；5 星：专业或生僻词。在翻卡复习、听写训练、看词写义中均可按星级选择学习范围。星级是本词库的学习难度建议，并非官方考试等级，与“熟练、认识、模糊、不认识”的个人掌握情况分开记录。</p><p class="small muted">全部 75 个单词和 48 组短语附词性与英式常用音标。词性按本词库收录的常用义项标注；n. 名词，v. 动词，adj. 形容词，adv. 副词，prep. 介词，conj. 连词，det. 限定词，pron. 代词。四星、五星的 17 个单词配有词根、构词或借词联想记忆；借词和无可靠拆分的词会明确说明，联想不等同于真实词源。短语音标采用词典式组合读法，连读时会有弱读。rise—rose—risen、fall—fell—fallen 等词形请结合文档搭配学习。听写时不显示音标，核对答案后才显示。</p></details><label>英语朗读音色<select id="voice-select"></select></label><p class="small muted">优先推荐 Natural、Neural、Premium 等自然音色。可用音色由浏览器和系统提供；没有自然音色时，请在设备的语音设置中添加英语增强语音。</p><label>语速 <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="${settings.rate}"><span id="rate-label">${settings.rate} ×</span></label><label>发音来源<select id="engine"><option value="device">设备英语语音 · 单词、短语、句子</option><option value="dictionary">在线词典发音 · 词条优先，失败转设备语音</option></select></label><p class="small muted">在线词典发音需要联网，会把所读词条发送给有道词典。句子始终使用所选设备音色。</p><div>${playButton('The figure for services remained unchanged.','试听所选音色')}</div><label>每天新词数量<input id="daily" type="number" min="1" max="100" value="${settings.daily}"></label><details open><summary>复习规则</summary><div class="rules"><p>不认识：1 分钟后再出现。模糊：10 分钟后再出现。认识：连续选择后，间隔按 1、3、7、14、30 天增加；再次选模糊或不认识会重置这个连续间隔。</p><p>熟练：退出所有自动复习和提前练习；可在全部词库中重新调整等级。新词每天默认 20 个，到期词不受新词上限限制。网页关闭后不弹通知，下次打开会列出到期词。</p><p>“提前练习”允许在到期前复习所有未熟练词。练习结果需要选择等级才会保存。</p></div></details><div><h2>进度备份</h2><p class="muted small">记录只保存在当前浏览器，不会自动同步到 GitHub 或其他设备。换设备前先导出。</p><div class="row"><button id="export">导出进度</button><label><span class="sr">导入进度文件</span><input id="import" type="file" accept="application/json,.json"></label></div></div><p class="small muted">词库：${DATA.items.filter(x=>x.type==='word').length} 个单词与词汇条目、${DATA.items.filter(x=>x.type==='phrase').length} 组短语。模板中的省略号不参与拼写；部分语法模板已改为可听写的具体表达，可在答案处查看文档形式。</p></section>`}
let modelGroup='A',reciteScope='due',reciteQueue=[],reciteCurrent=null,reciteChecked=false,reciteAnswer='',reciteMore=false,reciteCount=0;
const GROUPS={A:'范文 A · 按走势分组',B:'范文 B · 按期初规模分组',platform:'平台范文 · 带讲义批注',all:'所有范文'};
function reciteCandidates(){return DATA.models.filter(x=>(modelGroup==='all'||x.group===modelGroup)&&rec(x).level!==4&&(reciteScope==='all'||eligible(x))).sort((a,b)=>{let ar=rec(a),br=rec(b);return Boolean(br.level)-Boolean(ar.level)||(ar.due||0)-(br.due||0)})}
function buildReciteQueue(){reciteQueue=reciteCandidates().map(x=>x.id);nextRecite()}
function nextRecite(){let id=reciteQueue.shift();reciteCurrent=DATA.models.find(x=>x.id===id)||null;reciteChecked=false;reciteAnswer='';reciteMore=false;render()}
function sentenceNorm(s){return s.normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[^\p{L}\p{N}%']/gu,' ').replace(/\s+/g,' ').trim()}
function compareSentence(input,target){let a=sentenceNorm(input).split(' ').filter(Boolean),b=sentenceNorm(target).split(' ').filter(Boolean);let dp=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);let i=a.length,j=b.length,missing=[],extra=[];while(i||j){if(i&&j&&a[i-1]===b[j-1]){i--;j--}else if(j&&(!i||dp[i][j-1]>=dp[i-1][j]))missing.push(b[--j]);else extra.push(a[--i])}return {exact:sentenceNorm(input)===sentenceNorm(target),score:b.length?Math.round(2*dp[a.length][b.length]/(a.length+b.length)*100):0,missing:missing.reverse(),extra:extra.reverse()}}
function checkRecite(){reciteAnswer=$('recite-answer').value;if(reciteAnswer.length>5000){toast('每次请输入一条范文原句。');return}reciteChecked=true;render()}
function gradeRecite(level){if(!reciteCurrent||!reciteChecked)return;let result=compareSentence(reciteAnswer,reciteCurrent.en);if(level>=3&&!result.exact){toast('原句还不一致，请先选择“模糊”或“不认识”再练一次。');return}const old=rec(reciteCurrent),now=Date.now();let interval=level===1?60000:level===2?600000:level===3?[1,3,7,14,30][Math.min(old.level===3?(old.streak||0):0,4)]*86400000:0;state[reciteCurrent.id]={level,reps:(old.reps||0)+1,due:level===4?null:now+interval,streak:level===3?(old.level===3?(old.streak||0)+1:1):0,startedDay:old.startedDay||dayKey(),updated:now};save();reciteCount++;nextRecite()}
function recitePage(){let selected=DATA.models.filter(x=>modelGroup==='all'||x.group===modelGroup),mastered=selected.filter(x=>rec(x).level===4).length;let html=`<div class="controls"><select id="model-group" aria-label="选择范文">${Object.entries(GROUPS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="recite-scope" aria-label="默写复习范围"><option value="due">按计划 · 到期＋未学原句</option><option value="all">提前复习 · 所有未熟练原句</option></select></div><p class="small muted">本组 ${selected.length} 句 · 熟练 ${mastered} 句 · 本轮完成 ${reciteCount} 次。看中文与关键词，默写范文原句。</p>`;
if(modelGroup==='platform'||modelGroup==='all')html+='<p class="source-warning">平台范文按文档原句保留，供对照学习；讲义指出其服务业描述遗漏平台期，部分表达可更直接。优先练习范文 A、B。</p>';
if(!reciteCurrent){let future=selected.filter(x=>rec(x).level&&rec(x).level!==4&&rec(x).due>Date.now()).sort((a,b)=>rec(a).due-rec(b).due)[0];return html+`<section class="card empty"><h2>${mastered===selected.length?'本组原句已经全部熟练':'本轮默写已完成'}</h2><p class="muted">${future?'下次复习：'+escapeHTML(new Date(rec(future).due).toLocaleString()):'可以切换另一篇范文，或在原文精听中调整熟练程度。'}</p><button id="recite-refresh" class="primary">检查到期原句</button> <button id="recite-early">提前复习未熟练原句</button></section>`}
let x=reciteCurrent,result=reciteChecked?compareSentence(reciteAnswer,x.en):null;
html+=`<section class="card"><div class="cardtop"><span class="tag">${escapeHTML(GROUPS[x.group])} · 第 ${x.number} 句 · ${x.role}</span><span class="counter">待练 ${reciteQueue.length+1} 句</span></div><p class="recite-chinese">${escapeHTML(x.zh)}</p><div class="keyword-list" aria-label="关键词提示">${x.keywords.slice(0,reciteMore?undefined:3).map(k=>`<span>${escapeHTML(k)}</span>`).join('')}</div>`;
if(!reciteChecked){html+=`<p class="small muted">关键词用于回忆结构和数据，并非完整句子。</p>${x.keywords.length>3?`<button id="recite-hint" class="small">${reciteMore?'收起更多提示':'再给我一些关键词'}</button>`:''}<div class="practice-input recite-input"><label>默写完整英文原句<textarea id="recite-answer" spellcheck="false" autocapitalize="none" placeholder="根据句意和关键词，写出原句……" maxlength="5000">${escapeHTML(reciteAnswer)}</textarea></label></div><button id="recite-check" class="primary">提交并核对</button> <button id="recite-skip">先跳过</button> <button id="recite-listen">听原句提示</button>`}
else{html+=`<div class="answer"><p class="${result.exact?'ok':'warning'}"><b>${result.exact?'✓ 与原句一致':'继续巩固：词序匹配度 '+result.score+'%'}</b></p><p><b>你的默写：</b>${escapeHTML(reciteAnswer)||'（未填写）'}</p><p class="source-sentence"><b>范文原句：</b>${escapeHTML(x.en)}</p>${playButton(x.en,'朗读范文原句')}<p class="small muted">忽略大小写和标点，核对原句词语及顺序；匹配度不是雅思写作评分。</p>${result.missing.length?`<p class="warning"><b>漏写／待替换：</b>${escapeHTML(result.missing.join(' · '))}</p>`:''}${result.extra.length?`<p class="warning"><b>多写／待替换：</b>${escapeHTML(result.extra.join(' · '))}</p>`:''}<p><b>讲义提示：</b>${escapeHTML(x.note)}</p></div><div class="grades">${[[1,'不认识','1 分钟后'],[2,'模糊','10 分钟后'],[3,'认识','1 / 3 / 7 / 14 / 30 天'],[4,'熟练','退出自动复习']].map(([n,l,t])=>`<button data-rec-grade="${n}" ${n>=3&&!result.exact?'disabled':''}><b>${l}</b><small>${t}</small></button>`).join('')}</div><p class="hint">熟练原句不再自动出现；可在“原文精听”中调整等级。</p><button id="recite-retry">不看答案再写一次</button>`}
return html+'</section>'}
function setupRecite(){if($('model-group')){$('model-group').value=modelGroup;$('model-group').onchange=e=>{modelGroup=e.target.value;buildReciteQueue()}}if($('recite-scope')){$('recite-scope').value=reciteScope;$('recite-scope').onchange=e=>{reciteScope=e.target.value;buildReciteQueue()}}if($('recite-answer'))$('recite-answer').oninput=e=>{reciteAnswer=e.target.value};if($('recite-check'))$('recite-check').onclick=checkRecite;if($('recite-hint'))$('recite-hint').onclick=()=>{reciteMore=!reciteMore;render()};if($('recite-skip'))$('recite-skip').onclick=nextRecite;if($('recite-listen'))$('recite-listen').onclick=()=>speak(reciteCurrent.en);if($('recite-retry'))$('recite-retry').onclick=()=>{reciteChecked=false;reciteAnswer='';reciteMore=false;render()};if($('recite-refresh'))$('recite-refresh').onclick=buildReciteQueue;if($('recite-early'))$('recite-early').onclick=()=>{reciteScope='all';buildReciteQueue()}}

function render(){renderStats();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('subtitle').textContent={recite:'关键词提示 · 范文原句默写',cards:'Task 1 · 折线图 / 翻卡复习',dictation:'Task 1 · 折线图 / 听英文，写英文与中文',meaning:'Task 1 · 折线图 / 看英文，写中文释义',sentences:'在句子里，听懂每一个词。',library:'你的 Task 1 写作词库',settings:'学习偏好与进度管理'}[view];$('app').innerHTML=view==='recite'?recitePage():['cards','dictation','meaning'].includes(view)?training():view==='library'?library():view==='sentences'?sentences():settingsPage();
if(view==='recite')setupRecite();if($('kind')){$('kind').value=kind;$('kind').onchange=e=>{kind=e.target.value;if(view==='library')render();else buildQueue()}}if($('scope')){$('scope').value=scope;$('scope').onchange=e=>{scope=e.target.value;buildQueue()}}
if($('reveal'))$('reveal').onclick=reveal;if($('listen'))$('listen').onclick=()=>speak(current.term,true);if($('slow'))$('slow').onclick=()=>speak(current.term,true,0.65);if($('meaning-ok'))$('meaning-ok').onchange=e=>{meaningOK=e.target.checked;render()};if($('skip'))$('skip').onclick=()=>{next()};if($('refresh'))$('refresh').onclick=buildQueue;if($('early'))$('early').onclick=()=>{scope='all';buildQueue()};
if($('star-filter')){$('star-filter').value=starFilter;$('star-filter').onchange=e=>{starFilter=e.target.value;if(['cards','dictation','meaning'].includes(view))buildQueue();else render()}}if($('search'))$('search').oninput=e=>{let pos=e.target.selectionStart;search=e.target.value;render();$('search').focus();$('search').setSelectionRange(pos,pos)};if($('status-filter')){$('status-filter').value=statusFilter;$('status-filter').onchange=e=>{statusFilter=e.target.value;render()}}
if(view==='sentences'){$('sentence-type').value=sentenceType;$('sentence-type').onchange=e=>{sentenceType=e.target.value;sentenceList()};$('sentence-search').oninput=e=>{search=e.target.value;sentenceList()};sentenceList()}
if(view==='settings'){voiceOptions();$('engine').value=settings.engine;$('engine').onchange=e=>{settings.engine=e.target.value;saveSettings()};$('voice-select').onchange=e=>{settings.voice=e.target.value;saveSettings();voiceStatus()};$('rate').oninput=e=>{settings.rate=Number(e.target.value);$('rate-label').textContent=settings.rate+' ×';saveSettings()};$('daily').onchange=e=>{settings.daily=Math.max(1,Math.min(100,parseInt(e.target.value)||20));e.target.value=settings.daily;saveSettings()};$('export').onclick=exportData;$('import').onchange=importData}}
document.addEventListener('click',e=>{let v=e.target.closest('[data-view]');if(v){stopSound();search='';navigate(v.dataset.view)}let p=e.target.closest('[data-say]');if(p)speak(p.dataset.say,DATA.items.some(x=>x.term===p.dataset.say));let g=e.target.closest('[data-grade]');if(g)grade(Number(g.dataset.grade));let rg=e.target.closest('[data-rec-grade]');if(rg)gradeRecite(Number(rg.dataset.recGrade))});
document.addEventListener('change',e=>{let id=e.target.dataset.levelId;if(!id)return;let level=e.target.value;if(level==='new')delete state[id];else{let old=state[id]||{};state[id]={...old,level:Number(level),due:level==='4'?null:Date.now(),streak:0,reps:old.reps||0,startedDay:old.startedDay||dayKey(),updated:Date.now()}}save();renderStats()});
let audio=null,soundToken=0;
function stopSound(){soundToken++;if(audio){audio.pause();audio=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
function voiceScore(v){return (/natural|neural|premium|enhanced/i.test(v.name)?100:0)+(!v.localService?30:0)+(/^en-GB/i.test(v.lang)?10:0)+(/Google|Microsoft|Samantha|Daniel|Serena/i.test(v.name)?5:0)}
function selectedVoice(){return voices.find(v=>v.voiceURI===settings.voice)||voices[0]}
function loadVoices(){voices=('speechSynthesis'in window?speechSynthesis.getVoices():[]).filter(v=>/^en(?:-|_)/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));voiceStatus();if(view==='settings')voiceOptions()}
function voiceStatus(){let v=selectedVoice();$('voice-status').textContent=v?'英语音色 · '+v.name:('speechSynthesis'in window?'未检测到英语音色，请查看学习设置':'此浏览器不支持设备朗读，请尝试在线词典发音或其他浏览器')}
function voiceOptions(){if(!$('voice-select'))return;$('voice-select').innerHTML='<option value="">自动选择 · 优先自然英语音色</option>'+voices.map(v=>`<option value="${escapeHTML(v.voiceURI)}">${escapeHTML(v.name)} · ${escapeHTML(v.lang)}</option>`).join('');$('voice-select').value=settings.voice}
function deviceSpeech(text,rate,token){if(token!==soundToken)return;if(!('speechSynthesis'in window)){toast('此浏览器不支持语音朗读，请换用支持语音的浏览器。');return}loadVoices();let v=selectedVoice();if(!v){toast('未检测到英语音色，请在系统中添加英语语音后重试。');return}let u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=rate;u.pitch=1;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))toast('朗读未成功，请换一个英语音色。')};speechSynthesis.speak(u)}
function speak(text,isTerm=false,rate=settings.rate){stopSound();const token=soundToken;let spoken=text.replace(/\bA\b/g,'A').replace(/…/g,' ').replace(/[＋+]/g,' ');if(settings.engine==='dictionary'&&isTerm){audio=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(spoken)+'&type=1');audio.playbackRate=rate;let finished=false;const fallback=()=>{if(finished||token!==soundToken)return;finished=true;if(audio)audio.pause();toast('在线发音不可用，已切换设备音色。');deviceSpeech(spoken,rate,token)};const timer=setTimeout(fallback,7000);audio.onplaying=()=>{finished=true;clearTimeout(timer)};audio.onerror=fallback;audio.play().catch(fallback);return}deviceSpeech(spoken,rate,token)}
function exportData(){let blob=new Blob([JSON.stringify({app:KEY,version:1,exportedAt:new Date().toISOString(),state,settings},null,2)],{type:'application/json'});let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='IELTS-Task1-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.app!==KEY||d.version!==1||!d.state||typeof d.state!=='object'||Array.isArray(d.state))throw Error();let valid=new Set([...DATA.items,...DATA.models].map(x=>x.id)),incoming={};for(let [id,r]of Object.entries(d.state)){if(!valid.has(id))continue;if(!r||![1,2,3,4].includes(r.level)||!Number.isFinite(r.updated)||!Number.isFinite(r.reps)||r.reps<0||(r.level!==4&&!Number.isFinite(r.due)))throw Error();incoming[id]={level:r.level,due:r.level===4?null:r.due,reps:r.reps,updated:r.updated,streak:Number.isFinite(r.streak)?Math.max(0,r.streak):0,startedDay:typeof r.startedDay==='string'?r.startedDay:dayKey()}}for(let[id,r]of Object.entries(incoming))if(!state[id]||r.updated>=(state[id].updated||0))state[id]=r;save();render();toast('进度已导入：按最后更新时间合并，不覆盖较新的记录。')}catch{toast('导入失败：请选择本页面导出的有效进度文件。')}finally{if($('import'))$('import').value=''}}
window.addEventListener('hashchange',()=>{let v=location.hash.slice(1);if(v!==view&&['recite','cards','dictation','meaning','sentences','library','settings'].includes(v))navigate(v)});
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,1200)}else voiceStatus();
setInterval(()=>{renderStats();if(view==='recite'&&!reciteCurrent&&reciteCandidates().length)buildReciteQueue();if(['cards','dictation','meaning'].includes(view)&&!current&&!document.querySelector('#en-answer')){let ids=candidates().map(x=>x.id);if(ids.length){queue=ids;next()}}},15000);
if(view==='recite')buildReciteQueue();else if(['cards','dictation','meaning'].includes(view))buildQueue();else render();
</script></body></html>
