w we can break this habit", "zh": "一位心理学家解释了我们为什么拖延重要任务，以及如何改掉这一习惯。"}, {"en": "This makes sense if we consider that people are more likely to put off starting or completing tasks that they are really not keen to do.", "zh": "如果考虑到人们更容易推迟开始或完成那些自己确实不愿做的任务，这种解释就说得通了。"}, {"en": "She put off replying because she did not know what to say.", "zh": "她不知道该说什么，因此迟迟没有回复。"}], "pos": "短语／表达", "stars": 2, "contextSenses": [0], "id": "procrastination-1445b92b1893"}, {"term": "task", "ipa": "tɑːsk", "zh": "任务", "note": "常用于工作、学习和实验情境", "type": "word", "examples": [{"en": "A psychologist explains why we put off important tasks and how we can break this habit", "zh": "一位心理学家解释了我们为什么拖延重要任务，以及如何改掉这一习惯。"}, {"en": "Procrastination is the habit of delaying a necessary task, usually by focusing on less urgent, more enjoyable, and easier activities instead.", "zh": "拖延是一种推迟必要任务的习惯，通常表现为转而把注意力放在不那么紧急、更加愉快、也更容易的活动上。"}, {"en": "This makes sense if we consider that people are more likely to put off starting or completing tasks that they are really not keen to do.", "zh": "如果考虑到人们更容易推迟开始或完成那些自己确实不愿做的任务，这种解释就说得通了。"}], "pos": "n. 名词", "stars": 1, "contextSenses": [0], "id": "procrastination-cf9c08b95658"}, {"term": "break", "ipa": "breɪk", "zh": "改掉，打破；打破，中断", "note": "常见义：打破、损坏、中断；此处搭配 habit / break a cycle“打破循环”，不指物理打碎", "type": "word", "examples": [{"en": "A psychologist explains why we put off important tasks and how we can break this habit", "zh": "一位心理学家解释了我们为什么拖延重要任务，以及如何改掉这一习惯。"}, {"en": "Forgiving ourselves and feeling compassion when we procrastinate can help break the procrastination cycle.", "zh": "拖延时，原谅自己并对自己抱有体谅之心，可以帮助打破拖延循环。"}, {"en": "I am trying to break the habit of checking my phone before bed.", "zh": "我正努力改掉睡前查看手机的习惯。"}], "pos": "v. 动词", "stars": 1, "contextSenses": [0, 1], "id": "procrastination-d9821e5fa9f2"}, {"term": "habit", "ipa": "ˈhæbɪt", "zh": "习惯", "note": "常见搭配 form a habit“养成习惯”、break a habit“改掉习惯”", "type": "word", "examples": [{"en": "A psychologist explains why we put off important tasks and how we can break this habit", "zh": "一位心理学家解释了我们为什么拖延重要任务，以及如何改掉这一习惯。"}, {"en": "Procrastination is the habit of delaying a necessary task, usually by focusing on less urgent, more enjoyable, and easier activities instead.", "zh": "拖延是一种推迟必要任务的习惯，通常表现为转而把注意力放在不那么紧急、更加愉快、也更容易的活动上。"}, {"en": "I am trying to break the habit of checking my phone before bed.", "zh": "我正努力改掉睡前查看手机的习惯。"}], "pos": "n. 名词", "stars": 2, "contextSenses": [0], "id": "procrastination-54af07f39dc7"}, {"term": "delay", "ipa": "dɪˈleɪ", "zh": "推迟，拖延", "note": "也可作名词，表示延误；常用 delay doing something", "type": "word", "examples": [{"en": "Procrastination is the habit of delaying a necessary task, usually by focusing on less urgent, more enjoyable, and easier activities instead.", "zh": "拖延是一种推迟必要任务的习惯，通常表现为转而把注意力放在不那么紧急、更加愉快、也更容易的活动上。"}, {"en": "They did their best to avoid further delays.", "zh": "他们尽力避免进一步延误。"}, {"en": "Instead of berating myself for the delay, I decided to start with one small step.", "zh": "我没有继续责骂自己拖延，而是决定先迈出一小步。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0], "id": "procrastination-bd7a9372f995"}, {"term": "necessary", "ipa": "ˈnesəsəri", "zh": "必要的，需要完成的", "note": "不等同于 urgent“紧急的”", "type": "word", "examples": [{"en": "Procrastination is the habit of delaying a necessary task, usually by focusing on less urgent, more enjoyable, and easier activities instead.", "zh": "拖延是一种推迟必要任务的习惯，通常表现为转而把注意力放在不那么紧急、更加愉快、也更容易的活动上。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "procrastination-ee87a6a80395"}, {"term": "focus", "ipa": "ˈfəʊkəs", "zh": "集中注意力", "note": "名词表示焦点、重点；focus on“专注于”", "type": "word", "examples": [{"en": "Procrastination is the habit of delaying a necessary task, usually by focusing on less urgent, more enjoyable, and easier activities instead.", "zh": "拖延是一种推迟必要任务的习惯，通常表现为转而把注意力放在不那么紧急、更加愉快、也更容易的活动上。"}, {"en": "There are a number of evidence-based strategies that can help us fend off distractions that can occupy ou 现为转而把注意力放在不那么紧急、更加愉快、也更容易的活动上。"}, {"en": "If we engage in more enjoyable tasks instead, we get another mood boost.", "zh": "如果我们转而去做更愉快的事情，心情就会进一步好转。"}, {"en": "He focused on easier activities instead of starting the main task.", "zh": "他把注意力放在更容易的活动上，没有开始主要任务。"}], "pos": "adv. 副词", "stars": 3, "contextSenses": [0], "id": "procrastination-c93de0a778df"}, {"term": "compose", "ipa": "kəmˈpəʊz", "zh": "撰写，拟写", "note": "也指作曲；compose oneself“使自己镇定”", "type": "word", "examples": [{"en": "She composed a message.", "zh": "她拟写了一条信息。", "added": true}], "pos": "v. 动词", "stars": 3, "contextSenses": [0], "id": "procrastination-fbd8a4af26bf"}, {"term": "message", "ipa": "ˈmesɪdʒ", "zh": "信息，消息", "note": "也可指作品传达的思想，如 the message of a film", "type": "word", "examples": [{"en": "We might be composing a message to a friend who we have to let down, or putting together an important report for college or work; we're doing our best to avoid doing the job at hand, but deep down we know that we should just be getting on with it.", "zh": "我们要做的可能是给一位不得不让其失望的朋友写信息，也可能是整理一份学校或工作所需的重要报告；我们竭尽所能地逃避眼前这项任务，但内心深处知道，自己其实应该着手把它做下去。"}], "pos": "n. 名词", "stars": 1, "contextSenses": [0], "id": "procrastination-f8f2a8ef6ea3"}, {"term": "let down", "ipa": "ˌlet ˈdaʊn", "zh": "使失望", "note": "如 let somebody down；不是字面的“让其下来”", "type": "phrase", "examples": [{"en": "We might be composing a message to a friend who we have to let down, or putting together an important report for college or work; we're doing our best to avoid doing the job at hand, but deep down we know that we should just be getting on with it.", "zh": "我们要做的可能是给一位不得不让其失望的朋友写信息，也可能是整理一份学校或工作所需的重要报告；我们竭尽所能地逃避眼前这项任务，但内心深处知道，自己其实应该着手把它做下去。"}], "pos": "短语／表达", "stars": 2, "contextSenses": [0], "id": "procrastination-185387ffc468"}, {"term": "put together", "ipa": "ˌpʊt təˈɡeðə", "zh": "整理，编写；组装", "note": "也可指组装，如 put together furniture / 文档表达：put together…", "type": "phrase", "examples": [{"en": "I need to put together a short presentation.", "zh": "我需要准备一份简短的演示报告。"}, {"en": "The team put together a detailed research proposal.", "zh": "团队编写了一份详细的研究计划书。"}, {"en": "We put together the bookshelf yesterday.", "zh": "我们昨天组装了书架。"}], "pos": "短语／表达", "stars": 3, "contextSenses": [0, 1], "id": "procrastination-8d666bba07f3"}, {"term": "report", "ipa": "rɪˈpɔːt", "zh": "报告；报告，陈述；报告，自述", "note": "作动词可表示报告、报道 / 此处为动词，report doing“报告做过某事” / 本句为动词；强调信息来自参与者报告", "type": "word", "examples": [{"en": "We might be composing a message to a friend who we have to let down, or putting together an important report for college or work; we're doing our best to avoid doing the job at hand, but deep down we know that we should just be getting on with it.", "zh": "我们要做的可能是给一位不得不让其失望的朋友写信息，也可能是整理一份学校或工作所需的重要报告；我们竭尽所能地逃避眼前这项任务，但内心深处知道，自己其实应该着手把它做下去。"}, {"en": "We know that if we don't finish that report or complete those home repairs, then what we did can't be evaluated.", "zh": "我们知道，如果不把那份报告写完，或不完成那些家居维修，那么我们已经做出的东西就无法得到评价。"}, {"en": "In one study of over 3,000 German students over a six-month period, those who reported procrastinating over their university work were also more likely to engage in study-related misconduct, such as cheating and plagiarism.", "zh": "一项针对3,000多名德国学生、历时六个月的研究发现，那些自述在大学学业任务上拖延的学生，也更有可能出现与学习有关的不端行为，例如作弊和抄袭。"}], "pos": "v./n. 动词／名词", "stars": 3, "contextSenses": [0, 1, 2], "id": "procrastination-0c383e4e664b"}, {"term": "avoid", "ipa": "əˈvɔɪd", "zh": "避免，逃避；回避，避开", "note": "常接名词或 doing / 后接名词或 doing，不接 to do", "type": "word", "examples": [{"en": "We might be composing a message to a friend who we have to let down, or putting together an important report for college or work; we're doing our best to avoid doing the job at hand, but deep down we know that we should just be getting on with it.", "zh": "我们要做的可能是给一位不得不让其失望的朋友写信息，也可能是整理一份学校或工作所需的重要报告；我们竭尽所能地逃避眼前这项任务，但内心深处知道，自己其实应该着手把它做下去。"}, {"en": "When we avoid such tasks, we also avoid the negative emotions associated with them.", "zh": "当我们回避这类任务时，也就避开了与之相关的负面情绪。"}, {"en": "They did their best to avoid further delays.", "zh": "他们尽力避免进一步延误。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0, 1], "id": "procrastination-1c9f6029597d"}, {"term": "job", "ipa": "dʒɒb", "zh": "任务，事情", "note": "本句不是具体职位或职业", "type": "word", "examples": [{"en": "We might be composing a message to a friend who we have to let down, or putting together an important report for college or work; we're doing our best to avoid doing the job at hand, but deep down we know that we should just be getting on with it.", "zh": "我们要做的可能是给一位不得不让其失望的朋友写信息，也可能是整理一份学校或工作所需的重要报告；我们竭尽所能地逃避眼前这项任务，但内心深处知道，自己其实应该着手把它做下去。"}, {"en": "I turned off my phone so I could finish the job at hand.", "zh": "我关掉了手机，以便完成手头的任务。"}], "pos": "n. 名词", "stars": 1, "contextSenses": [0], "id": "procrastination-76800b74c106"}, {"term": "at hand", "ipa": "ət ˈhænd", "zh": "当前需要处理的", "note": "也可表示“在近处、即将到来”，依语境判断", "type": "phrase", "examples": [{"en": "We might be composing a message to a friend who we have to let down, or putting together an important report for college or work; we're doing our best to avoid doing the job at hand, but deep down we know that we should just be getting on with it.", "zh": "我们要做的可能是给一位不得不让其失望的朋友写信息，也可能是整理一份学校或工作所需的重要报告；我们竭尽所能地逃避眼前这项任务，但内心深处知道，自己其实应该着手把它做下去。"}, {"en": "Let's focus on the task at hand.", "zh": "让我们专注于眼前的任务。"}, {"en": "I turned off my phone so I could finish the job at hand.", "zh": "我关掉了手机，以便完成手头的任务。"}], "pos": "短语／表达", "stars": 2, "contextSenses": [0], "id": "procrastination-5c929577f96e"}, {"term": "deep down", "ipa": "ˌdiːp ˈdaʊn", "zh": "内心深处", "note": "强调真实但可能未表现出来的想法 / 文档表达：deep down", "type": "phrase", "examples": [{"en": "Deep down, I knew I needed to make a change.", "zh": "内心深处，我知道自己需要作出改变。"}, {"en": "She seemed confident, but deep down she was worried.", "zh": "她看起来很自信，但内心深处很担忧。"}, {"en": "Deep down, he wanted to give it another try.", "zh": "内心深处，他想再试一次。"}], "pos": "短语／表达", "stars": 2, "contextSenses": [0], "id": "procrastination-b6e56a40a37a"}, {"term": "get on with", "ipa": "ɡet ˈɒn wɪð", "zh": "开始／继续做；着手或继续做；着手／继续做……", "note": "get on with somebody 还可表示“与某人相处” / get on with somebody 也可表示“与某人相处” / 文档表达：get on with…", "type": "phrase", "examples": [{"en": "I stopped checking my phone and got on with my work.", "zh": "我停止查看手机，继续工作。"}, {"en": "We need to get on with preparing the report.", "zh": "我们需要着手准备报告了。"}, {"en": "Once I understood the instructions, I got on with the task.", "zh": "理解要求后，我便开始做任务。"}], "pos": "短语／表达", "stars": 3, "contextSenses": [0, 1, 2], "id": "procrastination-39da08a3ce4b"}, {"term": "unfortunately", "ipa": "ʌnˈfɔːtʃənətli", "zh": "遗憾的是，不幸的是", "note": "用于评价不理想的情况", "type": "word", "examples": [{"en": "Unfortunately, berating ourselves won't stop us procrastinating again.", "zh": "遗憾的是，责骂自己并不能阻止我们再次拖延。"}], "pos": "adv. 副词", "stars": 3, "contextSenses": [0], "id": "procrastination-5ddd57579a96"}, {"term": "berate", "ipa": "bɪˈreɪt", "zh": "严厉斥责，责骂", "note": "常用 berate somebody for something", "type": "word", "examples": [{"en": "She berated herself for missing the deadline.", "zh": "她因错过截止时间而责骂自己。"}], "pos": "v. 动词", "stars": 4, "contextSenses": [0], "id": "procrastination-b58052d72a98", "memory": {"method": "词根助记", "parts": "be-（加强语气）＋ rate（此处为旧义“斥责”）。", "tip": "不是给自己“打分”，而是严厉责骂；把语气与 criticise 一般批评区分。", "family": "berate oneself 责骂自己；berate somebody for something", "source": "https://www.etymonline.com/word/berate"}}, {"term": "ourselves", "ipa": "aʊəˈselvz", "zh": "我们自己", "note": "反身代词，动作回到主语自身 / 反身代词，与主语 we 对应", "type": "word", "examples": [{"en": "Unfortunately, berating ourselves won't stop us procrastinating again.", "zh": "遗憾的是，责骂自己并不能阻止我们再次拖延。"}, {"en": "For example, reminding ourselves about why the task is important and valuable can increase positive feelings towards it.", "zh": "例如，提醒自己这项任务为什么重要、为什么有价值，可以增加我们对它的积极感受。"}, {"en": "Forgiving ourselves and feeling compassion when we procrastinate can help break the procrastination cycle.", "zh": "拖延时，原谅自己并对自己抱有体谅之心，可以帮助打破拖延循环。"}], "pos": "pron. 反身代词", "stars": 3, "contextSenses": [0], "id": "procrastination-8ec989ca859a"}, {"term": "in fact", "ipa": "ɪn ˈfækt", "zh": "事实上", "note": "可用于纠正预期、补充或加强观点", "type": "phrase", "examples": [{"en": "In fact, it's one of the worst things we can do.", "zh": "事实上，这恰恰是我们能采取的最糟糕的做法之一。"}, {"en": "Scientific studies suggest procrastination is, in fact, caused by poor mood management.", "zh": "科学研究提示，拖延实际上是由情绪管理不善引起的。"}, {"en": "In fact, in one US survey of over 22,000 employees, participants who said they regularly procrastinated had less annual income and less employment stability.", "zh": "事实上，在美国一项针对22,000多名员工的调查中，那些自述经常拖延的参与者，年收入较低，就业稳定性也较差。"}], "pos": "短语／表达", "stars": 2, "contextSenses": [0], "id": "procrastination-f0934e975bd5"}, {"term": "worst", "ipa": "wɜːst", "zh": "最糟糕的", "note": "bad—worse—worst", "type": "word", "examples": [{"en": "In fact, it's one of the worst things we can do.", "zh": "事实上，这恰恰是我们能采取的最糟糕的做法之一。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "procrastination-5bbac319d473"}, {"term": "thing", "ipa": "θɪŋ", "zh": "做法，事情", "note": "不一定指具体“物品”，需结合语境", "type": "word", "examples": [{"en": "In fact, it's one of the worst things we can do.", "zh": "事实上，这恰恰是我们能采取的最糟糕的做法之一。"}, {"en": "There are a number of evidence-based strategies that can help us fend off distractions that can occupy our minds when we should be focusing on the thing we should be getting on with.", "zh": "有多种有研究证据支持的策略，可以帮助我们抵御干扰；这些干扰会在我们本该专注于手头任务时，占据我们的注意力。"}], "pos": "n. 名词", "stars": 1, "contextSenses": [0], "id": "procrastination-176b070d0b81"}, {"term": "matter", "ipa": "ˈmætə", "zh": "重要，要紧", "note": "动词；名词常表示事情、问题、物质", "type": "word", "examples": [{"en": "This matters because, as my research shows, procrastination doesn't just waste time, but is actually linked to other problems, too.", "zh": "这一点很重要，因为正如我的研究所显示的，拖延不仅浪费时间，实际上还与其他问题有关。"}, {"en": "She reminded herself why the report mattered.", "zh": "她提醒自己，这份报告为什么重要。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0], "id": "procrastination-2e234e75559c"}, {"term": "research", "ipa": "rɪˈsɜːtʃ", "zh": "研究", "note": "表示研究活动时通常不可数，不写 a research", "type": "word", "examples": [{"en": "This matters because, as my research shows, procrastination doesn't just waste time, but is actually linked to other problems, too.", "zh": "这一点很重要，因为正如我的研究所显示的，拖延不仅浪费时间，实际上还与其他问题有关。"}, {"en": "Research involving brain imaging has found that areas of the brain linked to detection of threats and emotion regulation are actually different in people who chronically procrastinate compared to those who don't procrastinate frequently.", "zh": "使用脑成像技术的研究发现，与不经常拖延的人相比，长期拖延者大脑中与威胁识别和情绪调节有关的区域确实存在差异。"}, {"en": "Other research shows that employees on average spend almost a quarter of their workday procrastinating, and again this is linked with negative outcomes.", "zh": "其他研究显示，员工平均将工作日中将近四分之一的时间花在拖延上，而这种情况同样与不良结果有关。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0], "id": "procrastination-de1da7c579e0"}, {"term": "waste", "ipa": "weɪst", "zh": "浪费", "note": "名词也表示废弃物，如 plastic waste", "type": "word", "examples": [{"en": "This matters because, as my research shows, procrastination doesn't just waste time, but is actually linked to other problems, too.", "zh": "这一点很重要，因为正如我的研究所显示的，拖延不仅浪费时间，实际上还与其他问题有关。"}, {"en": "The researchers tested an effective way of reducing waste.", "zh": "研究人员测试了一种有效减少浪费的方法。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0], "id": "procrastination-a113ab622ed3"}, {"term": "actually", "ipa": "ˈæktʃuəli", "zh": "实际上", "note": "常用来强调事实或纠正预期；不是“目前”", "type": "word", "examples": [{"en": "This matters because, as my research shows, procrastination doesn't just waste time, but is actually linked to other problems, too.", "zh": "这一点很重要，因为正如我的研究所显示的，拖延不仅浪费时间，实际上还与其他问题有关。"}, {"en": "Research involving brain imaging has found that areas of the brain linked to detection of threats and emotion regulation are actually different in people who chronically procrastinat 和情绪调节有关的区域确实存在差异。"}, {"en": "Compared to last month, I find it easier to start difficult tasks.", "zh": "与上个月相比，我现在更容易开始困难的任务。"}, {"en": "The new method takes less time compared to the old one.", "zh": "与旧方法相比，新方法耗时更少。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0], "id": "procrastination-b4c814c71f55"}, {"term": "emotionally", "ipa": "ɪˈməʊʃənəli", "zh": "在情绪上", "note": "来自 emotional“情绪的、情感上的”", "type": "word", "examples": [{"en": "Tasks that are emotionally loaded or difficult, such as preparing for exams, are prime candidates for procrastination.", "zh": "那些带有较强情绪负担或难度较高的任务，例如备考，最容易成为被拖延的对象。"}, {"en": "For her, discussing money is emotionally loaded.", "zh": "对她来说，谈论金钱带有较重的情绪负担。"}, {"en": "The decision was emotionally loaded because it involved leaving home.", "zh": "这个决定涉及离家，因此带有较强的情绪负担。"}], "pos": "adv. 副词", "stars": 3, "contextSenses": [0], "id": "procrastination-bff7908b0fe4"}, {"term": "loaded", "ipa": "ˈləʊdɪd", "zh": "带有强烈情绪含义的", "note": "常见义：装满的；a loaded question 可指带有预设、具有诱导性的问题", "type": "word", "examples": [{"en": "Tasks that are emotionally loaded or difficult, such as preparing for exams, are prime candidates for procrastination.", "zh": "那些带有较强情绪负担或难度较高的任务，例如备考，最容易成为被拖延的对象。"}, {"en": "For her, discussing money is emotionally loaded.", "zh": "对她来说，谈论金钱带有较重的情绪负担。"}, {"en": "The decision was emotionally loaded because it involved leaving home.", "zh": "这个决定涉及离家，因此带有较强的情绪负担。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "procrastination-7f6ca80f3cbf"}, {"term": "prime", "ipa": "praɪm", "zh": "主要的，最典型的", "note": "也可指最佳的，如 prime location“黄金地段”", "type": "word", "examples": [{"en": "Tasks that are emotionally loaded or difficult, such as preparing for exams, are prime candidates for procrastination.", "zh": "那些带有较强情绪负担或难度较高的任务，例如备考，最容易成为被拖延的对象。"}, {"en": "The old building is a prime candidate for renovation.", "zh": "这栋旧建筑很适合进行翻修。"}, {"en": "An unclear task is a prime candidate for procrastination.", "zh": "要求不清楚的任务很容易成为被拖延的对象。"}], "p 拖延的倾向。"}, {"en": "I tend to delay tasks when the instructions are unclear.", "zh": "要求不清楚时，我往往会推迟任务。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0], "id": "procrastination-6dd75494604f"}, {"term": "perfectionist", "ipa": "pəˈfekʃənɪst", "zh": "完美主义者", "note": "perfectionism“完美主义”", "type": "word", "examples": [{"en": "Another group of people who tend to procrastinate are perfectionists, who worry their work will be judged harshly by others.", "zh": "另一类容易拖延的人是完美主义者，他们担心自己的成果会受到他人的严苛评判。"}], "pos": "n. 名词", "stars": 4, "contextSenses": [0], "id": "procrastination-570c33c95aa3", "memory": {"method": "派生构词", "parts": "perfection（完美）＋ -ist（持某种倾向的人）。", "tip": "追求 perfection 的人 → 完美主义者。", "family": "perfect 完美的；perfectionism 完美主义"}}, {"term": "judge", "ipa": "dʒʌdʒ", "zh": "评判，评价", "note": "名词可指法官、裁判", "type": "word", "examples": [{"en": "Another group of people who tend to procrastinate are perfectionists, who worry their work will be judged harshly by others.", "zh": "另一类容易拖延的人是完美主义者，他们担心自己的成果会受到他人的严苛评判。"}, {"en": "She worried that her presentation would be judged harshly.", "zh": "她担心自己的演示会受到严苛评判。"}, {"en": "The students did not want their first attempts to be judged harshly.", "zh": "学生们不希望自己的初次尝试受到严苛评判。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0], "id": "procrastination-67e52d583eb7"}, {"term": "harshly", "ipa": "ˈhɑːʃli", "zh": "严苛地", "note": "来自 harsh“严厉的、恶劣的”", "type": "word", "examples": [{"en": "Another group of people who tend to procrastinate are perfectionists, who worry their work will be judged harshly by others.", "zh": "另一类容易拖延的人是完美主义者，他们担心自己的成果会受到他人的严苛评判。"}, {"en": "She worried that her presentation would be judged harshly.", "zh": "她担心自己的演示会受到严苛评判。"}, {"en": "The students did not want their first attempts to be judged harshly.", "zh": "学生们不希望自己的初次尝试受到严苛评判。"}], "pos": "adv. 副词", "stars": 3, "contextSenses": [0], "id": "procrastination-f0295f0e3843"}, {"term": "work", "ipa": "wɜːk", "zh": "工作成果，作品", "note": "此处通常按不可数名词理解，不是“职位”", "type": "word", "examples": [{"en": "We might be composing a message to a friend who we have to let down, or putting together an important report for college or work; we're doing our best to avoid doing the job at hand, but deep down we know that we should just be getting on with it.", "zh": "我们要做的可能是给一位不得不让其失望的朋友写信息，也可能是整理一份学校或工作所需的重要报告；我们竭尽所能地逃避眼前这项任务，但内心深处知道，自己其实应该着手把它做下去。"}, {"en": "Another group of people who tend to procrastinate are perfectionists, who worry their work will be judged harshly by others.", "zh": "另一类容易拖延的人是完美主义者，他们担心自己的成果会受到他人的严苛评判。"}, {"en": "In one study of over 3,000 German students over a six-month period, those who reported procrastinating over their university work were also more likely to engage in study-related misconduct, such as cheating and plagiarism.", "zh": "一项针对3,000多名德国学生、历时六个月的研究发现，那些自述在大学学业任务上拖延的学生，也更有可能出现与学习有关的不端行为，例如作弊和抄袭。"}], "pos": "n. 名词", "stars": 1, "contextSenses": [0], "id": "procrastination-29acf6b69190"}, {"term": "repair", "ipa": "rɪˈpeə", "zh": "修理，维修事项；改善，修复；修复，改善", "note": "repairs 常指一系列维修工作；也可作动词 / 此处比喻改善情绪；也可指修理物品 / 此处为名词，与前面动词用法形成呼应", "type": "word", "examples": [{"en": "We know that if we don't finish that report or complete those home repairs, then what we did can't be evaluated.", "zh": "我们知道，如果不把那份报告写完，或不完成那些家居维修，那么我们已经做出的东西就无法得到评价。"}, {"en": "This is rewarding, and it conditions us to use procrastination to repair our mood.", "zh": "这种回避会带来满足或轻松感，并使我们逐渐形成通过拖延来改善情绪的习惯性反应。"}, {"en": "The 'mood repair' we experience is temporary.", "zh": "我们体验到的这种“情绪修复”只是暂时的。"}], "pos": "v./n. 动词／名词", "stars": 3, "contextSenses": [0, 1, 2], "id": "procrastination-7da5fee08939"}, {"term": "evaluate", "ipa": "ɪˈvæljueɪt", "zh": "评价，评估", "note": "常指依据标准判断质量、效果或价值", "type": "word", "examples": [{"en": "We know that if we don't finish that report or complete those home repairs, then what we did can't be evaluated.", "zh": "我们知道，如果不把那份报告写完，或不完成那些家居维修，那么我们已经做出的东西就无法得到评价。"}], "pos": "v. 动词", "stars": 4, "contextSenses": [0], "id": "procrastination-ac979dd71a25", "memory": {"method": "词族联想", "parts": "联系 value（价值）与 evaluate（评估）；先记“判断价值”这一语义关系。", "tip": "把成果的价值、效果评出来 → 评价、评估；这是词族联想，不是逐字拼接 value。", "family": "value 价值；evaluation 评价"}}, {"term": "evaluation", "ipa": "ɪˌvæljuˈeɪʃən", "zh": "评价，评估", "note": "evaluate 对应的名词", "type": "word", "examples": [{"en": "We know that if we don't finish that report or complete those home repairs, then what we did can't be evaluated.", "zh": "我们知道，如果不把那份报告写完，或不完成那些家居维修，那么我们已经做出的东西就无法得到评价。"}], "pos": "n. 名词", "stars": 4, "contextSenses": [0], "id": "procrastination-f86495f63dfb", "memory": {"method": "派生构词", "parts": "evaluate（评估）去 e，加 -ion → evaluation。", "tip": "evaluate 是动作，evaluation 是评价过程或结果。", "family": "evaluate v.；evaluation n."}}, {"term": "negative", "ipa": "ˈneɡətɪv", "zh": "负面的", "note": "也可表示否定的、阴性的、负数的 / 此处形容对自己的不良感受", "type": "word", "examples": [{"en": "When we avoid such tasks, we also avoid the negative emotions associated with them.", "zh": "当我们回避这类任务时，也就避开了与之相关的负面情绪。"}, {"en": "Afterwards, people tend to be left with a sense of guilt that not only increases their negative mood, but also reinforces their tendency to procrastinate.", "zh": "事后，人们往往会留下内疚感；这种内疚不仅加重他们的负面情绪，还会强化他们拖延的倾向。"}, {"en": "Other research shows that employees on average spend almost a quarter of their workday procrastinating, and again this is linked with negative outcomes.", "zh": "其他研究显示，员工平均将工作日中将近四分之一的时间花在拖延上，而这种情况同样与不良结果有关。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "procrastination-00982a4c40e3"}, {"term": "associated", "ipa": "əˈsəʊʃieɪtɪd", "zh": "有关联的", "note": "be associated with“与……相关”", "type": "word", "examples": [{"en": "When we avoid such tasks, we also avoid the negative emotions associated with them.", "zh": "当我们回避这类任务时，也就避开了与之相关的负面情绪。"}, {"en": "The task was associated with memories of an earlier failure.", "zh": "这项任务与之前一次失败的记忆联系在一起。"}, {"en": "The researchers measured the emotions associated with public speaking.", "zh": "研究人员测量了与公开演讲相关的情绪。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "procrastination-76ad74999680"}, {"term": "rewarding", "ipa": "rɪˈwɔːdɪŋ", "zh": "带来满足感的，有心理回报的", "note": "也常形容工作、经历“有成就感的”", "type": "word", "examples": [{"en": "This is rewarding, and it conditions us to use procrastination to repair our mood.", "zh": "这种回避会带来满足或轻松感，并使我们逐渐形成通过拖延来改善情绪的习惯性反应。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "procrastination-0ba04f20c57b"}, {"term": "condition", "ipa": "kənˈdɪʃən", "zh": "使形成习惯性反应", "note": "熟词生义；名词常表示条件、状况", "type": "word", "examples": [{"en": "This is rewarding, and it conditions us to use procrastination to repair our mood.", "zh": "这种回避会带来满足或轻松感，并使我们逐渐形成通过拖延来改善情绪的习惯性反应。"}, {"en": "The results make sense when we consider the different conditions.", "zh": "考虑到不同条件，这些结果就能解释得通。"}, {"en": "Repeated rewards can condition people to repeat a behaviour.", "zh": "反复获得回报可能使人形成重复某种行为的习惯性反应。"}], "pos": "v./n. 动词／名词", "stars": 3, "contextSenses": [0], "id": "procrastination-c5df798c66ad"}, {"term": "engage", "ipa": "ɪnˈɡeɪdʒ", "zh": "参与，从事", "note": "engage in；也可表示吸引注意，如 engage an audience", "type": "word", "examples": [{"en": "If we engage in more enjoyable tasks instead, we get another mood boost.", "zh": "如果我们转而去做更愉快的事情，心情就会进一步好转。"}, {"en": "In one study of over 3,000 German students over a six-month period, those who reported procrastinating over their university work were also more likely to engage in study-related misconduct, such as cheating and plagiarism.", "zh": "一项针对3,000多名德国学生、历时六个月的研究发现，那些自述在大学学业任务上拖延的学生，也更有可能出现与学习有关的不端行为，例如作弊和抄袭。"}, {"en": "The students engaged in a group discussion.", "zh": "学生们参与了小组讨论。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0], "id": "procrastination-7e73ff787dae"}, {"term": "boost", "ipa": "buːst", "zh": "提升，促进", "note": "可作名词或动词，如 boost confidence“增强信心”", "type": "word", "examples": [{"en": "If we engage in more enjoyable tasks instead, we get another mood boost.", "zh": "如果我们转而去做更愉快的事情，心情就会进一步好转。"}, {"en": "She got a mood boost from talking to a close friend.", "zh": "与好友交谈让她心情好了一些。"}, {"en": "I got a small mood boost after completing the first step.", "zh": "完成第一步后，我的心情稍有改善。"}], "pos": "v./n. 动词／名词", "stars": 3, "contextSenses": [0], "id": "procrastination-efb55801d657"}, {"term": "another", "ipa": "əˈnʌðə", "zh": "又一个，进一步的", "note": "此处强调额外的一次情绪改善", "type": "word", "examples": [{"en": "Another group of people who tend to procrastinate are perfectionists, who worry their work will be judged harshly by others.", "zh": "另一类容易拖延的人是完美主义者，他们担心自己的成果会受到他人的严苛评判。"}, {"en": "If we engage in more enjoyable tasks instead, we get another mood boost.", "zh": "如果我们转而去做更愉快的事情，心情就会进一步好转。"}, {"en": "Deep down, he wanted to give it another try.", "zh": "内心深处，他想再试一次。"}], "pos": "det./pron. 限定词／代词", "stars": 1, "contextSenses": [0], "id": "procrastination-e20718db8626"}, {"term": "in the long run", "ipa": "ɪn ðə ˌlɒŋ ˈrʌn", "zh": "从长远来看", "note": "与 in the short run“短期来看”对应 / 文档表达：in the long run", "type": "phrase", "examples": [{"en": "In the long run, a realistic routine may be easier to maintain.", "zh": "从长远来看，切合实际的日常安排可能更容易坚持。"}, {"en": "Avoiding the problem may create more work in the long run.", "zh": "回避问题可能从长远上带来更多工作。"}, {"en": "The cheaper option may cost more in the long run.", "zh": "较便宜的选项从长远来看可能花费更多。"}], "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-14f7e9ed0d08"}, {"term": "effective", "ipa": "ɪˈfektɪv", "zh": "有效的", "note": "强调达到预期效果；不同于 efficient“效率高的”", "type": "word", "examples": [{"en": "In the long run, however, procrastination isn't an effective way of managing emotions.", "zh": "然而，从长远来看，拖延并不是一种有效的情绪管理方式。"}, {"en": "Breaking the task into steps is an effective way of making it clearer.", "zh": "把任务拆成步骤，是让任务更清晰的一种有效方式。"}, {"en": "The researchers tested an effective way of reducing waste.", "zh": "研究人员测试了一种有效减少浪费的方法。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "procrastination-db212b702a32"}, {"term": "manage", "ipa": "ˈmænɪdʒ", "zh": "管理，调节；处理，应对；管理、调节情绪", "note": "manage to do 则表示“设法成功做成” / 也指处理事务；manage to do“设法成功做成”", "type": "word", "examples": [{"en": "They are less likely to practise healthy behaviours, such as eating a healthy diet and regularly exercising, and use destructive coping strategies to manage their stress.", "zh": "他们较少采取健康行为，例如健康饮食和经常锻炼；同时，他们会采用有害的应对策略来处理压力。"}, {"en": "An important first step is to manage our environment and how we view the task.", "zh": "一个重要的起点，是管理我们所处的环境，并调整我们看待任务的方式。"}, {"en": "The participants described the coping strategies they used to manage stress.", "zh": "参与者描述了自己用来处理压力的应对策略。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0, 1, 2], "id": "procrastination-881240e4fafa"}, {"term": "experience", "ipa": "ɪkˈspɪəriəns", "zh": "体验到，经历；经历，感受到", "note": "名词可指经验或经历；本句为动词 / 名词可表示经验或经历；本句为动词", "type": "word", "examples": [{"en": "The 'mood repair' we experience is temporary.", "zh": "我们体验到的这种“情绪修复”只是暂时的。"}, {"en": "They also experience higher levels of stress and poor sleep quality.", "zh": "他们还承受更高程度的压力，而且睡眠质量较差。"}, {"en": "The experience conditioned him to avoid similar situations.", "zh": "这段经历使他逐渐形成回避类似情境的反应。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0, 1], "id": "procrastination-6ddb13725291"}, {"term": "temporary", "ipa": "ˈtemprəri", "zh": "暂时的，临时的", "note": "反义词 permanent“永久的”", "type": "word", "examples": [{"en": "The 'mood repair' we experience is temporary.", "zh": "我们体验到的这种“情绪修复”只是暂时的。"}, {"en": "The enjoyable activity gave him a temporary mood boost.", "zh": "这项愉快的活动让他的心情暂时好转。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "procrastination-d28ba60ec04f"}, {"term": "afterwards", "ipa": "ˈɑːftəwədz", "zh": "随后，事后", "note": "强调前述事件之后", "type": "word", "examples": [{"en": "Afterwards, people tend to be left with a sense of guilt that not only increases their negative mood, but also reinforces their tendency to procrastinate.", "zh": "事后，人们往往会留下内疚感；这种内疚不仅加重他们的负面情绪，还会强化他们拖延的倾向。"}], "pos": "adv. 副词", "stars": 3, "c ɪ", "zh": "占据注意力", "note": "也可表示占用时间、空间，或占领地区", "type": "word", "examples": [{"en": "There are a number of evidence-based strategies that can help us fend off distractions that can occupy our minds when we should be focusing on the thing we should be getting on with.", "zh": "有多种有研究证据支持的策略，可以帮助我们抵御干扰；这些干扰会在我们本该专注于手头任务时，占据我们的注意力。"}, {"en": "Small worries can occupy our minds when we try to concentrate.", "zh": "当我们试图集中注意力时，小小的担忧也可能占据我们的心思。"}, {"en": "She needed a break from the thoughts occupying her mind.", "zh": "她需要暂时摆脱那些占据心头的想法。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0], "id": "procrastination-d99914dc9238"}, {"term": "focus on", "ipa": "ˈfəʊkəs ɒn", "zh": "专注于；专注于……；把注意力放在……", "note": "on 后接名词或动名词 / 文档表达：focus on…", "type": "phrase", "examples": [{"en": "Today I will focus on reviewing my reading mistakes.", "zh": "今天我会专注于复盘阅读错题。"}, {"en": "The report focuses on the causes of procrastination.", "zh": "报告重点讨论拖延的原因。"}, {"en": "He focused on easier activities instead of starting the main task.", "zh": "他把注意力放在更容易的活动上，没有开始主要任务。"}], "pos": "短语／表达", "stars": 3, "contextSenses": [0, 1, 2], "id": "procrastination-547f792fb476"}, {"term": "remind", "ipa": "rɪˈmaɪnd", "zh": "提醒", "note": "remind somebody to do“提醒某人做……”", "type": "word", "examples": [{"en": "For example, reminding ourselves about why the task is important and valuable can increase positive feelings towards it.", "zh": "例如，提醒自己这项任务为什么重要、为什么有价值，可以增加我们对它的积极感受。"}, {"en": "We should remind ourselves that we're not the first person to procrastinate, nor the last.", "zh": "我们应该提醒自己：我们不是第一个拖延的人，也不会是最后一个。"}, {"en": "I reminded myself why I had chosen this goal.", "zh": "我提醒自己，当初为什么选择这个目标。"}], "pos": "v. 动词", "stars": 3, "contextSenses": [0], "id": "procrastination-6db98908aafd"}, {"term": "valuable", "ipa": "ˈvæljuəbl", "zh": "有价值的", "note": "不一定指价格昂贵，也可指有用、有意义", "type": "word", "examples": [{"en": "For example, reminding ourselves about why the task is important and valuable can increase positive feelin 友交谈让她的焦虑有所缓和。"}, {"en": "A small snack took the edge off my hunger.", "zh": "吃一点零食缓解了我的饥饿感。"}, {"en": "Having a clear first step took the edge off the task's difficulty.", "zh": "明确第一步后，这项任务不再显得那么难。"}], "pos": "短语／表达", "stars": 3, "contextSenses": [0, 1], "id": "procrastination-3bf2cd0a3748"}, {"term": "feeling", "ipa": "ˈfiːlɪŋ", "zh": "感受，情绪", "note": "也可表示感觉或看法", "type": "word", "examples": [{"en": "For example, reminding ourselves about why the task is important and valuable can increase positive feelings towards it.", "zh": "例如，提醒自己这项任务为什么重要、为什么有价值，可以增加我们对它的积极感受。"}, {"en": "Forgiving ourselves and feeling compassion when we procrastinate can help break the procrastination cycle.", "zh": "拖延时，原谅自己并对自己抱有体谅之心，可以帮助打破拖延循环。"}, {"en": "Doing this can take the edge off the negative feelings we have about ourselves when we procrastinate.", "zh": "这样做，可以减轻我们拖延时对自己产生的负面感受。"}], "pos": "n. 名词", "stars": 1, "contextSenses": [0], "id": "procrastination-31264aaea9ff"}, {"term": "easier", "ipa": "ˈiːziə", "zh": "更容易的", "note": "easy 的比较级", "type": "word", "examples": [{"en": "Procrastination is the habit of delaying a necessary task, usually by focusing on less urgent, more enjoyable, and easier activities instead.", "zh": "拖延是一种推迟必要任务的习惯，通常表现为转而把注意力放在不那么紧急、更加愉快、也更容易的活动上。"}, {"en": "This can all make it easier to get back on track.", "zh": "这些做法都能让我们更容易回到正轨。"}, {"en": "He focused on easier activities instead of starting the main task.", "zh": "他把注意力放在更容易的活动上，没有开始主要任务。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0], "id": "procrastination-cb2f3007e6e5"}, {"term": "track", "ipa": "træk", "zh": "正常推进的路线〔比喻〕", "note": "常见义：轨道、跑道、踪迹；动词可指追踪", "type": "word", "examples": [{"en": "This can all make it easier to get back on track.", "zh": "这些做法都能让我们更容易回到正轨。"}, {"en": "We need an effective way of tracking our progress.", "zh": "我们需要一种有效追踪进度的方法。"}, {"en": "After a short break, I got back on track with my revision.", "zh": "短暂休息后，我重新推进复习。"}], "pos": "n. 名词", "stars": 1, "contextSe let somebody down", "zh": "让某人失望", "type": "phrase", "examples": [{"en": "I did not want to let my friend down.", "zh": "我不想让朋友失望。"}, {"en": "He apologised for letting the team down.", "zh": "他因让团队失望而道歉。"}, {"en": "She felt that she had let herself down.", "zh": "她觉得自己辜负了自己的期待。"}], "note": "文档表达：let somebody down", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-b919f8b3ce6c"}, {"term": "do one's best to do", "zh": "尽力做……", "type": "phrase", "examples": [{"en": "I will do my best to complete the task today.", "zh": "我会尽力在今天完成任务。"}, {"en": "The teacher did her best to explain the concept clearly.", "zh": "老师尽力把这个概念解释清楚。"}, {"en": "They did their best to avoid further delays.", "zh": "他们尽力避免进一步延误。"}], "note": "文档表达：do one’s best to do…", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-4c9fe6f9226c"}, {"term": "the task at hand", "zh": "眼前需要处理的任务", "type": "phrase", "examples": [{"en": "Let's focus on the task at hand.", "zh": "让我们专注于眼前的任务。"}, {"en": "I turned off my phone so I could finish the job at hand.", "zh": "我关掉了手机，以便完成手头的任务。"}, {"en": "The discussion distracted us from the task at hand.", "zh": "这场讨论让我们偏离了当前需要处理的任务。"}], "note": "文档表达：the task/job at hand", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-6cc449f065e5"}, {"term": "berate oneself for", "zh": "因……而责骂自己", "type": "phrase", "examples": [{"en": "She berated herself for missing the deadline.", "zh": "她因错过截止时间而责骂自己。"}, {"en": "He kept berating himself for making a small mistake.", "zh": "他因犯了一个小错误而不断责骂自己。"}, {"en": "Instead of berating myself for the delay, I decided to start with one small step.", "zh": "我没有继续责骂自己拖延，而是决定先迈出一小步。"}], "note": "文档表达：berate oneself for…", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-5ccd371ba788"}, {"term": "stop somebody from doing", "zh": "阻止某人做……", "type": "phrase", "examples": [{"en": "The noise stopped me from concentrating.", "zh": "噪声让我无法集中注意力。"}, {"en": "Fear of making mistakes can stop people from trying.", "zh": "对犯错的恐惧可能阻止人们尝试。"}, {"en": "The reminder stopped me forgetting the appointment.", "zh": "提醒让我没有忘记预约。"}], "note": "文档表达：stop somebody (from) doing…", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-df2f9963c041"}, {"term": "be linked to", "zh": "与……有关联", "type": "phrase", "examples": [{"en": "The researchers examined whether stress was linked to procrastination.", "zh": "研究人员考察了压力是否与拖延有关。"}, {"en": "The decline in sales was linked to changes in demand.", "zh": "销售下降与需求变化有关。"}, {"en": "These two problems may be closely linked to each other.", "zh": "这两个问题可能密切相关。"}, {"en": "The study examined brain areas linked to emotion regulation.", "zh": "这项研究考察了与情绪调节有关的大脑区域。"}, {"en": "The researchers investigated whether the behaviour was linked to stress.", "zh": "研究人员调查了这种行为是否与压力有关。"}, {"en": "These changes may be linked to differences in the environment.", "zh": "这些变化可能与环境差异有关。"}], "note": "文档表达：be linked to…", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-1e618a06add4"}, {"term": "contrary to popular belief", "zh": "与普遍看法相反", "type": "phrase", "examples": [{"en": "Contrary to popular belief, being busy does not always mean being productive.", "zh": "与普遍看法相反，忙碌并不总意味着效率高。"}, {"en": "Contrary to popular belief, the task does not require advanced computer skills.", "zh": "与普遍看法相反，这项任务不需要高阶计算机技能。"}, {"en": "Contrary to popular belief, making a detailed plan is not always the hardest part.", "zh": "与普遍看法相反，制定详细计划不一定是最难的部分。"}], "note": "文档表达：contrary to popular belief", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-fa1334c38129"}, {"term": "be due to", "zh": "由……造成；由于……", "type": "phrase", "examples": [{"en": "The delay was due to a technical problem.", "zh": "延误是由技术问题造成的。"}, {"en": "Her progress was partly due to regular feedback.", "zh": "她的进步部分归功于经常获得反馈。"}, {"en": "The poor r ycle.", "zh": "识别这种模式，是打破恶性循环的第一步。"}], "note": "文档表达：break the vicious cycle", "ipa": "", "pos": "短语／表达", "stars": 4, "contextSenses": [0], "id": "procrastination-314dd8f371df"}, {"term": "how we view the task", "zh": "我们如何看待任务", "type": "phrase", "examples": [{"en": "How we view the task can influence whether we start it.", "zh": "我们如何看待任务，可能影响我们是否开始行动。"}, {"en": "The exercise encouraged us to reconsider how we view the task.", "zh": "这项练习鼓励我们重新思考自己如何看待任务。"}, {"en": "We discussed how we view the task and why it feels difficult.", "zh": "我们讨论了自己如何看待任务，以及它为什么让人觉得困难。"}], "note": "文档表达：how we view the task", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-5b81c8229903"}, {"term": "evidence-based strategies", "zh": "有证据支持的策略", "type": "phrase", "examples": [{"en": "The workshop introduces evidence-based strategies for managing distractions.", "zh": "工作坊介绍了有证据支持的干扰管理策略。"}, {"en": "The team reviewed the evidence-based strategies available.", "zh": "团队审查了现有的循证策略。"}, {"en": "The article explains how evidence-based strategies can be applied in daily life.", "zh": "文章解释了如何在日常生活中运用有证据支持的策略。"}], "note": "文档表达：evidence-based strategies", "ipa": "", "pos": "短语／表达", "stars": 4, "contextSenses": [0], "id": "procrastination-2bc1dfcbf4b0"}, {"term": "fend off distractions", "zh": "抵御干扰", "type": "phrase", "examples": [{"en": "I turn off notifications to fend off distractions.", "zh": "我关闭通知来减少干扰。"}, {"en": "A quiet workspace can help us fend off distractions.", "zh": "安静的工作空间可以帮助我们抵御干扰。"}, {"en": "She found it difficult to fend off distractions while working at home.", "zh": "在家工作时，她发现很难抵御干扰。"}], "note": "文档表达：fend off distractions", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-8293b1ff27f3"}, {"term": "occupy somebody's mind", "zh": "占据某人的思绪", "type": "phrase", "examples": [{"en": "The unfinished report occupied my mind all evening.", "zh": "那份未完成的报告整个晚上都占据着我的思绪。"}, {"en": "Small worries can occupy our minds when we try to concentrate.", "zh": "当我们试图集中注意力时，小小的担忧也可能占据我们的心思。"}, {"en": "She needed a break from the thoughts occupying her mind.", "zh": "她需要暂时摆脱那些占据心头的想法。"}], "note": "文档表达：occupy somebody’s mind", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-200ac8411076"}, {"term": "remind oneself why", "zh": "提醒自己为什么……", "type": "phrase", "examples": [{"en": "I reminded myself why I had chosen this goal.", "zh": "我提醒自己，当初为什么选择这个目标。"}, {"en": "She reminded herself why the report mattered.", "zh": "她提醒自己，这份报告为什么重要。"}, {"en": "Before starting, we reminded ourselves why the task was valuable.", "zh": "开始之前，我们提醒自己这项任务为什么有价值。"}], "note": "文档表达：remind oneself why…", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-ea3af8275196"}, {"term": "forgive oneself", "zh": "原谅自己／体谅自己", "type": "phrase", "examples": [{"en": "She tried to forgive herself for missing one day of practice.", "zh": "她试着原谅自己有一天没有练习。"}, {"en": "He showed himself compassion after a disappointing result.", "zh": "结果令人失望后，他试着体谅自己。"}, {"en": "Forgiving ourselves does not prevent us from learning from mistakes.", "zh": "原谅自己并不妨碍我们从错误中学习。"}], "note": "文档表达：forgive oneself / show oneself compassion", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-6b60ff8385a8"}, {"term": "be overly critical of", "zh": "对……过分苛刻", "type": "phrase", "examples": [{"en": "I realised I was being overly critical of myself.", "zh": "我意识到自己对自己过于苛刻了。"}, {"en": "The feedback was useful without being overly critical of the writer.", "zh": "这些反馈很有用，同时没有过分苛责作者。"}, {"en": "Try to assess the result without being overly critical of every detail.", "zh": "试着评估结果，而不要对每个细节都过分挑剔。"}], "note": "文档表达：be overly critical of…", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-10732dfbae09"}, {"term": "not the first , nor the last", "zh": "不是第一个……，也不是最后一个", "type": "phrase", "examples": [{"en": "You are not the first person to make this mistake, nor the last.", "zh": "你不是第一个犯这个错误的人，也不是最后一个。"}, {"en": "She was not the first student to feel nervous, nor the last.", "zh": "她不是第一个感到紧张的学生，也不是最后一个。"}, {"en": "We are not the first team to face this problem, nor the last.", "zh": "我们不是第一支面临这个问题的团队，也不是最后一支。"}], "note": "文档表达：not the first…, nor the last", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-477684fe5ae5"}, {"term": "make it easier to do", "zh": "让做……更容易", "type": "phrase", "examples": [{"en": "A clear checklist makes it easier to start.", "zh": "清楚的检查清单让开始行动更容易。"}, {"en": "The examples made it easier to understand the instructions.", "zh": "这些例子让要求更容易理解。"}, {"en": "Preparing the materials in advance can make it easier to concentrate.", "zh": "提前准备好材料，可以让集中注意力更容易。"}], "note": "文档表达：make it easier to do…", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "procrastination-acbcd5060436"}], "sentences": [{"en": "A psychologist explains why we put off important tasks and how we can break this habit", "zh": "一位心理学家解释了我们为什么拖延重要任务，以及如何改掉这一习惯。"}, {"en": "Procrastination is the habit of delaying a necessary task, usually by focusing on less urgent, more enjoyable, and easier activities instead.", "zh": "拖延是一种推迟必要任务的习惯，通常表现为转而把注意力放在不那么紧急、更加愉快、也更容易的活动上。"}, {"en": "We all do it from time to time.", "zh": "我们每个人都时不时会这样做。"}, {"en": "We might be composing a message to a friend who we have to let down, or putting together an important report for college or work; we're doing our best to avoid doing the job at hand, but deep down we know that we should just be getting on with it.", "zh": "我们要做的可能是给一位不得不让其失望的朋友写信息，也可能是整理一份学校或工作所需的重要报告；我们竭尽所能地逃避眼前这项任务，但内心深处知道，自己其实应该着手把它做下去。"}, {"en": "Unfortunately, berating ourselves won't stop us procrastinating again.", "zh": "遗憾的是，责骂自己并不能阻止我们再次拖延。"}, {"en": "In fact, it's one of the worst things we can do.", "zh": "事实上，这恰恰是我们能采取的最糟糕的做法之一。"}, {"en": "This matters because, as my research shows, procrastination doesn't just waste time, but is actually linked to other problems, too.", "zh": "这一点很重要，因为正如我的研究所显示的，拖延不仅浪费时间，实际上还与其他问题有关。"}, {"en": "Contrary to popular belief, procrastination is not due to laziness or poor time management.", "zh": "与普遍看法相反，拖延并不是由懒惰或时间管理不善造成的。"}, {"en": "Scientific studies suggest procrastination is, in fact, caused by poor mood management.", "zh": "科学研究提示，拖延实际上是由情绪管理不善引起的。"}, {"en": "This makes sense if we consider that people are more likely to put off starting or completing tasks that they are really not keen to do.", "zh": "如果考虑到人们更容易推迟开始或完成那些自己确实不愿做的任务，这种解释就说得通了。"}, {"en": "If just thinking about the task threatens our sense of self-worth or makes us anxious, we will be more likely to put it off.", "zh": "如果仅仅想到这项任务，就会威胁到我们的自我价值感，或让我们感到焦虑，我们就更容易拖延它。"}, {"en": "Research involving brain imaging has found that areas of the brain linked to detection of threats and emotion regulation are actually different in people who chronically procrastinate compared to those who don't procrastinate frequently.", "zh": "使用脑成像技术的研究发现，与不经常拖延的人相比，长期拖延者大脑中与威胁识别和情绪调节有关的区域确实存在差异。"}, {"en": "Tasks that are emotionally loaded or difficult, such as preparing for exams, are prime candidates for procrastination.", "zh": "那些带有较强情绪负担或难度较高的任务，例如备考，最容易成为被拖延的对象。"}, {"en": "People with low self-esteem are more likely to procrastinate.", "zh": "自尊水平较低的人更容易拖延。"}, {"en": "Another group of people who tend to procrastinate are perfectionists, who worry their work will be judged harshly by others.", "zh": "另一类容易拖延的人是完美主义者，他们担心自己的成果会受到他人的严苛评判。"}, {"en": "We know that if we don't finish that report or complete those home repairs, then what we did can't be evaluated.", "zh": "我们知道，如果不把那份报告写完，或不完成那些家居维修，那么我们已经做出的东西就无法得到评价。"}, {"en": "When we avoid such tasks, we also avoid the negative emotions associated with them.", "zh": "当我们回避这类任务时，也就避开了与之相关的负面情绪。"}, {"en": "This is rewarding, and it conditions us to use procrastination to repair our mood.", "zh": "这种回避会带来满足或轻松感，并使我们逐渐形成通过拖延来改善情绪的习惯性反应。"}, {"en": "If we engage in more enjoyable tasks instead, we get another mood boost.", "zh": "如果我们转而去做更愉快的事情，心情就会进一步好转。"}, {"en": "In the long run, however, procrastination isn't an effective way of managing emotions.", "zh": "然而，从长远来看，拖延并不是一种有效的情绪管理方式。"}, {"en": "The 'mood repair' we experience is temporary.", "zh": "我们体验到的这种“情绪修复”只是暂时的。"}, {"en": "Afterwards, people tend to be left with a sense of guilt that not only increases their negative mood, but also reinforces their tendency to procrastinate.", "zh": "事后，人们往往会留下内疚感；这种内疚不仅加重他们的负面情绪，还会强化他们拖延的倾向。"}, {"en": "So why is this such a problem?", "zh": "那么，为什么这会成为如此严重的问题呢？"}, {"en": "When most people think of the costs of procrastination, they think of the toll on productivity.", "zh": "大多数人想到拖延的代价时，想到的是它对生产效率的损害。"}, {"en": "For example, studies have shown that procrastination negatively impacts on student performance.", "zh": "例如，研究表明，拖延会对学生的表现产生负面影响。"}, {"en": "But putting off reading textbooks and writing essays may affect other areas of students' lives.", "zh": "但拖着不读教材、不写论文，还可能影响学生生活中的其他方面。"}, {"en": "In one study of over 3,000 German students over a six-month period, those who reported procrastinating over their university work were also more likely to engage in study-related misconduct, such as cheating and plagiarism.", "zh": "一项针对3,000多名德国学生、历时六个月的研究发现，那些自述在大学学业任务上拖延的学生，也更有可能出现与学习有关的不端行为，例如作弊和抄袭。"}, {"en": "But the behaviour that procrastination was most closely linked with was using fraudulent excuses to get deadline extensions.", "zh": "不过，与拖延关联最密切的行为，是编造虚假理由来获得截止日期的延长。"}, {"en": "Other research shows that employees on average spend almost a quarter of their workday procrastinating, and again this is linked with negative outcomes.", "zh": "其他研究显示，员工平均将工作日中将近四分之一的时间花在拖延上，而这种情况同样与不良结果有关。"}, {"en": "In fact, in one US survey of over 22,000 employees, participants who said they regularly procrastinated had less annual income and less employment stability.", "zh": "事实上，在美国一项针对22,000多名员工的调查中，那些自述经常拖延的参与者，年收入较低，就业稳定性也较差。"}, {"en": "For every one-point increase on a measure of chronic procrastination, annual income decreased by US$15,000.", "zh": "在一项衡量长期拖延程度的评分指标上，分数每增加1分，年收入就相应低15,000美元。"}, {"en": "Procrastination also correlates with serious health and well-being problems.", "zh": "拖延还与严重的健康和身心福祉问题相关。"}, {"en": "A tendency to procrastinate is linked to poor mental health, including higher levels of depression and anxiety.", "zh": "拖延倾向与较差的心理健康状况有关，包括较高程度的抑郁和焦虑。"}, {"en": "Across numerous studies, I've found people who regularly procrastinate report a greater number of health issues, such as headaches, flu and colds, and digestive issues.", "zh": "在多项研究中，我发现，经常拖延的人自述的健康问题更多，例如头痛、流感、感冒和消化方面的问题。"}, {"en": "They also experience higher levels of stress and poor sleep quality.", "zh": "他们还承受更高程度的压力，而且睡眠质量较差。"}, {"en": "They are less likely to practise healthy behaviours, such as eating a healthy diet and regularly exercising, and use destructive coping strategies to manage their stress.", "zh": "他们较少采取健康行为，例如健康饮食和经常锻炼；同时，他们会采用有害的应对策略来处理压力。"}, {"en": "In one study of over 700 people, I found people prone to procrastination had a 63% greater risk of poor heart health after accounting for other personality traits and demographics.", "zh": "在一项涉及700多人的研究中，我发现，在考虑并控制其他人格特质和人口统计学因素后，容易拖延的人心脏健康不佳的风险高出63%。"}, {"en": "Finding better ways of managing our emotions is one route out of the vicious cycle of procrastination.", "zh": "找到更好的情绪管理方式，是摆脱拖延恶性循环的一条途径。"}, {"en": "An important first step is to manage our environment and how we view the task.", "zh": "一个重要的起点，是管理我们所处的环境，并调整我们看待任务的方式。"}, {"en": "There are a number of evidence-based strategies that can help us fend off distractions that can occupy our minds when we should be focusing on the thing we should be getting on with.", "zh": "有多种有研究证据支持的策略，可以帮助我们抵御干扰；这些干扰会在我们本该专注于手头任务时，占据我们的注意力。"}, {"en": "For example, reminding ourselves about why the task is important and valuable can increase positive feelings towards it.", "zh": "例如，提醒自己这项任务为什么重要、为什么有价值，可以增加我们对它的积极感受。"}, {"en": "Forgiving ourselves and feeling compassion when we procrastinate can help break the procrastination cycle.", "zh": "拖延时，原谅自己并对自己抱有体谅之心，可以帮助打破拖延循环。"}, {"en": "We should admit that we feel bad, but not be overly critical of ourselves.", "zh": "我们应该承认自己感到难受，但不应过分苛责自己。"}, {"en": "We should remind ourselves that we're not the first person to procrastinate, nor the last.", "zh": "我们应该提醒自己：我们不是第一个拖延的人，也不会是最后一个。"}, {"en": "Doing this can take the edge off the negative feelings we have about ourselves when we procrastinate.", "zh": "这样做，可以减轻我们拖延时对自己产生的负面感受。"}, {"en": "This can all make it easier to get back on track.", "zh": "这些做法都能让我们更容易回到正轨。"}], "examples": [{"en": "I kept putting off writing the report.", "zh": "我一直拖着不写报告。"}, {"en": "She put off replying because she did not know what to say.", "zh": "她不知道该说什么，因此迟迟没有回复。"}, {"en": "We should not put off dealing with the problem.", "zh": "我们不应拖延处理这个问题。"}, {"en": "I am trying to break the habit of checking my phone before bed.", "zh": "我正努力改掉睡前查看手机的习惯。"}, {"en": "It can take time to break a long-standing habit.", "zh": "改掉一个长期习惯可能需要时间。"}, {"en": "She broke the habit by changing her daily routine.", "zh": "她通过调整日常安排改掉了这个习惯。"}, {"en": "Today I will focus on reviewing my reading mistakes.", "zh": "今天我会专注于复盘阅读错题。"}, {"en": "The report focuses on the causes of procrastination.", "zh": "报告重点讨论拖延的原因。"}, {"en": "He focused on easier activities instead of starting the main task.", "zh": "他把注意力放在更容易的活动上，没有开始主要任务。"}, {"en": "We all feel uncertain from time to time.", "zh": "我们每个人偶尔都会感到不确定。"}, {"en": "I still look through my old notes from time to time.", "zh": "我仍会时不时翻看以前的笔记。"}, {"en": "She works from home from time to time.", "zh": "她偶尔在家办公。"}, {"en": "I did not want to let my friend down.", "zh": "我不想让朋友失望。"}, {"en": "He apologised for letting the team down.", "zh": "他因让团队失望而道歉。"}, {"en": "She felt that she had let herself down.", "zh": "她觉得自己辜负了自己的期待。"}, {"en": "I need to put together a short presentation.", "zh": "我需要准备一份简短的演示报告。"}, {"en": "The team put together a detailed research proposal.", "zh": "团队编写了一份详细的研究计划书。"}, {"en": "We put together the bookshelf yesterday.", "zh": "我们昨天组装了书架。"}, {"en": "I will do my best to complete the task today.", "zh": "我会尽力在今天完成任务。"}, {"en": "The teacher did her best to explain the concept clearly.", "zh": "老师尽力把这个概念解释清楚。"}, {"en": "They did their best to avoid further delays.", "zh": "他们尽力避免进一步延误。"}, {"en": "Let's focus on the task at hand.", "zh": "让我们专注于眼前的任务。"}, {"en": "I turned off my phone so I could finish the job at hand.", "zh": "我关掉了手机，以便完成手头的任务。"}, {"en": "The discussion distracted us from the task at hand.", "zh": "这场讨论让我们偏离了当前需要处理的任务。"}, {"en": "Deep down, I knew I needed to make a change.", "zh": "内心深处，我知道自己需要作出改变。"}, {"en": "She seemed confident, but deep down she was worried.", "zh": "她看起来很自信，但内心深处很担忧。"}, {"en": "Deep down, he wanted to give it another try.", "zh": "内心深处，他想再试一次。"}, {"en": "I stopped checking my phone and got on with my work.", "zh": "我停止查看手机，继续工作。"}, {"en": "We need to get on with preparing the report.", "zh": "我们需要着手准备报告了。"}, {"en": "Once I understood the instructions, I got on with the task.", "zh": "理解要求后，我便开始做任务。"}, {"en": "She berated herself for missing the deadline.", "zh": "她因错过截止时间而责骂自己。"}, {"en": "He kept berating himself for making a small mistake.", "zh": "他因犯了一个小错误而不断责骂自己。"}, {"en": "Instead of berating myself for the delay, I decided to start with one small step.", "zh": "我没有继续责骂自己拖延，而是决定先迈出一小步。"}, {"en": "The noise stopped me from concentrating.", "zh": "噪声让我无法集中注意力。"}, {"en": "Fear of making mistakes can stop people from trying.", "zh": "对犯错的恐惧可能阻止人们尝试。"}, {"en": "The reminder stopped me forgetting the appointment.", "zh": "提醒让我没有忘记预约。"}, {"en": "The researchers examined whether stress was linked to procrastination.", "zh": "研究人员考察了压力是否与拖延有关。"}, {"en": "The decline in sales was linked to changes in demand.", "zh": "销售下降与需求变化有关。"}, {"en": "These two problems may be closely linked to each other.", "zh": "这两个问题可能密切相关。"}, {"en": "Contrary to popular belief, being busy does not always mean being productive.", "zh": "与普遍看法相反，忙碌并不总意味着效率高。"}, {"en": "Contrary to popular belief, the task does not require advanced computer skills.", "zh": "与普遍看法相反，这项任务不需要高阶计算机技能。"}, {"en": "Contrary to popular belief, making a detailed plan is not always the hardest part.", "zh": "与普遍看法相反，制定详细计划不一定是最难的部分。"}, {"en": "The delay was due to a technical problem.", "zh": "延误是由技术问题造成的。"}, {"en": "Her progress was partly due to regular feedback.", "zh": "她的进步部分归功于经常获得反馈。"}, {"en": "The poor result was not simply due to a lack of effort.", "zh": "结果不佳并不只是因为不够努力。"}, {"en": "The workshop focuses on mood management during stressful periods.", "zh": "这个工作坊重点讨论压力时期的情绪管理。"}, {"en": "She began paying more attention to mood management while preparing for exams.", "zh": "备考时，她开始更加关注情绪管理。"}, {"en": "The article explores the relationship between mood management and procrastination.", "zh": "这篇文章探讨情绪管理与拖延之间的关系。"}, {"en": "Your explanation makes sense.", "zh": "你的解释说得通。"}, {"en": "The results make sense when we consider the different conditions.", "zh": "考虑到不同条件，这些结果就能解释得通。"}, {"en": "It makes sense to divide a large task into smaller steps.", "zh": "把大任务分成小步骤是合理的。"}, {"en": "I am more likely to concentrate when my phone is out of reach.", "zh": "手机不在手边时，我更容易集中注意力。"}, {"en": "People may be more likely to postpone tasks they find unpleasant.", "zh": "人们可能更容易推迟那些让自己感到不愉快的任务。"}, {"en": "Students are more likely to ask questions when they feel comfortable.", "zh": "学生感到自在时，更可能提问。"}, {"en": "I kept putting off starting the report.", "zh": "我一直拖着不开始写报告。"}, {"en": "She put off completing the application because one section seemed difficult.", "zh": "因为有一个部分看起来很难，她迟迟没有完成申请。"}, {"en": "He spent the morning organising files while putting off writing the introduction.", "zh": "他一上午都在整理文件，却拖着不写引言。"}, {"en": "I am keen to improve my spoken English.", "zh": "我很想提高英语口语。"}, {"en": "She was not kee const KEY='procrastination-review-v1',SETTINGKEY=KEY+'-settings';
const LABELS={new:'未学',1:'不认识',2:'模糊',3:'认识',4:'熟练'};
const $=id=>document.getElementById(id),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function readLocal(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}}
let state=readLocal(KEY,{}),settings={voice:'',rate:0.9,daily:20,engine:'device',...readLocal(SETTINGKEY,{})};
let view=['cards','dictation','meaning','sentences','library','settings'].includes(location.hash.slice(1))?location.hash.slice(1):'cards',kind='all',scope='due',queue=[],current=null,revealed=false,voices=[],sessionCount=0,answerEN='',answerZH='',meaningOK=false,search='',statusFilter='all',starFilter='all';
const icon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 8q5 4 0 8M19 5q8 7 0 14"/></svg>';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{toast('保存失败：浏览器存储不可用，请导出备份。');return false}}
function saveSettings(){try{localStorage.setItem(SETTINGKEY,JSON.stringify(settings))}catch{toast('设置未保存：浏览器存储不可用。')}}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,4500)}
function rec(x){return state[x.id]||{level:0,due:0,reps:0}}
function eligible(x,now=Date.now()){let r=rec(x);return r.level!==4&&(!r.level||r.due<=now)}
function dayKey(){return new Date().toLocaleDateString('en-CA')}
function todayNew(){return Object.values(state).filter(r=>r.startedDay===dayKey()).length}
function matchesStudyFilters(x){return (kind==='all'||x.type===kind)&&(starFilter==='all'||String(x.stars)===starFilter)}
function candidates(){let all=DATA.items.filter(x=>matchesStudyFilters(x)&&rec(x).level!==4);if(scope==='all')return all.sort((a,b)=>(rec(a).level||1)-(rec(b).level||1));let due=all.filter(x=>rec(x).level&&eligible(x)).sort((a,b)=>rec(a).due-rec(b).due);let fresh=all.filter(x=>!rec(x).level).slice(0,Math.max(0,settings.daily-todayNew()));return [...due,...fresh]}
function buildQueue(){queue=candidates().map(x=>x.id);next()}
function next(){const id=queue.shift();current=DATA.items.find(x=>x.id===id)||null;revealed=false;answerEN='';answerZH='';meaningOK=false;render()}
function navigate(v){view=v;location.hash=v;if(['cards','dictation','meaning'].includes(v))buildQueue();else render()}
function renderStats(){const counts={4:0,2:0,3:0,1:0};DATA.items.forEach(x=>{let l=rec(x).level;if(l)counts[l]++});let due=DATA.items.filter(x=>rec(x).level&&eligible(x)).length;let fresh=DATA.items.filter(x=>!rec(x).level).length;$('stats').innerHTML=`<div class="stat"><b>${due}</b><span>到期复习</span></div><div class="stat"><b>${fresh}</b><span>尚未学习</span></div><div class="stat"><b>${counts[1]+counts[2]+counts[3]}</b><span>正在巩固</span></div><div class="stat"><b>${counts[4]}</b><span>已经熟练</span></div>`;$('progress').style.width=(counts[4]/DATA.items.length*100)+'%';$('progress-label').textContent=`${counts[4]} / ${DATA.items.length}`}
function starSelect(){return `<select id="star-filter" aria-label="按五星难度筛选学习"><option value="all">学习难度 · 全部星级</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${'★'.repeat(n)}${'☆'.repeat(5-n)} · 只学 ${n} 星</option>`).join('')}</select>`}
function contextMeaningHtml(x){let selected=x.contextSenses||[0];return x.zh.split('；').map((sense,i)=>selected.includes(i)?`<span class="context-meaning">${escapeHTML(sense)}<span class="context-badge">本文义</span></span>`:escapeHTML(sense)).join('；')}
function filterControls(){return `<div class="controls"><select id="kind" aria-label="词条类型"><option value="all">全部 · 单词与短语</option><option value="word">只练单词</option><option value="phrase">只练短语</option></select>${starSelect()}<select id="scope" aria-label="练习范围"><option value="due">按计划 · 到期＋新词</option><option value="all">提前练习 · 当前筛选内未熟练词</option></select></div><p class="study-filter-note">${starFilter==='all'?'全部星级':'仅练 '+starFilter+' 星'} · ${DATA.items.filter(x=>matchesStudyFilters(x)&&rec(x).level!==4).length} 条未熟练。可叠加单词／短语筛选；红色释义为本文义。</p>`}
function playButton(text,label='朗读',small=false){return `<button class="speaker${small?' small':''}" data-say="${escapeHTML(text)}" aria-label="${escapeHTML(label)}">${icon}<span>${label}</span></button>`}
function norm(s){return s.normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:…“”"()\[\]]/g,'').replace(/\s+/g,' ').trim()}
function spellingCorrect(){return current&&norm(answerEN)===norm(current.term)}
function reveal(){if(view==='dictation')answerEN=$('en-answer').value;if(view!=='cards')answerZH=$('zh-answer').value;revealed=true;render()}
function grade(level){if(!current||!revealed)return;if(view!=='cards'&&level>=3&&(!meaningOK||(view==='dictation'&&!spellingCorrect()))){toast('请先核对拼写，并确认中文意思基本正确。');return}const old=rec(current),now=Date.now(),reps=(old.reps||0)+1;let interval=level===1?60000:level===2?600000:level===3?[1,3,7,14,30][Math.min(old.level===3?(old.streak||0):0,4)]*86400000:0;state[current.id]={...old,level,reps,due:level===4?null:now+interval,streak:level===3?(old.level===3?(old.streak||0)+1:1):0,startedDay:old.startedDay||dayKey(),updated:now};save();sessionCount++;next()}
function training(){let intro={cards:'先回忆，再揭晓。每一次主动回忆，都在加深记忆。',dictation:'先听英文，再写拼写和中文意思。答案在核对前保持隐藏。',meaning:'看到英文，主动写出中文意思，再对照自评。'};let html=filterControls();if(!current){let selected=DATA.items.filter(matchesStudyFilters);let future=selected.filter(x=>rec(x).level&&rec(x).level!==4&&rec(x).due>Date.now()).sort((a,b)=>rec(a).due-rec(b).due)[0];let complete=selected.length>0&&selected.every(x=>rec(x).level===4);html+=`<section class="card empty"><div class="big">${complete?'✓':'◌'}</div><h2>${complete?'当前筛选内的词，你已经掌握了！':!selected.length?'当前筛选没有词条':'当前筛选的学习计划已完成'}</h2><p class="muted">本轮已完成 ${sessionCount} 次。${future?'下一次复习：'+escapeHTML(new Date(rec(future).due).toLocaleString()):'可以在全部词库查看学习情况。'}</p><p class="small muted">${complete?'熟练词不会自动出现，可在词库改回其他等级。':'不认识的 1 分钟后、模糊的 10 分钟后回来；认识的按天复习。新词每天默认 20 个。'}</p><button id="refresh" class="primary">检查到期复习</button> <button id="early">提前练习当前星级</button></section>`;return html}
let x=current,r=rec(x);html+=`<p class="small muted">${intro[view]}</p><section class="card"><div class="cardtop"><span class="tag">${x.type==='word'?'WORD · 单词':'PHRASE · 短语'} / ${LABELS[r.level]||'未学'}</span><span class="counter">本轮已完成 ${sessionCount} · 待练 ${queue.length+1}</span></div><div class="center">`;
if(view==='dictation'&&!revealed){html+=`<div class="term">Listen & recall</div><p class="muted small">点击小喇叭，听清后填写答案</p><button id="listen" class="speaker">${icon} 播放英文</button> <button id="slow" class="speaker small">慢速再听</button>`}else html+=`<div class="term">${escapeHTML(x.term)}</div>${wordMeta(x)}${playButton(x.term,'播放读音')}`;
if(view!=='cards'&&!revealed)html+=`<div class="practice-input">${view==='dictation'?'<label>英文单词或短语<input id="en-answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入你听到的英文"></label>':''}<label>中文释义<textarea id="zh-answer" placeholder="写出你理解的中文意思"></textarea></label></div>`;
if(!revealed)html+=`<p style="margin-top:25px"><button id="reveal" class="primary">${view==='cards'?'揭晓释义':'核对答案'}</button></p>`;
else{html+=`<div class="meaning">${contextMeaningHtml(x)}</div>`;if(x.note&&x.note!==x.term)html+=`<p class="small muted">文档用法：${escapeHTML(x.note)}</p>`;
if(view!=='cards'){html+=`<div class="answer">${view==='dictation'?`<p class="${spellingCorrect()?'ok':'warning'}">${spellingCorrect()?'✓ 英文拼写正确':'请再记一次：'+escapeHTML(x.term)}</p><p>你的英文：${escapeHTML(answerEN)||'（未填写）'}</p>`:''}<p>你的中文：${escapeHTML(answerZH)||'（未填写）'}</p><label><input id="meaning-ok" type="checkbox" ${meaningOK?'checked':''}> 我已对照，中文意思基本正确</label><p class="small muted">中文接受同义表达，由你自评；英文忽略大小写、标点和多余空格。</p></div>`}
if(x.examples.length){html+=`<div class="example">${x.examples.slice(0,3).map(e=>`<p>${escapeHTML(e.en)}</p><p class="small muted">${escapeHTML(e.zh)}</p>${playButton(e.en,e.added?'补充例句朗读':'例句朗读',true)}`).join('<div style="height:15px"></div>')}</div>`}}
if(revealed)html+=memoryHtml(x);html+='</div>';
if(revealed){let gated=view!=='cards'&&(!meaningOK||(view==='dictation'&&!spellingCorrect()));html+=`<div class="grades">${[[1,'不认识','1 分钟后'],[2,'模糊','10 分钟后'],[3,'认识','1 / 3 / 7 / 14 / 30 天'],[4,'熟练','退出自动复习']].map(([n,l,t])=>`<button data-grade="${n}" ${gated&&n>=3?'disabled':''}><b>${l}</b><small>${t}</small></button>`).join('')}</div><p class="hint">根据回忆表现选择等级。只有你主动标记“熟练”，才会退出自动复习。</p>`}
return html+'</section><div class="bottom"><span>间隔复习 · 优先复习到期词</span><button id="skip">暂时跳过</button></div>'}
function formatIPA(s){return s.split('；').map(p=>{let m=p.match(/^([^（]+)(.*)$/);return '/'+escapeHTML(m?m[1]:p)+'/'+escapeHTML(m?m[2]:'')}).join('；')}
function wordMeta(x){return `<div class="word-meta">${x.pos?`<span class="pos">${escapeHTML(x.pos)}</span>`:""}${x.ipa?`<span class="ipa" lang="en-GB">${formatIPA(x.ipa)}</span>`:''}<span class="stars" role="img" aria-label="学习难度 ${x.stars} 星，共 5 星" title="学习难度 ${x.stars}/5">${'★'.repeat(x.stars)}${'☆'.repeat(5-x.stars)} <span class="star-label">难度 ${x.stars}/5</span></span></div>`}
function memoryHtml(x){if(!x.memory)return '';let m=x.memory;return `<section class="memory-panel" aria-label="${escapeHTML(x.term)}的词根记忆法"><h3>词根与构词记忆 <span class="memory-label">${escapeHTML(m.method)}</span></h3><p><b>拆分／来源：</b>${escapeHTML(m.parts)}</p><p><b>这样记：</b>${escapeHTML(m.tip)}</p><p class="memory-family"><b>一起记：</b>${escapeHTML(m.family)}</p>${m.source?`<a href="${escapeHTML(m.source)}" target="_blank" rel="noopener noreferrer">查看词源参考 · Etymonline</a>`:''}</section>`}
function library(){let rows=DATA.items.filter(x=>(kind==='all'||kind===x.type)&&(statusFilter==='all'||String(rec(x).level||'new')===statusFilter)&&(starFilter==='all'||String(x.stars)===starFilter)&&(x.term+' '+x.zh+' '+(x.ipa||'')+' '+(x.pos||'')).toLowerCase().includes(search.trim().toLowerCase()));return `<label class="library-search" for="search">搜索全部词库</label><div class="controls"><input id="search" type="search" aria-label="搜索词库" placeholder="输入英文、中文或音标，例如：procrastination / 拖延 / 动词" value="${escapeHTML(search)}"><select id="kind"><option value="all">全部类型</option><option value="word">单词</option><option value="phrase">短语</option></select><select id="status-filter"><option value="all">所有熟练程度</option>${Object.entries(LABELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="star-filter" aria-label="按五星难度筛选"><option value="all">所有难度等级</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${"★".repeat(n)} · ${n} 星</option>`).join('')}</select></div><p class="search-help">支持英文、中文、音标实时搜索，可叠加词条类型、熟练程度与星级筛选。</p><p class="small muted">共 ${rows.length} 条。可手动调整等级；熟练词也会保留在这里供查阅。</p><section class="card">${rows.map(x=>`<article class="list-item"><div class="listhead"><b>${escapeHTML(x.term)}</b>${playButton(x.term,'读音',true)}</div>${wordMeta(x)}<p>${contextMeaningHtml(x)}</p>${x.note?`<p class="small muted">文档用法与其他义：${escapeHTML(x.note)}</p>`:""}${memoryHtml(x)}<select data-level-id="${x.id}" aria-label="${escapeHTML(x.term)}的熟练程度">${Object.entries(LABELS).map(([k,v])=>`<option value="${k}" ${(rec(x).level||'new')==k?'selected':''}>${v}</option>`).join('')}</select>${x.examples.length?`<details><summary>查看例句</summary>${x.examples.map(e=>`<p>${escapeHTML(e.en)}</p><p class="muted small">${escapeHTML(e.zh)}</p>${playButton(e.en,e.added?'补充例句朗读':'例句朗读',true)}`).join('')}</details>`:''}</article>`).join('')||'<p>没有匹配的词条。</p>'}</section>`}
function sentences(){return `<p class="muted">${DATA.sentences.length} 个原文句子 · ${DATA.examples.length} 个文档学习例句。先听，再展开中文。</p><div class="controls"><input id="sentence-search" placeholder="搜索原文或例句" aria-label="搜索句子" value="${escapeHTML(search)}"><select id="sentence-type"><option value="original">原文句子</option><option value="examples">文档学习例句</option></select></div><section class="card" id="sentence-list"></section>`}
let sentenceType='original';
function sentenceList(){if(!$('sentence-list'))return;let rows=(sentenceType==='original'?DATA.sentences:DATA.examples).filter(x=>(x.en+x.zh).toLowerCase().includes(search.toLowerCase()));$('sentence-list').innerHTML=rows.map((x,i)=>`<article class="list-item"><span class="tag">${String(i+1).padStart(2,'0')}</span><p style="font-size:18px">${escapeHTML(x.en)}</p>${playButton(x.en,'朗读整句',true)}<details><summary>查看中文</summary><p>${escapeHTML(x.zh)}</p></details></article>`).join('')||'<p>没有匹配的句子。</p>'}
function settingsPage(){return `<section class="card settings"><h2>让学习适合你</h2><details><summary>五星难度、音标与词性说明</summary><p class="small muted">1 星：基础词；2 星：日常常用词；3 星：雅思阅读常见词；4 星：进阶词；5 星：专业或生僻词。在翻卡复习、听写训练、看词写义中均可按星级选择学习范围。星级是本词库的学习难度建议，并非官方考试等级，与“熟练、认识、模糊、不认识”的个人掌握情况分开记录。</p><p class="small muted">全部 178 个单词附词性与英式常用音标。词性按本词库收录的常用义项标注；n. 名词，v. 动词，adj. 形容词，adv. 副词，prep. 介词，conj. 连词，det. 限定词，pron. 代词。四星、五星的 26 个单词配有词根、构词或借词联想记忆；借词和无可靠拆分的词会明确说明，联想不等同于真实词源。本文涉及不同语境中的熟词生义；重复词条合并保留，红色为文档句中义，其他用法单独说明。increase 和 impact 的读音区分词性。听写时不显示音标，核对答案后才显示。</p></details><label>英语朗读音色<select id="voice-select"></select></label><p class="small muted">优先推荐 Natural、Neural、Premium 等自然音色。可用音色由浏览器和系统提供；没有自然音色时，请在设备的语音设置中添加英语增强语音。</p><label>语速 <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="${settings.rate}"><span id="rate-label">${settings.rate} ×</span></label><label>发音来源<select id="engine"><option value="device">设备英语语音 · 单词、短语、句子</option><option value="dictionary">在线词典发音 · 词条优先，失败转设备语音</option></select></label><p class="small muted">在线词典发音需要联网，会把所读词条发送给有道词典。句子始终使用所选设备音色。</p><div>${playButton('We can break the habit of putting off important tasks.','试听所选音色')}</div><label>每天新词数量<input id="daily" type="number" min="1" max="100" value="${settings.daily}"></label><details open><summary>复习规则</summary><div class="rules"><p>不认识：1 分钟后再出现。模糊：10 分钟后再出现。认识：连续选择后，间隔按 1、3、7、14、30 天增加；再次选模糊或不认识会重置这个连续间隔。</p><p>熟练：退出所有自动复习和提前练习；可在全部词库中重新调整等级。新词每天默认 20 个，到期词不受新词上限限制。网页关闭后不弹通知，下次打开会列出到期词。</p><p>“提前练习”允许在到期前复习所有未熟练词。练习结果需要选择等级才会保存。</p></div></details><div><h2>进度备份</h2><p class="muted small">记录只保存在当前浏览器，不会自动同步到 GitHub 或其他设备。换设备前先导出。</p><div class="row"><button id="export">导出进度</button><label><span class="sr">导入进度文件</span><input id="import" type="file" accept="application/json,.json"></label></div></div><p class="small muted">词库：${DATA.items.filter(x=>x.type==='word').length} 个单词与词汇条目、${DATA.items.filter(x=>x.type==='phrase').length} 组短语。模板中的省略号不参与拼写；部分语法模板已改为可听写的具体表达，可在答案处查看文档形式。</p></section>`}
function render(){renderStats();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('subtitle').textContent={cards:'Procrastination · 拖延 / 翻卡复习',dictation:'Procrastination · 拖延 / 听英文，写英文与中文',meaning:'Procrastination · 拖延 / 看英文，写中文释义',sentences:'在句子里，听懂每一个词。',library:'你的 Procrastination 词库',settings:'学习偏好与进度管理'}[view];$('app').innerHTML=['cards','dictation','meaning'].includes(view)?training():view==='library'?library():view==='sentences'?sentences():settingsPage();
if($('kind')){$('kind').value=kind;$('kind').onchange=e=>{kind=e.target.value;if(view==='library')render();else buildQueue()}}if($('scope')){$('scope').value=scope;$('scope').onchange=e=>{scope=e.target.value;buildQueue()}}
if($('reveal'))$('reveal').onclick=reveal;if($('listen'))$('listen').onclick=()=>speak(current.term,true);if($('slow'))$('slow').onclick=()=>speak(current.term,true,0.65);if($('meaning-ok'))$('meaning-ok').onchange=e=>{meaningOK=e.target.checked;render()};if($('skip'))$('skip').onclick=()=>{next()};if($('refresh'))$('refresh').onclick=buildQueue;if($('early'))$('early').onclick=()=>{scope='all';buildQueue()};
if($('star-filter')){$('star-filter').value=starFilter;$('star-filter').onchange=e=>{starFilter=e.target.value;if(['cards','dictation','meaning'].includes(view))buildQueue();else render()}}if($('search'))$('search').oninput=e=>{let pos=e.target.selectionStart;search=e.target.value;render();$('search').focus();$('search').setSelectionRange(pos,pos)};if($('status-filter')){$('status-filter').value=statusFilter;$('status-filter').onchange=e=>{statusFilter=e.target.value;render()}}
if(view==='sentences'){$('sentence-type').value=sentenceType;$('sentence-type').onchange=e=>{sentenceType=e.target.value;sentenceList()};$('sentence-search').oninput=e=>{search=e.target.value;sentenceList()};sentenceList()}
if(view==='settings'){voiceOptions();$('engine').value=settings.engine;$('engine').onchange=e=>{settings.engine=e.target.value;saveSettings()};$('voice-select').onchange=e=>{settings.voice=e.target.value;saveSettings();voiceStatus()};$('rate').oninput=e=>{settings.rate=Number(e.target.value);$('rate-label').textContent=settings.rate+' ×';saveSettings()};$('daily').onchange=e=>{settings.daily=Math.max(1,Math.min(100,parseInt(e.target.value)||20));e.target.value=settings.daily;saveSettings()};$('export').onclick=exportData;$('import').onchange=importData}}
document.addEventListener('click',e=>{let v=e.target.closest('[data-view]');if(v){stopSound();search='';navigate(v.dataset.view)}let p=e.target.closest('[data-say]');if(p)speak(p.dataset.say,DATA.items.some(x=>x.term===p.dataset.say));let g=e.target.closest('[data-grade]');if(g)grade(Number(g.dataset.grade))});
document.addEventListener('change',e=>{let id=e.target.dataset.levelId;if(!id)return;let level=e.target.value;if(level==='new')delete state[id];else{let old=state[id]||{};state[id]={...old,level:Number(level),due:level==='4'?null:Date.now(),streak:0,reps:old.reps||0,startedDay:old.startedDay||dayKey(),updated:Date.now()}}save();renderStats()});
let audio=null,soundToken=0;
function stopSound(){soundToken++;if(audio){audio.pause();audio=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
function voiceScore(v){return (/natural|neural|premium|enhanced/i.test(v.name)?100:0)+(!v.localService?30:0)+(/^en-GB/i.test(v.lang)?10:0)+(/Google|Microsoft|Samantha|Daniel|Serena/i.test(v.name)?5:0)}
function selectedVoice(){return voices.find(v=>v.voiceURI===settings.voice)||voices[0]}
function loadVoices(){voices=('speechSynthesis'in window?speechSynthesis.getVoices():[]).filter(v=>/^en(?:-|_)/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));voiceStatus();if(view==='settings')voiceOptions()}
function voiceStatus(){let v=selectedVoice();$('voice-status').textContent=v?'英语音色 · '+v.name:('speechSynthesis'in window?'未检测到英语音色，请查看学习设置':'此浏览器不支持设备朗读，请尝试在线词典发音或其他浏览器')}
function voiceOptions(){if(!$('voice-select'))return;$('voice-select').innerHTML='<option value="">自动选择 · 优先自然英语音色</option>'+voices.map(v=>`<option value="${escapeHTML(v.voiceURI)}">${escapeHTML(v.name)} · ${escapeHTML(v.lang)}</option>`).join('');$('voice-select').value=settings.voice}
function deviceSpeech(text,rate,token){if(token!==soundToken)return;if(!('speechSynthesis'in window)){toast('此浏览器不支持语音朗读，请换用支持语音的浏览器。');return}loadVoices();let v=selectedVoice();if(!v){toast('未检测到英语音色，请在系统中添加英语语音后重试。');return}let u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=rate;u.pitch=1;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))toast('朗读未成功，请换一个英语音色。')};speechSynthesis.speak(u)}
function speak(text,isTerm=false,rate=settings.rate){stopSound();const token=soundToken;let spoken=text.replace(/\bA\b/g,'A').replace(/…/g,' ').replace(/[＋+]/g,' ');if(settings.engine==='dictionary'&&isTerm){audio=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(spoken)+'&type=1');audio.playbackRate=rate;let finished=false;const fallback=()=>{if(finished||token!==soundToken)return;finished=true;if(audio)audio.pause();toast('在线发音不可用，已切换设备音色。');deviceSpeech(spoken,rate,token)};const timer=setTimeout(fallback,7000);audio.onplaying=()=>{finished=true;clearTimeout(timer)};audio.onerror=fallback;audio.play().catch(fallback);return}deviceSpeech(spoken,rate,token)}
function exportData(){let blob=new Blob([JSON.stringify({app:KEY,version:1,exportedAt:new Date().toISOString(),state,settings},null,2)],{type:'application/json'});let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='Procrastination-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.app!==KEY||d.version!==1||!d.state||typeof d.state!=='object'||Array.isArray(d.state))throw Error();let valid=new Set(DATA.items.map(x=>x.id)),incoming={};for(let [id,r]of Object.entries(d.state)){if(!valid.has(id))continue;if(!r||![1,2,3,4].includes(r.level)||!Number.isFinite(r.updated)||!Number.isFinite(r.reps)||r.reps<0||(r.level!==4&&!Number.isFinite(r.due)))throw Error();incoming[id]={level:r.level,due:r.level===4?null:r.due,reps:r.reps,updated:r.updated,streak:Number.isFinite(r.streak)?Math.max(0,r.streak):0,startedDay:typeof r.startedDay==='string'?r.startedDay:dayKey()}}for(let[id,r]of Object.entries(incoming))if(!state[id]||r.updated>=(state[id].updated||0))state[id]=r;save();render();toast('进度已导入：按最后更新时间合并，不覆盖较新的记录。')}catch{toast('导入失败：请选择本页面导出的有效进度文件。')}finally{if($('import'))$('import').value=''}}
window.addEventListener('hashchange',()=>{let v=location.hash.slice(1);if(v!==view&&['cards','dictation','meaning','sentences','library','settings'].includes(v))navigate(v)});
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,1200)}else voiceStatus();
setInterval(()=>{renderStats();if(['cards','dictation','meaning'].includes(view)&&!current&&!document.querySelector('#en-answer')){let ids=candidates().map(x=>x.id);if(ids.length){queue=ids;next()}}},15000);
if(['cards','dictation','meaning'].includes(view))buildQueue();else render();
</script></body></html>
