 on the collections there.", "zh": "她们就读的伦敦学校注重文化方面的学习，而非学术课程；她们还与家庭女教师Jane Blaker广泛游历，参观美术馆，并对馆内藏品做了详尽的笔记。"}, {"en": "While it was long assumed that these men were largely responsible for the nature of the sisters' collection, it has recently been accepted that Gwendoline and Margaret retained a far more active role in the process.", "zh": "虽然长期以来，人们一直认为这两位男士在很大程度上决定了姐妹俩收藏的特色，但近来人们已认可：格温多琳与玛格丽特在这一过程中所发挥的主动作用，比过去认为的要大得多。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0, 1, 2, 3], "id": "davies-sisters-aa6e96e7a389"}, {"term": "late", "ipa": "leɪt", "zh": "某时期末尾的；某一时期后期的", "note": "其他义：迟到的；已故的，如 her late father / 不是“迟到的”；the late 1800s 表示时代范围", "type": "word", "examples": [{"en": "Between 1908 and 1924, Gwendoline and Margaret Davies amassed one of the largest collections of late-nineteenth and early-twentieth-century French paintings in Britain.", "zh": "1908年至1924年间，格温多琳与玛格丽特·戴维斯积累了一批法国绘画藏品。这些作品创作于19世纪末至20世纪初，该收藏的规模在英国同类收藏中位居前列。"}, {"en": "The movement developed in the late 1800s.", "zh": "这一流派形成于19世纪后期。"}, {"en": "The building was constructed in the late 1800s.", "zh": "这栋建筑建于19世纪后期。"}], "pos": "adj. 形容词", "stars": 1, "contextSenses": [0, 1], "id": "davies-sisters-49a3999d21d4"}, {"term": "early", "ipa": "ˈɜːli", "zh": "某时期初期的", "note": "也可表示早的、提前的", "type": "word", "examples": [{"en": "Between 1908 and 1924, Gwendoline and Margaret Davies amassed one of the largest collections of late-nineteenth and early-twentieth-century French paintings in Britain.", "zh": "1908年至1924年间，格温多琳与玛格丽特·戴维斯积累了一批法国绘画藏品。这些作品创作于19世纪末至20世纪初，该收藏的规模在英国同类收藏中位居前列。"}, {"en": "Instead, their early purchases were of the fashionable, safe variety, and included, for example, paintings by the French artist Jean-Baptiste-Camille Corot.", "zh": "因此，她们早期购买的主要是当时流行、选择较稳妥的那类作品，例如法国画家让-巴蒂斯特-卡米耶·柯罗的画作。"}, {"en": "By the early 1920s, Gwendoline felt increasingly uncomfortable buying art works when faced with the poverty and social upheaval created by the First World War.", "zh": "到20世纪20年代初，面对第一次世界大战造成 ，即使没有超出她们的财力，也超出了她们愿意支付的金额。"}, {"en": "I am willing to pay more for a reliable product.", "zh": "我愿意为可靠的产品多付一些钱。"}, {"en": "The price exceeded what she was willing to pay.", "zh": "价格超过了她愿意支付的金额。"}], "pos": "adj. 形容词", "stars": 2, "contextSenses": [0], "id": "davies-sisters-8c61aaa92703"}, {"term": "pay", "ipa": "peɪ", "zh": "支付", "note": "pay for something“为某物付款”；过去式和过去分词 paid", "type": "word", "examples": [{"en": "Quite simply, high quality Old Master works were, if not beyond their means, then beyond what they were willing to pay for them.", "zh": "说得直白些，优质古典大师作品的价格，即使没有超出她们的财力，也超出了她们愿意支付的金额。"}, {"en": "I am willing to pay more for a reliable product.", "zh": "我愿意为可靠的产品多付一些钱。"}, {"en": "The price exceeded what she was willing to pay.", "zh": "价格超过了她愿意支付的金额。"}], "pos": "v. 动词", "stars": 1, "contextSenses": [0], "id": "davies-sisters-ccc745f2ad88"}, {"term": "instead", "ipa": "ɪnˈsted", "zh": "转而，作为替代", "note": "指没有采取前述选择，改选其他对象", "type": "word", "examples": [{"en": "Instead, their early purchases were of the fashionable, safe variety, and included, for example, paintings by the French artist Jean-Baptiste-Camille Corot.", "zh": "因此，她们早期购买的主要是当时流行、选择较稳妥的那类作品，例如法国画家让-巴蒂斯特-卡米耶·柯罗的画作。"}], "pos": "adv. 副词", "stars": 2, "contextSenses": [0], "id": "davies-sisters-c93de0a778df"}, {"term": "fashionable", "ipa": "ˈfæʃənəbl", "zh": "流行的，受到追捧的；当时流行的", "note": "不限于衣着，也可修饰观点、地区、艺术风格 / 不限于服装，也可形容观点、艺术风格等", "type": "word", "examples": [{"en": "Instead, their early purchases were of the fashionable, safe variety, and included, for example, paintings by the French artist Jean-Baptiste-Camille Corot.", "zh": "因此，她们早期购买的主要是当时流行、选择较稳妥的那类作品，例如法国画家让-巴蒂斯特-卡米耶·柯罗的画作。"}, {"en": "Yet they didn't feel obliged to follow fashionable tastes and were free to pursue their own preferences.", "zh": "然而，她们并不觉得自己必须追随流行品味，因此能够自由地按照自己的偏好进行收藏。"}, {"en": "The collectors did not simply follow fashionable tastes.", "zh": "这些收藏家并非只是追随流行品味。"}], "pos": "adj. 形容词", "stars": 3, "contextSenses": [0, 1], "id": "davies-sisters-1d87af596528"}, {"term": "safe", "ipa": "seɪf", "zh": "稳妥的，风险较小的", "note": "熟词生义；不一定指人身或物品安全", "type": "word", "examples": [{"en": "Instead, their early purchases were of the fashionable, safe variety, and included, for example, paintings by the French artist Jean-Baptiste-Camille Corot.", "zh": "因此，她们早期购买的主要是当时流行、选择较稳妥的那类作品，例如法国画家让-巴蒂斯特-卡米耶·柯罗的画作。"}, {"en": "Their initial response to the war effort was to finance the safe passage of artists from occupied Belgium to Wales, as a humanitarian act, but also with the hope of establishing a vibrant artists' community in the area.", "zh": "她们最初参与战时支援的方式，是出资帮助艺术家从被占领的比利时安全前往威尔士。这既是出于人道主义援助，也寄望于在当地建立一个充满活力的艺术家社群。"}, {"en": "The fund financed the safe passage of several families.", "zh": "这项基金资助几个家庭安全转移。"}], "pos": "adj. 形容词", "stars": 1, "contextSenses": [0], "id": "davies-sisters-2ee1cb63ee3e"}, {"term": "variety", "ipa": "vəˈraɪəti", "zh": "类型，种类", "note": "a variety of则表示“各种各样的”", "type": "word", "examples": [{"en": "Instead, their early purchases were of the fashionable, safe variety, and included, for example, paintings by the French artist Jean-Baptiste-Camille Corot.", "zh": "因此，她们早期购买的主要是当时流行、选择较稳妥的那类作品，例如法国画家让-巴蒂斯特-卡米耶·柯罗的画作。"}, {"en": "His jokes are usually of the gentle, harmless variety.", "zh": "他的笑话通常属于温和、无伤大雅的类型。"}, {"en": "Their early purchases were of the traditional variety.", "zh": "她们早期买的作品属于传统类型。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0], "id": "davies-sisters-66077cf6e4ac"}, {"term": "include", "ipa": "ɪnˈkluːd", "zh": "包括", "note": "后面的例子不一定穷尽全部藏品", "type": "word", "examples": [{"en": "Instead, their early purchases were of the fashionable, safe variety, and included, for example, paintings by the French artist Jean-Baptiste-Camille Corot.", "zh": "因此，她们早期购买的主要是当时流行、选择较稳妥的那类作品，例如法国画家让-巴蒂斯特-卡米耶·柯罗的画作。"}, {"en": "Their purchases included paintings by Corot.", "zh": "她们购入的作品包括柯罗的画作。"}, {"en": "The exhibition included scenes of Paris by a local artist.", "zh": "展览包括一位当地艺术家创作的巴黎街景画。"}], "pos": "v. 动词", "stars": 2, "contextSenses": [0], "id": "davies-sisters-33cd3ff897e8"}, {"term": "artist", "ipa": "ˈɑːtɪst", "zh": "艺术家，画家；艺术家", "note": "本句具体指绘画创作者 / 本文主要涉及绘画创作者", "type": "word", "examples": [{"en": "Instead, their early purchases were of the fashionable, safe variety, and included, for example, paintings by the French artist Jean-Baptiste-Camille Corot.", "zh": "因此，她们早期购买的主要是当时流行、选择较稳妥的那类作品，例如法国画家让-巴蒂斯特-卡米耶·柯罗的画作。"}, {"en": "Whatever the precise reason for this change, their first purchases of Impressionist art, made in October 1912, were scenes of Venice by the French artist Claude Monet.", "zh": "无论这一转变的确切原因是什么，她们于1912年10月首次购入的印象派作品，是法国画家克洛德·莫奈描绘威尼斯景色的画作。"}, {"en": "Their initial response to the war effort was to finance the safe passage of artists from occupied Belgium to Wales, as a humanitarian act, but also with the hope of establishing a vibrant artists' community in the area.", "zh": "她们最初参与战时支援的方式，是出资帮助艺术家从被占领的比利时安全前往威尔士。这既是出于人道主义援助，也寄望于在当地建立一个充满活力的艺术家社群。"}], "pos": "n. 名词", "stars": 1, "contextSenses": [0, 1], "id": "davies-sisters-dcefb3097cd7"}, {"term": "direction", "ipa": "dəˈrekʃən", "zh": "发展方向", "note": "不仅指空间方向，也可指事业、政策等的走向", "type": "word", "examples": [{"en": "However, it was only a few years before their collecting took a new direction and they turned to the work of the French Impressionists***.", "zh": "然而，仅仅过了几年，她们的收藏便转向了新的方向，开始关注法国印象派画家的作品。"}, {"en": "Her research took a new direction after the discovery.", "zh": "这一发现之后，她的研究转向了新的方向。"}, {"en": "The company's strategy took a new direction.", "zh": "公司的战略发生了转向。"}], "pos": "n. 名词", "stars": 3, "contextSenses": [0], "id": "davies-sisters-84a7169e1fbd"}, {"term": "turn to", "ipa": "ˈtɜːn tə", "zh": "转向，开始关注", "note": "还可表示求助于，如turn to somebody for help", "type": "phrase", "examples": [{"en": "The collectors began to turn to the work of French painters.", "zh": "收藏家们开始转向法国画家的作品。"}], "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "davies-sisters-a0448d3072d3"}, {"t ugh Blaker, as a champion of contemporary French art, had a hand in the decision, and we know also that they would have seen examples on their various trips to Paris.", "zh": "我们知道，Hugh Blaker作为法国当代艺术的积极支持者，参与影响了这一决定；我们也知道，她们在多次巴黎之行中，想必见过这类作品。"}, {"en": "We took advice from several specialists before making a decision.", "zh": "作决定前，我们听取了几位专家的建议。"}, {"en": "It was long assumed that the advisers had made most of the decisions.", "zh": "长期以来，人们一直认为大多数决定由顾问作出。"}], "pos": "n. 名词", "stars": 2, "contextSenses": [0], "id": "davies-sisters-8717971538d1"}, {"term": "example", "ipa": "ɪɡˈzɑːmpəl", "zh": "某类事物的实例；代表性实例", "note": "此处具体指这类艺术作品 / 本句指具体艺术作品", "type": "word", "examples": [{"en": "Instead, their early purchases were of the fashionable, safe variety, and included, for example, paintings by the French artist Jean-Baptiste-Camille Corot.", "zh": "因此，她们早期购买的主要是当时流行、选择较稳妥的那类作品，例如法国画家让-巴蒂斯特-卡米耶·柯罗的画作。"}, {"en": "We know that Hugh Blaker, as a champion of contemporary French art, had a hand in the decision, and we know also that they would have seen examples on their various trips to Paris.", "zh": "我们知道，Hugh Blaker作为法国当代艺术的积极支持者，参与影响了这一决定；我们也知道，她们在多次巴黎之行中，想必见过这类作品。"}, {"en": "The Gwendoline and Margaret Davies collection, donated in 1951 and 1963 respectively to the National Museum Wales, contains major examples of work by leading French Impressionists.", "zh": "格温多琳与玛格丽特·戴维斯收藏分别于1951年和1963年捐赠给威尔士国家博物馆，其中包含法国印象派重要画家的代表性作品。"}], "pos": "n. 名词", "stars": 1, "contextSenses": [0, 1], "id": "davies-sisters-50dbe27a2b90"}, {"term": "whatever", "ipa": "wɒtˈevə", "zh": "无论什么", "note": "引出不影响主句事实成立的条件", "type": "word", "examples": [{"en": "Whatever the precise reason for this change, their first purchases of Impressionist art, made in October 1912, were scenes of Venice by the French artist Claude Monet.", "zh": "无论这一转变的确切原因是什么，她们于1912年10月首次购入的印象派作品，是法国画家克洛德·莫奈描绘威尼斯景色的画作。"}, {"en": "Whatever the precise reason, the plan was abandoned.", "zh": "无论确切原因是什么，计划最终被放弃了。"}, {"en": "Whateve yle of painting.", "zh": "这位艺术家形成了一种独特的绘画风格。"}, {"en": "She preferred a style of painting that emphasised colour.", "zh": "她更喜欢强调色彩的绘画风格。"}, {"en": "The exhibition explored how this style of painting developed.", "zh": "展览探讨了这种绘画风格如何发展起来。"}], "note": "文档表达：a style of painting", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "davies-sisters-8cf54d414d49"}, {"term": "in the late 1800s", "zh": "在19世纪后期", "type": "phrase", "examples": [{"en": "The movement developed in the late 1800s.", "zh": "这一流派形成于19世纪后期。"}, {"en": "The building was constructed in the late 1800s.", "zh": "这栋建筑建于19世纪后期。"}, {"en": "The collection includes paintings created in the late 1800s.", "zh": "这批收藏包含创作于19世纪后期的画作。"}], "note": "文档表达：in the late 1800s", "ipa": "", "pos": "短语／表达", "stars": 3, "contextSenses": [0], "id": "davies-sisters-2de507f84fc4"}], "sentences": [{"en": "Between 1908 and 1924, Gwendoline and Margaret Davies amassed one of the largest collections of late-nineteenth and early-twentieth-century French paintings in Britain.", "zh": "1908年至1924年间，格温多琳与玛格丽特·戴维斯积累了一批法国绘画藏品。这些作品创作于19世纪末至20世纪初，该收藏的规模在英国同类收藏中位居前列。"}, {"en": "Gwendoline (1882–1951) and Margaret (1884–1963) Davies were the granddaughters of David Davies, a Welshman who amassed a fortune in the shipping and mining industries.", "zh": "格温多琳·戴维斯（1882—1951）和玛格丽特·戴维斯（1884—1963）是大卫·戴维斯的孙女。大卫是一位威尔士人，在航运业和采矿业积累了巨额财富。"}, {"en": "In 1907, when Gwendoline came into her inheritance (Margaret would follow in 1909), the sisters were said to be the wealthiest unmarried women in Britain.", "zh": "1907年，格温多琳继承了遗产，玛格丽特则于1909年随后继承。当时，据说这对姐妹是英国最富有的未婚女性。"}, {"en": "Their religious upbringing in rural Wales gave them a deep sense of social responsibility and they chose to use their inheritance for cultural and philanthropic* purposes.", "zh": "她们在威尔士乡村接受的宗教教养，使她们具有强烈的社会责任感，因此她们选择将继承的财富用于文化和慈善公益事业。"}, {"en": "While there was no real family history of art collecting, the sisters' education was rigorously geared toward such pursuits.", "zh": "虽然家族并没有明显的艺术收藏传统，但姐妹俩接受的教育，却经过严格安排，以培养她们从事这类活动的能力和兴趣。"}, {"en": "Their London school focused on cultural rather than academic study, and they travelled extensively with their governess, Jane Blaker, visiting art galleries and making extensive notes on the collections there.", "zh": "她们就读的伦敦学校注重文化方面的学习，而非学术课程；她们还与家庭女教师Jane Blaker广泛游历，参观美术馆，并对馆内藏品做了详尽的笔记。"}, {"en": "The sisters began to make regular art purchases from 1908, which roughly coincided with the dates of their inheritance.", "zh": "姐妹俩从1908年开始经常购买艺术品，这一时间与她们继承遗产的时间大致吻合。"}, {"en": "They took advice from various people, including the art dealer Hugh Blaker (the brother of Jane Blaker) and David Croal Thompson, who was also an art dealer.", "zh": "她们听取了多人的建议，其中包括艺术商Hugh Blaker——家庭女教师Jane Blaker的兄弟——以及同样从事艺术品交易的David Croal Thompson。"}, {"en": "While it was long assumed that these men were largely responsible for the nature of the sisters' collection, it has recently been accepted that Gwendoline and Margaret retained a far more active role in the process.", "zh": "虽然长期以来，人们一直认为这两位男士在很大程度上决定了姐妹俩收藏的特色，但近来人们已认可：格温多琳与玛格丽特在这一过程中所发挥的主动作用，比过去认为的要大得多。"}, {"en": "The sisters' journals reveal their preference for Old Master** paintings.", "zh": "姐妹俩的日记显示，她们偏爱古典大师的绘画作品。"}, {"en": "Yet they initially made very few attempts to secure any such works.", "zh": "然而，最初她们几乎没有尝试购得这类作品。"}, {"en": "While the sisters were wealthy in relative terms, their income was nothing compared to the fortunes of American art collectors of this period, such as J. Pierpont Morgan.", "zh": "虽然相对而言姐妹俩很富有，但与当时美国艺术收藏家——例如J. Pierpont Morgan——的巨额财富相比，她们的收入就显得微不足道。"}, {"en": "Quite simply, high quality Old Master works were, if not beyond their means, then beyond what they were willing to pay for them.", "zh": "说得直白些，优质古典大师作品的价格，即使没有超出她们的财力，也超出了她们愿意支付的金额。"}, {"en": "Instead, their early purchases were of the fashionable, safe variety, and included, for example, paintings by the French artist Jean-Baptiste-Camille Corot.", "zh": "因此，她们早期购买的主要是当时流行、选择较稳妥的那类作品，例如法国画家让-巴蒂斯特-卡米耶·柯罗的画作。"}, {"en": "However, it was only a few years before their collecting took a new direction and they turned to the work of the French Impressionists***.", "zh": "然而，仅仅过了几年，她们的收藏便转向了新的方向，开始关注法国印象派画家的作品。"}, {"en": "We know that Hugh Blaker, as a champion of contemporary French art, had a hand in the decision, and we know also that they would have seen examples on their various trips to Paris.", "zh": "我们知道，Hugh Blaker作为法国当代艺术的积极支持者，参与影响了这一决定；我们也知道，她们在多次巴黎之行中，想必见过这类作品。"}, {"en": "Whatever the precise reason for this change, their first purchases of Impressionist art, made in October 1912, were scenes of Venice by the French artist Claude Monet.", "zh": "无论这一转变的确切原因是什么，她们于1912年10月首次购入的印象派作品，是法国画家克洛德·莫奈描绘威尼斯景色的画作。"}, {"en": "Over the next 12 years, the sisters amassed the bulk of their Impressionist collection, including six further works by Monet, two more by Manet, and three by Renoir, including his well-known painting La Parisienne.", "zh": "在接下来的12年里，姐妹俩积累了她们印象派藏品中的大部分，其中包括另外六件莫奈的作品、另外两件马奈的作品，以及三件雷诺阿的作品；雷诺阿的名作《巴黎女子》（La Parisienne）也在其中。"}, {"en": "The First World War (1914–1918) played a part in the development of the sisters' collection.", "zh": "第一次世界大战（1914—1918年）也对姐妹俩收藏的发展产生了影响。"}, {"en": "Their initial response to the war effort was to finance the safe passage of artists from occupied Belgium to Wales, as a humanitarian act, but also with the hope of establishing a vibrant artists' community in the area.", "zh": "她们最初参与战时支援的方式，是出资帮助艺术家从被占领的比利时安全前往威尔士。这既是出于人道主义援助，也寄望于在当地建立一个充满活力的艺术家社群。"}, {"en": "Later in the conflict, both sisters decided to volunteer at a canteen for troops at Troyes, in northern France; Gwendoline in 1916, followed by Margaret in 1917.", "zh": "战争后期，姐妹俩都决定前往法国北部特鲁瓦的一处军人食堂做志愿服务；格温多琳于1916年先去，玛格丽特则于1917年随后加入。"}, {"en": "It was tedious and distressing work, which would have a permanent effect on Gwendoline's health.", "zh": "那是一份单调乏味、又令人痛苦的工作，后来对格温多琳的健康造成了永久影响。"}, {"en": "Yet on one of numerous trips to nearby Paris, she visited the Bernheim-Jeune Gallery.", "zh": "不过，在多次前往附近巴黎的行程中，有一次她参观了贝尔内姆—热纳画廊。"}, {"en": "Here she acquired two works by Cézanne – Provençal Landscape and The François Zola Dam.", "zh": "她在这里购得了塞尚的两幅作品——《普罗旺斯风景》和《弗朗索瓦·左拉水坝》。"}, {"en": "The paintings were shipped directly to Bath, England, where they became the first works by Cézanne to go on display in a public gallery in Britain.", "zh": "这些画作被直接运往英国巴斯，并在那里成为首批在英国公共美术馆展出的塞尚作品。"}, {"en": "Commentators have often described the sisters as unlikely pioneer collectors.", "zh": "评论者常把姐妹俩描述为出人意料的先驱型收藏家。"}, {"en": "Much is made of their isolation in rural Wales and the fact that they didn't make friends with artists or gallery owners.", "zh": "人们常常特别强调她们身处威尔士乡村、远离艺术圈的处境，以及她们没有与艺术家或画廊主人结交这一事实。"}, {"en": "Yet they didn't feel obliged to follow fashionable tastes and were free to pursue their own preferences.", "zh": "然而，她们并不觉得自己必须追随流行品味，因此能够自由地按照自己的偏好进行收藏。"}, {"en": "Although they relied on a trusted circle of advisers, they made frequent trips to London and Paris, and also regularly had paintings sent to their home for consideration.", "zh": "虽然她们依靠一个自己信任的顾问圈提供意见，但她们也经常前往伦敦和巴黎，还定期安排将画作送到家中，以便考虑是否购买。"}, {"en": "By the early 1920s, Gwendoline felt increasingly uncomfortable buying art works when faced with the poverty and social upheaval created by the First World War.", "zh": "到20世纪20年代初，面对第一次世界大战造成的贫困与社会动荡，格温多琳对于继续购买艺术品感到越来越不安。"}, {"en": "Her philanthropic pursuits then became focused almost exclusively on social causes and the development of the sisters' home at Gregynog Hall into a conference centre and venue for the Gregynog Festival of Music and Poetry.", "zh": "此后，她的慈善活动几乎完全转向了社会公益事业，以及将姐妹俩位于格雷吉诺格庄园的住所改建为会议中心和格雷吉诺格音乐诗歌节的举办场所。"}, {"en": "Gwendoline made her final art purchase in March 1926.", "zh": "格温多琳于1926年3月进行了最后一次艺术品购买。"}, {"en": "Margaret also stopped collecting around this time, but started again in the 1930s acquiring, on a relatively small scale, work by contemporary British artists.", "zh": "玛格丽特也在这前后停止了收藏，但在20世纪30年代又重新开始，以相对较小的规模购入英国当代艺术家的作品。"}, {"en": "The sisters collected French Impressionist paintings at a time when such art was routinely ignored by individuals and institutions alike.", "zh": "姐妹俩收藏法国印象派画作时，这类艺术还普遍受到个人和机构的忽视。"}, {"en": "The Gwendoline and Margaret Davies collection, donated in 1951 and 1963 respectively to the National Museum Wales, contains major examples of work by leading French Impressionists.", "zh": "格温多琳与玛格丽特·戴维斯收藏分别于1951年和1963年捐赠给威尔士国家博物馆，其中包含法国印象派重要画家的代表性作品。"}, {"en": "In collecting paintings that they loved, the sisters created a lasting and meaningful cultural legacy for the people of Wales and beyond.", "zh": "姐妹俩在收藏自己喜爱的画作的过程中，为威尔士人民乃至更广泛的公众，留下了持久而富有意义的文化遗产。"}], "examples": [{"en": "She amassed a collection of nineteenth-century paintings.", "zh": "她收藏了一批19世纪绘画。"}, {"en": "The museum has amassed a large collection of photographs.", "zh": "博物馆积累了大量摄影藏品。"}, {"en": "Over many years, he amassed an impressive collection of rare books.", "zh": "多年来，他积累了一批规模可观的珍本书籍。"}, {"en": "The museum holds one of the largest collections of modern art in the region.", "zh": "该博物馆拥有当地规模最大的现代艺术收藏之一。"}, {"en": "This is one of the largest collections of historical maps in the country.", "zh": "这是该国规模最大的历史地图收藏之一。"}, {"en": "They created one of the largest collections of French paintings in Britain.", "zh": "她们建立了英国规模最大的法国绘画收藏之一。"}, {"en": "He amassed a fortune in the shipping industry.", "zh": "他在航运业积累了巨额财富。"}, {"en": "The family amassed a fortune through trade.", "zh": "这个家族通过贸易积累了巨额财富。"}, {"en": "She amassed a fortune before turning her attention to philanthropy.", "zh": "她积累巨额财富后，将注意力转向慈善事业。"}, {"en": "She came into her inheritance in 1907.", "zh": "她于1907年继承了遗产。"}, {"en": "After coming into his inheritance, he decided to support local schools.", "zh": "继承遗产后，他决定资助当地学校。"}, {"en": "The sisters came into their inheritances at different times.", "zh": "姐妹俩在不同时间继承了各自的遗产。"}, {"en": "The building is said to be over two hundred years old.", "zh": "据说，这栋 function rec(x){return state[x.id]||{level:0,due:0,reps:0}}
function eligible(x,now=Date.now()){let r=rec(x);return r.level!==4&&(!r.level||r.due<=now)}
function dayKey(){return new Date().toLocaleDateString('en-CA')}
function todayNew(){return Object.values(state).filter(r=>r.startedDay===dayKey()).length}
function matchesStudyFilters(x){return (kind==='all'||x.type===kind)&&(starFilter==='all'||String(x.stars)===starFilter)}
function candidates(){let all=DATA.items.filter(x=>matchesStudyFilters(x)&&rec(x).level!==4);if(scope==='all')return all.sort((a,b)=>(rec(a).level||1)-(rec(b).level||1));let due=all.filter(x=>rec(x).level&&eligible(x)).sort((a,b)=>rec(a).due-rec(b).due);let fresh=all.filter(x=>!rec(x).level).slice(0,Math.max(0,settings.daily-todayNew()));return [...due,...fresh]}

function renderStats(){const counts={4:0,2:0,3:0,1:0};DATA.items.forEach(x=>{let l=rec(x).level;if(l)counts[l]++});let due=DATA.items.filter(x=>rec(x).level&&eligible(x)).length;let fresh=DATA.items.filter(x=>!rec(x).level).length;$('stats').innerHTML=`<div class="stat"><b>${due}</b><span>到期复习</span></div><div class="stat"><b>${fresh}</b><span>尚未学习</span></div><div class="stat"><b>${counts[1]+counts[2]+counts[3]}</b><span>正在巩固</span></div><div class="stat"><b>${counts[4]}</b><span>已经熟练</span></div>`;$('progress').style.width=(counts[4]/DATA.items.length*100)+'%';$('progress-label').textContent=`${counts[4]} / ${DATA.items.length}`}

function reveal(){if(view==='dictation')answerEN=$('en-answer').value;if(view!=='cards')answerZH=$('zh-answer').value;revealed=true;render()}
function grade(level){if(!current||!revealed)return;if(view!=='cards'&&level>=3&&(!meaningOK||(view==='dictation'&&!spellingCorrect()))){toast('请先核对拼写，并确认中文意思基本正确。');return}const old=rec(current),now=Date.now(),reps=(old.reps||0)+1;let interval=level===1?60000:level===2?600000:level===3?[1,3,7,14,30][Math.min(old.level===3?(old.streak||0):0,4)]*86400000:0;state[current.id]={...old,level,reps,due:level===4?null:now+interval,streak:level===3?(old.level===3?(old.streak||0)+1:1):0,startedDay:old.startedDay||dayKey(),updated:now};save();sessionCount++;next()}
function training(){let intro={cards:'先回忆，再揭晓。每一次主动回忆，都在加深记忆。',dictation:'先听英文，再写拼写和中文意思。答案在核对前保持隐藏。',meaning:'看到英文，主动写出中文意思，再对照自评。'};let html=filterControls();if(!current){let selected=DATA.items.filter(matchesStudyFilters);let future=selected.filter(x=>rec(x).level&&rec(x).level!==4&&rec(x).due>Date.now()).sort((a,b)=>rec(a).due-rec(b).due)[0];let complete=selected.length>0&&selected.every(x=>rec(x).level===4);html+=`<section class="card empty"><div class="big">${complete?'✓':'◌'}</div><h2>${complete?'当前筛选内的词，你已经掌握了！':!selected.length?'当前筛选没有词条':'当前筛选的学习计划已完成'}</h2><p class="muted">本轮已完成 ${sessionCount} 次。${future?'下一次复习：'+escapeHTML(new Date(rec(future).due).toLocaleString()):'可以在全部词库查看学习情况。'}</p><p class="small muted">${complete?'熟练词不会自动出现，可在词库改回其他等级。':'不认识的 1 分钟后、模糊的 10 分钟后回来；认识的按天复习。新词每天默认 20 个。'}</p><button id="refresh" class="primary">检查到期复习</button> <button id="early">提前练习当前星级</button></section>`;return html}
let x=current,r=rec(x);html+=`<p class="small muted">${intro[view]}</p><section class="card"><div class="cardtop"><span class="tag">${x.type==='word'?'WORD · 单词':'PHRASE · 短语'} / ${LABELS[r.level]||'未学'}</span><span class="counter">本轮已完成 ${sessionCount} · 待练 ${queue.length+1}</span></div><div class="center">`;
if(view==='dictation'&&!revealed){html+=`<div class="term">Listen & recall</div><p class="muted small">点击小喇叭，听清后填写答案</p><button id="listen" class="speaker">${icon} 播放英文</button> <button id="slow" class="speaker small">慢速再听</button>`}else html+=`<div class="term">${escapeHTML(x.term)}</div>${wordMeta(x)}${playButton(x.term,'播放读音')}`;
if(view!=='cards'&&!revealed)html+=`<div class="practice-input">${view==='dictation'?'<label>英文单词或短语<input id="en-answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入你听到的英文"></label>':''}<label>中文释义<textarea id="zh-answer" placeholder="写出你理解的中文意思"></textarea></label></div>`;
if(!revealed)html+=`<p style="margin-top:25px"><button id="reveal" class="primary">${view==='cards'?'揭晓释义':'核对答案'}</button></p>`;
else{html+=`<div class="meaning">${contextMeaningHtml(x)}</div>`;if(x.note&&x.note!==x.term)html+=`<p class="small muted">文档用法：${escapeHTML(x.note)}</p>`;
if(view!=='cards'){html+=`<div class="answer">${view==='dictation'?`<p class="${spellingCorrect()?'ok':'warning'}">${spellingCorrect()?'✓ 英文拼写正确':'请再记一次：'+escapeHTML(x.term)}</p><p>你的英文：${escapeHTML(answerEN)||'（未填写）'}</p>`:''}<p>你的中文：${escapeHTML(answerZH)||'（未填写）'}</p><label><input id="meaning-ok" type="checkbox" ${meaningOK?'checked':''}> 我已对照，中文意思基本正确</label><p class="small muted">中文接受同义表达，由你自评；英文忽略大小写、标点和多余空格。</p></div>`}
if(x.examples.length){html+=`<div class="example">${x.examples.slice(0,3).map(e=>`<p>${escapeHTML(e.en)}</p><p class="small muted">${escapeHTML(e.zh)}</p>${playButton(e.en,e.added?'补充例句朗读':'例句朗读',true)}`).join('<div style="height:15px"></div>')}</div>`}}
if(revealed)html+=memoryHtml(x);html+='</div>';
if(revealed){let gated=view!=='cards'&&(!meaningOK||(view==='dictation'&&!spellingCorrect()));html+=`<div class="grades">${[[1,'不认识','1 分钟后'],[2,'模糊','10 分钟后'],[3,'认识','1 / 3 / 7 / 14 / 30 天'],[4,'熟练','退出自动复习']].map(([n,l,t])=>`<button data-grade="${n}" ${gated&&n>=3?'disabled':''}><b>${l}</b><small>${t}</small></button>`).join('')}</div><p class="hint">根据回忆表现选择等级。只有你主动标记“熟练”，才会退出自动复习。</p>`}
return html+'</section><div class="bottom"><span>间隔复习 · 优先复习到期词</span><button id="skip">暂时跳过</button></div>'}
function formatIPA(s){return s.split('；').map(p=>{let m=p.match(/^([^（]+)(.*)$/);return '/'+escapeHTML(m?m[1]:p)+'/'+escapeHTML(m?m[2]:'')}).join('；')}
function wordMeta(x){return `<div class="word-meta">${x.pos?`<span class="pos">${escapeHTML(x.pos)}</span>`:""}${x.ipa?`<span class="ipa" lang="en-GB">${formatIPA(x.ipa)}</span>`:''}<span class="stars" role="img" aria-label="学习难度 ${x.stars} 星，共 5 星" title="学习难度 ${x.stars}/5">${'★'.repeat(x.stars)}${'☆'.repeat(5-x.stars)} <span class="star-label">难度 ${x.stars}/5</span></span></div>`}
function memoryHtml(x){if(!x.memory)return '';let m=x.memory;return `<section class="memory-panel" aria-label="${escapeHTML(x.term)}的词根记忆法"><h3>词根与构词记忆 <span class="memory-label">${escapeHTML(m.method)}</span></h3><p><b>拆分／来源：</b>${escapeHTML(m.parts)}</p><p><b>这样记：</b>${escapeHTML(m.tip)}</p><p class="memory-family"><b>一起记：</b>${escapeHTML(m.family)}</p>${m.source?`<a href="${escapeHTML(m.source)}" target="_blank" rel="noopener noreferrer">查看词源参考 · Etymonline</a>`:''}</section>`}
function library(){let rows=DATA.items.filter(x=>(kind==='all'||kind===x.type)&&(statusFilter==='all'||String(rec(x).level||'new')===statusFilter)&&(starFilter==='all'||String(x.stars)===starFilter)&&(x.term+' '+x.zh+' '+(x.ipa||'')+' '+(x.pos||'')).toLowerCase().includes(search.trim().toLowerCase()));return `<label class="library-search" for="search">搜索全部词库</label><div class="controls"><input id="search" type="search" aria-label="搜索词库" placeholder="输入英文、中文或音标，例如：collection / 藏品 / 动词" value="${escapeHTML(search)}"><select id="kind"><option value="all">全部类型</option><option value="word">单词</option><option value="phrase">短语</option></select><select id="status-filter"><option value="all">所有熟练程度</option>${Object.entries(LABELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="star-filter" aria-label="按五星难度筛选"><option value="all">所有难度等级</option>${[1,2,3,4,5].map(n=>`<option value="${n}">${"★".repeat(n)} · ${n} 星</option>`).join('')}</select></div><p class="search-help">支持英文、中文、音标实时搜索，可叠加词条类型、熟练程度与星级筛选。</p><p class="small muted">共 ${rows.length} 条。可手动调整等级；熟练词也会保留在这里供查阅。</p><section class="card">${rows.map(x=>`<article class="list-item"><div class="listhead"><b>${escapeHTML(x.term)}</b>${playButton(x.term,'读音',true)}</div>${wordMeta(x)}<p>${contextMeaningHtml(x)}</p>${x.note?`<p class="small muted">文档用法与其他义：${escapeHTML(x.note)}</p>`:""}${memoryHtml(x)}<select data-level-id="${x.id}" aria-label="${escapeHTML(x.term)}的熟练程度">${Object.entries(LABELS).map(([k,v])=>`<option value="${k}" ${(rec(x).level||'new')==k?'selected':''}>${v}</option>`).join('')}</select>${x.examples.length?`<details><summary>查看例句</summary>${x.examples.map(e=>`<p>${escapeHTML(e.en)}</p><p class="muted small">${escapeHTML(e.zh)}</p>${playButton(e.en,e.added?'补充例句朗读':'例句朗读',true)}`).join('')}</details>`:''}</article>`).join('')||'<p>没有匹配的词条。</p>'}</section>`}
function sentences(){return `<p class="muted">${DATA.sentences.length} 个原文句子 · ${DATA.examples.length} 个文档学习例句。先听，再展开中文。</p><div class="controls"><input id="sentence-search" placeholder="搜索原文或例句" aria-label="搜索句子" value="${escapeHTML(search)}"><select id="sentence-type"><option value="original">原文句子</option><option value="examples">文档学习例句</option></select></div><section class="card" id="sentence-list"></section>`}
let sentenceType='original';
function sentenceList(){if(!$('sentence-list'))return;let rows=(sentenceType==='original'?DATA.sentences:DATA.examples).filter(x=>(x.en+x.zh).toLowerCase().includes(search.toLowerCase()));$('sentence-list').innerHTML=rows.map((x,i)=>`<article class="list-item"><span class="tag">${String(i+1).padStart(2,'0')}</span><p style="font-size:18px">${escapeHTML(x.en)}</p>${playButton(x.en,'朗读整句',true)}<details><summary>查看中文</summary><p>${escapeHTML(x.zh)}</p></details></article>`).join('')||'<p>没有匹配的句子。</p>'}
function settingsPage(){return `<section class="card settings"><h2>让学习适合你</h2><details><summary>五星难度、音标与词性说明</summary><p class="small muted">1 星：基础词；2 星：日常常用词；3 星：雅思阅读常见词；4 星：进阶词；5 星：专业或生僻词。在翻卡复习、听写训练、看词写义中均可按星级选择学习范围。星级是本词库的学习难度建议，并非官方考试等级，与“熟练、认识、模糊、不认识”的个人掌握情况分开记录。</p><p class="small muted">全部 192 个单词附词性与英式常用音标。词性按本词库收录的常用义项标注；n. 名词，v. 动词，adj. 形容词，adv. 副词，prep. 介词，conj. 连词，det. 限定词，pron. 代词。四星、五星的 36 个单词配有词根、构词或借词联想记忆；借词和无可靠拆分的词会明确说明，联想不等同于真实词源。本文涉及不同语境中的熟词生义；重复词条合并保留，红色为文档句中义，其他用法单独说明。work、means、cause 等熟词采用本文语境中的含义；历史叙述中的 contemporary 以当时为参照。听写时不显示音标，核对答案后才显示。</p></details><label>英语朗读音色<select id="voice-select"></select></label><p class="small muted">优先推荐 Natural、Neural、Premium 等自然音色。可用音色由浏览器和系统提供；没有自然音色时，请在设备的语音设置中添加英语增强语音。</p><label>语速 <input id="rate" type="range" min="0.6" max="1.2" step="0.05" value="${settings.rate}"><span id="rate-label">${settings.rate} ×</span></label><label>发音来源<select id="engine"><option value="device">设备英语语音 · 单词、短语、句子</option><option value="dictionary">在线词典发音 · 词条优先，失败转设备语音</option></select></label><p class="small muted">在线词典发音需要联网，会把所读词条发送给有道词典。句子始终使用所选设备音色。</p><div>${playButton('The sisters created a lasting cultural legacy.','试听所选音色')}</div><label>每天新词数量<input id="daily" type="number" min="1" max="100" value="${settings.daily}"></label><details open><summary>复习规则</summary><div class="rules"><p>不认识：1 分钟后再出现。模糊：10 分钟后再出现。认识：连续选择后，间隔按 1、3、7、14、30 天增加；再次选模糊或不认识会重置这个连续间隔。</p><p>熟练：退出所有自动复习和提前练习；可在全部词库中重新调整等级。新词每天默认 20 个，到期词不受新词上限限制。网页关闭后不弹通知，下次打开会列出到期词。</p><p>“提前练习”允许在到期前复习所有未熟练词。练习结果需要选择等级才会保存。</p></div></details><div><h2>进度备份</h2><p class="muted small">记录只保存在当前浏览器，不会自动同步到 GitHub 或其他设备。换设备前先导出。</p><div class="row"><button id="export">导出进度</button><label><span class="sr">导入进度文件</span><input id="import" type="file" accept="application/json,.json"></label></div></div><p class="small muted">词库：${DATA.items.filter(x=>x.type==='word').length} 个单词与词汇条目、${DATA.items.filter(x=>x.type==='phrase').length} 组短语。模板中的省略号不参与拼写；部分语法模板已改为可听写的具体表达，可在答案处查看文档形式。</p></section>`}
function render(){renderStats();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('subtitle').textContent={cards:'The Davies Sisters · 戴维斯姐妹 / 翻卡复习',dictation:'The Davies Sisters · 戴维斯姐妹 / 听英文，写英文与中文',meaning:'The Davies Sisters · 戴维斯姐妹 / 看英文，写中文释义',sentences:'在句子里，听懂每一个词。',library:'你的 The Davies Sisters 词库',settings:'学习偏好与进度管理'}[view];$('app').innerHTML=['cards','dictation','meaning'].includes(view)?training():view==='library'?library():view==='sentences'?sentences():settingsPage();
if($('kind')){$('kind').value=kind;$('kind').onchange=e=>{kind=e.target.value;if(view==='library')render();else buildQueue()}}if($('scope')){$('scope').value=scope;$('scope').onchange=e=>{scope=e.target.value;buildQueue()}}
if($('reveal'))$('reveal').onclick=reveal;if($('listen'))$('listen').onclick=()=>speak(current.term,true);if($('slow'))$('slow').onclick=()=>speak(current.term,true,0.65);if($('meaning-ok'))$('meaning-ok').onchange=e=>{meaningOK=e.target.checked;render()};if($('skip'))$('skip').onclick=()=>{next()};if($('refresh'))$('refresh').onclick=buildQueue;if($('early'))$('early').onclick=()=>{scope='all';buildQueue()};
if($('star-filter')){$('star-filter').value=starFilter;$('star-filter').onchange=e=>{starFilter=e.target.value;if(['cards','dictation','meaning'].includes(view))buildQueue();else render()}}if($('search'))$('search').oninput=e=>{let pos=e.target.selectionStart;search=e.target.value;render();$('search').focus();$('search').setSelectionRange(pos,pos)};if($('status-filter')){$('status-filter').value=statusFilter;$('status-filter').onchange=e=>{statusFilter=e.target.value;render()}}
if(view==='sentences'){$('sentence-type').value=sentenceType;$('sentence-type').onchange=e=>{sentenceType=e.target.value;sentenceList()};$('sentence-search').oninput=e=>{search=e.target.value;sentenceList()};sentenceList()}
if(view==='settings'){voiceOptions();$('engine').value=settings.engine;$('engine').onchange=e=>{settings.engine=e.target.value;saveSettings()};$('voice-select').onchange=e=>{settings.voice=e.target.value;saveSettings();voiceStatus()};$('rate').oninput=e=>{settings.rate=Number(e.target.value);$('rate-label').textContent=settings.rate+' ×';saveSettings()};$('daily').onchange=e=>{settings.daily=Math.max(1,Math.min(100,parseInt(e.target.value)||20));e.target.value=settings.daily;saveSettings()};$('export').onclick=exportData;$('import').onchange=importData}}
document.addEventListener('click',e=>{let v=e.target.closest('[data-view]');if(v){stopSound();search='';navigate(v.dataset.view)}let p=e.target.closest('[data-say]');if(p)speak(p.dataset.say,DATA.items.some(x=>x.term===p.dataset.say));let g=e.target.closest('[data-grade]');if(g)grade(Number(g.dataset.grade))});
document.addEventListener('change',e=>{let id=e.target.dataset.levelId;if(!id)return;let level=e.target.value;if(level==='new')delete state[id];else{let old=state[id]||{};state[id]={...old,level:Number(level),due:level==='4'?null:Date.now(),streak:0,reps:old.reps||0,startedDay:old.startedDay||dayKey(),updated:Date.now()}}save();renderStats()});
let audio=null,soundToken=0;
function stopSound(){soundToken++;if(audio){audio.pause();audio=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
function voiceScore(v){return (/natural|neural|premium|enhanced/i.test(v.name)?100:0)+(!v.localService?30:0)+(/^en-GB/i.test(v.lang)?10:0)+(/Google|Microsoft|Samantha|Daniel|Serena/i.test(v.name)?5:0)}
function selectedVoice(){return voices.find(v=>v.voiceURI===settings.voice)||voices[0]}
function loadVoices(){voices=('speechSynthesis'in window?speechSynthesis.getVoices():[]).filter(v=>/^en(?:-|_)/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));voiceStatus();if(view==='settings')voiceOptions()}
function voiceStatus(){let v=selectedVoice();$('voice-status').textContent=v?'英语音色 · '+v.name:('speechSynthesis'in window?'未检测到英语音色，请查看学习设置':'此浏览器不支持设备朗读，请尝试在线词典发音或其他浏览器')}
function voiceOptions(){if(!$('voice-select'))return;$('voice-select').innerHTML='<option value="">自动选择 · 优先自然英语音色</option>'+voices.map(v=>`<option value="${escapeHTML(v.voiceURI)}">${escapeHTML(v.name)} · ${escapeHTML(v.lang)}</option>`).join('');$('voice-select').value=settings.voice}
function deviceSpeech(text,rate,token){if(token!==soundToken)return;if(!('speechSynthesis'in window)){toast('此浏览器不支持语音朗读，请换用支持语音的浏览器。');return}loadVoices();let v=selectedVoice();if(!v){toast('未检测到英语音色，请在系统中添加英语语音后重试。');return}let u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=rate;u.pitch=1;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))toast('朗读未成功，请换一个英语音色。')};speechSynthesis.speak(u)}
function speak(text,isTerm=false,rate=settings.rate){stopSound();const token=soundToken;let spoken=text.replace(/\bA\b/g,'A').replace(/…/g,' ').replace(/[＋+]/g,' ');if(settings.engine==='dictionary'&&isTerm){audio=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(spoken)+'&type=1');audio.playbackRate=rate;let finished=false;const fallback=()=>{if(finished||token!==soundToken)return;finished=true;if(audio)audio.pause();toast('在线发音不可用，已切换设备音色。');deviceSpeech(spoken,rate,token)};const timer=setTimeout(fallback,7000);audio.onplaying=()=>{finished=true;clearTimeout(timer)};audio.onerror=fallback;audio.play().catch(fallback);return}deviceSpeech(spoken,rate,token)}
function exportData(){let blob=new Blob([JSON.stringify({app:KEY,version:1,exportedAt:new Date().toISOString(),state,settings},null,2)],{type:'application/json'});let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='Davies-Sisters-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.app!==KEY||d.version!==1||!d.state||typeof d.state!=='object'||Array.isArray(d.state))throw Error();let valid=new Set(DATA.items.map(x=>x.id)),incoming={};for(let [id,r]of Object.entries(d.state)){if(!valid.has(id))continue;if(!r||![1,2,3,4].includes(r.level)||!Number.isFinite(r.updated)||!Number.isFinite(r.reps)||r.reps<0||(r.level!==4&&!Number.isFinite(r.due)))throw Error();incoming[id]={level:r.level,due:r.level===4?null:r.due,reps:r.reps,updated:r.updated,streak:Number.isFinite(r.streak)?Math.max(0,r.streak):0,startedDay:typeof r.startedDay==='string'?r.startedDay:dayKey()}}for(let[id,r]of Object.entries(incoming))if(!state[id]||r.updated>=(state[id].updated||0))state[id]=r;save();render();toast('进度已导入：按最后更新时间合并，不覆盖较新的记录。')}catch{toast('导入失败：请选择本页面导出的有效进度文件。')}finally{if($('import'))$('import').value=''}}
window.addEventListener('hashchange',()=>{let v=location.hash.slice(1);if(v!==view&&['cards','dictation','meaning','sentences','library','settings'].includes(v))navigate(v)});
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,1200)}else voiceStatus();
setInterval(()=>{renderStats();if(['cards','dictation','meaning'].includes(view)&&!current&&!document.querySelector('#en-answer')){let ids=candidates().map(x=>x.id);if(ids.length){queue=ids;next()}}},15000);
if(['cards','dictation','meaning'].includes(view))buildQueue();else render();
</script></body></html>
