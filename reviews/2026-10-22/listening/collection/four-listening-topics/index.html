<script>
const destinations = [{"url":"/ielts-review-library/reviews/2026-10-20/listening/part-3/how-babies-and-children-learn/","keys":["babies","how-babies-and-children-learn"]},{"url":"/ielts-review-library/reviews/2026-10-21/listening/part-4/canadian-maple-syrup/","keys":["maple","canadian-maple-syrup"]},{"url":"/ielts-review-library/reviews/2026-10-21/listening/part-1/nature-farm/","keys":["farm","nature-farm"]},{"url":"/ielts-review-library/reviews/2026-10-21/listening/part-2/vacation-jobs/","keys":["jobs","vacation-jobs"]}];
const query = new URLSearchParams(location.search);
const fragment = location.hash.slice(1).split('/')[0].toLowerCase();
const selected = [fragment, query.get('material'), query.get('article'), query.get('group')]
  .filter(Boolean).map(key => key.toLowerCase());
const target = destinations.find(item => item.keys.some(key => selected.includes(key)));
if (target) {
  location.replace(target.url + location.search + location.hash);
} else {
  document.querySelectorAll('li a').forEach((link, index) => {
    link.href = destinations[index].url + location.search + location.hash;
  });
}
</script>
