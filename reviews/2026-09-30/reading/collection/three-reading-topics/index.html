<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三篇阅读主题 · 独立篇目</title>
<style>
:root{color-scheme:light;background:#f4f7f2;color:#183b3a;font:16px/1.6 system-ui,sans-serif}
main{max-width:690px;margin:auto;padding:30px 18px}h1{font-size:clamp(24px,6vw,34px)}a{color:#17685c}ul{padding:0;list-style:none;display:grid;gap:12px}
li a{display:block;padding:15px 18px;border:1px solid #dce7e1;border-radius:14px;background:white;text-decoration:none}
li a:hover,li a:focus-visible{border-color:#17685c}li span{display:block;font-weight:750}small{color:#526e66}
</style>
</head>
<body><main>
<a href="/ielts-review-library/index.html">← 复习总览</a>
<h1>三篇阅读主题已拆分</h1>
<p>选择一篇打开独立复习页。原来的复习记录会随篇目继续使用。</p>
<ul aria-label="独立复习链接">
<li><a href="/ielts-review-library/reviews/2026-09-30/reading/practice/how-they-move/"><span>How they move</span><small>过山车如何运行 · 2026-09-30 · 模考</small></a></li>
<li><a href="/ielts-review-library/reviews/2026-09-30/reading/practice/humans-and-food/"><span>Humans and Food</span><small>人类与食物 · 2026-09-30 · 模考</small></a></li>
<li><a href="/ielts-review-library/reviews/2026-09-30/reading/practice/survivors-story/"><span>Survivor’s Story</span><small>幸存者的故事 · 2026-09-30 · 模考</small></a></li>
</ul>
</main>
<script>
const destinations = [{"url":"/ielts-review-library/reviews/2026-09-30/reading/practice/how-they-move/","keys":["move","how-they-move"]},{"url":"/ielts-review-library/reviews/2026-09-30/reading/practice/humans-and-food/","keys":["food","humans-and-food"]},{"url":"/ielts-review-library/reviews/2026-09-30/reading/practice/survivors-story/","keys":["story","survivors-story"]}];
const query = new URLSearchParams(location.search);
const fragment = location.hash.slice(1).split('/')[0].toLowerCase();
const selected = [fragment, query.get('material'), query.get('article'), query.get('group')]
  .filter(Boolean).map(key => key.toLowerCase());
const target = destinations.find(item => item.keys.some(key => selected.includes(key)));
if (target) {
  location.replace(target.url + location.search + location.hash);
} else {
  document.querySelectorAll('li a').forEach((link, index) => {
    link.href = destinations[index].url + location.search + location.hash;
  });
}
</script>
</body></html>
