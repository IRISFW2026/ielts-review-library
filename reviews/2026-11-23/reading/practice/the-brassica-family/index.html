ky coastlines of Europe for thousands of years.","zh":"这个物种通常被称为野生甘蓝或野生芥菜，在欧洲岩石海岸自然生长已有数千年。"},{"paragraph":"A","en":"Through careful human selection, it has gradually developed into many of the vegetables that are commonly found in supermarkets today.","zh":"经过人类的精心选育，它逐渐演变成了今天超市里常见的许多蔬菜。"},{"paragraph":"B","en":"The transformation of Brassica oleracea did not happen by chance.","zh":"甘蓝的演变并非偶然发生。"},{"paragraph":"B","en":"It was the result of a process known as selective breeding, in which farmers repeatedly chose plants with desirable characteristics and used them to produce the next generation.","zh":"这是选择性育种的结果。在这一过程中，农民反复选出具有理想性状的植株，用它们繁育下一代。"},{"paragraph":"B","en":"Unlike modern genetic engineering, selective breeding does not involve changing a plant’s DNA in a laboratory.","zh":"与现代基因工程不同，选择性育种不涉及在实验室改变植物的 DNA。"},{"paragraph":"B","en":"Instead, it relies on naturally occurring genetic variation that already exists within a species.","zh":"选择性育种依靠物种内部原本就存在的自然遗传变异。"},{"paragraph":"C","en":"Early farmers noticed that some wild Brassica plants had larger leaves, thicker stems or more compact flower buds than others.","zh":"早期农民发现，有些野生甘蓝植株的叶更大、茎更粗或花芽更紧密。"},{"paragraph":"C","en":"By saving seeds only from those preferred plants, they gradually increased the frequency of these characteristics over many generations.","zh":"他们只从选中的植株留种，经过许多代，逐渐提高了这些性状的出现频率。"},{"paragraph":"C","en":"As a result, different vegetables began to emerge.","zh":"因此，不同种类的蔬菜开始出现。"},{"paragraph":"C","en":"Cabbage was developed for its large terminal leaves, broccoli for its flower buds, cauliflower for its undeveloped flower clusters, Brussels sprouts for its side buds, kale for its loose leaves and kohlrabi for its swollen stem.","zh":"卷心菜的选育目标是较大的顶生叶，西兰花是花芽，花椰菜是未发育成熟的花簇，抱子甘蓝是侧芽，羽衣甘蓝是松散的叶片，苤蓝是膨大的茎。"},{"paragraph":"D","en":"Although these vegetables look very different, scientists have discovered that they are genetically very similar.","zh":"虽然这些蔬菜看起来差异很大，但科学家发现，它们在遗传上很相似。"},{"paragraph":"D","en":"Because they all belong to the same species, they are still capable of interbreeding under suitable conditions.","zh":"由于它们都属于同一物种，在适宜条件下仍能相互杂交繁殖。"},{"paragraph":"D","en":"This close genetic relationship explains why plant breeders can continue to develop new varieties with improved qualities, such as better taste, higher nutritional value or greater resistance to disease.","zh":"这种密切的遗传关系解释了育种人员为何能够继续培育口味更好、营养价值更高或抗病性更强的新品种。"},{"paragraph":"E","en":"The Brassica family is also well known for its impressive nutritional benefits.","zh":"芸薹类蔬菜也以其显著的营养益处而闻名。"},{"paragraph":"E","en":"Most Brassica vegetables contain large amounts of vitamins C and K, dietary fibre and important minerals such as potassium and calcium.","zh":"大多数芸薹类蔬菜富含维生素 C 和 K、膳食纤维以及钾和钙等重要矿物质。"},{"paragraph":"E","en":"They also contain natural plant chemicals called glucosinolates, which give these vegetables their distinctive flavour.","zh":"它们还含有名为硫苷的天然植物化合物，赋予这些蔬菜独特的风味。"},{"paragraph":"E","en":"When a Brassica vegetable is cut or chewed, these compounds are converted into other substances that may help protect the body from certain diseases.","zh":"芸薹类蔬菜被切开或咀嚼时，这些化合物会转化为其他可能有助于人体抵御某些疾病的物质。"},{"paragraph":"E","en":"Although researchers continue to investigate these effects, many health experts recommend eating a variety of Brassica vegetables as part of a balanced diet.","zh":"尽管研究人员仍在研究这些效果，许多健康专家已建议在均衡饮食中摄入多种芸薹类蔬菜。"},{"paragraph":"F","en":"However, growing Brassica crops presents several challenges for farmers.","zh":"然而，种植芸薹类作物给农民带来了几项挑战。"},{"paragraph":"F","en":"Because many members of the family are closely related, they are vulnerable to similar insects and plant diseases.","zh":"由于许多芸薹类作物亲缘关系密切，它们容易受到相似的虫害和植物病害侵袭。"},{"paragraph":"F","en":"One of the most serious problems is clubroot disease, which attacks the roots and reduces plant growth.","zh":"最严重的问题之一是根肿病，它侵袭根部并抑制植株生长。"},{"paragraph":"F","en":"Farmers often reduce these risks by rotating crops, improving soil conditions and developing resistant varieties through breeding programmes.","zh":"农民通常通过轮作、改善土壤条件和培育抗性品种来降低这些风险。"},{"paragraph":"G","en":"Modern plant scientists now combine traditional breeding methods with advanced genetic techniques.","zh":"如今，植物科学家将传统育种方法与先进遗传技术相结合。"},{"paragraph":"G","en":"By studying the DNA of Brassica plants, researchers can identify genes responsible for useful characteristics such as drought tolerance, faster growth or resistance to pests.","zh":"通过研究芸薹属植物的 DNA，研究人员能够找出影响耐旱、快速生长或抗虫等有利性状的基因。"},{"paragraph":"G","en":"This knowledge enables breeders to produce improved crops more efficiently while still relying on natural breeding methods.","zh":"这些知识让育种人员能够继续采用自然育种方法，同时更高效地培育改良作物。"},{"paragraph":"G","en":"Scientists are also preserving wild Brassica populations because they contain valuable genetic diversity that may help future crops adapt to climate change and new diseases.","zh":"科学家也在保护芸薹属野生种群，因为这些种群保有宝贵的遗传多样性，可能有助于未来的作物适应气候变化和新病害。"},{"paragraph":"H","en":"The history of the Brassica family demonstrates the remarkable influence of human agriculture on plant evolution.","zh":"芸薹类作物的历史展示了人类农业对植物演化的显著影响。"},{"paragraph":"H","en":"From one wild coastal plant, centuries of careful selection have produced a wide range of vegetables with different shapes, colours and uses.","zh":"经过数百年的精心选育，一种野生海岸植物演变成了形状、颜色和用途各不相同的多种蔬菜。"},{"paragraph":"H","en":"Today, Brassica crops are grown throughout the world and play an important role in both human nutrition and global agriculture.","zh":"如今，世界各地都种植芸薹类作物，它们在人类营养与全球农业中都发挥着重要作用。"},{"paragraph":"H","en":"Their development provides a clear example of how small genetic differences, guided by human choice, can create extraordinary diversity while maintaining a common biological origin.","zh":"它们的演变清楚地说明了，在人类选择的引导下，微小的遗传差异如何在保有共同生物学起源的同时产生惊人的多样性。"}],"examples":[]};

const DAY=86400000, MINUTE=60000, MAX_INTERVAL_DAYS=120;
function rec(x){return state[x.id]||{level:0,due:0,reps:0,intervalDays:0,easeFactor:2.4,lapses:0}}
function eligible(x,now=Date.now()){let r=rec(x);return !r.level||!Number.isFinite(r.due)||r.due<=now}
function dayKey(){return new Date().toLocaleDateString('en-CA')}
function todayNew(){return Object.values(state).filter(r=>r&&r.startedDay===dayKey()).length}
function dailyRemaining(limit=settings.daily){return Math.max(0,Math.max(1,Math.min(100,Number(limit)||20))-todayNew())}
function dailyProgressText(limit=settings.daily){const used=todayNew(),cap=Math.max(1,Math.min(100,Number(limit)||20));return scope==='all'?`提前练习模式：本次包含全部词条，不受每日新词上限限制。今日已接触新词 ${used} 个。`:`今日新词：${used} / ${cap} 个，剩余 ${dailyRemaining(cap)} 个（到期复习不占用新词额度）。`}
function matchesStudyFilters(x){return (kind==='all'||x.type===kind)&&(starFilter==='all'||String(x.stars)===starFilter)}
function scheduleRecord(old,level,now=Date.now()){
 const previous=Number(old.intervalDays)||0, ease=Math.max(1.6,Math.min(2.85,Number(old.easeFactor)||2.4));
 const wasLearning=previous<1, again=level===1;
 let days=level===1?(old.reps>0?10:1)/1440:level===2?(wasLearning?Math.max(10/1440,previous*1.5):Math.max(1,previous*1.18)):level===3?(wasLearning?1:Math.max(previous+1,previous*ease)):(wasLearning?4:Math.max(previous+2,previous*(ease+0.55)));
 days=Math.min(days,MAX_INTERVAL_DAYS);
 return {...old,level,reps:(old.reps||0)+1,due:now+Math.round(days*DAY),intervalDays:days,easeFactor:Math.max(1.6,Math.min(2.85,ease+(level===1?-.2:level===2?-.08:level===4?.08:0))),lapses:(old.lapses||0)+(again?1:0),streak:again?0:(old.streak||0)+1,startedDay:old.startedDay||dayKey(),updated:now};
}
function formatDelay(days){let minutes=Math.round(days*1440);if(minutes<60)return Math.max(1,minutes)+' 分钟后';if(minutes<1440)return Math.round(minutes/60)+' 小时后';let d=days>=10?Math.round(days):Math.round(days*10)/10;return d+' 天后'}
function migrateProgress(){if(settings.schedulerVersion===2)return;let now=Date.now();for(let r of Object.values(state)){if(!r||![1,2,3,4].includes(r.level))continue;if(!Number.isFinite(r.intervalDays)){let inferred=Number.isFinite(r.due)&&Number.isFinite(r.updated)?Math.max(1/1440,(r.due-r.updated)/DAY):0;r.intervalDays=r.level===4?30:Math.min(30,inferred);r.easeFactor=2.4;r.lapses=r.level===1?1:0;if(r.level===4&&!Number.isFinite(r.due))r.due=now+7*DAY;}}settings.schedulerVersion=2;save();saveSettings()}
function candidates(){let all=DATA.items.filter(matchesStudyFilters);if(scope==='all')return all.slice().sort((a,b)=>(rec(a).level||0)-(rec(b).level||0)||b.stars-a.stars);let due=all.filter(x=>rec(x).level&&eligible(x)).sort((a,b)=>rec(a).level-rec(b).level||b.stars-a.stars||rec(a).due-rec(b).due);let fresh=all.filter(x=>!rec(x).level&&rec(x).startedDay!==dayKey()).sort((a,b)=>b.stars-a.stars||((a.type==='word'?0:1)-(b.type==='word'?0:1))).slice(0,dailyRemaining());return [...due,...fresh]}
function buildQueue(){queue=candidates().map(x=>x.id);next()}
function next(){const id=queue.shift();current=DATA.items.find(x=>x.id===id)||null;if(current&&!rec(current).level&&rec(current).startedDay!==dayKey()){state[current.id]={...rec(current),startedDay:dayKey(),introducedAt:Date.now()};save()}revealed=false;answerEN='';answerZH='';meaningOK=false;render()}

if($('reveal'))$('reveal').onclick=reveal;if($('listen'))$('listen').onclick=()=>speak(current.audioTerm||current.term,true);if($('slow'))$('slow').onclick=()=>speak(current.audioTerm||current.term,true,0.65);if($('meaning-ok'))$('meaning-ok').onchange=e=>{meaningOK=e.target.checked;render()};if($('skip'))$('skip').onclick=()=>{next()};if($('refresh'))$('refresh').onclick=buildQueue;if($('early'))$('early').onclick=()=>{scope='all';buildQueue()};
if($('star-filter')){$('star-filter').value=starFilter;$('star-filter').onchange=e=>{starFilter=e.target.value;if(view==='cards')buildQueue();else render()}}if($('search'))$('search').oninput=e=>{search=e.target.value;render();$('search').focus()};
if(view==='sentences'){$('sentence-search').oninput=e=>{search=e.target.value;sentenceList()};sentenceList()}
if(view==='settings'){voiceOptions();$('engine').value=settings.engine;$('engine').onchange=e=>{settings.engine=e.target.value;saveSettings()};$('voice-select').onchange=e=>{settings.voice=e.target.value;saveSettings();voiceStatus()};$('rate').oninput=e=>{settings.rate=Number(e.target.value);$('rate-label').textContent=settings.rate+' ×';saveSettings()};$('daily').oninput=e=>{let proposed=Math.max(1,Math.min(100,parseInt(e.target.value)||20));if($('daily-status'))$('daily-status').textContent=`设置为 ${proposed} 个；今日已接触 ${todayNew()} 个新词，剩余额度 ${Math.max(0,proposed-todayNew())} 个。`};$('daily').onchange=e=>{settings.daily=Math.max(1,Math.min(100,parseInt(e.target.value)||20));e.target.value=settings.daily;saveSettings();if($('daily-status'))$('daily-status').textContent=dailyProgressText(settings.daily)+' 返回翻卡页面后会按新额度重新安排队列。';toast(`每日新词上限已保存为 ${settings.daily} 个；到期复习不占用新词额度。`)};$('export').onclick=exportData;$('import').onchange=importData;}}
document.addEventListener('click',e=>{
 if(e.target.closest('#reset-quiz')){answers={};saveQuiz();render();return}
 let v=e.target.closest('[data-view]');if(v){stopSound();search='';navigate(v.dataset.view)}
 let p=e.target.closest('[data-say]');if(p)speak(p.dataset.say,DATA.items.some(x=>x.term===p.dataset.say));
 let g=e.target.closest('[data-grade]');if(g)grade(Number(g.dataset.grade));
 let toggle=e.target.closest('[data-sentence-flag-toggle]');
 if(toggle){
  const number=Number(toggle.dataset.sentenceFlagToggle);if(!DATA.sentences[number-1])return;const key=sentenceFlagKey(number),old=state[key]||{},now=Date.now();
  state[key]={updated:now,createdAt:Number.isFinite(old.createdAt)?old.createdAt:now,removed:!old.removed&&!!sentenceFlag(number),reasons:Array.isArray(old.reasons)?old.reasons:[],note:typeof old.note==='string'?old.note:''};
  save();
  if(view==='cards'){
   const controls=toggle.closest('.card-sentence-flag');
   if(controls){
    controls.innerHTML=sentenceFlagControls(number);
    controls.querySelector('button')?.focus();
   }
   return;
  }
  sentenceList();
  const row=document.getElementById('sentence-row-'+number);if(row)row.scrollIntoView({block:'nearest'});
  return;
 }
 let jump=e.target.closest('[data-sentence-jump]');
 if(jump){const number=Number(jump.dataset.sentenceJump);sentenceType='original';search='';render();const row=document.getElementById('sentence-row-'+number);if(row)row.scrollIntoView({behavior:'smooth',block:'center'});return}
 if(e.target.closest('#export-sentence-difficulties')){exportSentenceDifficulties();return}
});
document.addEventListener('input',e=>{
 const note=e.target.closest('textarea[data-sentence-note]');
 if(!note)return;
 const key=sentenceFlagKey(Number(note.dataset.sentenceNote));
 const flag=state[key];
 if(!flag||flag.removed)return;
 state[key]={...flag,note:note.value.slice(0,2000),updated:Date.now()};
 save();
 renderSentenceCollection();
});
document.addEventListener('change',e=>{
 if(e.target.matches('[data-quiz]')){
  const question=e.target.dataset.quiz;
  answers[question]=e.target.value;saveQuiz();render();
  document.querySelector('[data-quiz="'+question+'"]:checked')?.focus();
  return;
 }
 const reasonInput=e.target.closest('input[data-sentence-reason]');
 if(reasonInput){
  const number=Number(reasonInput.dataset.sentenceReason),key=sentenceFlagKey(number),old=state[key];
  if(!old||old.removed)return;
  const reasons=new Set(Array.isArray(old.reasons)?old.reasons:[]);
  if(reasonInput.checked)reasons.add(reasonInput.value);else reasons.delete(reasonInput.value);
  state[key]={...old,reasons:Array.from(reasons),updated:Date.now()};save();renderSentenceCollection();return;
 }
 const noteInput=e.target.closest('textarea[data-sentence-note]');
 if(noteInput){
  const number=Number(noteInput.dataset.sentenceNote),key=sentenceFlagKey(number),old=state[key];
  if(!old||old.removed)return;
  state[key]={...old,note:noteInput.value.slice(0,2000),updated:Date.now()};save();renderSentenceCollection();return;
 }
 const sel=e.target.closest('select[data-level-id]');if(!sel)return;
 const id=sel.dataset.levelId,level=Number(sel.value);
 if(![1,2,3,4].includes(level)||!DATA.items.some(x=>x.id===id))return;
 const old=state[id]||{};if(old.level===level)return;
 const now=Date.now();state[id]=scheduleRecord(old,level,now);
 // An unfamiliar word should enter the card queue immediately, not only after the one-minute initial interval.
 if(level===1)state[id].due=now;
 save();renderStats();
 const wrapper=sel.closest('.library-familiarity');
 if(wrapper){wrapper.dataset.level=String(level);const note=wrapper.querySelector('.level-next');if(note)note.textContent=levelNextLabel(state[id])}
 toast('已标记'+LABELS[level]+'；'+levelNextLabel(state[id])+'，翻卡计划已更新。');
});
let audio=null,soundToken=0;
function stopSound(){soundToken++;if(audio){audio.pause();audio=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
function voiceScore(v){return (/natural|neural|premium|enhanced/i.test(v.name)?100:0)+(!v.localService?30:0)+(/^en-GB/i.test(v.lang)?10:0)+(/Google|Microsoft|Samantha|Daniel|Serena/i.test(v.name)?5:0)}
function selectedVoice(){return voices.find(v=>v.voiceURI===settings.voice)||voices[0]}
function loadVoices(){voices=('speechSynthesis'in window?speechSynthesis.getVoices():[]).filter(v=>/^en(?:-|_)/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));voiceStatus();if(view==='settings')voiceOptions()}
function voiceStatus(){let v=selectedVoice();$('voice-status').textContent=v?'英语音色 · '+v.name:('speechSynthesis'in window?'未检测到英语音色，请查看学习设置':'此浏览器不支持设备朗读，请尝试在线词典发音或其他浏览器')}
function voiceOptions(){if(!$('voice-select'))return;$('voice-select').innerHTML='<option value="">自动选择 · 优先自然英语音色</option>'+voices.map(v=>`<option value="${escapeHTML(v.voiceURI)}">${escapeHTML(v.name)} · ${escapeHTML(v.lang)}</option>`).join('');$('voice-select').value=settings.voice}
function deviceSpeech(text,rate,token){if(token!==soundToken)return;if(!('speechSynthesis'in window)){toast('此浏览器不支持语音朗读，请换用支持语音的浏览器。');return}loadVoices();let v=selectedVoice();if(!v){toast('未检测到英语音色，请在系统中添加英语语音后重试。');return}let u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;u.rate=rate;u.pitch=1;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))toast('朗读未成功，请换一个英语音色。')};speechSynthesis.speak(u)}
function speak(text,isTerm=false,rate=settings.rate){stopSound();const token=soundToken;let spoken=text.replace(/\bA\b/g,'A').replace(/…/g,' ').replace(/[＋+]/g,' ');if(settings.engine==='dictionary'&&isTerm){audio=new Audio('https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(spoken)+'&type=1');audio.playbackRate=rate;let finished=false;const fallback=()=>{if(finished||token!==soundToken)return;finished=true;if(audio)audio.pause();toast('在线发音不可用，已切换设备音色。');deviceSpeech(spoken,rate,token)};const timer=setTimeout(fallback,7000);audio.onplaying=()=>{finished=true;clearTimeout(timer)};audio.onerror=fallback;audio.play().catch(fallback);return}deviceSpeech(spoken,rate,token)}
function exportData(){let blob=new Blob([JSON.stringify({app:KEY,version:2,exportedAt:new Date().toISOString(),state,settings},null,2)],{type:'application/json'});let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='Brassica-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(e){
 let f=e.target.files[0];if(!f)return;
 try{
  let d=JSON.parse(await f.text());
  if(d.app!==KEY||![1,2].includes(d.version)||!d.state||typeof d.state!=='object'||Array.isArray(d.state))throw Error();
  let valid=new Set(DATA.items.map(x=>x.id)),incoming={};
  for(let [id,r] of Object.entries(d.state)){
   if(id.startsWith(SENTENCE_FLAG_PREFIX)){
    const match=/^__sentenceDifficulty__:(\d{1,4})$/.exec(id),number=match?Number(match[1]):0;
    if(!match||number<1||number>DATA.sentences.length||!r||typeof r!=='object'||Array.isArray(r)||!Number.isFinite(r.updated)||r.updated<0)throw Error();
    const allowed=SENTENCE_REASON_OPTIONS.map(function(x){return x[0]});
    incoming[id]={updated:r.updated,createdAt:Number.isFinite(r.createdAt)?r.createdAt:r.updated,removed:r.removed===true,reasons:Array.isArray(r.reasons)?Array.from(new Set(r.reasons.filter(function(x){return allowed.includes(x)}))):[],note:typeof r.note==='string'?r.note.slice(0,2000):''};
    continue;
   }
   if(!valid.has(id))continue;
   if(!r||![1,2,3,4].includes(r.level)||!Number.isFinite(r.updated)||!Number.isFinite(r.reps)||r.reps<0||(r.level!==4&&!Number.isFinite(r.due)))throw Error();
   incoming[id]={...r,intervalDays:Number.isFinite(r.intervalDays)?r.intervalDays:(r.level===4?30:Math.max(1/1440,(r.due-r.updated)/DAY)),easeFactor:Number.isFinite(r.easeFactor)?r.easeFactor:2.4,lapses:Number.isFinite(r.lapses)?r.lapses:0,due:Number.isFinite(r.due)?r.due:Date.now()+7*DAY,startedDay:typeof r.startedDay==='string'?r.startedDay:dayKey()};
  }
  for(let[id,r]of Object.entries(incoming))if(!state[id]||r.updated>=(state[id].updated||0))state[id]=r;
  save();buildQueue();toast('进度已导入：词卡记录与难点句标记均已合并。');
 }catch{toast('导入失败：请选择本页面导出的有效进度文件。')}
 finally{if($('import'))$('import').value=''}
}
function activateLibraryEntry(el){if(!el||view!=='library')return;activeLibraryId=el.dataset.libraryId;document.querySelectorAll('.library-entry').forEach(node=>node.classList.toggle('is-current',node===el))}
document.addEventListener('pointerdown',e=>activateLibraryEntry(e.target.closest('.library-entry')));
document.addEventListener('focusin',e=>activateLibraryEntry(e.target.closest('.library-entry')));
document.addEventListener('keydown',e=>{
  if(e.repeat||e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;
  const tag=document.activeElement?.tagName||'';
  if((e.code==='Space'||e.key===' ')&&view==='library'){
    if(/^(INPUT|TEXTAREA|SELECT|BUTTON|A|SUMMARY)$/.test(tag)||document.activeElement?.isContentEditable)return;
    const el=document.querySelector('.library-entry.is-current')||document.querySelector('.library-entry');
    if(!el)return;
    const item=DATA.items.find(x=>x.id===el.dataset.libraryId);
    if(!item)return;
    e.preventDefault();
    speak(item.audioTerm||item.term,true);
    return;
  }
  if(!current)return;
  if((e.code==='Space'||e.key===' ')&&view==='cards'){
    if(/^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(tag)||document.activeElement?.isContentEditable)return;
    e.preventDefault();
    const sentence=revealed?current.examples?.[0]?.en:null;
    if(sentence)speak(sentence,false);
    else speak(current.audioTerm||current.term,true);
    return;
  }
  if(e.key==='Enter'&&view==='cards'&&!revealed){
    if(/^(INPUT|TEXTAREA|SELECT|BUTTON|A)$/.test(tag)||document.activeElement?.isContentEditable)return;
    e.preventDefault();
    reveal();
    return;
  }
  if(e.key>='1'&&e.key<='4'&&view==='cards'&&revealed){
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag)||document.activeElement?.isContentEditable)return;
    e.preventDefault();
    grade(Number(e.key));
  }
});
window.addEventListener('hashchange',()=>{let v=location.hash.slice(1);if(v!==view)navigate(v)});
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,1200)}else voiceStatus();
setInterval(()=>{renderStats();if(view==='cards'&&!current){let ids=candidates().map(x=>x.id);if(ids.length){queue=ids;next()}}},15000);
migrateProgress();
if(view==='cards')buildQueue();else render();
</script></body></html>
