const byId = id => document.getElementById(id);
const key = "ielts-review-brassica-1123-v1";

try {const saved=JSON.parse(localStorage.getItem(key));if(saved) state={...state,...saved};} catch {}
let storageAvailable = true;
function save() {
 try { localStorage.setItem(key,JSON.stringify(state)); }
 catch { storageAvailable = false; byId("settings-status").textContent="当前浏览器无法保存进度。"; }
}
const escape = text => String(text).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[char]);
const stars = value => '<span class="stars" aria-label="'+value+' 星">'+'★'.repeat(value)+'</span>';
const ipa = word => word.i ? '<span class="ipa">/'+escape(word.i)+'/</span>' : '';
const sourceLabel = word => word.p==="题" ? "题干" : word.p+" 段原文";
const day = () => new Date().toLocaleDateString("sv-SE");
const dayMs = 86400000;
let activeTab = "cards";
let current = null;
let revealed = false;
let waiting = [];
const grades = ["Again","Hard","Good","Easy"];
function speak(word) {
 if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
  byId("progress").textContent="当前浏览器不支持发音。";
  return;
 }
 const voice = new SpeechSynthesisUtterance(word.replaceAll("…"," ").replaceAll("/"," or "));
 voice.lang = "en-GB";
 const british = speechSynthesis.getVoices().find(option=>option.lang.toLowerCase()==="en-gb");
 if (british) voice.voice = british;
 speechSynthesis.cancel();
 speechSynthesis.speak(voice);
}
function buildQueue() {
 const used = Object.values(state.cards).filter(card=>card.first===day()).length;
 const due = words.filter(word=>state.cards[word.id]?.due<=Date.now());
 const fresh = words.filter(word=>!state.cards[word.id]).slice(0,Math.max(0,state.limit-used));
 waiting = [...due,...fresh];
 current = waiting.shift()??null;
 revealed = false;
 renderCard();
}
function renderCard() {
 const card = byId("card");
 const learned = Object.values(state.cards).filter(value=>value.first===day()).length;
 byId("progress").textContent = "今日新词 "+learned+" / "+state.limit+" · 本轮剩余 "+(waiting.length+Number(Boolean(current)));
 byId("shortcuts").hidden = !current;
 if (!current) {
  card.innerHTML='<h2>本轮复习完成</h2><p class="muted">到期词卡会进入下一轮。</p><button type="button" id="refresh">检查待复习词卡</button>';
  byId("refresh").onclick=buildQueue;
  return;
 }
 card.innerHTML='<p class="muted">'+sourceLabel(current)+' · '+stars(current.s)+'</p><h2 lang="en">'+escape(current.w)+'</h2>'+ipa(current)+'<button type="button" id="speak-card" aria-label="发音">🔊 发音</button>'+
 (revealed ? '<div class="answer"><h3>'+escape(current.m)+'</h3><p class="muted">'+sourceLabel(current)+'</p><blockquote lang="en">'+escape(current.e)+'</blockquote><p>'+escape(current.zh)+'</p><p>搭配／同义替换　'+escape(current.c)+'</p></div><div class="ratings">'+grades.map((grade,index)=>'<button type="button" data-grade="'+index+'">'+(index+1)+' '+grade+'</button>').join("")+'</div>' : ' <button type="button" id="reveal" class="primary">揭晓释义</button>');
 byId("speak-card").onclick=()=>speak(current.w);
 if (revealed) card.querySelectorAll("[data-grade]").forEach(button=>button.onclick=()=>grade(Number(button.dataset.grade)));
 else byId("reveal").onclick=reveal;
}
function reveal() {if(!current||revealed) return; revealed=true;renderCard();}
function grade(index) {
 if(!current||!revealed) return;
 const review = state.cards[current.id];
 const intervals = [0,1,3,7];
 const days = index>1 ? Math.max(intervals[index],Math.round((review?.days??0)*(index===2?1.6:2.4))) : intervals[index];
 state.cards[current.id]={first:review?.first??day(),days,due:Date.now()+days*dayMs,grade:grades[index]};
 save();
 if(index===0) waiting.push(current);
 current=waiting.shift()??null;
 revealed=false;
 renderCard();
}
function renderBank() {
 const search=byId("query").value.trim().toLowerCase();
 const paragraph=byId("paragraph").value;
 const result=words.filter(word=>(!paragraph||word.p===paragraph)&&[word.w,word.m,word.c].join(" ").toLowerCase().includes(search));
 if(byId("order").value==="stars") result.sort((a,b)=>b.s-a.s||a.id-b.id);
 byId("count").textContent=result.length+" 项";
 byId("rows").innerHTML=result.map(word=>'<tr><td><strong lang="en">'+escape(word.w)+'</strong><button type="button" data-speak="'+word.id+'" aria-label="'+escape(word.w)+' 发音">🔊</button>'+ipa(word)+'<small>'+sourceLabel(word)+'</small></td><td>'+escape(word.m)+'</td><td>'+word.t+'</td><td><span lang="en">'+escape(word.e)+'</span><br><small>'+escape(word.zh)+'</small></td><td>'+escape(word.c)+'</td><td>'+stars(word.s)+'</td></tr>').join("");
}

 byId("quiz-form").innerHTML=questions.map(question=>{
  const picked=state.answers[question.id];
  const feedback=picked ? '<p><strong>'+ (question.id===6 ? "题库答案："+question.correct+"（有争议）" : picked===question.correct ? "正确 · FALSE" : "答案：FALSE")+'</strong> · 你选 '+escape(picked)+'</p><blockquote lang="en">'+escape(question.quote)+'</blockquote><p>'+escape(question.explanation)+'</p>' : '';
  return '<fieldset><legend>第 '+question.id+' 题</legend><p lang="en">'+escape(question.prompt)+'</p><div class="controls">'+["TRUE","FALSE","NOT GIVEN"].map(label=>'<label><input type="radio" name="'+question.id+'" value="'+label+'" '+(label===picked?"checked":"")+'> '+label+'</label>').join("")+'</div><div aria-live="polite">'+feedback+'</div></fieldset>';
 }).join("");
}
document.querySelectorAll("[data-tab]").forEach(button=>button.onclick=()=>{
 activeTab=button.dataset.tab;
 document.querySelectorAll("[data-tab]").forEach(tab=>{
  byId(tab.dataset.tab).hidden=tab!==button;
  tab.setAttribute("aria-pressed",String(tab===button));
 });
});
document.addEventListener("keydown",event=>{
 if(activeTab!=="cards"||!current||event.altKey||event.ctrlKey||event.metaKey||event.repeat||event.target.closest("input,select,textarea,a")) return;
 if(event.key==="Enter"&&!revealed&&(!event.target.closest("button")||event.target.id==="reveal")) {event.preventDefault();reveal();}
 if(event.code==="Space"&&!event.target.closest("button")) {event.preventDefault();speak(current.w);}
 if(revealed&&/^[1-4]$/.test(event.key)) grade(Number(event.key)-1);
});
for(const letter of "ABCDEFGH题") byId("paragraph").add(new Option(letter==="题"?"错题补充":letter+" 段",letter));
byId("query").addEventListener("input",renderBank);
byId("paragraph").addEventListener("change",renderBank);
byId("order").addEventListener("change",renderBank);
byId("rows").addEventListener("click",event=>{const button=event.target.closest("[data-speak]");if(button) speak(words[button.dataset.speak].w);});
byId("quiz-form").addEventListener("change",event=>{
 const {name,value}=event.target;
 state.answers[name]=value;
 save();
 renderQuiz();
 byId("quiz-form").querySelector('input[name="'+name+'"]:checked')?.focus();
});
byId("reset-quiz").onclick=()=>{state.answers={};save();renderQuiz();};
byId("limit").value=state.limit;
byId("settings-form").addEventListener("submit",event=>{
 event.preventDefault();
 state.limit=Number(byId("limit").value);
 save();
 buildQueue();
 if(storageAvailable) byId("settings-status").textContent="已保存。进度保存在当前浏览器。";
});
buildQueue();
renderBank();
renderQuiz();
</script>
</body>
</html>
